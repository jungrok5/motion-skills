  { k: 'tono', mode: 'CLOSE-UP', name: 'TONOPLAST', sub: 'Vacuole membrane', b: ['H⁺ pumps acidify the sap', 'aquaporins move water', 'separates sap from cytoplasm'], zoom: '×30 000', bar: '200 nm', c: '#4ff0e0', cam: { t: [-.4, 2.3, .05], d: 3.8, az: 12, el: 34, orbit: 8 } },

];
SH.forEach(s => { s.rgb = hx(s.c); s.title = s.title || s.name; });
const OVERVIEW = { t: [0, 1.6, .3], d: 18.5, az: 0, el: 60 };

// ---------- stage, tour, film ----------
const RS = clamp(+(new URLSearchParams(location.search).get('rs') || 1), .25, 1);   // ?rs=0.67 renders the 3D layer at 2/3 size (MP4 bakes)
const stage = K.createStage({ W: LY.W, H: LY.H, scale: RS, bg: 0x020805, fog: .018, fov: 46, bloom: [.5, .5, .82], exposure: 1.04 });

const XRAY = K.xrayMaterial(0x3ff0c8, 2.0);
let cap = null, capMat = null, THUMB = null, thumbCam = null; const FADE = [];   // neighbour materials: hidden while the closed cell turns alone

function std(color, o = {}) { return new THREE.MeshPhysicalMaterial({ color, roughness: o.r ?? .4, metalness: 0, clearcoat: o.cc ?? .7, clearcoatRoughness: o.ccr ?? .25, envMapIntensity: o.env ?? 1.1, ...o.extra }); }

async function build(F, progress) {
  SZ.baseTextures();
  const tick = async f => { progress(f); await new Promise(r => setTimeout(r, 0)); };
  scene.environment = K.studioEnv(renderer, { top: 0x4d8a9a, bot: 0x030806 });
  // ---- textures painted with the 2D kit ----
  const fiberC = SZ.fiberTex(4, { size: 1024 }), fiber = K.canvasTex(fiberC), fiberB = K.canvasTex(fiberC, { srgb: false });

  const ground = K.paintTex(1024, (g, s) => SZ.fieldBase(g, 0, 0, s, s, 14, { n: 500, c0: [8, 30, 14], c1: [3, 12, 6], cols: [[40, 120, 60]] }));
  const stroma = K.paintTex(512, (g, s) => { g.fillStyle = '#2e7a22'; g.fillRect(0, 0, s, s); const P = new Path2D(); P.rect(0, 0, s, s); SZ.texOver(g, P, TEX.grain, { alpha: .6, scale: 1 }); SZ.network(g, 0, 0, s, s, 160, 15, { cols: [[150, 230, 90], [90, 180, 60]], alpha: .5, lw0: .6, lw1: 2 }); });
  const matrixT = K.paintTex(512, (g, s) => { g.fillStyle = '#5a170a'; g.fillRect(0, 0, s, s); const P = new Path2D(); P.rect(0, 0, s, s); SZ.texOver(g, P, TEX.grain, { alpha: .7, scale: 1 }); });
  await tick(.25);

  // ---- light ----
  scene.add(new THREE.HemisphereLight(0x9fd8ff, 0x0a1a0a, .55));
  const key = new THREE.DirectionalLight(0xfff2dd, 1.9); key.position.set(-7, 14, 9); scene.add(key);
  const rim = new THREE.DirectionalLight(0x5fc8ff, 1.3); rim.position.set(9, 6, -11); scene.add(rim);
  const inside = new THREE.PointLight(0x7fffd0, 14, 9, 1.6); inside.position.set(-.5, 3.4, -1.5); scene.add(inside);

  // ---- ground, neighbours, walls ----
  const gm = new THREE.MeshStandardMaterial({ map: ground, roughness: .9 }); ground.repeat.set(10, 10);
  const gp = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), gm); gp.rotation.x = -Math.PI / 2; scene.add(gp);
  const wallMat = new THREE.MeshStandardMaterial({ map: fiber, bumpMap: fiberB, bumpScale: 2.2, roughness: .55, color: 0xcfe8b0, emissive: 0x0b2a06, envMapIntensity: .8 });
  const nWallMat = wallMat.clone(); nWallMat.color = new THREE.Color(0x6d8f58); nWallMat.emissive = new THREE.Color(0x020a02);
  const ring1 = HEX.map((_, i) => K.reflectPoly(HEX, i)), ring2 = [];
  ring1.forEach(poly => poly.forEach((_, i) => { const r = K.reflectPoly(poly, i), c = r.reduce((a, q) => [a[0] + q[0] / 6, a[1] + q[1] / 6], [0, 0]); if (Math.hypot(c[0], c[1]) > 14) ring2.push(r); }));

  };

  nWallMat.transparent = true; FADE.push(nWallMat, darkFloor);
  addPoly(HEX, wallMat); ring1.forEach(r => addPoly(r, nWallMat, darkFloor)); ring2.forEach(r => addPoly(r, nWallMat, darkFloor));
  verts.forEach(([v, mat]) => { const c = new THREE.Mesh(new THREE.CylinderGeometry(WT * .62, WT * .62, HC, 20), mat); c.position.set(v[0], HC / 2, v[1]); scene.add(c); const s = new THREE.Mesh(new THREE.SphereGeometry(WT * .62, 20, 12), mat); s.position.set(v[0], HC, v[1]); scene.add(s); });
  // closed lids for the opening shot (all cells), faded away when the cell opens
  capMat = new THREE.MeshStandardMaterial({ map: fiber, bumpMap: fiberB, bumpScale: 3, roughness: .6, color: 0xb8d89a, emissive: 0x0b2a06, transparent: true });
  cap = new THREE.Group(); cap.add(K.plate(K.insetPoly(HEX, -WT * .3), HC + .4, .42, capMat, { texScale: 3 })); scene.add(cap);
  await tick(.4);

  // ---- cytoplasm floor, filaments, membrane ----
  const cytoMat = new THREE.MeshStandardMaterial({ map: cyto, emissiveMap: cyto, emissive: 0x6688ff, emissiveIntensity: .55, roughness: .75, bumpMap: grain, bumpScale: 1.5 });
  scene.add(K.plate(INNER, FLOOR, .5, cytoMat, { texScale: 5 }));
  const fil = new THREE.MeshStandardMaterial({ color: 0x3a7cff, emissive: 0x2d6bff, emissiveIntensity: 1.6, roughness: .4 });
  { const R = rng(21); for (let i = 0; i < 70; i++) { let x = lerp(-4.5, 4.5, R()), z = lerp(-5, 5.5, R()), a = R() * 6.3; const pts = []; for (let s = 0; s < 14; s++) { if (K.inPoly(INNER, x, z)) pts.push([x, FLOOR + .03 + R() * .25, z]); a += (R() - .5) * .8; x += Math.cos(a) * .35; z += Math.sin(a) * .35; } if (pts.length > 3) scene.add(K.tube(pts, .012 + R() * .018, fil, { radial: 6 })); } }
  const memMat = new THREE.MeshStandardMaterial({ color: 0xff6fc0, emissive: 0x801050, emissiveIntensity: .25, roughness: .35, transparent: true, opacity: .07, side: THREE.DoubleSide, depthWrite: false });
  const MEM = K.insetPoly(HEX, WT * .62 + .03);
  MEM.forEach((a, i) => { const b = MEM[(i + 1) % 6], L = Math.hypot(b[0] - a[0], b[1] - a[1]), m = new THREE.Mesh(new THREE.PlaneGeometry(L, HC - FLOOR - .1), memMat); m.position.set((a[0] + b[0]) / 2, (HC + FLOOR) / 2, (a[1] + b[1]) / 2); m.rotation.y = -Math.atan2(b[1] - a[1], b[0] - a[0]); scene.add(m); });
  scene.add(K.tube([...MEM, MEM[0]].map(([x, z]) => [x, FLOOR + .04, z]), .05, new THREE.MeshStandardMaterial({ color: 0xff6fc0, emissive: 0xff2f9a, emissiveIntensity: 1.2 }), { seg: 240, closed: true }));
  // transport proteins (aquaporins / pumps) on the membrane along the left wall
  { const a = MEM[5], b = MEM[0], R = rng(22), L = []; /* left wall, where shot 10 looks */ const ang = -Math.atan2(b[1] - a[1], b[0] - a[0]);
    for (let i = 0; i < 90; i++) { const f = R(), y = lerp(FLOOR + .25, HC - .4, R()); L.push([lerp(a[0], b[0], f) + .03, y, lerp(a[1], b[1], f), .085, .085, .085, 0, ang, Math.PI / 2 + (R() - .5) * .3]); }
    scene.add(K.beads(L, std(0xe0369a, { r: .3, cc: 1 }), new THREE.CapsuleGeometry(.5, .5, 6, 12))); }
  await tick(.5);

  // ---- vacuole ----
  const vac = new THREE.Mesh(K.blobGeo(31, .14, 128), new THREE.MeshPhysicalMaterial({ color: 0x5cdcf8, roughness: .04, transparent: true, opacity: .8, emissive: 0x0c6f90, emissiveMap: caus, emissiveIntensity: 1.25, clearcoat: 1, clearcoatRoughness: .03, envMapIntensity: 1.8, bumpMap: fine, bumpScale: .4 }));
  vac.position.set(-.75, 2.15, -2.5); vac.scale.set(2.25, 1.45, 2.7); vac.rotation.y = .25; scene.add(vac);
  const tono = new THREE.Mesh(vac.geometry, new THREE.MeshPhysicalMaterial({ color: 0xaaf6ff, roughness: .1, transparent: true, opacity: .16, side: THREE.BackSide, emissive: 0x2fd0e0, emissiveIntensity: .3 }));
  tono.position.copy(vac.position); tono.scale.copy(vac.scale).multiplyScalar(1.03); tono.rotation.copy(vac.rotation); scene.add(tono);
  { const R = rng(32), pos = vac.geometry.attributes.position, nrm = vac.geometry.attributes.normal, L = [], B = [], v = new THREE.Vector3(), n = new THREE.Vector3(); vac.updateMatrixWorld();
    for (let i = 0; i < 150; i++) { const j = (R() * pos.count) | 0; v.fromBufferAttribute(pos, j).applyMatrix4(vac.matrixWorld); n.fromBufferAttribute(nrm, j).transformDirection(vac.matrixWorld); if (v.y < FLOOR + .2) continue; L.push([v.x + n.x * .02, v.y + n.y * .02, v.z + n.z * .02, .028 + R() * .02]); }
    for (let i = 0; i < 60; i++) B.push([-.75 + (R() - .5) * 3, 2.1 + (R() - .5) * 1.8, -2.5 + (R() - .5) * 3.6, .03 + R() * R() * .12]);
    scene.add(K.beads(L, std(0xff5ac0, { r: .25, cc: 1 })));                                                 // H⁺ pumps on the tonoplast
    scene.add(K.beads(B, new THREE.MeshPhysicalMaterial({ color: 0xdffcff, roughness: 0, transparent: true, opacity: .35, clearcoat: 1, envMapIntensity: 2 }))); }

  // ---- nucleus: cut open from the top ----
  const nuc = new THREE.Group(); nuc.position.set(...NUC);
  const nb = K.bowl(NR, NR, NR, std(0x9a52e6, { r: .45, cc: .6, extra: { bumpMap: grain, bumpScale: 2.5 } }), std(0x3c1478, { r: .8, cc: .2, extra: { bumpMap: grain, bumpScale: 3, side: THREE.BackSide } }), { cut: .42, thick: .1, rimMat: std(0xc08aff, { r: .3 }) });
  nuc.add(nb);
  const nucl = new THREE.Mesh(new THREE.SphereGeometry(.55, 64, 48), std(0x5a24b8, { r: .3, cc: 1, extra: { bumpMap: grain, bumpScale: 3 } })); nucl.position.set(.05, -.35, .05); nuc.add(nucl);
  { const R = rng(41), pores = [], gran = [], chrom = [], q = new THREE.Vector3();
    for (let i = 0; i < 160; i++) { q.set(R() * 2 - 1, R() * 2 - 1, R() * 2 - 1).normalize(); if (q.y > .38) continue; const s = q.clone().multiplyScalar(NR * 1.003), e = new THREE.Euler().setFromQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), q)); pores.push([s.x, s.y, s.z, .06, .06, .06, e.x, e.y, e.z]); }
    for (let i = 0; i < 220; i++) { q.set(R() * 2 - 1, R() * 2 - 1, R() * 2 - 1).normalize(); if (q.y > .5) continue; gran.push([.05 + q.x * .56, -.35 + q.y * .56, .05 + q.z * .56, .025 + R() * .03]); }
    for (let i = 0; i < 160; i++) { q.set(R() * 2 - 1, -R(), R() * 2 - 1); if (q.length() > 1) continue; chrom.push([q.x * NR * .8, q.y * NR * .8 + .1, q.z * NR * .8, .012 + R() * .02]); }
    nuc.add(K.beads(pores, std(0x2a0a50, { r: .5, cc: .3 }), new THREE.TorusGeometry(1, .38, 10, 20)));
    nuc.add(K.beads(gran, std(0x8a5ae0, { r: .35, cc: .8 })));
    nuc.add(K.beads(chrom, new THREE.MeshStandardMaterial({ color: 0x8a60d0, emissive: 0x4a2090, emissiveIntensity: .5 }))); }
  scene.add(nuc);

  // ---- ER around the nucleus, studded with ribosomes ----
  const erMat = std(0x3f80f2, { r: .35, cc: .8, extra: { emissive: 0x0a2a80, emissiveIntensity: .45, bumpMap: fine, bumpScale: 1.5 } }), riboMat = std(0xd8204c, { r: .22, cc: 1 });
  { const R = rng(51), studs = [];
    for (let k = 0; k < 7; k++) { const rr = NR + .35 + k * .2; let a = .2 + R() * .2;
      while (a < 3.3) { const len = .5 + R() * .8, pts = []; for (let s = a; s < a + len; s += .08) pts.push([NUC[0] + Math.cos(s) * rr * (1 + Math.sin(s * 5 + k) * .03), FLOOR + .25 + k * .05 + Math.sin(s * 7 + k) * .07, NUC[2] + Math.sin(s) * rr * 1.05]);

        a += len + .1 + R() * .15; } }
    scene.add(K.beads(studs, riboMat)); }
