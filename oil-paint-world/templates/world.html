<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchard Morning — oil-paint-world template</title>
<!-- A 12 s starter: a spring orchard in the morning, a picker walking the grass way between the rows.
     It is an example of the style, not a menu: write BRIEF.md for your topic, then replace everything marked ①–⑧. -->
<script type="importmap">{ "imports": { "three": "../lib/three.module.min.js", "opw/": "../lib/" } }</script>
<script type="module">
import { World, pal, mix3, noise, fbm, sm } from 'opw/world.js';
import * as kit from 'opw/kit.js';
import { Figure } from 'opw/figure.js';

// ① the light and the air: where the sun is (az: compass bearing it shines from, 0 = -z; el: its height), the wind,
//    the colour of distance (haze), of distance toward the sun, and how thick the air is
const W = new World({
  name: 'Orchard Morning', seed: 11, extent: 96,
  sun: { az: 318, el: 27 }, wind: { az: 80, strength: 0.7 },
  air: { haze: '#a5bccb', sun: '#f6ecc8', glow: '#161204', density: 0.007 },
  glaze: { mul: '#6f7f6a', add: '#04060a' }, bounce: '#0a1400',
  finish: { shafts: 0.35, glow: '#fff1c9' },
});

// ② the way: where the wanderer walks, [x, z] metres
W.way([[5, 42], [2, 30], [-3, 18], [-2, 6], [3, -6], [5, -18], [1, -30], [-4, -42]]);

// ③ the land: its height, and four masks the kit reads. Here r = the worn way, g = drifts of flowers, b = clover in the shade
W.land({
  height: (x, z) => 2.6 * fbm(x / 70, z / 70, 3, 5) + 0.25 * noise(x / 9, z / 9, 2),
  cover: (x, z) => [1 - sm(0.5, 1.5, W.wayDist(x, z)), sm(0.55, 0.75, noise(x / 17, z / 17, 8)), sm(0.6, 0.8, noise(x / 11 + 9, z / 11, 4)), 0],
});

// ④ what the world is made of. Palettes are three mixes: pal(light, half-tone, shade) — or mix3(colour).
W.add(kit.sky(W, { zenith: '#6f9fd0', horizon: '#dbe9ec', glow: '#fff6d6', clouds: { pal: pal('#fffaf0', '#dfe3ea', '#a9b3c9'), amount: 0.42 } }));
W.add(kit.ranges(W, { rows: [
  { dist: 900, height: 150, base: -20, pal: pal('#9fb7c9', '#869fba', '#6f86a8'), haze: 0.6, seed: 3 },
  { dist: 520, height: 70, base: -12, pal: pal('#8fae7c', '#6c8f70', '#4f7068'), haze: 0.5, seed: 8 },
] }));
W.add(kit.ground(W, { covers: [
  { pals: [pal('#a8c552', '#6f9a41', '#33583c'), pal('#bccf5c', '#84a747', '#3c6240'), pal('#8fba4b', '#5f8d3c', '#2d5038')] }, // grass
  { pals: [pal('#d9bd8a', '#a98a62', '#66544f'), pal('#c9b47c', '#97825c', '#5b4e4c')] },                                    // r: the worn way
  { pals: [pal('#cfd767', '#93ac4b', '#48693f'), pal('#e9e4a8', '#aab87a', '#5c7254')] },                                    // g: flowers gone over
  { pals: [pal('#7fae4c', '#517f3d', '#2a4a3a')] },                                                                          // b: clover
] }));
W.add(kit.growth(W, { density: 0.7, kinds: [
  { pal: pal('#cfe070', '#86a845', '#3b5f3c'), tall: [0.22, 0.5], wide: 0.035, fan: 0.3, share: 5 },                                                   // grass
  { pal: pal('#a9c85a', '#6c9440', '#335338'), tall: [0.2, 0.42], wide: 0.03, fan: 0.25, share: 2, mask: 'g', head: { pal: pal('#fff36b', '#f2c230', '#a9761f'), size: 0.075 } }, // dandelions
  { pal: pal('#b4cf62', '#75993f', '#35553a'), tall: [0.25, 0.5], wide: 0.03, fan: 0.3, share: 2, drifts: 0.9, head: { pal: pal('#ffffff', '#e6e9f2', '#a7afc9'), size: 0.065 } }, // daisies
  { pal: pal('#8fbf52', '#5b8a40', '#2c4c38'), tall: [0.3, 0.7], wide: 0.13, fan: 1.3, mark: 'frond', share: 1.2, mask: 'b' },                           // dock leaves
] }));
const orchard = W.add(kit.trees(W, {
  kinds: { apple: {
    trunk: { pal: pal('#b08d6c', '#5a4640', '#2a2130'), r: [0.16, 0.26], h: [5.5, 7.5], lean: 0.2 },
    crown: { shape: 'round', spread: [2.8, 3.6], from: 0.34, limbs: [5, 7], leaf: 0.2, dense: 110, shade: 0.5, through: 0.35, dark: '#8b6f8f',
      pals: [pal('#ffe6ec', '#f0b6ca', '#b47a9c'), pal('#fff4f2', '#f3d0da', '#bd8faa'), pal('#b9d67a', '#7da455', '#3f6646')] },
  } },
  // rows of an orchard, 9 m apart, a little out of true, kept 3.5 m off the way
  scatter: { grid: 9, fill: 0.86, offWay: 3.5, reach: 70, kind: () => 'apple' },
}));
W.add(kit.flecks(W, { n: 380, pals: [pal('#ffffff', '#f6d3de', '#c79bb3')], size: [0.06, 0.08], fall: 0.55, drift: 0.8, sway: 0.5 })); // petals

// ⑤ the wanderer: what they wear and carry (palettes by part)
W.figure(new Figure({
  height: 1.66, hair: 'bun', sleeves: 'short',
  hat: { kind: 'cap' }, coat: { length: 0.5, flare: 0.28, open: true }, carry: { kind: 'bag', side: 'left' },
  palettes: { top: mix3('#9db7cf'), legs: mix3('#56627a'), shoes: mix3('#5a3d2b'), coat: pal('#e3b23c', '#b9822c', '#6d4a33'), hat: mix3('#5f8a4e'), hair: mix3('#3a2a22'), prop: pal('#c99a5b', '#94683c', '#5a3d30') },
}));

// ⑥ the shots: where they walk (metres along the way) and where the eye is
W.shots([
  { name: 'between the rows', dur: 5, walk: [6, 13.2], cam: { from: { back: 5.2, up: 1.75, side: 0.9, yaw: 6, look: [0, 1.3, 3] }, to: { back: 4.4, up: 1.6, side: 0.5, yaw: -8, look: [0, 1.3, 3] } } },
  { name: 'from the grass', dur: 3.5, walk: [13.2, 18.2], cam: { from: { way: [19.5, 2.6, 0.5], look: [0, 1.0, 0], fov: 42 }, to: { way: [19.5, 2.6, 0.6], look: [0, 1.05, 0], fov: 42 } } },
  { name: 'under the blossom', dur: 3.5, walk: [18.2, 23.2], cam: { from: { back: 4.2, up: 1.2, yaw: 150, look: [0, 1.5, 0], fov: 46 }, to: { back: 5.4, up: 1.0, yaw: 168, look: [0, 2.6, 0], fov: 46 } } },
]);

// ⑦ rules of your own (optional): a sentence when one is broken
W.check('an orchard', () => orchard.list.length < 40 && `only ${orchard.list.length} trees stand`);

// ⑧ go
W.start();
</script>
</html>
