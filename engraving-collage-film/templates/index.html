<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시계탑 심부름 · engraving-collage-film</title>
<script type="importmap">{ "imports": { "three": "../lib/vendor/three.module.min.js", "ec/": "../lib/" } }</script>
</head>
<body>
<script type="module">
import { Film } from 'ec/film.js';
import { sets } from './world.js';
import { cast, brassKey } from './cast.js';
cast.oto.props = { key: { on: 'foreN', draw: brassKey } };
// shots, cameras and acts come from BRIEF.md
new Film({
  sets, cast,
  score: { bpm: 96, key: 'D', mood: 'busy' },
  shots: [
    // 1 · Oto runs down the market street with the key; the camera trucks along low; two blocks pop up behind him
    { set: 'street', dur: 6.2, focus: 6,
      cam: [{ pos: [-1.6, 1.15, 6.2], look: [-0.6, 1.4, -4], fov: 44 }, { pos: [-0.4, 1.25, 2.6], look: [1.2, 1.7, -10], fov: 42 }, { pos: [0.6, 1.5, -1.4], look: [2.0, 2.6, -24], fov: 40 }],
      acts: { oto: [{ at: [-4.2, 0, -1.2], face: 1, view: 'side', expr: 'smile', hold: 'key' }, { t: 0.3, run: [3.4, -6.4] }] } },
    // 2 · he stops at the foot of the clock tower and looks up; the camera cranes up to the clock face
    { set: 'square', dur: 5.4, ease: 'dolly',
      cam: [{ pos: [2.6, 1.0, 3.4], look: [0.2, 1.0, -3.6], fov: 42, focus: 6 }, { pos: [2.2, 1.6, 3.0], look: [0.2, 2.6, -6], fov: 44, focus: 7 }, { pos: [1.2, 4.2, 2.0], look: [0, 22, -16], fov: 46, focus: 22 }],
      acts: { oto: [{ at: [-1.6, 0, -2.9], face: 1, view: 'side', expr: 'neutral', hold: 'key' }, { t: 0.1, walk: [0.3, -3.6], view: 'threeq' }, { t: 3.0, do: 'lookUp' }, { t: 3.2, expr: 'surprise' }] } },
    // 3 · on the belfry ledge he turns to us and waves the balloon by; the camera swings round him over the roofs
    { set: 'roofs', dur: 5.6,
      cam: [{ pos: [-3.2, 1.6, 3.6], look: [0.3, 0.9, -1], fov: 40, focus: 4.5 }, { pos: [0.2, 1.3, 4.4], look: [0, 1.2, -2], fov: 40, focus: 4.4 }, { pos: [3.2, 1.9, 3.4], look: [-0.6, 1.6, -4], fov: 42, focus: 5 }],
      acts: { oto: [{ at: [-0.8, 0, 0.3], face: 1, view: 'threeq', expr: 'smile', hold: 'key' }, { t: 0.4, walk: [0.4, 0.4], view: 'threeq' }, { t: 2.15, turn: 'front' }, { t: 2.8, do: 'wave' }, { t: 2.9, expr: 'smile' }] } },
  ],
}).start();
</script>
</body>
</html>
