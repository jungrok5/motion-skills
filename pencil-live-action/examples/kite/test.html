<!doctype html><html><head><meta charset="utf-8"><title>test</title>
<script type="importmap">{ "imports": { "three": "../../lib/vendor/three.module.min.js", "pla/": "../../lib/" } }</script></head><body>
<script type="module">
import { Film } from 'pla/film.js';
import { gait } from 'pla/gait.js';
import { PIP } from './cast.js';
const F = new Film({ dur: 6, title: 'test' });
await F.load();
await F.table({ at: [0, 0], r: .36, tex: 'wood_table_worn', legs: 'pedestal' });
await F.ground('patterned_cobblestone', { radius: 5, at: [.4, .2] });
const book = F.sketchbook({ at: [-.03, .74, .03], rot: 6 });
const sy = book.userData.surfaceY, Hm = .07, leg = .37 * Hm;
const g = gait({ start: { L: [-.048, sy, .045], R: [-.036, sy, .043] }, legLen: leg, face0: 0 });
g.walk({ to: [.03, .05], t0: 2, speed: .05, y: () => sy });
F.hero(PIP, t => { const a = g.at(t); return { feet: { L: a.L, R: a.R }, planted: a.planted, face: a.face, hip: a.hipY, ground: sy, pose: { mouth: 'smile', head: { yaw: 0 } } }; }, { height: Hm });
const pen = F.pencil({ colour: '#2e4a3a', hold: [.45, .75, .5] });
F.sketch({ plane: F.upright([.05, sy, .05], 0), parts: [], at: 99 });
F.camera([{ t: 0, pos: [-.01, .80, .27], look: [-.02, .765, .04], mm: 50, fstop: 2.8, focusOn: 'hero' }, { t: 6, pos: [.02, .80, .27], look: [0, .765, .04], mm: 50 }]);
F.start();
</script></body></html>
