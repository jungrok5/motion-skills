<!doctype html><html><body style="margin:0;background:#000">
<script type="importmap">{ "imports": { "three": "../../lib/vendor/three.module.min.js" } }</script>
<script type="module">
import { Plate, THREE as T, buildTable, buildGround, buildSketchbook, buildPencil } from '../../lib/plate.js';
const P = new Plate({ W: 960, H: 540, base: './' });
await P.load();
P.turn(+(new URLSearchParams(location.search).get('turn') || 0));
const wood = await P.surface('wood_table_worn'), stone = await P.surface('patterned_cobblestone');
const tab = buildTable({ at: [0, 0], size: [.9, .6], mat: wood }); P.scene.add(tab);
P.scene.add(buildGround(stone, { radius: 5 }));
const book = buildSketchbook({ at: [0.05, .74, 0], rot: 8 }); P.scene.add(book);
const pen = buildPencil({}); pen.position.set(.12, book.userData.surfaceY + .004, .05); pen.rotation.set(0, .5, Math.PI / 2); P.scene.add(pen);
const ball = new T.Mesh(new T.SphereGeometry(.03, 48, 24), new T.MeshStandardMaterial({ metalness: 1, roughness: .05 })); ball.position.set(-.2, .77, .05); ball.castShadow = true; P.scene.add(ball);
const ball2 = new T.Mesh(new T.SphereGeometry(.03, 48, 24), new T.MeshStandardMaterial({ color: 0xffffff, roughness: .6 })); ball2.position.set(-.28, .77, -.05); ball2.castShadow = true; P.scene.add(ball2);
P.front.push(pen);
const q = new URLSearchParams(location.search);
P.render({ pos: [0, .86, .42], look: [0, .75, 0], mm: +(q.get('mm') || 35), fstop: 2.8, focus: .44 });
const out = document.createElement('canvas'); out.width = 960; out.height = 540; document.body.appendChild(out);
const c = out.getContext('2d'); c.drawImage(P.canvas, 0, 0);
c.strokeStyle = '#333'; c.lineWidth = 3; c.beginPath(); c.moveTo(400, 300); c.lineTo(700, 330); c.stroke();
P.drawFront(c);
window.info = { expo: P.expo, sun: P.sunInfo.dir.toArray(), sunI: P.sun.intensity, E: P.sunInfo.E, notes: P.notes };
window.__ready = true;
</script></body></html>
