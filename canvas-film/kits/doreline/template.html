<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>동판화 · 새 장면</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;600&display=swap">
</head>
<body>
<script src="lib.js"></script>
<script src="story.js"></script>
<script src="script.js"></script>
<script src="kit-doreline.js"></script>
<script>
/* Template scene — house style "doreline" (see kits/doreline/STYLE.md). A placeholder 30 s plate with a different subject
   from the worked example (the shepherds' field): a lighthouse on a headland over a night sea, a small boat on the swell; the
   lamp is lit, its beam turns, and wherever it passes the hatching parts to bare paper; it finds the boat and stays.
   To make your film: keep draw()'s skeleton (values into the plate → solid ink behind the words → ENG.engrave with a field
   that follows the forms); replace the headland, lighthouse and boat with your image. */
const { clamp, lerp, ss, eo, eio, rng, canvas } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', S = window.SCRIPT, B = S.beat, DUR = S.DUR;
let P = null;
const sea = (x, t) => H * (V ? .6 : .62) + 10 * Math.sin(x * .012 + t * .8) + 6 * Math.sin(x * .031 - t * 1.3);
function draw(ctx, t) {
  if (!P) { P = canvas(W, H); P.g = P.getContext('2d'); }
  const g = P.g, hz = H * (V ? .58 : .6), LH = [W * (V ? .74 : .72), H * (V ? .44 : .4)], lamp = ss(B.lamp, B.lamp + 1.2, t);
  const ang = t < B.sweep ? Math.PI * .95 : t < B.boat ? Math.PI * .95 + (t - B.sweep) * .42 : Math.PI * .95 + (B.boat - B.sweep) * .42, boat = [W * (V ? .3 : .32), sea(W * .3, t) + 6];
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  const z = 1 + .05 * eio(clamp(t / DUR)); g.save(); g.translate(W / 2, H * .55); g.scale(z, z); g.translate(-W / 2, -H * .55);
  { const gr = g.createLinearGradient(0, 0, 0, hz); gr.addColorStop(0, 'rgb(24,24,24)'); gr.addColorStop(1, 'rgb(70,70,70)'); g.fillStyle = gr; g.fillRect(-W, -H, 3 * W, 3 * H); }
  { const r = rng(3); g.fillStyle = '#fff'; for (let i = 0; i < 90; i++) { g.globalAlpha = .4 + .6 * r(); g.fillRect(r() * W, r() * hz * .8, 2, 2); } g.globalAlpha = 1; }
  // the beam: a wedge of light from the lamp, bare paper where it is strongest
  if (lamp > 0) { g.save(); g.globalCompositeOperation = 'lighter'; for (const [wd, a] of [[.16, .25], [.08, .45], [.035, .7]]) { g.fillStyle = `rgba(255,255,255,${a * lamp})`; g.beginPath(); g.moveTo(LH[0], LH[1]);
      g.lineTo(LH[0] + Math.cos(ang - wd) * W * 2, LH[1] + Math.sin(ang - wd) * W * 2); g.lineTo(LH[0] + Math.cos(ang + wd) * W * 2, LH[1] + Math.sin(ang + wd) * W * 2); g.closePath(); g.fill(); } g.restore();
    const gr = g.createRadialGradient(LH[0], LH[1], 0, LH[0], LH[1], 120); gr.addColorStop(0, `rgba(255,255,255,${lamp})`); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(LH[0] - 120, LH[1] - 120, 240, 240); }
  // the sea: swell lines below the horizon, a lighter band where the beam lies on it
  g.fillStyle = 'rgb(46,46,46)'; g.beginPath(); g.moveTo(-60, H + 60); for (let x = -60; x <= W + 60; x += 8) g.lineTo(x, sea(x, t)); g.lineTo(W + 60, H + 60); g.closePath(); g.fill();
  // the headland and the lighthouse (a tapered tower, a lamp room), the boat (a hull, a mast, one sail), rims toward the lamp
  g.fillStyle = 'rgb(16,16,16)'; g.beginPath(); g.moveTo(W + 60, H + 60); g.lineTo(W * .5, H + 60); g.quadraticCurveTo(W * .62, hz + 20, LH[0] - 60, LH[1] + 180); g.lineTo(W + 60, LH[1] + 150); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(LH[0] - 34, LH[1] + 190); g.lineTo(LH[0] - 20, LH[1] + 20); g.lineTo(LH[0] + 20, LH[1] + 20); g.lineTo(LH[0] + 34, LH[1] + 190); g.closePath(); g.fill(); g.fillRect(LH[0] - 26, LH[1] - 10, 52, 30); g.beginPath(); g.moveTo(LH[0] - 30, LH[1] - 10); g.lineTo(LH[0], LH[1] - 40); g.lineTo(LH[0] + 30, LH[1] - 10); g.fill();
  { const [bx, by] = boat, s = V ? 1.3 : 1.1, lit = ss(B.boat - .6, B.boat + .4, t); g.fillStyle = 'rgb(14,14,14)'; g.beginPath(); g.moveTo(bx - 60 * s, by); g.quadraticCurveTo(bx, by + 26 * s, bx + 60 * s, by); g.lineTo(bx + 48 * s, by - 6 * s); g.lineTo(bx - 52 * s, by - 6 * s); g.closePath(); g.fill();
    g.fillRect(bx - 2, by - 110 * s, 4, 104 * s); g.beginPath(); g.moveTo(bx + 4, by - 104 * s); g.lineTo(bx + 52 * s, by - 18 * s); g.lineTo(bx + 4, by - 18 * s); g.closePath(); g.fillStyle = `rgb(${30 + 200 * lit},${30 + 200 * lit},${30 + 200 * lit})`; g.fill(); }
  g.restore();
  // solid ink behind the words (lines in glyph counters read as stripes)
  { const y0 = H * (V ? .7 : .74), gr = g.createLinearGradient(0, y0 - 120, 0, y0 + 40); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.95)'); g.fillStyle = gr; g.fillRect(0, y0 - 120, W, 160); g.fillStyle = 'rgba(0,0,0,.95)'; g.fillRect(0, y0 + 40, W, H); }
  ENG.engrave(ctx, P, { spacing: V ? 7 : 6.5, tint: [255, 214, 140, .2 * lamp], field: (x, y) => y < hz ? y + 5 * Math.sin(x * .011) : y + .8 * (sea(x, 0) - hz) });
  { const k = ss(B.end - .2, B.end + .9, t); if (k > 0) { ctx.fillStyle = `rgba(8,5,3,${.8 * k})`; ctx.fillRect(0, 0, W, H); } }
  Story.captions(ctx, t, S.lines, { y: V ? H * .8 : H * .85, size: V ? 52 : 46, color: '#f3ece0' });
  Story.endCard(ctx, t, S.endCard, B.end, { color: '#f3ece0', srcColor: '#e3d6bd', ctaColor: '#e9c77a' });
  Story.fadeBlack(ctx, t, DUR);
}
Pilot.run({ W, H, dur: DUR, fonts: ["600 40px 'Noto Serif KR'", "700 40px 'Noto Serif KR'", "400 28px 'Noto Sans KR'", "600 30px 'Noto Sans KR'"], draw });
</script>
</body>
</html>
