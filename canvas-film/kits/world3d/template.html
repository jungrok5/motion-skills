<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3D 세계 · 새 장면</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;600&display=swap">
</head>
<body>
<script src="lib.js"></script>
<script src="story.js"></script>
<script src="script.js"></script>
<script src="kit-world3d.js"></script>
<script>
/* Template scene — house style "world3d" (see kits/world3d/STYLE.md). A placeholder 30 s flight with a different subject from
   the worked example (the night over Bethlehem, backlit Rome): a fishing village on the far shore of a lake at dusk. The camera
   flies in low over the water toward one window; the sun goes down behind hills that the haze pulls apart into layers, one
   window lights, a small boat with one fisherman slides past on the left, the other windows and the first stars follow.
   To make your film: keep draw()'s order (sky → water → far land in 3D, far → near → the near thing as a backlit silhouette
   placed with W3.P → lamps and bloom → W3.finish → words) and the cam/light keys; replace the lake, hills, village and boat.
   3D is for land, sky and far things; close up, faces read as an architecture model, so stop the camera before they do. */
const { clamp, ss, rng, fbm, noise, mix } = Pilot, css = W3.css;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', S = window.SCRIPT, B = S.beat, DUR = S.DUR;
// far hills as curtains standing in the lake: [z m, base, height, frequency, seed, albedo] — far → near
const RIDGES = [[3600, 60, 300, .0009, 1, [.5, .46, .48]], [2200, 30, 190, .0016, 2, [.42, .4, .42]], [1300, 10, 110, .0028, 3, [.34, .32, .32]], [780, 3, 46, .005, 4, [.24, .25, .21]]];
const HERO = 6, BOAT = [-7, 0, 330];
let CAM, LIGHT, VIL = [], HOUSES = [];
function build() {
  CAM = W3.cam([[0, -8, 9, -160, 8, 62, 640, 1300, 1750], [12, -4, 4.5, 140, 8, 38, 640, 1360, 1850], [22, 0, 3, 400, 8, 20, 640, 1500, 2150], [30, 2, 2.4, 500, 8, 11, 640, 1600, 2400]]);
  LIGHT = W3.light([[0, 6, 6, 1, [255, 184, 120], [86, 72, 92], [56, 74, 126], [252, 180, 124], [255, 186, 120], [214, 162, 142], 900, 0],
    [B.lamp + 1, 2.5, 6, .7, [255, 150, 96], [66, 58, 88], [36, 48, 98], [228, 138, 112], [250, 146, 100], [160, 116, 130], 820, .2],
    [B.night + 1, -2, 6, .15, [255, 126, 92], [44, 44, 76], [18, 24, 58], [120, 86, 112], [190, 106, 100], [76, 68, 100], 740, .7],
    [DUR, -5, 6, 0, [255, 126, 92], [32, 34, 64], [10, 14, 40], [56, 54, 90], [96, 74, 98], [46, 48, 78], 700, 1]]);
  VIL.push(...W3.box(-120, -1, 604, 140, 1.2, 720, [.36, .33, .28]));                                // the bank the houses stand on
  const r = rng(21); for (let i = 0; i < 12; i++) { const x = -70 + i * 13 + (r() - .5) * 4, z = 610 + r() * 8, w = 6 + r() * 3.5, d = 6 + r() * 3, h = 3.4 + r() * 2.4, y0 = 1.2, y1 = y0 + h, yr = y1 + 1.8, x0 = x - w / 2, x1 = x + w / 2, z1 = z + d, zm = z + d / 2, wall = [.86, .8, .68], roof = [.56, .38, .3];
    VIL.push(...W3.box(x0, y0, z, x1, y1, z1, wall), { pts: [[x0, y1, z], [x0, yr, zm], [x1, yr, zm], [x1, y1, z]], alb: roof }, { pts: [[x1, y1, z1], [x1, yr, zm], [x0, yr, zm], [x0, y1, z1]], alb: roof },
      { pts: [[x0, y1, z], [x0, y1, z1], [x0, yr, zm]], alb: wall }, { pts: [[x1, y1, z1], [x1, y1, z], [x1, yr, zm]], alb: wall });
    HOUSES.push({ x, z, on: i === HERO ? B.lamp : r() < .3 ? null : B.night - 1 + r() * 5, k: r() }); }
}
// one ridge and its reflection: a top line sampled across the view, filled down to its shoreline (y = 0), shaded and fogged by distance
function ridge(ctx, c, L, [z, base, amp, f, sd, alb]) {
  const span = (z - c.z) * (V ? .5 : .95) + 60, top = [], ref = [], foot = W3.P(c, c.x, 0, z); if (!foot) return;
  for (let i = 0; i <= 140; i++) { const x = c.x - span + 2 * span * i / 140, h = base + amp * fbm(x * f + sd * 17, sd, 4), p = W3.P(c, x, h, z), q = W3.P(c, x, -h * .85, z); if (p) top.push(p); if (q) ref.push(q); }
  const fill = (pts, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(pts[0][0], foot[1]); for (const p of pts) ctx.lineTo(p[0], p[1]); ctx.lineTo(pts[pts.length - 1][0], foot[1]); ctx.closePath(); ctx.fill(); };
  const col = W3.shade(alb, [0, .4, -.92], z - c.z, L); fill(ref, css(mix(col, L.fog, .2), .6)); fill(top, css(col));
  ctx.strokeStyle = css(L.glow, .45 * L.sunI); ctx.lineWidth = 1.5; ctx.beginPath(); top.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();   // the rim the low sun leaves on the ridge
}
// the fisherman in his boat (metres, origin at the waterline, facing right): a dark silhouette, rim light on the edges toward the sun
const BOATP = new Path2D(); { const p = BOATP; p.moveTo(-2.7, -.75); p.lineTo(2.9, -.85); p.quadraticCurveTo(2.5, -.1, 2.0, 0); p.lineTo(-2.3, 0); p.closePath(); p.ellipse(-.8, -2.32, .13, .15, 0, 0, 6.283); p.ellipse(-.8, -2.44, .3, .06, 0, 0, 6.283);
  p.moveTo(-1.08, -2.16); p.lineTo(-.52, -2.16); p.lineTo(-.42, -.74); p.lineTo(-1.18, -.74); p.closePath(); p.moveTo(-.6, -1.7); p.lineTo(2.4, -3.3); p.lineTo(2.42, -3.24); p.lineTo(-.56, -1.6); p.closePath(); p.rect(2.1, -2.1, .06, 1.3); }
function draw(ctx, t) {
  const c = CAM(t), L = LIGHT(t), sk = W3.sky(ctx, c, L, t, { stars: true }), hy = sk.hy;
  // the lake: it mirrors the sky (horizon colour far, the zenith near), then the sun's glitter path on the ripples
  { const g = ctx.createLinearGradient(0, hy, 0, H); g.addColorStop(0, css(mix(L.skyH, L.glow, .3))); g.addColorStop(.3, css(mix(L.skyH, L.skyT, .6))); g.addColorStop(1, css(mix(L.skyT, [6, 8, 16], .5))); ctx.fillStyle = g; ctx.fillRect(0, hy, W, H - hy); }
  if (sk.sun && L.sunI > 0) { ctx.save(); ctx.globalCompositeOperation = 'screen'; for (let j = 0; j < 260; j++) { const u = (j + .5) / 260, y = hy + 2 + (H - hy) * u * u, sp = 14 + (V ? 160 : 240) * u, a = Math.max(0, noise(j * 1.9 + 7, t * 1.8) - .4) * 2;
    if (a <= 0) continue; const w = (6 + 70 * u) * (.4 + noise(j * .7, t)); ctx.fillStyle = css(L.glow, L.sunI * (.75 - .5 * u) * a); ctx.fillRect(sk.sun[0] - w / 2 + (noise(j * 3.3, t * .6) - .5) * 2 * sp, y, w, 1.2 + 3 * u); } ctx.restore(); }
  for (const R of RIDGES) ridge(ctx, c, L, R);
  W3.faces(ctx, c, L, VIL);
  { const p = W3.P(c, c.x, 0, 640); if (p) { const g = ctx.createLinearGradient(0, p[1] - 70, 0, p[1] + 26); g.addColorStop(0, css(L.fog, 0)); g.addColorStop(.7, css(L.fog, .32)); g.addColorStop(1, css(L.fog, 0)); ctx.fillStyle = g; ctx.fillRect(0, p[1] - 70, W, 96); } }   // mist on the water
  // windows: lamps come on (the hero first), each with its long broken reflection on the water
  ctx.save(); ctx.globalCompositeOperation = 'screen'; let hero = null;
  for (const h of HOUSES) { if (h.on == null) continue; const on = ss(h.on, h.on + 1.2, t) * (.9 + .1 * Math.sin(t * 2 + h.k * 9)); if (on <= 0) continue;
    const p = W3.P(c, h.x, 3, h.z - .05), q = W3.P(c, h.x, 0, h.z - .05); if (!p || !q) continue; const s = p[2], R = Math.max(3, s * .8);
    if (W3.poly(ctx, c, [[h.x - .5, 2.5, h.z - .05], [h.x + .5, 2.5, h.z - .05], [h.x + .5, 3.5, h.z - .05], [h.x - .5, 3.5, h.z - .05]])) { ctx.fillStyle = `rgba(255,206,130,${on})`; ctx.fill(); }
    let g = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], R * 3); g.addColorStop(0, `rgba(255,214,140,${.6 * on})`); g.addColorStop(.3, `rgba(255,176,90,${.25 * on})`); g.addColorStop(1, 'rgba(255,170,80,0)'); ctx.fillStyle = g; ctx.fillRect(p[0] - R * 3, p[1] - R * 3, R * 6, R * 6);
    for (let j = 0; j < 14; j++) { const n = noise(j * 1.7 + h.k * 9, t * 1.6), y = q[1] + 3 + (j + .7 * noise(j * 2.3, t * 1.2 + h.k * 5)) * Math.max(2, s * .45), w = s * (.2 + .9 * n);
      ctx.fillStyle = `rgba(255,190,110,${.45 * on * n * (1 - j / 14)})`; ctx.fillRect(p[0] - w / 2 + (noise(j * 1.3, t * 1.1 + h.k * 7) - .5) * s * .7, y, w, Math.max(1.2, s * (.1 + .15 * n))); }
    if (h === HOUSES[HERO]) hero = [p[0], p[1], on]; }
  ctx.restore();
  // the boat: placed in the world (it slides past with true parallax), drawn as a backlit silhouette + its reflection
  { const p = W3.P(c, ...BOAT); if (p) { const s = p[2], body = css(mix(L.amb, [10, 8, 10], .7)); ctx.save(); ctx.translate(p[0], p[1]); ctx.scale(s, -s * .9); ctx.globalAlpha = .4; ctx.fillStyle = body; ctx.fill(BOATP); ctx.restore();
    ctx.save(); ctx.translate(p[0], p[1]); ctx.scale(s, s); ctx.fillStyle = css(mix(L.glow, [255, 236, 210], .3), .85); ctx.fill(BOATP); ctx.clip(BOATP); ctx.translate(0, 3 / s); ctx.fillStyle = body; ctx.fill(BOATP); ctx.restore();
    const ln = ss(B.boat - 1, B.boat + .5, t); if (ln > 0) W3.bloom(ctx, p[0] + 2.13 * s, p[1] - 2.15 * s, [255, 196, 120], .45 * ln, { r: Math.max(20, s * 2.2), streak: .08 }); } }
  if (sk.sun) W3.bloom(ctx, sk.sun[0], sk.sun[1], L.glow, L.sunI * clamp((L.elev - 2) / 3), { r: V ? 180 : 150, streak: .5 });   // fades as the sun sinks behind the hills
  if (hero) W3.bloom(ctx, hero[0], hero[1], [255, 200, 120], .4 * hero[2], { r: V ? 70 : 60, streak: .22 });
  W3.finish(ctx, t, { vignette: .6 });
  { const y0 = H * (V ? .66 : .7), g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, 'rgba(8,8,14,0)'); g.addColorStop(.5, 'rgba(8,8,14,.4)'); g.addColorStop(1, 'rgba(8,8,14,.55)'); ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0); }   // the words' band
  { const k = ss(B.end - .2, B.end + .9, t); if (k > 0) { ctx.fillStyle = `rgba(6,6,12,${.7 * k})`; ctx.fillRect(0, 0, W, H); } }
  Story.captions(ctx, t, S.lines, { y: V ? H * .8 : H * .84, size: V ? 52 : 46, color: '#f3ece0' });
  Story.endCard(ctx, t, S.endCard, B.end, { color: '#f3ece0', srcColor: '#e3d6bd', ctaColor: '#e9c77a' });
  Story.fadeBlack(ctx, t, DUR);
}
Pilot.run({ W, H, dur: DUR, fonts: ["600 40px 'Noto Serif KR'", "700 40px 'Noto Serif KR'", "400 28px 'Noto Sans KR'", "600 30px 'Noto Sans KR'"], init: async () => build(), draw });
</script>
</body>
</html>
