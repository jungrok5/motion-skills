   (Original notes of the all-code version follow.)
   01 건널목 — Japanese TV/film anime look, drawn in Canvas 2D.
   The grammar of the look, each piece on purpose:
   - painted backgrounds vs flat cel characters: skies, clouds, houses carry gradients and detail; figures are flat fills
     with ONE hard-edged shadow tone (the "cel" trick: fill the shadow colour, then the base colour shifted toward the
     light and clipped to the shape — the uncovered crescent is the shadow) and a coloured ink line;
   - characters animate "on twos" (12 drawings/s, TW below) while the camera, train and light move at the full 30 fps;
   - Shinkai-style sky: deep cobalt zenith to a pale horizon, towering cel cumulonimbus, contrail, lens flare;
   - compositing (撮影) pass: a soft diffusion glow over the whole frame, a light leak, grain;
   - hard cuts between shots (wide → insert → wide → sunset), the classic railway-crossing beat: a train cuts between
     two people, and when it has passed the far side is empty.
   Shots: A 0–7 sky tilt-down · B 7–13 the crossing · L 13–14.6 alarm lamps insert · C 14.6–20.6 the train · D 20.6–27 dusk. */

// ---------------- helpers ----------------
// smooth closed path through points; a point [x, y, 1] is a sharp corner (hair tips, pleats)
function sm(ctx, pts) {
  const n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  ctx.beginPath(); const m0 = mid(pts[n - 1], pts[0]); ctx.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++) { const p = pts[i], q = mid(p, pts[(i + 1) % n]);
    if (p[2]) { ctx.lineTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); } else ctx.quadraticCurveTo(p[0], p[1], q[0], q[1]); }
  ctx.closePath();
}
// cel fill: shadow everywhere, base shifted toward the light (dx,dy) and clipped — leaves one hard shadow crescent
function cel(ctx, path, base, shade, dx, dy, lw, ink = INK) {

  if (lw) { path(); ctx.strokeStyle = ink; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.stroke(); }

// ---------------- cel clouds (built once) ----------------
function cloudTex(seed, w, h, pal, o = {}) {

  const Y = u => base - u * (base - top), puffs = [];

  for (let i = 0; i < (o.ne || 230); i++) { const s = r(), u = r(), rad = ((o.re || .028) + r() * .04) * h * (1 - .3 * u);
    if (s < .36) puffs.push([cx - prof(u) * w + rad * (.4 + r() * .6), Y(u), rad]);
    else if (s < .72) puffs.push([cx + prof(u) * w - rad * (.4 + r() * .6), Y(u), rad]);
    else { const k = r() * 2 - 1, u2 = .72 + .28 * Math.sqrt(1 - k * k); puffs.push([cx + k * prof(.72) * w * .98, Y(u2) + rad * .7, rad]); } }
  puffs.sort((a, b) => a[1] - b[1]);                        // top first: lower (nearer) lumps overlap the ones above
  const mid = hx(mix(hex(pal.base), hex(pal.shadow), .5));
  for (const [px, py, rad] of puffs) {                       // small-scale lumps: base + a soft-toned crescent
    x.save(); x.beginPath(); x.arc(px, py, rad, 0, PI2); x.clip(); x.fillStyle = mid; x.fillRect(px - rad, py - rad, rad * 2, rad * 2);
    x.beginPath(); x.arc(px + L[0] * rad * .16, py + L[1] * rad * .2, rad * .9, 0, PI2); x.fillStyle = pal.base; x.fill(); x.restore(); }
  const U = canvas(w, h), ux = U.getContext('2d'), union = (dx, dy, col, k = 1) => { ux.fillStyle = col; for (const [px, py, rad] of puffs) { ux.beginPath(); ux.arc(px + dx, py + dy, rad * k, 0, PI2); ux.fill(); } };

  flare(ctx, sx, sy, .8, true);
}
// close-up background: the painted sky, out of focus
function paintBGGp() {
  const img = PL('sky'), c = canvas(W, H), x = c.getContext('2d');
  const s = Math.max(W / img.width, H / (img.height * .62)), iw = img.width * s, ih = img.height * s;
  x.filter = 'blur(9px)'; x.drawImage(img, (W - iw) / 2, H - ih * .97, iw, ih); x.filter = 'none';
  x.globalCompositeOperation = 'lighter'; const r = rng(4);
  for (let i = 0; i < 16; i++) { const bx = r() * W, by = H * (.2 + r() * .7), rr = 16 + r() * 46; x.fillStyle = `rgba(255,250,235,${.04 + r() * .06})`; x.beginPath(); x.arc(bx, by, rr, 0, PI2); x.fill(); }
  return c;
}

// ---------------- the scene ----------------
function draw(ctx, t) {
  if (PLATE) { drawPlate(ctx, t); return; }
  if (t < SH.B) { shotA(ctx, t); post(ctx, t, .2); }
  else if (t < SH.L || (t >= SH.C && t < SH.G)) {
    const C = t >= SH.C, k = C ? 1.065 : 1 + .035 * eio(clamp((t - SH.B) / 6));
    const pass = C ? ss(14.9, 15.3, t) * (1 - ss(19.2, 19.7, t)) : 0;
    const shx = (fbm(t * 9, 2) - .5) * 9 * pass, shy = (fbm(t * 9 + 40, 2) - .5) * 6 * pass;
    ctx.save(); ctx.translate(W / 2 + shx, CAM.hy + shy); ctx.scale(k, k); ctx.translate(-W / 2, -CAM.hy);
    if (FIG) { ctx.fillStyle = '#ff00ff'; ctx.fillRect(-W, -H, W * 3, H * 3); } else street(ctx, t, C);
    const wind = C ? lerp(.38, -1.35, ss(15.0, 15.6, t)) * (1 - ss(19.3, 20.4, t)) + .3 * ss(19.3, 20.4, t) : .36 + .16 * Math.sin(t * .9);
    const [gx0, gy0] = P3(CAM.gx, 0, CAM.gz); artBack(ctx, gx0, gy0, CAM.f / CAM.gz / 100, t, wind);
    if (!FIG) dust(ctx, t);
    ctx.restore();
    if (!FIG) post(ctx, t, .22);
  }
  else if (t < SH.C) { shotL(ctx, t); post(ctx, t, .26); }
  else if (t < SH.D) { shotG(ctx, t); if (!FIG) post(ctx, t, .2); }
  else { shotD(ctx, t); post(ctx, t, .24); }

  if (FIG) return;
  // words (every on-screen string goes through Pilot.text → translatable)
  const T = { size: V ? 50 : 52, weight: 600, color: '#fffaf0', shadow: 'rgba(14,22,58,.9)', shadowBlur: 14 };
  text(ctx, '01  ·  건널목', V ? 64 : 110, V ? 170 : 120, { align: 'left', size: 30, weight: 600, color: '#fff6e6', alpha: win(t, .6, 5, 1, 1), ls: 4, shadow: 'rgba(14,22,58,.8)', shadowBlur: 10 });
  text(ctx, '그해 여름, 하늘은 유난히 높았다.', W / 2, H * (V ? .26 : .3), { ...T, alpha: win(t, 1.8, 6.5, 1, .8) });
  text(ctx, '건널목 너머의 너에게,\n하고 싶은 말이 있었다.', W / 2, H * (V ? .12 : .12), { ...T, alpha: win(t, 7.7, 12.85, .9, .7) });
  text(ctx, '전철이 지나간 자리에는\n여름 하늘만 남아 있었다.', W / 2, H * (V ? .19 : .21), { ...T, alpha: win(t, SH.D + .4, SH.D + 5.2, 1, .9) });
  ctx.fillStyle = `rgba(0,0,0,${1 - ss(0, 1, t) * (1 - ss(DUR - 1.3, DUR, t))})`; ctx.fillRect(0, 0, W, H);
}

Pilot.run({ W, H, dur: DUR, audio: 'crossing.m4a', fonts: ["600 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => {
    await Promise.all([['sky', 'plates/sky'], ['crossing', 'plates/crossing-' + (V ? 'v' : 'h')], ['front', 'plates/crossing-front-' + (V ? 'v' : 'h')],
      ['signal', 'plates/signal-' + (V ? 'v' : 'h')], ['sunset', 'plates/sunset-' + (V ? 'v' : 'h')], ['train', 'plates/train'], ['turn1', 'turn1'], ['turn2', 'turn2'], ['back', 'back']]
      .map(([n, f]) => Cutout.load(n, 'art/' + f + '.webp')));
    if (ORIG) await Promise.all(['back', 'bust', 'bust-blink', 'bust-sad'].map(n => Cutout.load(n, 'art/' + n + '.webp')));
    SKIRTP = Rig.pendulum(478, 46, { damp: 4.5, gravity: 900, gain: 1 });
    BACKRIG = await Rig.load('art/rig/', 'back', { parts: [{ k: 34, rootStiff: 5, damp: 4.2, gain: 1 }] });
    BUSTRIG = await Rig.load('art/rig/', 'bust', { parts: [{ k: 26, rootStiff: 9, damp: 3.6, gain: 1, rootLock: 1.6 }, { k: 30, rootStiff: 4, damp: 3.4, gain: 1.4 }, { k: 30, rootStiff: 4, damp: 3.4, gain: 1.4 }] });
    grain = Pilot.speckle(W / 2 + 32, H / 2 + 32, 60, 11); gravel = gravelPattern();
    gb = canvas(W / 4, H / 4); gx = gb.getContext('2d');
    CB = cloudTex(3, 1500, 1400, DAY); CS = cloudTex(9, 800, 480, DAY, { prof: u => .44 - .26 * u, top: .22, ni: 30, ne: 120, ri: .1, re: .05 });
    CD = cloudTex(3, 1500, 1400, DUSK, { light: [1, -.25] });
    CBand = cloudTex(21, 1800, 340, DUSK, { prof: u => .47 - .1 * u + .03 * Math.sin(u * 9), top: .22, base: .85, ni: 40, ne: 170, ri: .14, re: .07, light: [1, -.25] });
    CSoft = canvas(750, 700); { const x = CSoft.getContext('2d'); x.filter = 'blur(9px)'; x.drawImage(CB, 0, 0, 750, 700); }
    BGG = PLATE ? paintBGG() : paintBGGp();
    trainCar = PLATE ? buildCar(CAM.f / TR.z) : paintedCar(CAM.f / TR.z); trainBuf = canvas(Math.ceil(W * 1.2), trainCar.height);
    const r = rng(41);
    for (let i = 0; i < 26; i++) tufts.push([(r() < .5 ? -1 : 1) * (2.95 + r() * .9), 1.1 + r() * 3.1, r() < .5]);
    for (let i = 0; i < 16; i++) { const z = 14 + r() * 30, left = i < 10; trees.push({ x: left ? -(5 + r() * 14) : 10 + r() * 10, z, y: 3 + r() * 2, r: 2.4 + r() * 2.2, seed: i + 1 }); }
    trees.sort((a, b) => b.z - a.z);
    const r2 = rng(7);
    skyA.cirrus = canvas(W, H); { const x = skyA.cirrus.getContext('2d'); x.filter = 'blur(5px)'; x.strokeStyle = 'rgba(255,255,255,.3)'; x.lineCap = 'round';
      for (let i = 0; i < 16; i++) { const cx = r2() * W, cy = H * (.06 + r2() * .4), l = 200 + r2() * 420, b = 14 + r2() * 30; x.lineWidth = 6 + r2() * 14; x.beginPath(); x.moveTo(cx, cy); x.quadraticCurveTo(cx + l * .5, cy - b, cx + l, cy + b * .4); x.stroke(); } }
    const roofs = (seed, h0, h1, w0, w1) => { const p = new Path2D(), rr = rng(seed); p.moveTo(-40, H); let x = -40;
      while (x < W + 40) { const w = w0 + rr() * (w1 - w0), hb = h0 + rr() * (h1 - h0), rh = 40 + rr() * 70, ty = rr();
        p.lineTo(x, -hb);
        if (ty < .55) { p.lineTo(x + w / 2, -hb - rh); p.lineTo(x + w, -hb); }
        else if (ty < .85) { p.lineTo(x + w * .25, -hb - rh * .7); p.lineTo(x + w * .75, -hb - rh * .7); p.lineTo(x + w, -hb); }
        else { p.lineTo(x, -hb - 10); p.lineTo(x + w * .3, -hb - 10); p.lineTo(x + w * .3, -hb - 60); p.lineTo(x + w * .55, -hb - 60); p.lineTo(x + w * .55, -hb - 10); p.lineTo(x + w, -hb - 10); p.lineTo(x + w, -hb); }
        if (rr() < .3) { p.lineTo(x + w * .8, -hb); p.lineTo(x + w * .8, -hb - rh - 50); p.lineTo(x + w * .8 + 3, -hb - rh - 50); p.lineTo(x + w * .8 + 3, -hb); }
        x += w; }
      p.lineTo(W + 40, H); p.closePath(); return p; };
    skyA.far = roofs(12, H * .2, H * .3, 120, 260); skyA.near = roofs(13, H * .06, H * .16, 160, 320);
    skyD.far = roofs(22, 30, 70, 90, 200); skyD.near = roofs(23, 4, 40, 120, 260);
  },
  draw });
