<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Model sheet · heroine</title></head>
<body>
<script>window.FILM_SRC = 'ko'; window.FILM_FONTS = { serif: "'Noto Serif KR'", sans: "'Noto Sans KR'" };</script>
<script src="lib.js"></script>
<script src="anime-kit.js"></script>
<script src="heroine.js"></script>
<script>
/* The heroine's model sheet: approve this before drawing any shot. Row 1: busts in the three views the film uses.
   Row 2: the 3/4 head in every expression. Rendered with the same code the shots call (Heroine.draw). */
const W = 1920, H = 1080, V = false;
function draw(ctx, t) {
  ctx.fillStyle = '#f3efe6'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(120,110,90,.15)'; ctx.lineWidth = 1; for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); } for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  const lab = (s, x, y) => text(ctx, s, x, y, { size: 22, font: "'Noto Sans KR',sans-serif", color: '#5a5040', ls: 2 });
  text(ctx, 'HEROINE · model sheet', 60, 64, { align: 'left', size: 30, weight: 600, color: '#3a3226', ls: 3 });
  const views = [['q', '3/4'], ['side', 'side'], ['back', 'back']];
  views.forEach(([v, name], i) => { const x = 330 + i * 560, y = 250;
    ctx.save(); ctx.translate(x, y); ctx.scale(1.15, 1.15); Heroine.draw(ctx, { view: v, expr: 'neutral', t: 0, wind: .35 }); ctx.restore(); lab(name, x, 690); });
  const ex = ['neutral', 'smile', 'smileopen', 'surprised', 'sad', 'blink', 'talk'];
  ctx.save(); ctx.beginPath(); ctx.rect(0, 700, W, 380); ctx.clip();
  ex.forEach((e, i) => { const x = 170 + i * 263, y = 850;
    ctx.save(); ctx.translate(x, y); ctx.scale(.95, .95); Heroine.draw(ctx, { view: 'q', expr: e, t: 0, wind: .2, body: false, ponytail: false }); ctx.restore(); });
  ctx.restore();
  ex.forEach((e, i) => lab(e, 170 + i * 263, 1060));
}
Pilot.run({ W, H, dur: 1, fonts: ["600 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"], init: async () => {}, draw });
</script>
</body>
</html>
