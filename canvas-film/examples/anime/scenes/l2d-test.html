<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live2D layers test · anime example</title>
</head>
<body>
<script src="lib.js"></script>
<script src="cutout.js"></script>
<script src="rig.js"></script>
<script src="layers.js"></script>
<script>
/* Stress test for the full-layer puppet (layers.js): bigger motion than the film uses, so holes, cut edges and
   misregistered layers show up. ?fig=1 draws on magenta for tools/review.py; ?rest=1 holds the drawn pose.
   0–3 s head sweeps left → right with a tilt · 3–5 s nods, blinks · 5–8 s sad smile, gusts in the hair. */
const { clamp, lerp, ss, eio, fbm, canvas } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', DUR = 8;
const FIG = /[?&]fig=1/.test(location.search), REST = /[?&]rest=1/.test(location.search);
let P, BG, SPR = {};
const angX = t => REST ? 0 : Math.sin(t * 1.25 - .4) * (t < 5 ? 1 : .35);
const angY = t => REST ? 0 : (t > 3 && t < 5 ? Math.sin((t - 3) * 3.1) * .7 : .15 * Math.sin(t * .8));
const angZ = t => REST ? 0 : .06 * Math.sin(t * 1.25 - .9);
const gust = (t, s) => (fbm(t * 1.4 + s, 3) - .5) * 2;
function draw(ctx, t) {
  if (FIG) { ctx.fillStyle = '#ff00ff'; ctx.fillRect(0, 0, W, H); } else ctx.drawImage(BG, 0, 0);
  const s = H * (V ? .62 : 1.0) / P.size[1], x = W / 2 - P.size[0] * s * .5, y = V ? H * .25 : 0;
  const hair = {};
  if (!REST) for (const L of P.layers) if (L.hair) {   // each hair layer: a spring pushed by the head's turn and the wind
    const sp = SPR[L.name] || (SPR[L.name] = Rig.pendulum(300, L.name === 'bangs' ? 70 : 34, { damp: 3.2, gravity: 0, gain: 1 }));
    const k = L.name === 'bangs' ? .35 : 1, dir = L.name === 'backhair' ? -1 : 1;
    const th = Rig.sim(sp, t, tt => [(-(angX(tt + .01) - angX(tt)) / .01 * 900 * dir + gust(tt, L.depth * 7) * (t > 5 ? 2200 : 900)) * k, 0], 0)[0];
    hair[L.name] = (th - Math.PI / 2) * (L.name === 'lockL' ? -1 : 1) * .9;
  }
  let expr = t > 5 ? 'sad' : '';
  for (const b of [2.2, 4.1, 6.6]) if (t >= b && t < b + .12) expr = 'blink';
  Layers.draw(ctx, P, x, y, s, { angX: angX(t), angY: angY(t), angZ: angZ(t), breath: REST ? 0 : .5 + .5 * Math.sin(t * 2.2), body: [REST ? 0 : angX(t) * -6, 0], expr, hair });
}
Pilot.run({ W, H, dur: DUR, fonts: [], init: async () => {
  P = await Layers.load('art/l2d/', 'bust');
  BG = canvas(W, H); const x = BG.getContext('2d'), g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#3a73c8'); g.addColorStop(1, '#cfe6f4'); x.fillStyle = g; x.fillRect(0, 0, W, H);
}, draw });
</script>
</body>
</html>
