<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마지막 도넛 · 3화 반전</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gaegu:wght@400;700&family=Jua&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@600&display=swap">
</head>
<body>
<script src="lib.js"></script>
<script src="kit-webtoon.js"></script>
<script src="donut-manga.js"></script>
<script src="donut-cast.js"></script>
<script src="ep3-twist-fx.js"></script>
<script src="script-ep3-twist.js"></script>
<script>
/* 「마지막 도넛」 3화 · 반전 (24 s). One strip read downward (BRIEF row 3), printed as a premium mono manga (Manga.grade at the end):
   A  freeze flash 번쩍 over ep2's last frame (the three hands still in their slow-motion lunge) — a fourth hand plucks the donut (쏙),
      then the three snap shut on air
   B  calm wide pantry: 하늘 bites (바삭) 「아, 이거 제가 아까 사 온 건데…」「드실래요?」          ← punchline 1 (held)
   ·  beat gutter (camera pauses mid-gap)
   C  silent beat 「……」: the three frozen mid-reach toward the reader (where 하늘 stands), a sweat drop, a blink
   D  hard cut, black panel: SD grey stone → cracks → crumble, 털썩
   E  끼익 — the door: 사장님 with three full boxes, white rays cut from solid black 「다들 고생 많지? 도넛 사 왔어~」
   F  three SD faces, star eyes + waterfall tears of joy (focus wedges on paper)
   G  「근데 회의 끝나고 먹자.」 → 「지금 회의 시작!」 (snap: bold focus wedges, zoom punch)  ← punchline 2 (held)
   H  dragged off by the collars, reaching back at the boxes, waterfall tears, halftone dust puffs (질질)
   I  the empty pantry: 하늘 waves 「다녀오세요~」 with a fresh donut → premium mono end card (✱ 다음 화) */
const WT = Webtoon, C = Cast, X = EP3, MG = Manga, S = window.SCRIPT, B = S.beat, L = S.lines, { clamp, lerp, ss, eo, eio } = Pilot;
const INK = MG.C.ink, PAPER = MG.C.paper, PAPERL = MG.C.paperL, LW = 8;
const at = k => L[k][0], out = k => L[k][1], txt = k => L[k][2];
const bl = (k, o) => Object.assign({ text: txt(k), at: at(k), out: out(k) }, o);
const flat = (c, P, col = PAPER) => { c.fillStyle = col; c.fillRect(-4, -80, P.w + 8, P.h + 160); };

// ---------------------------------------------------------------- the strip (thick ink borders, a few slanted cuts)
const STRIP = WT.strip({
  top: 0, side: 48, bottom: 700, bg: PAPER,
  panels: [
    { id: 'a', h: 1380, x: 90, w: 900, lw: LW, ink: INK, draw: (c, t, P) => panelA(c, t, P), over: (c, t, P) => overA(c, t, P) },
    { id: 'b', h: 1180, gap: 240, lw: LW, ink: INK, cut: [0, 0, 56, 0], draw: (c, t, P) => panelB(c, t, P),
      cam: (t, P) => WT.kenBurns(t, B.bite - .1, out('offer'), 1.05, 560, 520) },
    { id: 'c', h: 760, gap: 'beat', lw: LW, ink: INK, draw: (c, t, P) => panelC(c, t, P) },
    { id: 'd', h: 1240, gap: 'seq', border: 'bleed', lw: LW, ink: INK, draw: (c, t, P) => panelD(c, t, P), over: (c, t, P) => overD(c, t, P),
      cam: (t, P) => WT.mixCam({ fx: P.w / 2, fy: 700 }, WT.punch(t, B.stone, { z0: 1.18 })) },
    { id: 'e', h: 1260, gap: 'action', lw: LW, ink: INK, cut: [40, 0, 0, 0], draw: (c, t, P) => panelE(c, t, P), over: (c, t, P) => overE(c, t, P),
      cam: (t, P) => WT.kenBurns(t, B.door + .4, out('boss'), 1.05, P.w / 2, 420) },
    { id: 'f', h: 660, gap: 'seq', lw: LW, ink: INK, draw: (c, t, P) => panelF(c, t, P) },
    { id: 'g', h: 1180, gap: 'action', border: 'bleed', lw: LW, ink: INK, cut: [50, 0, -30, 0], draw: (c, t, P) => panelG(c, t, P),
      cam: (t, P) => WT.mixCam({ fx: 620, fy: 520 }, t < B.meeting ? WT.kenBurns(t, at('later'), B.meeting, 1.04, 620, 480) : { z: 1.04 }, WT.punch(t, B.meeting)) },
    { id: 'h', h: 900, gap: 'seq', lw: LW, ink: INK, cut: [70, 0, -20, 50], draw: (c, t, P) => panelH(c, t, P) },
    { id: 'i', h: 1200, gap: 'beat', lw: LW, ink: INK, draw: (c, t, P) => panelI(c, t, P),
      cam: (t, P) => WT.kenBurns(t, B.bye - .3, B.end, 1.05, 560, 560) },
  ],
});
const Pn = STRIP.P;
// the scroll, written as absolute arrive/leave times (glide = the time between); the beat gutter gets its own pause
const CAM = X.plan(STRIP, [
  { panel: 'a', arrive: 0, leave: 2.05 },
  { panel: 'b', arrive: 2.5, leave: out('offer'), drift: 18 },
  { at: Pn.b.y + Pn.b.h + 170, arrive: out('offer') + .42, leave: out('offer') + .72 },        // the silent gutter before the beat panel
  { panel: 'c', arrive: B.beat, leave: B.stone - .12 },
  { panel: 'd', arrive: B.stone, leave: 10.0, ease: 'out' },                                 // ≈ hard cut (.12 s)
  { panel: 'e', arrive: B.door, leave: out('boss') - .1 },
  { panel: 'f', arrive: B.joy, leave: 14.65 },
  { panel: 'g', arrive: at('later'), leave: out('now') },
  { panel: 'h', arrive: B.drag, leave: 19.85, ease: 'out' },
  { panel: 'i', arrive: B.bye, leave: S.DUR, drift: 24 },
]);

// ---------------------------------------------------------------- A · ep2's last frame, frozen: the lunge goes on, a fourth hand takes the donut
// geometry copied from ep2-standoff's p11 (same panel 900×1380, donut, box and hand angles) so the cut from ep2 is seamless
const DON = [450, 980], DR = 120, HSZ = 132, GAPD = 46;
const LUNGE = [{ who: 'park', ang: .36, flip: 1 }, { who: 'kim', ang: Math.PI - .36, flip: -1 }, { who: 'choi', ang: Math.PI / 2, flip: 1 }];
function lungeWrist(h, back) {   // wrist position `back` px behind the final pose (fingertips GAPD short of the glaze)
  const ca = Math.cos(h.ang), sa = Math.sin(h.ang), rd = 1 / Math.hypot(ca / DR, sa / (DR * .62)) + 18 * Math.abs(sa);
  const tip = [DON[0] - ca * (rd + GAPD), DON[1] - 14 - sa * (rd + GAPD)], Ln = 1.6 * HSZ + back;
  return [tip[0] - ca * Ln, tip[1] - sa * Ln];
}
function handPath(t) {   // 하늘's hand: in over the box front from the bottom-right, pinches the donut's near rim, leaves with it
  const [h0, h1, h2] = B.hand, grabAt = [DON[0] + 78, DON[1] + 50];
  const rest = [860, 1760], ang = -Math.PI / 2 - .5, sz = 100, go = WT.Rig.gripOffset('pinch', ang, sz, -1);
  const tgt = [grabAt[0] - go[0], grabAt[1] - go[1]];
  let w;
  if (t < h0) w = rest; else if (t < h1) w = WT.lerpP(rest, tgt, eo(clamp((t - h0) / (h1 - h0)))); else if (t < h1 + .12) w = tgt;
  else { const u = clamp((t - h1 - .12) / (h2 - h1 - .12)); w = WT.lerpP(tgt, [990, 1820], u * u); }
  return { w, ang, sz, held: t >= h1, grab: [w[0] + go[0], w[1] + go[1]], off: [DON[0] - grabAt[0], DON[1] - grabAt[1]] };
}
function panelA(c, t, P) {
  flat(c, P, PAPERL);
  MG.focus(c, t, { x: 0, y: 0, w: P.w, h: P.h, cx: DON[0], cy: DON[1] - 40, rx: 330, ry: 330, n: 84, wMax: 30, seed: 41, fps: 0 });   // frozen (no boil)
  C.box(c, DON[0], P.h + 10, 900, { n: 0, lid: .01, seed: 3 });
  const hp = handPath(t), gone = hp.held;
  if (!gone) C.donut(c, DON[0], DON[1], DR, { t, seed: 7 });
  // the three hands: still creeping in slow motion (the freeze is the flash, not the hands) — then they slam shut on nothing
  const shut = t >= B.close, creep = shut ? -70 * eo(clamp((t - B.close) / .12)) : -16 * clamp(t / B.close);
  for (const h of LUNGE) {
    const w = lungeWrist(h, creep), [tx, ty] = WT.tremble(t, shut ? 0 : 1.5, 12, h.ang * 10), j = shut ? WT.shake(t, B.close, 7, .1) : [0, 0];
    C.hand(c, h.who, shut ? 'rock' : 'grab', w[0] + tx + j[0], w[1] + ty + j[1], h.ang, HSZ * 1.08, { flip: h.flip, len: 11 });
  }
  if (shut) MG.ticks(c, DON[0], DON[1] - 20, 160, { n: 9, a0: 0, a1: Math.PI * 2 - .7, seed: 6 });
  // 하늘's hand (cardigan cuff) — the donut moves with the pinch
  if (t >= B.hand[0] - .02) {
    const k = clamp((t - B.hand[0]) / (B.hand[1] - B.hand[0]));
    if (k < 1) MG.speed(c, t, { x: 520, y: 1000, w: 380, h: 380, ang: -Math.PI / 2 - .5, n: 8, wMax: 9, seed: 4, v: 0 });
    C.hand(c, 'haneul', gone ? 'pinch' : 'open', hp.w[0], hp.w[1], hp.ang, hp.sz, { len: 6, flip: -1 });
    if (gone) C.donut(c, hp.grab[0] + hp.off[0], hp.grab[1] + hp.off[1], DR, { t, seed: 7 });
  }
}
function overA(c, t, P) {
  X.sfx(c, t, { text: L.sfxFlash, x: 250, y: 190, size: 170, at: .1, out: 1.9, rot: -.1 });
  X.sfx(c, t, { text: L.sfxPluck, x: 260, y: 1190, size: 140, at: B.hand[1], out: 2.0, rot: .14 });
}

// ---------------------------------------------------------------- B · 하늘 eats it (calm daylight register — flat paper)
const HB = { x: 650, y: 1585, s: 2.05, turn: -.42 };
function haneulB(t, ctx) {
  const g0 = C.geom(t, 'haneul', { x: HB.x, y: HB.y, s: HB.s, turn: HB.turn }), hd = g0.head, r = hd.r;
  // three holds for the far arm (screen-left = the side she faces): at the mouth → at the chest → held out to them
  const K = [[[hd.x - r * 1.2, hd.y + r * .95], -1.6], [[hd.x - r * .9, hd.y + r * 2.7], -1.15], [[hd.x - 300, hd.y + 250], -.55]];
  const k1 = eio(ss(B.bite + .35, B.bite + .8, t)), k2 = eo(ss(B.offer - .25, B.offer + .2, t));
  const to = WT.lerpP(WT.lerpP(K[0][0], K[1][0], k1), K[2][0], k2), ang = lerp(lerp(K[0][1], K[1][1], k1), K[2][1], k2);
  const talk = (t > at('mine') && t < at('mine') + 1.5) || (t > B.offer && t < B.offer + .7) ? .5 + .5 * Math.sin(t * 22) : 0;
  const o = { x: HB.x, y: HB.y, s: HB.s, turn: HB.turn, hairEv: [B.bite, B.offer], tilt: k2 * .08 - (1 - k1) * .05, nod: lerp(.12, -.04, k2),
    expr: t < at('mine') ? 'chew' : t < B.offer - .1 ? 'talk' : 'happy', talk, blush: .5,
    arms: { L: { to, hand: 'pinch', ang, front: true, propFront: (cc, H) => donutB(cc, t, H, k1, k2) } } };
  return ctx ? C.draw(ctx, t, 'haneul', o) : C.geom(t, 'haneul', o);
}
function donutB(c, t, H, k1, k2) {   // the donut sits on the pinch (rig-local coords), the bitten side toward her mouth
  const r = 30, dx = lerp(-r * .2, -r * .5, k2), dy = lerp(-r * .75, -r * .5, k1);
  C.donut(c, H.grip[0] + dx, H.grip[1] + dy, r, { bite: t < B.bite ? 1 : 2, rot: lerp(.25, 0, k2), seed: 7, t, lw: 1.6 });
}
function panelB(c, t, P) {
  flat(c, P);
  C.room(c, t, 'pantry', P.w, P.h, { horizon: 930 });
  C.fridge(c, 30, 930, .82);
  C.counter(c, 470, 660, 610, .82); C.coffee(c, 600, 660, .75); C.box(c, 900, 660, 230, { n: 0, seed: 2, t });
  const G = haneulB(t, c);
  if (t > B.bite - .05) X.crumbs(c, t, B.bite, G.hands.L.grip[0] + 10, G.hands.L.grip[1] - 50, { n: 12, seed: 5 });
  X.sfx(c, t, { text: L.sfxBite, x: 820, y: 300, size: 124, at: B.bite, out: B.bite + 1.4, rot: .1 });
  const ta = G.mouth;
  WT.balloons(c, t, [
    bl('mine', { x: 330, y: 150, tail: [ta[0] - 30, ta[1] - 10], maxW: 560 }),
    bl('offer', { x: 255, y: 560, tail: [ta[0] - 50, ta[1] + 10], size: 52 }),
  ]);
}

// ---------------------------------------------------------------- C · the silent beat: frozen mid-reach toward the reader (= where 하늘 stands)
const CROW = [['park', 190, .1], ['kim', 492, 0], ['choi', 795, -.1]], CS = 1.5;
function panelC(c, t, P) {
  flat(c, P);
  C.room(c, t, 'pantry', P.w, P.h, { horizon: 740 });
  for (const [who, x, tn] of CROW) {
    const g0 = C.geom(t, who, { x, y: 0, s: CS, turn: tn }), y = 330 - g0.head.y, hx = g0.head.x;
    const sh = C.geom(t, who, { x, y, s: CS, turn: tn }).shoulders;
    // both hands out in front of the chest, reaching toward the camera (the cast gives a target in front of the torso depth)
    const G = C.draw(c, t, who, { x, y, s: CS, turn: tn, expr: 'dead', sway: .3,
      arms: { L: { to: [sh.L[0] + 14, sh.L[1] + 4], hand: 'grab', ang: -1.85 }, R: { to: [sh.R[0] - 10, sh.R[1] + 22], hand: 'grab', ang: -1.3 } } });
    if (who === 'kim') WT.emote(c, t, 'sweat', G.head, { at: B.beat + .4, side: 1 });
  }
  WT.balloon(c, t, bl('dots', { kind: 'whisper', x: 492, y: 92, size: 48 }));
}

// ---------------------------------------------------------------- D · stone, cracks, crumble (SD gag register, a solid black panel with white lines)
const DROW = [['park', 220, 0], ['kim', 540, .14], ['choi', 860, .28]], DFLOOR = 1010;
function panelD(c, t, P) {
  flat(c, P, INK);
  MG.speed(c, t, { x: 0, y: 0, w: P.w, h: P.h, ang: Math.PI / 2, n: 26, wMax: 10, col: PAPERL, seed: 9, v: 120 });
  c.fillStyle = INK; c.fillRect(0, DFLOOR - 40, P.w, P.h);   // floor band stays solid so the rubble reads
  c.fillStyle = PAPERL; c.fillRect(0, DFLOOR + 26, P.w, 6);
  for (const [who, x, d] of DROW) {
    const sd = C.sdGeom(t, who, { x, y: DFLOOR, s: 1.45 });
    const o = { x, y: DFLOOR, s: 1.45, turn: (x - 540) / -1800, arms: { L: { to: [x - 34, sd.head.y + sd.head.r * 1.35], hand: 'grab' }, R: { to: [x + 38, sd.head.y + sd.head.r * 1.4], hand: 'grab' } } };
    const t0 = B.crumble + d;
    if (t < t0 - .45) C.stone(c, t, who, Object.assign({ crack: clamp((t - B.stone - .1) / .5) }, o));
    else C.crumble(c, t, who, o, { t0, dur: .8, crack: .45, floor: DFLOOR + 14 });
  }
}
function overD(c, t, P) {
  if (t >= B.stone && t < B.stone + .3) for (const [, x] of DROW) WT.poof(c, t, B.stone, x, DFLOOR - 300, 130, PAPERL);
  X.sfx(c, t, { text: L.sfxCrumble, x: 560, y: 1140, size: 160, at: B.crumble + .55, out: 10.3, rot: .08 });
}

// ---------------------------------------------------------------- E · 끼익 — 사장님 and the three boxes (white rays cut from solid black)
const EDX = 252, EDW = 480, EHZ = 1080;
function panelE(c, t, P) {
  flat(c, P);
  const dk = eo(ss(B.door, B.door + .5, t)), k = eo(ss(B.door + .15, B.door + .6, t));
  C.room(c, t, 'door', P.w, P.h, { horizon: EHZ, dx: EDX, dw: EDW, door: dk, light: 0 });
  if (k > 0) {
    const x = EDX + EDW / 2;
    X.rays(c, t, x, 640, { rect: [0, -60, P.w, P.h + 120], alpha: clamp(k * 1.6), rx: 170, ry: 200, n: 40, wMax: 60, seed: 5 });
    const s = lerp(1.62, 1.86, k), y = lerp(1140, 1255, k), m = c.getTransform();
    const g = C.geom(t, 'boss', { x, y, s }), sw = 270, sy = g.hip[1] - 20;
    // a paper halo round him so the black-on-black edges still read
    c.save(); c.globalAlpha = clamp(k * 2); c.fillStyle = PAPERL; c.beginPath(); c.ellipse(x, sy - 120, 330, 520, 0, 0, Math.PI * 2); c.fill();
    c.lineWidth = 8; c.strokeStyle = INK; c.stroke(); c.restore();
    const G = C.draw(c, t, 'boss', { x, y, s, alpha: clamp(k * 2.5), expr: 'happy', talk: t > at('boss') && t < at('boss') + 1.8 ? .5 + .5 * Math.sin(t * 20) : 0, hairEv: [B.door + .6],
      arms: { L: { to: [x - sw * .5 + 4, sy - 30], hand: 'hold', ang: .5, prop: cc => { cc.save(); cc.setTransform(m); X.stack(cc, x, sy + 22, sw, 3, { t }); cc.restore(); } },
              R: { to: [x + sw * .5 - 4, sy - 30], hand: 'hold', ang: Math.PI - .5 } } });
    for (let i = 0; i < 5; i++) { const a = i * 1.3 + .4, rr = 300 + 40 * Math.sin(t * 2 + i), tw = .5 + .5 * Math.sin(t * 5 + i * 2);
      X.star(c, x + Math.cos(a) * rr, sy - 140 + Math.sin(a) * rr * .8, 16 + 14 * tw, t * .5 + i); }
    P._mouth = G.mouth;
  }
}
function overE(c, t, P) {
  X.sfx(c, t, { text: L.sfxDoor, x: EDX + EDW + 120, y: 330, size: 118, at: B.door, out: B.door + 1.5, rot: .18 });
  if (P._mouth) WT.balloon(c, t, bl('boss', { x: 300, y: 150, tail: [P._mouth[0] - 20, P._mouth[1] - 30], maxW: 600 }));
}

// ---------------------------------------------------------------- F · tears of joy (SD on paper, bold focus wedges, inked sparkles)
function panelF(c, t, P) {
  flat(c, P, PAPERL);
  MG.focus(c, t, { x: 0, y: 0, w: P.w, h: P.h, cx: P.w / 2, cy: 330, rx: 430, ry: 250, n: 60, wMax: 22, seed: 12 });
  [['park', 175, -.15], ['kim', 492, 0], ['choi', 810, .15]].forEach(([who, x, tn], i) => {
    const y = 790, s = 1.32, bob = Math.abs(Math.sin((t - B.joy) * 7 + i)) * -10;
    C.sd(c, t, who, { x, y: y + bob, s, turn: tn, eyes: 'sparkle', mouth: 'grin', expr: 'joy', tears: 'fall', tearAt: B.joy - .1 + i * .06, tearFloor: P.h - 10,
      arms: { L: { to: [x - 140, y - 520] }, R: { to: [x + 140, y - 520] } } });
  });
  for (let i = 0; i < 6; i++) { const tw = .5 + .5 * Math.sin(t * 6 + i * 1.7); X.star(c, 90 + i * 170, 90 + (i % 2) * 70, 14 + 16 * tw, i); }
  X.sfx(c, t, { text: L.sfxWow, x: P.w / 2, y: 92, size: 84, at: B.joy + .1, rot: -.04, font: "'Jua',sans-serif" });
}

// ---------------------------------------------------------------- G · 「지금 회의 시작!」 (calm → snap)
function panelG(c, t, P) {
  const hit = t >= B.meeting;
  flat(c, P, PAPERL);
  if (!hit) { c.fillStyle = MG.tone(c, .12); c.fillRect(0, 760, P.w, P.h); for (let i = 0; i < 4; i++) X.star(c, 160 + i * 250, 640 - (i % 2) * 120, 12 + 10 * (.5 + .5 * Math.sin(t * 4 + i)), i); }
  else MG.focus(c, t, { x: 0, y: -60, w: P.w, h: P.h + 120, cx: 640, cy: 460, rx: 330, ry: 360, n: 90, wMax: 34, seed: 5 });
  const s = 3.1, g0 = C.geom(t, 'boss', { x: 0, y: 0, s, turn: -.2 }), x = 660, y = 470 - g0.head.y;
  const up = ss(B.meeting - .12, B.meeting + .02, t), hd = [x + g0.head.x, 470];
  C.draw(c, t, 'boss', { x, y, s, turn: -.2, expr: hit ? 'happy' : 'smile', talk: (t > at('later') && t < at('later') + 1.4) || (hit && t < B.meeting + .9) ? .5 + .5 * Math.sin(t * 19) : 0,
    hairEv: [B.meeting], tilt: hit ? -.06 : .04,
    arms: up > 0 ? { R: { to: [hd[0] + lerp(200, 245, up), hd[1] + lerp(520, 40, up)], hand: 'wave', ang: -Math.PI / 2 + .2 } } : {} });
  if (hit) MG.ticks(c, hd[0] + 300, hd[1] - 60, 110, { n: 6, a0: -2.4, a1: -.4, seed: 3 });
  WT.balloons(c, t, [
    bl('later', { x: 290, y: 170, tail: [hd[0] - 150, hd[1] + 150], maxW: 520 }),
    bl('now', { kind: 'shout', x: 330, y: 880, tail: [hd[0] - 120, hd[1] + 260], size: 74, maxW: 560 }),
  ]);
}

// ---------------------------------------------------------------- H · dragged off by the collar (SD, slanted panel, speed wedges, halftone dust)
function panelH(c, t, P) {
  const gxAt = tt => lerp(70, -170, clamp((tt - B.drag + .3) / 1.9)), gx = gxAt(t), FL = 790;
  flat(c, P);
  c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.moveTo(0, FL); c.lineTo(P.w, FL); c.stroke();
  MG.speed(c, t, { x: 0, y: 80, w: P.w, h: FL - 120, ang: Math.PI, n: 20, wMax: 12, seed: 3, v: 1600 });
  // the boxes, left behind on the counter, sliding out of reach
  const kx = 905 + gx * .3;
  C.counter(c, kx - 110, 520, 330, .8);
  X.stack(c, kx, 520, 180, 3, { t });
  for (let i = 0; i < 3; i++) X.star(c, kx - 90 + i * 90, 300 - (i % 2) * 40, 12 + 10 * (.5 + .5 * Math.sin(t * 6 + i)), i);
  // the boss leads (cheerful), the three slide behind on their seats, collars bunched in his fist
  const bx = 150 + gx, ph = (t - B.drag) * 2.2, bs = 1.6;
  const bo = { x: bx, y: FL + 8, s: bs, turn: -.5, pose: 'run', ph, expr: 'happy', arms: { R: { to: [bx + 200, FL - 260], hand: 'fist' } } };
  const bg = C.sdGeom(t, 'boss', bo), fist = [bg.hands.R.x + 6, bg.hands.R.y];
  const crew = [['choi', 560, FL - 6, 1.3], ['kim', 410, FL, 1.32], ['park', 265, FL + 8, 1.34]];
  crew.forEach(([who, dx, y], i) => X.trail(c, t, tt => 150 + gxAt(tt) + dx + 70, y + 4, { t0: B.drag - .5, every: .2, life: .75, r: 46, seed: i * 11 + 2, dir: 1 }));
  const geo = crew.map(([who, dx, y, s]) => C.sdGeom(t, who, { x: bx + dx, y, s, turn: .5, pose: 'sit', tilt: .1 }));
  crew.forEach(([who, dx, y, s], i) => {
    C.sd(c, t, who, { x: bx + dx, y, s, turn: .5, pose: 'sit', expr: 'cry', tears: 'fall', tearAt: B.drag - .35, tearFloor: y + 4, tilt: .1 + .04 * Math.sin(t * 9 + i),
      arms: { L: { to: [bx + dx + 260, y - 420] }, R: { to: [bx + dx + 300, y - 330] } } });
  });
  geo.forEach((G, i) => X.collar(c, [G.head.x - 26 * crew[i][3], G.head.y + G.head.r * .95], fist, PAPERL, 24 - i * 2));
  C.sd(c, t, 'boss', bo);
  WT.emote(c, t, 'note', bg.head, { at: B.drag + .1, side: -1 });
  X.sfx(c, t, { text: L.sfxDrag, x: 470, y: 185, size: 124, at: B.drag + .05, rot: -.06 });
}

// ---------------------------------------------------------------- I · the empty pantry: 하늘 waves goodbye (with a fresh donut)
function panelI(c, t, P) {
  flat(c, P);
  C.room(c, t, 'pantry', P.w, P.h, { horizon: 960 });
  C.fridge(c, 30, 960, .84);
  C.counter(c, 470, 690, 610, .82); C.coffee(c, 600, 690, .75);
  C.box(c, 905, 690, 250, { n: 5, seed: 6, t });
  // what they left behind: three rubble heaps and drag marks to the left
  c.strokeStyle = INK; c.lineWidth = 4; c.lineCap = 'round'; c.setLineDash([26, 18]);
  for (const y of [1040, 1080, 1120]) { c.beginPath(); c.moveTo(-20, y); c.quadraticCurveTo(200, y - 6, 330, y + 4); c.stroke(); }
  c.setLineDash([]);
  X.rubble(c, 160, 1110, 150, 3); X.rubble(c, 330, 1150, 140, 5);
  const s = 1.86, x = 600, y = 1530, g0 = C.geom(t, 'haneul', { x, y, s, turn: -.18 }), hd = g0.head;
  const wv = Math.sin((t - B.bye) * 9);
  const G = C.draw(c, t, 'haneul', { x, y, s, turn: -.18, expr: t < at('bye') + 1.2 ? 'happy' : 'smile', talk: t > at('bye') && t < at('bye') + 1 ? .5 + .5 * Math.sin(t * 20) : 0, blush: .6, tilt: .06 + wv * .02, hairEv: [B.bye],
    arms: { R: { to: [hd.x + 210 + wv * 22, hd.y - 30], hand: 'wave', ang: -1.45 + wv * .2 },
            L: { to: [hd.x - 95, hd.y + 330], hand: 'pinch', ang: -1.3, front: true, propFront: (cc, H) => C.donut(cc, H.grip[0] - 8, H.grip[1] - 22, 30, { bite: 1, seed: 12, t, lw: 1.6 }) } } });
  WT.emote(c, t, 'note', G.head, { at: B.bye + .5, side: 1 });
  WT.balloon(c, t, bl('bye', { x: 300, y: 220, tail: [G.mouth[0] - 30, G.mouth[1] - 20], size: 54 }));
}

// ---------------------------------------------------------------- frame
function draw(ctx, t) {
  WT.begin(ctx, PAPER);
  const shake = [WT.shake(t, B.crumble + .55, 12), WT.shake(t, B.meeting, 14), WT.shake(t, .02, 10), WT.shake(t, B.close, 8)].reduce((a, b) => [a[0] + b[0], a[1] + b[1]], [0, 0]);
  WT.drawStrip(ctx, t, STRIP, CAM.y(t), { shake });
  WT.flash(ctx, t, 0, { hold: .2, dur: .5, col: PAPERL });
  WT.flash(ctx, t, B.stone, { hold: .04, dur: .2, col: PAPERL });
  if (t >= B.end) X.monoCard(ctx, t, B.end, S.endCard);
  if (window.Manga && !/[?&]grade=0/.test(location.search)) Manga.grade(ctx);   // the manga print finish (?grade=0 = raw colour)
  WT.fade(ctx, t, S.DUR, .4, .4);
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: WT.FONTS, draw });
</script>
