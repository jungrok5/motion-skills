<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>부엌 · 경찬 · 명현 부부의 쭈꾸미볶음</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@500;700;900&display=swap">
</head>
<body>
<script src="lib.js"></script>
<script src="story.js"></script>
<script src="script-mograph.js"></script>
<script src="kit-mograph.js"></script>
<script src="cook-mograph-art.js"></script>
<script>
/* 「쭈꾸미 한 접시」 scene 2 — cook-mograph (22 s, 120 BPM, 11 bars), the 「word-log 교실」 mograph kit.
   The cooks are the couple 경찬 · 명현: 명현 (dark hair in a low bun, navy top, the mustard apron — she caught the 쭈꾸미)
   on the left facing right, 경찬 (short dark hair, green-grey top, cream apron) on the right facing left, the work between
   them. Both are CookArt re-dresses of the kit's code rig (two actors, two pose tracks); the world swaps on bar lines and
   every step is labelled as it happens:
   ① window grid: close on the wooden tub of red 쭈꾸미 (scene 1's last image), pull back into the gold window, 「경찬 · 명현
     부부의」「손질 시작!」, she tips the tub out on the counter, he cheers → dive into the pile → ② manga: he pours the flour, she
     rubs while he holds the bowl, close-up 박박! → ③ drafting sheet: she dips the strainer, he times it — a 30-second dial →
     yellow floods up → ④ yellow: he tips a measuring spoon into the bowl on every beat (the amount pops and parks), she
     stirs, the jamo of 양념 jump out → ⑤ navy stage: she tosses the wok on a high flame on every beat, he pours the sauce in,
     it coats the 쭈꾸미 deep red, 「센 불에 휘리릭」 → a bubble grows → ⑥ pink bubbles: 명현's phone, the chat to 「정록 · 세진」
     (typed, sent, photo, typing dots, 「콜! 7시에 갈게」), 경찬 leans in → ⑦ kaleidoscope: they set the plate down together,
     「완성!」, fade to black.
   Only the octopus and its sauce use the accent red. Hands that hold things are IK'd to the grip (Mograph.rig), and every
   held prop is drawn from the same quantised time as the actors' frames (12 fps), so it never drifts off the hand. */
const S = window.SCRIPT, B = S.beat, MG = Mograph, A = CookArt, { clamp, lerp, ss, eo, eio, rng } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2, FPS = 12;
MG.tempo(S.BPM);
const SC = MG.sceneTable(S.scenes, S.DUR), scAt = id => SC.find(s => s.id === id);
const tq = t => Math.floor(t * FPS + 1e-6) / FPS;                                   // the actors' frame time
const beatU = t => ((t % MG.BEAT) + MG.BEAT) % MG.BEAT / MG.BEAT;                  // 0..1 within the beat
const tri = (t, at, len = .14) => Math.max(0, 1 - Math.abs(t - at) / len);
const T = s => Pilot.tr(s);
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const rotAbout = (q, c, a) => { const dx = q[0] - c[0], dy = q[1] - c[1], co = Math.cos(a), si = Math.sin(a); return [c[0] + dx * co - dy * si, c[1] + dx * si + dy * co]; };
const mixHex = (a, b, k) => Pilot.rgb(Pilot.mix(Pilot.hex(a), Pilot.hex(b), k));
const L = A.L, toL = A.toLocal;

// ---------------- where they stand in each world: m = 명현 (faces right), k = 경찬 (faces left) ----------------
const PL = {
  counter: { m: A.at(200, 1440, 700), k: A.at(900, 1440, 730, -1) },   // grid coordinates (inside the wide hero window)
  flour: { m: A.at(290, 1150, 640), k: A.at(800, 1150, 660, -1) },
  blanch: { m: A.at(190, 1600, 860), k: A.at(990, 1600, 880, -1) },
  season: { m: A.at(210, 1640, 880), k: A.at(880, 1640, 900, -1) },
  wok: { m: A.at(190, 1640, 860), k: A.at(940, 1640, 880, -1) },
  chat: { m: A.at(250, 1850, 760), k: A.at(700, 1850, 790, -1) },
  done: { m: A.at(170, 1660, 860), k: A.at(910, 1660, 880, -1) },
};
const COUNTER_Y = 380;   // worktop height, 명현-local px
const counterTop = id => L(PL[id].m, [0, COUNTER_Y])[1];

// ---------------- props over time (명현-local px unless noted) ----------------
// ① the tub: rot 0 → .95 rad (pivot at its front-bottom corner) and back; the 쭈꾸미 that slide out
const tipRot = t => .95 * eio(ss(B.tip, B.tip + .45, t)) * (1 - eio(ss(3.0, 3.4, t)));
const SPILL = [0, 1, 2, 3].map(i => ({ tr: B.tip + .2 + i * .07, land: [425 + i * 44, COUNTER_Y], seed: 11 + i, rot: [-.2, .15, -.1, .25][i] }));
// ② flour: 경찬 pours (his local grip on the bag's bottom), then holds the bowl; 명현 rubs
const FL_BOWL = [300, 470], FL_W = 260;
const bagGripK = t => [205 + 5 * Math.sin(t * TAU * 2), 612 + 8 * Math.abs(Math.sin(t * TAU * 2))];
const rubPh = t => Math.sin((t - B.rub) * TAU * 2);   // one stroke a beat
// ③ blanch: the strainer basket's centre height; 경찬's kitchen timer (his local)
const basketY = t => lerp(lerp(680, 540, eio(ss(6.0, B.dip, t))), 650, eio(ss(B.lift, B.lift + .35, t)));
const BASKET_X = 415, POT_X0 = 290, POT_X1 = 540, TIMER_K = [185, 680];
// ④ seasoning bowl, 명현's stirring spoon, 경찬's measuring spoon (screen px)
const SE_BOWL = [300, 480], SE_W = 300;
const stirGrip = t => { const a = (t - 8) * TAU * 1; return [282 + 30 * Math.cos(a), 578 + 10 * Math.sin(a)]; };
function mspoonState(t) {   // → { g (screen grip), tilt 0..1, kind, amt } — rest → over the bowl → tip on the beat → back
  const p = PL.season, bc = L(p.m, SE_BOWL), OVER = [bc[0] + 150, bc[1] - 105], REST = L(p.k, [160, 590]), bt = S.season.map(r => r[0]);
  let i = bt.findIndex((b, j) => t >= b && (j === bt.length - 1 || t < bt[j + 1])); if (t < bt[0]) i = -1;
  const t0 = i < 0 ? bt[0] - .5 : bt[i], ph = clamp((t - t0) / .5), nxt = S.season[i + 1], cur = S.season[i];
  if (i >= 0 && (ph < .25 || !nxt)) {   // tipped over the bowl (then home after the last one)
    const home = nxt ? 0 : eio(ss(.25, .6, ph)), END = L(p.k, [130, 500]);   // after the last spoonful the spoon comes to rest on the rim
    return { g: [lerp(OVER[0], END[0], home), lerp(OVER[1], END[1], home)], tilt: 1 - .8 * home, kind: cur[2], amt: 0 }; }
  if (ph < .5 && i >= 0) { const v = eio((ph - .25) / .25); return { g: [lerp(OVER[0], REST[0], v), lerp(OVER[1], REST[1], v)], tilt: 1 - v, kind: cur[2], amt: 0 }; }
  const v = eio(ss(.6, .9, ph)), fill = MG.popScale((ph - .5) * .5, .2)[0];
  return { g: [lerp(REST[0], OVER[0], v), lerp(REST[1], OVER[1], v)], tilt: eio(ss(.9, 1, ph)), kind: nxt[2], amt: (nxt[3] > 1 ? 1.15 : 1) * Math.min(1, fill) * (1 - ss(.94, 1, ph)) };
}
// ⑤ wok (명현 tosses): centre, tilt and grip under the toss; 경찬's sauce bowl (screen px)
const WOK_C = [420, 480], WOK_W = 280, WOK_D = 85, WOK_GRIP = [200, 522], WOK_GRIP_F = [244, 516];
function wokState(t) {
  const u = beatU(t), b = Math.sin(Math.PI * clamp(u / .5)), ang = .2 * b, off = [-20 * b, 18 * b];
  const g = q => { const r = rotAbout(q, WOK_C, ang); return [r[0] + off[0], r[1] + off[1]]; };
  return { C: [WOK_C[0] + off[0], WOK_C[1] + off[1]], ang, grip: g(WOK_GRIP), gripF: g(WOK_GRIP_F), b };
}
const pourTilt = t => .95 * eio(ss(12.0, 12.3, t)) * (1 - eio(ss(13.3, 13.6, t)));
function sauceBowl(t) {   // → { c (screen centre), rot (screen, CCW negative), near, far (screen grips) }
  const p = PL.wok, up = L(p.k, [150, 600]), down = L(p.k, [120, 540]), k = ss(13.4, 13.8, t);
  const c = [lerp(up[0], down[0], k), lerp(up[1], down[1], k) + 6 * MG.beatPulse(t) * k], rot = -pourTilt(t);
  const g = q => rotAbout([c[0] + q[0], c[1] + q[1]], c, rot);
  return { c, rot, near: g([62, 14]), far: g([30, 40]) };
}
// ⑥ phone in 명현's hands
const PHONE = [236, 600];
const tapDip = t => (t > 16.05 && t < 17.5) ? 7 * Math.max(0, Math.sin(t * TAU * 4)) : 0;
// ⑦ the plate (screen): carried by both, set on the counter at B.set
const PLATE_W = 400, PLATE_CX = 540;
const plateYs = t => lerp(L(PL.done.m, [0, 530])[1], counterTop('done') - 10, eio(ss(B.set - .35, B.set, t)));

// ---------------- the two pose tracks ----------------
const base = (t, f, blinks) => ({ walk: 0, walkAmt: 0, armSwing: 0, look: -.15, lean: .15, bounce: -9 * MG.beatPulse(t), mouth: .3, face: f, blink: Math.max(...blinks.map(b => tri(t, b))) });
const idAt = t => MG.sceneOf(SC, t).id;
function poseM(t) {   // 명현
  const id = idAt(t), P = base(t, 1, [1.2, 3.3, 5.6, 9.1, 13.4, 15.2, 17.9, 21.3]), p = PL[id] && PL[id].m;
  if (id === 'counter') {
    const r = tipRot(t), k = r / .95;
    Object.assign(P, { lean: .2 + .2 * k, look: -.12 - .2 * k, reach: A.bucketPt(r, 230, 405), reachAmt: 1, reachFar: A.bucketPt(r, 230, 520), reachFarAmt: 1,
      mouth: Math.max(.3, .9 * ss(2.4, 2.55, t) * (1 - ss(3.2, 3.5, t))) });
  } else if (id === 'flour') {
    const rub = eio(ss(B.pourEnd, B.rub, t)), ph = rubPh(t);
    Object.assign(P, { lean: .22 + .06 * rub, look: -.32, bounce: -6 * MG.beatPulse(t), mouth: .25 + .35 * rub,
      reach: [lerp(222, FL_BOWL[0] + 36 * ph, rub), lerp(478, FL_BOWL[1] - 18, rub)], reachAmt: 1,
      reachFar: [lerp(190, FL_BOWL[0] + 14 - 36 * ph, rub), lerp(474, FL_BOWL[1] - 14, rub)], reachFarAmt: 1 });
  } else if (id === 'blanch') {
    Object.assign(P, { lean: .12, look: -.2, reach: [205, basketY(t) + 96], reachAmt: 1, reachFarAmt: 0, mouth: .3 + .5 * ss(7.5, 7.7, t) });
  } else if (id === 'season') {
    const up = ss(B.jamo, B.jamo + .4, t);
    Object.assign(P, { lean: .16, look: lerp(-.22, .2, up), reach: stirGrip(t), reachAmt: 1, reachFar: [175, SE_BOWL[1] + 4], reachFarAmt: 1, mouth: .3 + .6 * up });
  } else if (id === 'wok') {
    const w = wokState(t);
    Object.assign(P, { lean: .14 + .05 * w.b, look: -.1 + .08 * w.b, reach: w.grip, reachAmt: 1, reachFar: w.gripF, reachFarAmt: 1, mouth: .3 + .4 * w.b });
  } else if (id === 'chat') {
    const rep = ss(18.5, 18.7, t), pump = t > 19 ? Math.max(0, Math.sin((t - 19) * TAU * 2)) : 0;
    Object.assign(P, { lean: .06, look: lerp(-.32, .1, rep), reach: [PHONE[0] - 8, PHONE[1] - 10 - tapDip(t)], reachAmt: 1,
      reachFar: [lerp(PHONE[0] + 14, 175, ss(18.9, 19.1, t)), lerp(PHONE[1] + 8, 790 + 30 * pump, ss(18.9, 19.1, t))], reachFarAmt: 1,
      bounce: -9 * MG.beatPulse(t) + 16 * rep * (1 - ss(18.8, 19.0, t)), mouth: .3 + .6 * rep });
  } else if (id === 'done') {
    const y = plateYs(t), off = 1 - ss(B.set + .05, B.set + .35, t), ch = ss(B.set + .15, B.set + .45, t), hx = PLATE_CX - PLATE_W / 2;
    Object.assign(P, { lean: (.2 + .15 * ss(B.set - .35, B.set, t)) * off + .05, look: lerp(-.25, .12, ch), cheer: ch, mouth: .3 + .6 * ch,
      reach: toL(p, [hx + 10, y + 8]), reachAmt: off, reachFar: toL(p, [hx + 52, y + 20]), reachFarAmt: off });
  }
  return P;
}
function poseK(t) {   // 경찬
  const id = idAt(t), P = base(t, -1, [.9, 2.8, 6.2, 8.6, 11.8, 14.1, 17.2, 20.2]), p = PL[id] && PL[id].k;
  P.bounce = -9 * MG.beatPulse(t - .02);
  if (id === 'counter') {
    const ct = toL(p, [0, counterTop('counter')])[1] + 6, wow = ss(2.45, 2.7, t) * (1 - ss(3.35, 3.6, t));
    Object.assign(P, { lean: .2 - .15 * wow, look: lerp(-.28, .12, wow), reach: [175, ct], reachAmt: 1 - wow, reachFar: [205, ct], reachFarAmt: 1 - wow, cheer: .85 * wow, mouth: .3 + .6 * wow });
  } else if (id === 'flour') {
    const pm = PL.flour.m, rim = toL(p, L(pm, [FL_BOWL[0] + FL_W / 2 - 4, FL_BOWL[1] - 6])), to = eio(ss(B.pourEnd, B.rub, t));
    Object.assign(P, { lean: .22, look: -.3, reach: to > 0 ? [lerp(bagGripK(B.pourEnd)[0], rim[0], to), lerp(bagGripK(B.pourEnd)[1], rim[1], to)] : bagGripK(t), reachAmt: 1,
      reachFar: [rim[0] + 26, rim[1] + 4], reachFarAmt: 1, mouth: .3 + .3 * ss(B.rub, B.rub + .2, t) });
  } else if (id === 'blanch') {
    const done = ss(7.75, 7.95, t);
    Object.assign(P, { lean: .1, look: lerp(-.12, .1, done), reach: TIMER_K, reachAmt: 1, reachFarAmt: 0, cheer: .7 * done, mouth: .3 + .5 * done });
  } else if (id === 'season') {
    const sp = mspoonState(t), rim = toL(p, L(PL.season.m, [SE_BOWL[0] + SE_W / 2 - 4, SE_BOWL[1] + 4])), up = ss(B.jamo, B.jamo + .4, t);
    Object.assign(P, { lean: .18, look: lerp(-.25, .2, up), reach: toL(p, sp.g), reachAmt: 1, reachFar: rim, reachFarAmt: 1, mouth: .3 + .5 * up });
  } else if (id === 'wok') {
    const sb = sauceBowl(t);
    Object.assign(P, { lean: .16 - .06 * ss(13.4, 13.8, t), look: -.18 + .1 * ss(13.4, 13.8, t), reach: toL(p, sb.near), reachAmt: 1, reachFar: toL(p, sb.far), reachFarAmt: 1, mouth: .3 + .4 * MG.beatPulse(t) });
  } else if (id === 'chat') {
    const rep = ss(18.55, 18.75, t);
    Object.assign(P, { lean: lerp(.24, .04, rep), look: lerp(-.3, .12, rep), reachAmt: 0, reachFar: [150, 860 + 30 * Math.max(0, Math.sin((t - 19) * TAU * 2))], reachFarAmt: rep, mouth: .3 + .6 * rep, bounce: -9 * MG.beatPulse(t) + 14 * rep * (1 - ss(18.8, 19.0, t)) });
  } else if (id === 'done') {
    const y = plateYs(t), off = 1 - ss(B.set + .05, B.set + .35, t), ch = ss(B.set + .2, B.set + .5, t), hx = PLATE_CX + PLATE_W / 2;
    Object.assign(P, { lean: (.2 + .15 * ss(B.set - .35, B.set, t)) * off + .05, look: lerp(-.25, .12, ch), cheer: ch, mouth: .3 + .6 * ch,
      reach: toL(p, [hx - 10, y + 8]), reachAmt: off, reachFar: toL(p, [hx - 52, y + 20]), reachFarAmt: off });
  }
  return P;
}
let D, E;   // the actors: D = 명현, E = 경찬
const actorAt = (ctx, X, t, p, o) => X.draw(ctx, t, p.x, p.y, p.h, o);
const shadowAt = (ctx, X, t, p, col) => X.shadow(ctx, t, p.x, p.y, p.h, col);
const whiteIn = (ctx, X, t, p, u) => { const a = 1 - ss(0, .3, u); if (a > 0) { ctx.save(); ctx.globalAlpha = a; actorAt(ctx, X, t, p, { mode: 'white' }); ctx.restore(); } };
const pair = (ctx, t, id, o) => { actorAt(ctx, D, t, PL[id].m, o); actorAt(ctx, E, t, PL[id].k, o); };
const pairWhite = (ctx, t, id, u) => { whiteIn(ctx, D, t, PL[id].m, u); whiteIn(ctx, E, t, PL[id].k, u); };
const pairShadow = (ctx, t, id, col) => { shadowAt(ctx, D, t, PL[id].m, col); shadowAt(ctx, E, t, PL[id].k, col); };

// ---------------- ① window grid: the tub, tipped out ----------------
const WINC = { x: 40, y: 420, w: 1000, h: 1080, bar: 54 };   // a wide hero window: the kitchen holds two
const GRID = { hero: T('부엌 – 쭈꾸미'), win: WINC, side: [['손질', -1, -1], ['데치기', 0, -1], ['양념', 1, -1], ['', -1, 0], ['', 1, 0], ['', -1, 1], ['', 0, 1], ['', 1, 1]] };
const BUCKET_C = L(PL.counter.m, [315, 465]), PILE_C = L(PL.counter.m, [500, 410]);
function camTo(ctx, c, k) { ctx.translate(540, 960); ctx.scale(k, k); ctx.translate(-c[0], -c[1]); }
function octoInBucket(t, which) {   // octopus in the tub (tub-local px): which 'in' (clipped, inside) | 'over' (draped over the rim)
  return (ctx, cx, top) => {
    const tt = tq(t), list = which === 'in' ? [[-46, 30, 2], [44, 26, 3]] : [[-30, -14, 0, -.25], [34, -20, 1, .2]];
    for (const [dx, dy, i, rot] of list) { if (SPILL[i] && t >= SPILL[i].tr) continue;
      A.octo(ctx, cx + dx, top + dy, 34, { col: A.RAW, t: tt + i, seed: 11 + i, rot: rot || 0, spread: .35 }); }
  };
}
function gridInner(ctx, t) {
  const p = PL.counter.m, tt = tq(t);
  MG.heroPage(ctx, WINC);
  A.counter(ctx, L(p, [110, 0])[0], L(PL.counter.k, [110, 0])[0], counterTop('counter'), 420);
  pairShadow(ctx, t, 'counter', 'rgba(110,70,20,.3)');
  for (const o of SPILL) { if (t < o.tr) continue;
    const v = clamp((t - o.tr) / .3), r0 = tipRot(o.tr), m0 = A.bucketPt(r0, 330 + (o.seed % 2) * 30, 540), land = [o.land[0], o.land[1] + 30];
    const q = [lerp(m0[0], land[0], eo(v)), lerp(m0[1], land[1], v) + 60 * Math.sin(Math.PI * v)];
    const sq = v >= 1 ? Math.max(0, 1 - (t - o.tr - .3) / .18) : 0, sc = L(p, q);
    A.octo(ctx, sc[0], sc[1], 34 * p.s, { col: A.RAW, t: tt + o.seed, seed: o.seed, rot: lerp(r0, o.rot, eo(v)), spread: lerp(.4, 1, v), squash: sq });
  }
  A.bucket(ctx, p, tipRot(tt), { inner: octoInBucket(t, 'in'), over: octoInBucket(t, 'over') });
  pair(ctx, t, 'counter');
}
function sceneCounter(ctx, t, u) {
  // camera: close on the tub → pull back into the window → dive into the pile on the last half beat
  const pb = eio(ss(1.0, 2.0, t)), dv = eio(ss(B.dive, 4.0, t));
  let c = [lerp(BUCKET_C[0], 540, pb), lerp(BUCKET_C[1], 960, pb)], k = lerp(2.4, 1, pb);
  c = [lerp(c[0], PILE_C[0], dv), lerp(c[1], PILE_C[1], dv)]; k = k * Math.pow(2.8, dv);
  ctx.save(); camTo(ctx, c, k); MG.windowGrid(ctx, t, u, x => gridInner(x, t), GRID); ctx.restore();
}

// ---------------- ② manga: flour, rub ----------------
const INK = '#111';
function flourHeap(ctx, x, y, w, amt) { if (amt <= 0) return; ctx.save(); ctx.fillStyle = '#ffffff'; ctx.strokeStyle = INK; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(x, y, w * .3 * amt, w * .1 * amt + 4, 0, Math.PI, TAU); ctx.quadraticCurveTo(x, y - w * .22 * amt, x - w * .3 * amt, y); ctx.fill(); ctx.stroke(); ctx.restore(); }
function puff(ctx, x, y, r, a) {   // a flour cloud: one outline around overlapping lobes
  if (a <= 0 || r <= 0) return; ctx.save(); ctx.globalAlpha = a;
  const lobes = [[0, 0, .62], [-.55, .18, .45], [.55, .16, .48], [-.2, -.38, .42], [.3, -.32, .4]];
  for (const pass of [0, 1]) { ctx.fillStyle = pass ? '#fff' : INK; for (const [dx, dy, rr] of lobes) { ctx.beginPath(); ctx.arc(x + dx * r, y + dy * r, rr * r + (pass ? 0 : 4), 0, TAU); ctx.fill(); } }
  ctx.restore(); }
function mangaHand(ctx, x, y, ang, sc) {   // a hand seen from above in the bowl: palm + four fingers, ink outline
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(sc, sc); ctx.lineCap = 'round';
  for (const pass of [0, 1]) { ctx.strokeStyle = pass ? '#fff' : INK; ctx.fillStyle = pass ? '#fff' : INK; const g = pass ? 0 : 10;
    for (let f = 0; f < 4; f++) { ctx.lineWidth = 26 + g; ctx.beginPath(); ctx.moveTo(10, -30 + f * 20); ctx.lineTo(62 - Math.abs(f - 1.5) * 8, -36 + f * 22); ctx.stroke(); }
    ctx.lineWidth = 24 + g; ctx.beginPath(); ctx.moveTo(-6, 26); ctx.lineTo(26, 48); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-8, 0, 46 + g / 2, 40 + g / 2, 0, 0, TAU); ctx.fill(); }
  ctx.restore(); }

function sceneFlour(ctx, t, u) {
  MG.mangaPaper(ctx);
  const p = PL.flour.m, pk = PL.flour.k, tt = tq(t), bw = FL_W * p.s, bc = L(p, FL_BOWL), flour = ss(4.15, B.pourEnd, t), coat = ss(B.rub, 5.9, t);

  ctx.fillStyle = '#f1e6d6'; ctx.beginPath(); ctx.roundRect(x + 3, y + 3, w - 6, 110, [44, 44, 0, 0]); ctx.fill();
  ctx.strokeStyle = '#2b1d1a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y + 113); ctx.lineTo(x + w, y + 113); ctx.stroke();
  ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x + 56, y + 38); ctx.lineTo(x + 36, y + 58); ctx.lineTo(x + 56, y + 78); ctx.stroke();
  avatar(ctx, x + 110, y + 58, 30, '#efe6d2'); avatar(ctx, x + 150, y + 58, 30, '#5f7fa8');
  ctx.fillStyle = '#2b1d1a'; ctx.font = `700 40px ${MG.SANS}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(T(S.group), x + 200, y + 60);
  // messages
  let yy = y + 150;
  for (const [at, who, str, until] of S.chat) {
    const kk = MG.backOut(clamp((t - at) / .25), 1.4);
    if (who === 'dots') { if (t >= at && t < until) { avatar(ctx, x + 80, yy + 40, 30, '#5f7fa8');
        ctx.save(); ctx.fillStyle = '#fff'; ctx.strokeStyle = '#2b1d1a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.roundRect(x + 130, yy, 150, 82, 30); ctx.fill(); ctx.stroke();
        for (let d = 0; d < 3; d++) { const b = Math.max(0, Math.sin((t - at) * TAU * 2 - d * .9)); ctx.fillStyle = '#8a7f78'; ctx.beginPath(); ctx.arc(x + 172 + d * 33, yy + 41 - 10 * b, 9, 0, TAU); ctx.fill(); } ctx.restore(); }
      continue; }
    if (who === 'photo') { if (t >= at) { const pw = 250, phh = 180, px = x + w - 40 - pw, sc = .6 + .4 * kk;
        ctx.save(); ctx.translate(px + pw, yy + phh); ctx.scale(sc, sc); ctx.translate(-(px + pw), -(yy + phh));
        ctx.beginPath(); ctx.roundRect(px, yy, pw, phh, 26); ctx.fillStyle = '#cfe0ea'; ctx.fill(); ctx.save(); ctx.clip();
        ctx.fillStyle = '#9fb9c9'; ctx.fillRect(px, yy + phh * .62, pw, phh);   // the photo: scene 1's wooden tub of 쭈꾸미 on the boat deck
        A.tub(ctx, px + pw / 2, yy + phh - 12, 120, 92, { over: (c, cx, top) => { A.octo(c, cx - 26, top + 4, 24, { col: A.RAW, seed: 3, spread: .3, t: 0 }); A.octo(c, cx + 26, top, 24, { col: A.RAW, seed: 4, spread: .3, t: 0, rot: .2 }); } });
        ctx.restore(); ctx.strokeStyle = '#2b1d1a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.roundRect(px, yy, pw, phh, 26); ctx.stroke(); ctx.restore(); }
      yy += 200; continue; }
    if (who === 'them') { if (t >= at) { avatar(ctx, x + 80, yy + 40, 30, '#5f7fa8'); bubbleBox(ctx, T(str), 'them', yy, 1, kk); } yy += 104; continue; }
    if (t >= at) bubbleBox(ctx, T(str), 'me', yy, 1, kk); yy += 104;
  }
  // input bar: the next message of mine types in before it is sent
  ctx.fillStyle = '#f1e6d6'; ctx.beginPath(); ctx.roundRect(x + 3, y + h - 96, w - 6, 93, [0, 0, 44, 44]); ctx.fill();
  ctx.strokeStyle = '#2b1d1a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y + h - 96); ctx.lineTo(x + w, y + h - 96); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(x + 30, y + h - 76, w - 160, 56, 28); ctx.fill(); ctx.stroke();
  const next = S.chat.find(([at, who]) => who === 'me' && t < at && t > at - .5);
  if (next) { const s0 = Pilot.chars(T(next[2])), n = Math.ceil(s0.length * clamp((t - (next[0] - .45)) / .4)); ctx.fillStyle = '#2b1d1a'; ctx.font = `500 36px ${MG.SANS}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const str = s0.slice(0, n).join(''); ctx.fillText(str, x + 56, y + h - 47); if ((t * 4 | 0) % 2 === 0) ctx.fillRect(x + 60 + ctx.measureText(str).width, y + h - 66, 4, 38); }
  ctx.fillStyle = '#e2a93b'; ctx.strokeStyle = '#2b1d1a'; ctx.beginPath(); ctx.arc(x + w - 70, y + h - 48, 32, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#2b1d1a'; ctx.beginPath(); ctx.moveTo(x + w - 84, y + h - 62); ctx.lineTo(x + w - 52, y + h - 48); ctx.lineTo(x + w - 84, y + h - 34); ctx.lineTo(x + w - 78, y + h - 48); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function sceneChat(ctx, t, u) {
  MG.bubbleSky(ctx, u);
  const p = PL.chat.m, tt = tq(t);
  pairShadow(ctx, t, 'chat', 'rgba(110,40,120,.35)');
  MG.bubblesBack(ctx, u);
  chatCard(ctx, t);
  const ph = L(p, [PHONE[0], PHONE[1] - tapDip(tt) * .5]);
  A.phone(ctx, ph[0] + 6, ph[1] - 26, p.s * 1.05, -.35, true);
  pair(ctx, t, 'chat'); pairWhite(ctx, t, 'chat', u);
  MG.bubblesFront(ctx, u);
}

// ---------------- ⑦ kaleidoscope: 완성 ----------------
let SNAP = [];
function sceneDone(ctx, t, u) {
  MG.kaleido(ctx, SNAP, u, { cy: 820 });
  ctx.fillStyle = 'rgba(27,20,48,.8)'; ctx.fillRect(0, 0, W, H);   // the worlds turn quietly behind; the dish is the subject
  const tt = tq(t), ct = counterTop('done');
  ctx.save(); ctx.translate(PLATE_CX, ct - 80); ctx.scale(.62, .62); MG.bigStar(ctx, u + .1, 0, 0); ctx.restore();
  A.counter(ctx, L(PL.done.m, [110, 0])[0], L(PL.done.k, [110, 0])[0], ct, 600, '#d9a86c', '#fbf3df');
  pairShadow(ctx, t, 'done', 'rgba(0,0,0,.35)');
  const py = plateYs(tt);
  if (t > B.set) A.steam(ctx, PLATE_CX, py - 70, 260, t, ss(B.set, B.set + .4, t));
  A.dish(ctx, PLATE_CX, py, PLATE_W, t);
  pair(ctx, t, 'done'); pairWhite(ctx, t, 'done', u);
}

// ---------------- frame ----------------
const SCENES = { counter: sceneCounter, flour: sceneFlour, blanch: sceneBlanch, season: sceneSeason, wok: sceneWok, chat: sceneChat, done: sceneDone };
function sceneAt(ctx, id, t) { const s = scAt(id); SCENES[id](ctx, t, t - s.at); }
function intro(ctx, t) {   // 「경찬 · 명현 부부의」 then 「손질 시작!」, out together before the dive
  const a = 1 - ss(3.6, 3.9, t); if (a <= 0) return;
  MG.pop(ctx, t, .5, T(S.intro[0]), 540, 215, 66, { alpha: a, d: .45 });
  MG.pop(ctx, t, 1.5, T(S.intro[1]), 540, 322, 110, { alpha: a });
}
function draw(ctx, t) {
  const sc = MG.sceneOf(SC, t);
  sceneAt(ctx, sc.id, t);
  if (sc.id === 'blanch' && t > sc.end - .3) MG.wipeUp(ctx, eio(ss(sc.end - .3, sc.end, t)), o => sceneSeason(o, sc.end, 0));
  if (sc.id === 'wok' && t > sc.end - .3) MG.bubblePop(ctx, eo(ss(sc.end - .3, sc.end, t)), o => sceneChat(o, sc.end, 0), ...L(PL.wok.m, [40, 560]));
  for (const id of ['flour', 'blanch', 'wok', 'done']) MG.flash(ctx, .8 * MG.pulse(t, scAt(id).at, .2));
  intro(ctx, t);
  MG.captions(ctx, t, S.lines);
  Story.fadeBlack(ctx, t, S.DUR, .5, .5);
}

async function init() {
  MG.init({ bpm: S.BPM, accent: A.RED }); MG.MAG2 = '#ffe9b0';   // the kit's light accent (spark tips) — warm cream, never a second red/pink
  D = MG.codeActor({ pose: poseM, dur: S.DUR, fps: FPS, colors: A.MH });
  E = MG.codeActor({ pose: poseK, dur: S.DUR, fps: FPS, colors: A.KC });
  const bc = L(PL.season.m, SE_BOWL);
  JHITS = WORD.jamo.map((_, i) => ({ t: B.jamo + i * .06, j: i, m: { x: bc[0] + (i - 2.5) * 36, y: bc[1] - 10 } }));
  for (const [id, dt] of [['counter', 3.0], ['flour', 1.5], ['blanch', 1.4], ['season', 3.6], ['wok', 2.2], ['chat', 2.9]])
    SNAP.push(MG.snap(x => sceneAt(x, id, scAt(id).at + dt)));
  // grip check (dev): a held thing must be within reach of the arm (IK pulls the hand short otherwise) — both actors
  window.__grip = ts => ts.map(t => { const o = [t];
    for (const [X, pf] of [[D, poseM], [E, poseK]]) { const i = X.fidx(t), r = X.rig(i), P = pf(i / FPS);
      for (const [k, key, amt] of [['aNear', 'reach', 'reachAmt'], ['aFar', 'reachFar', 'reachFarAmt']]) if (P[key] && (P[amt] ?? 1) >= .999) o.push(+dist(r[k].h, P[key]).toFixed(1)); }
    return o; });
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: MG.FONTS, init, draw });
</script>
