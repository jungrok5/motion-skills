<!doctype html>
<html lang="ko">

<title>바다 · 쭈꾸미 낚시</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap">

<script src="lib.js"></script>

<script src="kit-ukiyoe.js"></script>
<script>
/* sea-ukiyoe — scene 1 of 「쭈꾸미 한 접시」, an ukiyo-e print of 쭈꾸미 fishing at dawn (styles/ukiyoe/STYLE.md).
   One sheet: a dawn bokashi sky with mist bands and islands, the sea seen obliquely from the horizon (y 1000) down to the
   front cut (y 1300), and below the cut a printed SECTION of the water down to the sandy seabed (y ≈ 1830).
   A small wooden boat sits on the cut; 나 (navy, straw kasa with a mustard band) fishes with a short rod. The rig (snap,
   lead sinker, an ochre/green 에기) sinks to the seabed and is jigged (고패질); a beni-red 쭈꾸미 — the only red thing —
   peeks from behind a rock, climbs over and grabs the lure; the hit is a hard cut to a tight print with spray claws; it is
   reeled up, dangles, swung into the wooden bucket; two more follow; the sun comes up, the boat turns home, and the
   scene closes on the bucket full of red 쭈꾸미 (scene 2 opens on it).
   Clocks: figure, boat bob and rig on 8 fps (st8), water on 12 (st12), camera and captions on ones. */
const { clamp, lerp, ss, eo, eio, rng } = Pilot;
const U = Ukiyoe, PAL = U.PAL, KW = U.KW;
const { add, sub, lp2, seg, st8, st12, poly, smooth, circ, fill, key, both, erase, eraseStroke, len, nrm } = U;
const S = window.SCRIPT, B = S.beat, W = Pilot.W, H = Pilot.H, TAU = Math.PI * 2;

// ---------------------------------------------------------------- the world (world px)
const SX0 = -300, SY0 = -700, SX1 = 2200, SY1 = 2700;   // the printed sheet
const HZ = 1000, SEA = 1300, BED = 1930;                 // horizon, the front cut (waterline of the section), seabed
const MUST = '#e2a93b';                                  // 나's identity mark (hat band + tie)
const OS = 1.3;                                          // the 쭈꾸미's print scale (palm-sized, drawn readable)
const OCT = PAL.beni, OCT_T = PAL.beniT, OCT_D = '#963426', OCT_C = PAL.beniC;   // the one accent: 쭈꾸미 red
const bedY = x => BED + 6 * Math.sin(x * .011) + 4 * Math.sin(x * .037 + 1.3);
let SKY, ISL = [], RIPPLES, LX = 1060, RX, ROCK;

// ---------------------------------------------------------------- small helpers
// eased keyframes: ks = [[t, v], …] → v at t (eio between keys)
function kf(t, ks) {
  if (t <= ks[0][0]) return ks[0][1];
  for (let i = 1; i < ks.length; i++) if (t <= ks[i][0]) { const [a, va] = ks[i - 1], [b, vb] = ks[i]; return lerp(va, vb, eio(seg(t, a, b))); }
  return ks[ks.length - 1][1];
}
const rot = (v, a) => [v[0] * Math.cos(a) - v[1] * Math.sin(a), v[0] * Math.sin(a) + v[1] * Math.cos(a)];
// a tapered, curling stroke (octopus arm, seaweed frond) → { path, pts }
function taper(p0, a, L, w0, curl, wig = 0, ph = 0, n = 10) {
  const pts = []; let x = p0[0], y = p0[1];
  for (let i = 0; i <= n; i++) { pts.push([x, y]); const k = i / n; a += curl * k * k * .5 + wig * Math.sin(k * 5 + ph) * .1; x += Math.cos(a) * L / n; y += Math.sin(a) * L / n; }
  const Lp = [], Rp = [];
  for (let i = 0; i <= n; i++) {
    const q = pts[Math.min(i + 1, n)], pq = pts[Math.max(0, i - 1)], d = nrm(sub(q, pq)), w = w0 * Math.pow(1 - i / (n + 1), .85) + .5;
    Lp.push([pts[i][0] - d[1] * w, pts[i][1] + d[0] * w]); Rp.push([pts[i][0] + d[1] * w, pts[i][1] - d[0] * w]);
  }
  return { path: smooth(Lp.concat(Rp.reverse()), true), pts };
}

// ---------------------------------------------------------------- the boat (local u along the hull, v up(−)/down(+), d depth)
const BOW = 185, STERN = -205, BEAM = 80;
const gunV = u => { const k = u / 200; return -52 - 6 * k * k - (u > 0 ? 16 * Math.pow(u / BOW, 4) : 5 * Math.pow(-k, 3)); };
const keelV = u => u > 0 ? 36 * (1 - Math.pow(u / BOW, 2.4)) : 36 - 18 * Math.pow(-u / -STERN, 3);
function boatAt(t) {
  const tq = st8(t), bf = U.turn(t, B.turn, 1, -1, .375);
  const bx = lerp(820, 640, U.trap(seg(t, B.home, 23.5), .3));
  const by = SEA + 2.5 * Math.sin(tq * 2.1) + 1.2 * Math.sin(tq * 3.7 + 1);
  return { bx, by, bf };
}
const BP = (b, u, v, d = 0) => [b.bx + b.bf * u + U.DX * d, b.by + v + U.DY * d];
function boatBack(b) {
  const near = [], far = [];
  for (let u = STERN; u <= BOW; u += 10) { near.push(BP(b, u, gunV(u), 0)); far.push(BP(b, u, gunV(u), BEAM)); }
  near.push(BP(b, BOW, gunV(BOW), 0)); far.push(BP(b, BOW, gunV(BOW), BEAM));
  // the opening: floor boards (light) with the far inner wall above them
  fill(poly(near.concat(far.slice().reverse())), PAL.woodT);
  const wall = far.map(p => add(p, [0, 24]));
  both(poly(far.concat(wall.slice().reverse())), PAL.wood, 1.8);
  const pl = new Path2D(); for (const k of [.45]) { pl.moveTo(far[0][0], far[0][1] + 24 * k); for (const p of far) pl.lineTo(p[0], p[1] + 24 * k); } key(pl, 1.2, PAL.woodD, .8);
  // transom (stern face) + thwart (seat) across the beam
  both(poly([BP(b, STERN, gunV(STERN), 0), BP(b, STERN, gunV(STERN), BEAM), BP(b, STERN, -8, BEAM), BP(b, STERN, -8, 0)]), PAL.woodD, 1.8);
  for (const [u0, w0] of [[-150, 16], [BK_U - 24, 48]]) { const a = u0, c = u0 + w0; both(poly([BP(b, a, gunV(a) + 4, 0), BP(b, c, gunV(c) + 4, 0), BP(b, c, gunV(c) + 4, BEAM), BP(b, a, gunV(a) + 4, BEAM)]), PAL.woodT, 1.6); }
  key(poly(far, false), 2.2);
}
function boatFront(b, t) {
  const top = [], bot = [];
  for (let u = STERN; u <= BOW; u += 10) top.push(BP(b, u, gunV(u)));
  top.push(BP(b, BOW, gunV(BOW)));
  for (let u = BOW; u >= STERN; u -= 10) bot.push(BP(b, u, keelV(u)));
  bot.push(BP(b, STERN, keelV(STERN)));
  const hull = poly(top.concat(bot));
  both(hull, PAL.wood, KW);
  const s0 = BP(b, BOW, gunV(BOW) - 8), s1 = BP(b, BOW - 4, 4), stem = new Path2D(); stem.moveTo(s0[0], s0[1]); stem.quadraticCurveTo(s0[0] + b.bf * 6, (s0[1] + s1[1]) / 2, s1[0], s1[1]); key(stem, 7, PAL.sumi); key(stem, 4, PAL.woodD);
  // strakes (plank seams) + the gunwale rail
  const sk = new Path2D();
  for (const k of [.36, .68]) { let first = true; for (let u = STERN + 4; u <= BOW - 6; u += 10) { const g = gunV(u), kv = keelV(u), p = BP(b, u, lerp(g, kv, k * (u > 120 ? 1 - (u - 120) / 200 : 1))); if (first) { sk.moveTo(p[0], p[1]); first = false; } else sk.lineTo(p[0], p[1]); } }
  key(sk, 1.5, PAL.woodD, .9);
  const rail = []; for (let u = STERN; u <= BOW; u += 10) rail.push(BP(b, u, gunV(u) + 7)); rail.push(BP(b, BOW, gunV(BOW) + 7));
  both(poly(top.concat(rail.slice().reverse())), PAL.woodD, 1.6);
  // the part under the waterline is seen through the water: a Prussian glaze over it
  const wl = []; for (let u = STERN; u <= BOW; u += 10) wl.push(BP(b, u, 0));
  fill(poly(wl.concat(bot)), PAL.prus, .5);
  key(poly(wl, false), 1.6, PAL.prusL, .9);
  // a small outboard on the transom (steel greys, never red)
  const e0 = -222, E = (u, v) => BP(b, e0 + u, v, 40);
  both(poly([E(-6, -64), E(8, -64), E(6, 24), E(14, 30), E(-8, 30), E(-4, 22)]), PAL.greyD, 1.8);            // leg + skeg
  both(smooth([E(-22, -76), E(-18, -100), E(10, -104), E(22, -92), E(18, -66), E(-16, -62)], true), PAL.greyL, 2);   // cowl
  key(poly([E(-20, -80), E(20, -84)], false), 2.4, PAL.greyD);
  const tl = new Path2D(), t0 = E(16, -80), t1 = E(58, -70); tl.moveTo(t0[0], t0[1]); tl.lineTo(t1[0], t1[1]); key(tl, 5, PAL.sumi); key(tl, 2.6, PAL.greyD);  // tiller
  const pr = E(-2, 24); both(smooth([add(pr, [-3, -10]), add(pr, [4, -2]), add(pr, [-3, 10]), add(pr, [-6, 0])], true), PAL.grey, 1.4);
}

// ---------------------------------------------------------------- 나 (the kit's rig; this scene's poses)
const ME = { robe: '#2f4366', robeD: '#24365a', legs: '#22304c', shin: '#1c2840', shinD: '#141c2c', arm: '#283b5e', armD: '#1f3050', obi: '#3b3531', hat: 'none' };
const C2 = B.c2, C3 = B.c3, CY = [C2, C3];
function meAt(t, b) {
  const ta = st8(t), f = U.turn(t, B.turn, 1, -1, .375);
  let lean = kf(ta, [[0, .06], [10.45, .08], [10.6, -.14], [12.6, -.1], [13.4, .02], [14.3, .03], [15.1, .14], [15.5, .05],
    [C2 + .35, .06], [C2 + .5, -.04], [C2 + .75, .12], [C2 + .9, .05], [C3 + .35, .06], [C3 + .5, -.04], [C3 + .75, .12], [C3 + .9, .05], [17.9, .0]]);
  lean += .012 * Math.sin(ta * 1.9);
  const bow = kf(ta, [[0, .2], [3.8, .3], [6.5, .42], [10.45, .42], [10.6, .15], [13.0, .1], [13.4, -.02], [14.3, .0], [15.1, .45], [15.5, .3],
    [17.3, .25], [17.9, .0], [19.0, -.12], [21, -.05]]);
  return { x: b.bx + b.bf * -60, d: 40, gy: b.by - 12, f, mode: 'stand', lean, bow, hipH: 134, s: 1, ...ME };
}
// rod angle θ (rad from horizontal, − = up) and bend 0..1 per moment, + the 고패질 jig on 8 fps
function jig(ta) { for (const j0 of [7.0, 8.0, 9.0]) { const k = ta - j0; if (k >= 0 && k < .625) return k < .25 ? eo(k / .25) : k < .5 ? 1 : 1 - (k - .5) / .125; } return 0; }
function rodAngle(ta) {
  const ks = [[0, -.2], [3.6, -.2], [4.0, -.1], [6.5, -.17], [10.45, -.17], [10.55, -.02], [11.3, -.12], [13.0, -.42], [13.4, -.5], [14.3, -.5], [15.1, -1.0], [15.5, -.25]];
  for (const c of CY) ks.push([c + .35, -.25], [c + .5, -.5], [c + .75, -1.0], [c + .9, -.25]);
  ks.push([B.stow, -.25], [B.stow + .6, -1.42]);
  return kf(ta, ks) - .14 * jig(ta);
}
function rodBend(ta) {
  const ks = [[0, 0], [10.45, 0], [10.5, .95], [11.0, .8], [13.0, .6], [13.4, .28], [14.3, .25], [15.1, .2], [15.25, 0]];
  for (const c of CY) ks.push([c + .3, 0], [c + .38, .55], [c + .5, .32], [c + .75, .2], [c + .82, 0]);
  return kf(ta, ks);
}
const ROD = 250;
function rodAt(t) {
  const ta = st8(t), b = boatAt(t), st = meAt(t, b), R = U.pose(st), f = R.f;
  const th = rodAngle(ta), bend = rodBend(ta), stow = eio(seg(ta, B.stow, B.stow + .6));
  const G = U.reach(R, add(R.sh, lp2([30 * Math.sign(f) * Math.abs(f), 64], [24 * f, 42], stow)));
  const u = nrm([f * Math.cos(th), Math.sin(th)]);
  // bent rod: the tip is pulled down toward the line; the curve's control point stays on the straight rod
  const tip = add(G, rot(u, Math.sign(f) * bend * .55), ROD * (1 - .05 * bend)), ctrl = add(G, u, ROD * .5), butt = add(G, u, -24);
  let far = null;
  if (stow < .5) { for (let k = 52; k >= 22; k -= 3) { const p = add(G, u, k); if (len(sub(p, R.sh)) < (R.UA + R.FA) * .97) { far = p; break; } } }
  return { ta, b, st, R, G, u, tip, ctrl, butt, far, bend, stow };
}
function rodPts(r) { const pts = []; for (let i = 0; i <= 14; i++) { const k = i / 14, a = lp2(r.G, r.ctrl, k), c = lp2(r.ctrl, r.tip, k); pts.push(lp2(a, c, k)); } return pts; }
function drawRod(r) {
  const pts = rodPts(r);
  const p1 = new Path2D(); p1.moveTo(r.butt[0], r.butt[1]); for (let i = 0; i <= 8; i++) p1.lineTo(pts[i][0], pts[i][1]);
  const p2 = new Path2D(); p2.moveTo(pts[8][0], pts[8][1]); for (let i = 9; i <= 14; i++) p2.lineTo(pts[i][0], pts[i][1]);
  key(p1, 7, PAL.sumi); key(p1, 4, PAL.woodD); key(p2, 4.6, PAL.sumi); key(p2, 2.2, PAL.woodD);
  // cork grip + a small spinning reel under it
  const g0 = r.butt, g1 = add(r.G, r.u, 10), gp = new Path2D(); gp.moveTo(g0[0], g0[1]); gp.lineTo(g1[0], g1[1]); key(gp, 10, PAL.sumi); key(gp, 7, PAL.roadD);
  let n = [-r.u[1], r.u[0]]; if (n[1] < 0) n = [-n[0], -n[1]];
  const rc = add(add(r.G, r.u, 16), n, 13), st = new Path2D(); const s0 = add(r.G, r.u, 16); st.moveTo(s0[0], s0[1]); st.lineTo(rc[0], rc[1]);
  key(st, 3, PAL.sumi); both(circ(rc, 7.5), PAL.greyL, 1.8); both(circ(rc, 2.6), PAL.greyD, 1);
  // guides
  const gd = new Path2D(); for (const i of [6, 10, 13]) { const q = pts[i]; gd.moveTo(q[0] + 3, q[1]); gd.arc(q[0], q[1], 3, 0, TAU); } key(gd, 1.2);
}
// the hat: a mustard band round the kasa + a mustard chin tie, short dark hair under it (drawn right after the head)
function hatBand(R) {
  const s = R.s, f = R.f, hb = R.hb, up = [Math.sin(hb) * f, -Math.cos(hb)], fw = [Math.cos(hb) * f, Math.sin(hb)];
  const K = (u, v) => add(add(R.head, fw, u * s), up, v * s);
  both(poly([K(-13, 1), K(-15, -7), K(-10, -11), K(-6, -2)]), PAL.sumi, KW * .4);          // short dark hair under the brim
  const tie = new Path2D(), a = K(-7, 3), c = K(-1, -12), e = K(5, -16); tie.moveTo(a[0], a[1]); tie.quadraticCurveTo(c[0], c[1], e[0], e[1]); key(tie, 2.8, MUST);
  both(poly([K(-52, 2), K(-30, 12), K(-4, 30), K(4, 30), K(30, 12), K(54, 2), K(0, 6)]), '#e4d3a4', KW * s);
  const sl = new Path2D(); for (const q of [-30, -14, 0, 16, 32]) { const a0 = K(q * .1, 28), a1 = K(q * 1.5, 4); sl.moveTo(a0[0], a0[1]); sl.lineTo(a1[0], a1[1]); } key(sl, KW * s * .4, '#9c8250');
  both(poly([K(-50, 2), K(52, 2), K(0, -2)]), '#8a6a36', KW * s * .5);
  both(poly([K(-37, 9), K(38, 9), K(25, 17.5), K(-25, 17.5)]), MUST, KW * .8);
}

// ---------------------------------------------------------------- the rig: snap → lead sinker below, the 에기 hanging beside it
function drawEgi(n, a, s = 1) {
  const u = [Math.cos(a), Math.sin(a)], v = [-Math.sin(a), Math.cos(a)], L = (x, y) => [n[0] + (u[0] * x + v[0] * y) * s, n[1] + (u[1] * x + v[1] * y) * s];
  const body = smooth([L(-1, 0), L(8, -6.5), L(22, -8.5), L(36, -6.5), L(45, -3), L(47, 0), L(45, 3.5), L(31, 7.5), L(14, 7.5), L(4, 4.5)], true);
  both(body, PAL.ochre, 2);
  fill(smooth([L(6, -4.5), L(20, -8), L(36, -6.4), L(44, -2.6), L(34, -2.2), L(18, -2.4)], true), PAL.greenD);
  const st = new Path2D(); for (const x of [14, 22, 30]) { const p = L(x, -2), q = L(x + 4, 4.5); st.moveTo(p[0], p[1]); st.lineTo(q[0], q[1]); } key(st, 1.2, PAL.woodD, .7);
  key(body, 2);
  const e = L(7, 0); erase(circ(e, 2.8 * s), 1); key(circ(e, 2.8 * s), 1.2); fill(circ(e, 1.2 * s), PAL.sumi);
  const fn = new Path2D(); for (const x of [18, 26]) { const p = L(x, 7), q = L(x + 5, 12); fn.moveTo(p[0], p[1]); fn.lineTo(q[0], q[1]); } key(fn, 1.4);
  const hk = new Path2D(); for (let i = 0; i < 7; i++) { const aa = (i - 3) * .28, p = L(47, 0), q = add(p, rot(u, aa), 10 * s), r2 = add(q, rot(u, aa + (i < 3 ? -2.4 : 2.4)), 3 * s); hk.moveTo(p[0], p[1]); hk.lineTo(q[0], q[1]); hk.lineTo(r2[0], r2[1]); }
  key(hk, 1.1, PAL.greyD);
}
function drawRig(Sp, egiA, sinkA = 0) {
  const sk = add(Sp, rot([0, 30], sinkA)), ld = new Path2D(); ld.moveTo(Sp[0], Sp[1]); ld.lineTo(sk[0], sk[1] - 6);
  key(ld, 1.2, PAL.sumi, .9);
  both(smooth([add(sk, [0, -9]), add(sk, [6, -1]), add(sk, [5, 6]), add(sk, [-5, 6]), add(sk, [-6, -1])], true), PAL.greyD, 1.6);
  both(circ(Sp, 2.6), PAL.greyL, 1.2);
  drawEgi(add(Sp, [1, 3]), egiA);
}
// the line: sumi in the air, a paper thread in the water (light is paper)
function drawLine(T, Sp) {
  const p = new Path2D(); p.moveTo(T[0], T[1]); p.lineTo(Sp[0], Sp[1]);
  if (Sp[1] <= SEA - 2) { key(p, 1.5); return; }
  const k = clamp((SEA - T[1]) / (Sp[1] - T[1])), m = lp2(T, Sp, k), a = new Path2D(), w = new Path2D();
  a.moveTo(T[0], T[1]); a.lineTo(m[0], m[1]); w.moveTo(m[0], m[1]); w.lineTo(Sp[0], Sp[1]);
  key(a, 1.5); eraseStroke(w, 2.6, .85);
}

// ---------------------------------------------------------------- the 쭈꾸미 (palm-sized: round mantle, two eyes, 8 curling arms)
/* drawOcto(c, o): c = mantle centre; o = { s, ang (0 = mantle up), mode 'dangle' | 'crawl' | 'wrap' | 'tuck', t, seed, look,
   armL, front: false (draw only the far arms + body, for something to sit between) } */
function drawOcto(c, o) {
  const s = o.s ?? 1, ang = o.ang ?? 0, ta = st8(o.t ?? 0), R = rng(o.seed ?? 1), mode = o.mode || 'dangle';
  const rt = [Math.cos(ang), Math.sin(ang)], dn = [-Math.sin(ang), Math.cos(ang)];
  const P = (x, y) => [c[0] + (rt[0] * x + dn[0] * y) * s, c[1] + (rt[1] * x + dn[1] * y) * s];
  const arms = [];
  for (let i = 0; i < 8; i++) {
    const side = i < 4 ? -1 : 1, k = (i - 3.5) / 3.5, r1 = R(), r2 = R();
    let a, curl, Ln = 46 * (o.armL ?? 1) * (.82 + r1 * .3);
    if (mode === 'crawl') { a = Math.PI / 2 + k * 1.35; curl = -side * (.7 + r2 * .6); Ln *= 1.05; }
    else if (mode === 'wrap') { a = Math.PI / 2 + k * .9; curl = side * (1.3 + r2 * .7); }
    else if (mode === 'tuck') { a = Math.PI / 2 + k * 1.2; curl = -side * (1 + r2 * .6); Ln *= .62; }
    else { a = Math.PI / 2 + k * .5; curl = (i % 2 ? 1 : -1) * (.6 + r2 * .7); }
    const wig = Math.sin(ta * 4.2 + i * 1.7) * (mode === 'crawl' ? 1.2 : .8);
    const base = P(k * 10.5, 14 + (1 - Math.abs(k)) * 2.5);
    arms.push({ i, far: i % 2 === 1, base, a: a + ang, curl: curl * (o.curlK ?? 1), Ln: Ln * s, wig });
  }
  const drawArm = (A, col) => { const tp = taper(A.base, A.a, A.Ln, 5.4 * s, A.curl, A.wig, A.i); both(tp.path, col, 1.5 * Math.min(1.4, s)); return tp; };
  const part = o.part || 'all';
  if (part !== 'front') {
  for (const A of arms) if (A.far) drawArm(A, OCT_D);
  // mantle + head as one rounded body
  const body = smooth([P(0, -20), P(11, -17), P(15.5, -7), P(14, 2), P(10.5, 7), P(12.5, 12), P(9, 16.5), P(0, 17.5), P(-9, 16.5), P(-12.5, 12), P(-10.5, 7), P(-14, 2), P(-15.5, -7), P(-11, -17)], true);

function drawFish(t) {
  for (const [x0, y, sp, s, ph] of [[1500, 1470, -22, 1, 0], [300, 1590, 16, .8, 1.3]]) {
    const ta = st8(t), x = x0 + sp * t, f = Math.sign(sp), c = [x, y + Math.sin(t * 1.1 + ph) * 6], w = Math.sin(ta * 9 + ph) * 3;
    const body = smooth([add(c, [f * 22 * s, 0]), add(c, [f * 6 * s, -9 * s]), add(c, [-f * 14 * s, -4 * s]), add(c, [-f * 18 * s, 0]), add(c, [-f * 14 * s, 4 * s]), add(c, [f * 6 * s, 8 * s])], true);
    const tail = poly([add(c, [-f * 16 * s, 0]), add(c, [-f * 30 * s, -9 * s + w]), add(c, [-f * 27 * s, 0]), add(c, [-f * 30 * s, 9 * s + w])]);
    both(tail, PAL.greyL, 1.4); both(body, PAL.greyL, 1.6);
    const e = add(c, [f * 13 * s, -2 * s]); fill(circ(e, 1.8 * s), PAL.sumi);
  }
}

// ---------------------------------------------------------------- the 쭈꾸미 before the hit: hidden → peeks → climbs over → creeps → pounces
function octo0(t) {
  const ta = st8(t), top = ROCK.topY, lure = rigAt(t).Sp, bx = RX - 104, by = bedY(RX - 104) - 36;
  if (ta < B.peek) return null;
  if (ta < B.climb) { const k = eo(seg(ta, B.peek, B.peek + .6)); return { c: [RX - 6 + Math.sin(ta * 1.2) * 3, lerp(top + 42, top - 12, k)], behind: true, mode: 'dangle', ang: .12 * Math.sin(ta * 1.7), look: ta > 8 ? -1 : Math.sin(ta * 2) > 0 ? -1 : 0 }; }
  if (ta < 9.0) { const k = eio(seg(ta, B.climb, 9.0)); return { c: [lerp(RX - 6, RX - 40, k), lerp(top - 12, top - 40, Math.sin(k * Math.PI * .5))], behind: k < .4, mode: 'crawl', ang: -.35 * k, look: -1 }; }
  if (ta < 9.6) { const k = eio(seg(ta, 9.0, 9.6)); return { c: [lerp(RX - 40, bx, k), lerp(top - 40, by, k)], mode: 'crawl', ang: -.35 + .2 * k, look: -1 }; }
  if (ta < B.pounce) { const k = seg(ta, 9.6, B.pounce); return { c: [lerp(bx, lure[0] + 78, k), by + Math.sin(k * 6) * 2], mode: 'crawl', ang: -.1, look: -1 }; }
  const k = eo(seg(ta, B.pounce, B.hit - .05)); return { c: lp2([lure[0] + 78, by], add(lure, [20, 2]), k), mode: k < .8 ? 'crawl' : 'wrap', ang: -.4 * (1 - k), look: -1 };
}
// the 쭈꾸미 riding the lure (wrapped round the 에기)
function octoOnRig(rg, t, part) {
  const a = rg.egiA, mid = add(rg.Sp, [Math.cos(a) * 24, Math.sin(a) * 24 + 3]), n = [Math.sin(a), -Math.cos(a)];
  const c = add(mid, n, 20), ang = Math.atan2(n[0], -n[1]) * .5;
  drawOcto(c, { s: OS, ang, mode: 'wrap', t, seed: 11 + rg.oct * 7, look: 1, part });
  return c;
}
function drips(c, t, t0) {
  const tq = st12(t), dp = new Path2D();
  for (let i = 0; i < 3; i++) { const ph = ((tq - t0) * 1.6 + i / 3) % 1, x = c[0] + (i - 1) * 14, y = c[1] + 40 + ph * ph * 160, r = 2.6; if (y > SEA - 4) continue; dp.moveTo(x + r, y); dp.arc(x, y, r, 0, TAU); }
  erase(dp, 1); key(dp, 1, PAL.prusL, .8);
}

// ---------------------------------------------------------------- camera
const CA0 = { z: 1.27, x: 905, y: 1150 }, CA1 = { z: 1.33, x: 890, y: 1140 }, CB = { z: .98, x: 950, y: 1450 };
let CC, CH;
const CL = { z: 1.5, x: 915, y: 1150 }, CW = { z: .86, x: 900, y: 990 };
function camera(t) {
  let c;
  if (t < 4.6) c = U.camMix(CA0, CA1, seg(t, 0, 4.6));
  else if (t < 8.4) c = U.camMix(CA1, CB, eio(seg(t, 4.6, 6.6)));
  else if (t < B.hit) c = U.camMix(CB, CC, eio(seg(t, 8.4, B.hit - .1)));
  else if (t < 11.7) c = { ...CH, x: CH.x + U.shake(t, B.hit, .3, 12), y: CH.y - 12 * seg(t, B.hit, 11.7) };
  else if (t < 17.0) { c = U.camMix({ ...CH, y: CH.y - 12 }, CL, eio(seg(t, 11.7, 12.9))); c.x += 8 * seg(t, 12.9, 17); }
  else if (t < B.close) { const b = boatAt(t); c = U.camMix({ ...CL, x: CL.x + 8 }, { ...CW, x: CW.x + (b.bx - 820) * .5 }, eio(seg(t, 17.0, 18.4))); }
  else { const b = boatAt(t), bk = bucketTop(b), CE = { z: 4.4, x: bk[0] + 4, y: bk[1] + 22 }; c = U.camMix({ ...CW, x: CW.x + (b.bx - 820) * .5 }, CE, eio(seg(t, B.close, 21.0))); }
  return c;
}

// ---------------------------------------------------------------- frame
function world(t) {
  const ta = st8(t);
  drawSky(t);
  drawSurface(t);
  drawSection(t);
  drawFish(t);
  drawSeabed(t);
  const rg = rigAt(t), r = rg.r, b = r.b;
  // the 쭈꾸미 before the hit (behind the rock while it peeks)
  const o0 = t < B.hit ? octo0(t) : null;
  if (o0 && o0.behind) drawOcto(o0.c, { s: OS, ang: o0.ang, mode: o0.mode, t, seed: 11, look: o0.look });
  drawRock();
  // the hit: spray claws thrown up round the lure on the seabed (Hokusai's wave as punctuation)
  U.splash(t, { x: LX + 22, y: bedY(LX) - 16, t0: B.hit, sea: bedY(LX) - 8, size: .55 });
  // surface splashes as each one breaks the water
  U.splash(t, { x: rigAt(B.surface + .05).Sp[0], y: SEA - 2, t0: B.surface, sea: SEA + 4, size: .38 });
  for (const c of CY) if (t < c + 1.1) U.splash(t, { x: rigAt(c + .4).Sp[0], y: SEA - 2, t0: c + .4, sea: SEA + 4, size: .26 });   // cut short: the next beat is already on
  // boat (back half), 나, bucket, boat (front half)
  boatBack(b);
  drawBucket(b, t);
  const st = r.st, R = r.R;
  const holding = r.stow < .5;
  U.figure(R, ME, { st, near: r.G, far: r.far || undefined, nearFist: true, farFist: !!r.far,
    front: RR => { hatBand(RR); drawRod(r); } });
  boatFront(b, t);
  // the rig on its line, with the 쭈꾸미 riding it after the hit
  drawLine(r.tip, rg.Sp);
  if (o0 && !o0.behind) drawOcto(o0.c, { s: OS, ang: o0.ang, mode: o0.mode, t, seed: 11, look: o0.look });
  if (rg.oct >= 0) octoOnRig(rg, t, 'back');                       // body + far arms behind the lure, near arms over it
  drawRig(rg.Sp, rg.egiA);
  if (rg.oct >= 0) { const c = octoOnRig(rg, t, 'front'); if (rg.Sp[1] < SEA - 30) drips(c, t, 0); }
  U.border();
}
function draw(ctx, t) {
  const c = camera(t);
  U.begin(ctx, c);
  world(t);
  U.print(ctx, {});
  U.captions(ctx, t, S.lines);
  Story.fadeBlack(ctx, t, S.DUR, .5, .5);
}
async function init() {
  U.init({ sheet: [SX0, SY0, SX1, SY1], ground: SEA });
  SKY = U.sky({ y0: SY0, h: HZ + 40 - SY0, top: 120, topSoft: 640, haze: 760, hazeSoft: 260, hazeA: .3 });
  LX = rodAt(6.5).tip[0];
  buildStatic(); buildRock();
  CC = { z: 1.6, x: LX + 70, y: bedY(LX) - 150 }; CH = { z: 2.9, x: LX + 40, y: bedY(LX) - 70 };
}
Pilot.run({ W, H, dur: S.DUR, fonts: U.FONTS, init, draw });
</script>
