<script type="module">
// 「月蝕 · Thousand-Moon Eclipse」 — the worked example (BRIEF.md). 30 s, 16 shots, the fixed grammar of the style:

import { Film } from 'um/film.js';
import { fighter, run, drawFighter } from 'um/fighter.js';

const RED = '#e0142d';
const HERO = {

  wind: { pose: 'ready', twist: .6, hipYaw: .2, gx: .38, gy: 1.0, gz: -.18, by: 2.3, bp: .04, both: 1, ls: .24 },

  rise: { pose: 'rise', gx: .18, gy: 1.5, gz: .32, by: .1, bp: 1.0, both: 1, ls: -.5 },
  spin: { pose: 'tuck', gx: .45, gy: 1.1, gz: .05, by: 1.57, bp: 0, both: 0 },
  raise: { pose: 'raise', gx: .02, gy: 1.62, gz: .14, by: 0, bp: -1.3, both: 1, ls: .32 },
  plunge: { pose: 'plunge', gx: 0, gy: .86, gz: .42, by: 0, bp: -1.32, both: 1, ls: .3 },
  vertical: { pose: 'standUp', gx: .06, gy: 1.1, gz: .28, by: 0, bp: 1.5, br: 0, both: 0 },
  level: { pose: 'guard', gx: .2, gy: 1.16, gz: .3, by: -1.57, bp: 0, both: 1, ls: -.42 },
  draw: { pose: 'drawBack', gx: .28, gy: .99, gz: -.26, by: 2.75, bp: -.08, both: 1, ls: -.3 },
  final: { pose: 'finalCut', gx: -.28, gy: 1.0, gz: .24, by: -1.55, bp: .03, both: 1, ls: -.24 },
  rest: { pose: 'endStand', gx: .26, gy: .86, gz: .08, by: .55, bp: -.75, both: 0 },
  skid: { pose: 'skid', gx: .38, gy: .7, gz: -.15, by: 2.6, bp: -.15, both: 0 },
  runArm: { gx: .3, gy: .9, gz: -.22, by: 2.8, bp: -.18, both: 0, lhx: -.25, lhy: .98, lhz: .22 },
};
const K = (t, p, o = {}) => ({ t, ...SP[p], ...o });
// a run: keys every frame from t0 to t1, root from a to b ([x, z]), facing yaw, cycle rate f
const runKeys = (t0, t1, a, b, yaw, f = 2, o = {}) => { const out = []; for (let t = t0; t <= t1 + 1e-6; t += 1 / 30) { const k = (t - t0) / (t1 - t0); out.push({ t, ...SP.runArm, ...run(t * f, o), x: lerp(a[0], b[0], k), z: lerp(a[1], b[1], k), yaw, ...o.extra }); } return out; };

const F = new Film({ seed: 11, score: SCORE, accent: RED, env: { seed: 6, far: 'trees' }, fadeIn: 0, fadeOut: 0 });
const E = F.env;

// the domain: a thousand moons — three giants, a curved wall of hundreds, a swarm through every depth
const D = domain({ motif: 'moon', seed: 8, accent: RED, wallGlow: 0, fogDist: 170 })
  .giant({ p: [0, 19, -50], size: 13, th: 0, ck: .2, gone: .97 })
  .giant({ p: [-26, 9, -40], size: 6, th: .08, ck: .05, gone: .5 })
  .giant({ p: [24, 11, -44], size: 7, th: .14, ck: .1, gone: .55 })
  .wall({ z: -95, y0: 1, rows: 22, cols: 44, size: 3.6, curve: .32 })
  .wall({ z: 95, y0: 1, rows: 22, cols: 44, size: 3.6, curve: .32 })
  .giant({ p: [0, 13.5, 50], size: 12, th: .3, ck: .99, gone: 2 })

const focus = [0, 1.4, 0];

// ===================================================================== 1 · burst (0.0)
const H1 = fighter(HERO, [
  K(-.7, 'thrust', { x: -4.2, yaw: 1.5708 }), K(-.15, 'low', { x: .2, yaw: 1.5708, e: 'out' }),
  K(.22, 'low', { x: 1.15, yaw: 1.5708, py: .56, e: 'out' }), K(.55, 'low', { x: 1.2, yaw: 1.5708, py: .52, lean: .62 }),
  K(.72, 'low', { x: 1.2, yaw: 1.5708, py: .5, lean: .66 }), K(.76, 'thrust', { x: -9, yaw: -1.5708, e: 'lin' }),
], { name: 'Tsuki' });
E.cracks.push({ crack: groundCrack(3, [1.45, .1], .2, 3.2, { w: .045, branch: .35 }), t0: .2, d: .25, until: 1.4 });
E.cracks.push({ crack: groundCrack(4, [1.2, -.1], 2.6, 2.4, { w: .035, branch: .35 }), t0: .22, d: .3, until: 1.4 });
const fl1 = fleckList(1, 70, { t0: .72, t1: .82, at: (tb, h, h2) => v3.add(H1.rig(.7).chest, [-(h2) * 3, (h - .5) * 1.4, (h - .5) * .6]), speed: 2, life: 1, size: .07, g: 1.5 });
F.shot(1.4, (w, t) => {
  if (t < .76) { w.ink(H1, { span: lerp(.75, .25, smooth(.5, .74, t)), w: .55, red: true, from: -.7 }); w.fighter(H1); }
  else {   // vanished: the afterimage stays, then comes apart as flecks
    // the black silhouette stays where she was, then tears apart from the trailing side
    const k = (t - .76) / .55, at = H1.rig(.72).chest;
    if (k < 1) w.layer(at, 1, (c, v) => inkGhost(c, v, k));
    function inkGhost(c, v, k) {
      inkShadow(c, v, H1, .72, { span: .25, w: .55, from: -.7, tone: false });
      drawFighter(c, v, H1, .72, { flat: true, tone: '#0b0b0e' });
      c.globalCompositeOperation = 'destination-out'; c.fillStyle = '#000';
      const q = v.p(at); if (!q) return; const R = v.k(q[2]);
      for (let i = 0; i < 90; i++) { const h = j => hash(i, j), x = q[0] + (h(1) - .8) * R * 2.4, y = q[1] + (h(2) - .45) * R * 2, g = clamp(k * 1.6 - h(3) * .6 + (q[0] - x) / R * .3); if (g > 0) blot(c, x, y, R * .16 * g, { seed: i, dir: Math.PI, stretch: 1.5 }); }
      c.globalCompositeOperation = 'source-over';
    }
  }
  w.flecks(fl1);
}, { cam: [{ t: 0, at: [.5, .72, 0], yaw: -.08, pitch: .02, dist: 5.2, fov: 36 }, { t: .45, at: [.75, .72, 0], dist: 4.1 }, { t: .7, at: [.9, .74, 0], dist: 3.3, e: 'io' }, { t: 1.4, at: [.6, .74, 0], dist: 3.6 }],
  hits: [{ t: .2, a: 6, d: .25 }, { t: .76, a: 10, d: .2 }], mb: .7, name: 'burst' });

// ===================================================================== 2 · reappear, the sweep (1.4)
const H2 = fighter(HERO, [
  K(0, 'wind', { x: -1.6, z: 1.2, yaw: 1.2 }), K(.06, 'wind', { x: -1.5, z: 1.2, yaw: 1.2 }), K(.24, 'sweep', { x: -1.2, z: 1.25, yaw: 1.2, e: 'whip' }), K(1, 'sweep', { x: -1.15, z: 1.25, yaw: 1.2, py: .66 }),
]);

E.cracks.push({ crack: crack2, t0: 1.4 + .3, d: .35, until: 3.2 });
F.shot(1, (w, t) => {
  w.fighter(H2, { ghosts: t < .3 ? [{ dt: .05, a: .35 }, { dt: .1, a: .2 }] : null });
  const c = v3.add(H2.rig(.15).chest, [0, -.1, 0]);

}, { cam: [{ t: 0, at: [-1.2, .95, 1.2], yaw: .42, pitch: .06, dist: 4.4, fov: 42 }, { t: 1, at: [-1.1, .95, 1.2], yaw: .3, dist: 4.9 }], hits: [{ t: .2, a: 18, d: .3 }], holds: [[.2, .08]], mb: .9, name: 'sweep' });

F.shot(.8, (w, t) => {
  w.ink(H3, { span: .4, w: .6, red: true, from: 0 }); w.fighter(H3);
  w.screen((ctx, v) => { const p = v.p(H3.rig(t).chest); if (p) focusLines(ctx, v.W, v.H, { x: p[0], y: p[1], n: 70, r0: v.H * .32, col: '#1b1b1f', a: .25 + t * .4, t, w: .006 }); });
}, { cam: [{ t: 0, pos: [.25, .45, 3.2], at: [0, 1, -5], fov: 72 }, { t: .8, pos: [.25, .42, 3.4], at: [0, 1.05, -5], fov: 76 }], hits: [{ t: .62, a: 14, d: .25, fov: 6 }], mb: 1, name: 'charge' });

// ===================================================================== 4 · rising thrust (3.2)
const H4 = fighter(HERO, [K(0, 'thrust', { x: -2.6, yaw: 1.5708 }), K(.18, 'low', { x: -.9, yaw: 1.5708, e: 'out' }), K(.46, 'rise', { x: .4, yaw: 1.5708, py: .95, e: 'whip' }), K(1, 'rise', { x: .6, yaw: 1.5708, py: .98 })]);
F.shot(1, (w, t) => {
  w.ink(H4, { span: .3, w: .3, from: 0 }); w.fighter(H4);
  w.smear(H4, .2, .5, { red: { col: RED, n: 2 }, w: .55, fade: clamp((t - .6) / .4), seed: 31 });
}, { cam: [{ t: 0, at: [-1.2, 1.0, 0], yaw: -.35, pitch: -.05, dist: 3.6, fov: 44, roll: .06 }, { t: 1, at: [.4, 1.25, 0], yaw: -.15, dist: 4.2, roll: .03 }], hits: [{ t: .46, a: 14, d: .3 }], holds: [[.46, .07]], mb: .9, name: 'rising thrust' });

// ===================================================================== 5 · airborne spin, ring of ink (4.2)
const H5 = fighter(HERO, [K(0, 'spin', { x: .6, y: 1.0, yaw: 1.5708 }), K(.75, 'spin', { x: .7, y: 2.2, yaw: 1.5708 + TAU * 1.1, e: 'out' }), K(1, 'raise', { x: .7, y: 2.4, yaw: 1.5708 + TAU * 1.1 })]);
F.shot(1, (w, t) => {
  w.fighter(H5);
  const c = v3.add(H5.rig(.4).chest, [0, -.05, 0]);
  w.inked(c, (ctx, v) => slash(ctx, v, { c, r: 1.75, a0: 0, a1: TAU * .96, axis: [.08, 1, .05], w: .42, head: ease.out(clamp(t / .7)), fade: clamp((t - .7) / .3) * .6, red: { col: RED, n: 2 }, seed: 41, dry: .5 }), .2);
}, { cam: [{ t: 0, at: [.6, 1.6, 0], yaw: .5, pitch: .95, dist: 6.5, fov: 46 }, { t: 1, at: [.7, 2.2, 0], yaw: 1.2, pitch: 1.05, dist: 6 }], mb: .8, name: 'spin' });

// ===================================================================== 6 · freeze, orbit, plunge (5.2)
const H6 = fighter(HERO, [K(0, 'raise', { x: .7, y: 2.4, yaw: 7.85 }), K(.25, 'raise', { x: .7, y: 3.1, yaw: 7.85, e: 'out' }), K(.55, 'raise', { x: .7, y: 3.1, yaw: 7.85 }), K(.85, 'plunge', { x: .7, y: 0, yaw: 7.85, e: 'in' }), K(1.8, 'plunge', { x: .7, y: 0, yaw: 7.85, py: .5 })]);
const land = [.7, 0, .45];
for (let i = 0; i < 6; i++) E.cracks.push({ crack: groundCrack(60 + i, [land[0], land[2]], i / 6 * TAU + .3, 2 + hash(i, 3) * 2.5, { w: .045, branch: .3 }), t0: 5.2 + .85, d: .3, until: 7.0 });
const sh6 = shardList(6, 40, { center: [land[0], .2, land[2]], speed: 7, size: .14, r0: .3, flat: true, tb: .85 });
const fl6 = fleckList(6, 90, { t0: .85, t1: .9, at: () => [land[0], .1, land[2]], dir: (tb, h) => [Math.cos(h(3) * TAU), .4 + h(4), Math.sin(h(3) * TAU)], speed: 6, life: 1.1, size: .06, g: 6 });
F.shot(1.8, (w, t) => {
  w.fighter(H6, { ghosts: t > .55 && t < .85 ? [{ dt: .04, a: .4 }, { dt: .09, a: .25 }] : null });
  if (t > .55 && t < .9) w.ink(H6, { span: .3, w: .4, from: .55, parts: ['chest', 'pelvis', 'hemB'] });
  if (t > .85) {
    const k = t - .85;
    w.add(1e5, (ctx, v) => { groundRing(ctx, v, land, .4 + 2.2 * ease.out(clamp(k / .5)), .28 * (1 - clamp(k / 1.2) * .6), { seed: 7, dry: .4 + k * .4 }); groundRing(ctx, v, land, .2 + 1.3 * ease.out(clamp(k / .35)), .18, { seed: 8, dry: .55, a0: 1, span: 5 }); });
    w.at([land[0], .05, land[2]], (ctx, v) => { const p = v.p([land[0], .05, land[2]]); if (p) splash(ctx, p[0], p[1], v.k(p[2]) * 1.0, { seed: 6, grow: ease.out(clamp(k / .18)) * (1 - clamp((k - .6) / .8) * .3), sy: .35, spikes: .45, streaks: 16, drops: 40 }); }, .5);
    w.add(1e4, (ctx, v) => shards(ctx, v, sh6, t));
    w.flecks(fl6);
  }
}, { cam: t => {
    // a fast half-orbit while she hangs, then a low wide angle for the drop
    const o = ease.io(clamp((t - .2) / .45)), d = ease.in(clamp((t - .6) / .25));
    return { at: [.7, lerp(3.1, 1.1, d), 0], yaw: lerp(-.6, -.6 + Math.PI * .95, o), pitch: lerp(.1, -.12, d), dist: lerp(5.5, 6.4, d), fov: lerp(40, 58, d) };
  }, hits: [{ t: .85, a: 26, d: .5, fov: -6 }], holds: [[.85, .1]], mb: .8, name: 'freeze · plunge' });
F.impact(5.2 + .85, .1, 'black');

// ===================================================================== 7 · run into depth, the turn (7.0)
const H7 = fighter(HERO, runKeys(0, 2, [0, 0], [0, -14], Math.PI, 2, { lean: .6, py: .78 }));
F.shot(2, (w, t) => {
  if (t < 1.15) w.ink(H7, { span: .5, w: .42, red: true, from: 0, alpha: 1 - clamp((t - .85) / .3) });
  w.fighter(H7);
  // a ring of ink stamped at each foot plant (every half cycle)
  if (t < 1.2) w.add(1e5 - 2, (ctx, v) => { for (let k = 0; k < 8; k++) { const tp = (k + .25) / 4; if (tp > t) break; const r = H7.rig(tp), f = k % 2 ? r.fL.ank : r.fR.ank, a = t - tp; groundRing(ctx, v, [f[0], 0, f[2]], .25 + 1.6 * ease.out(clamp(a / .4)), .2 * (1 - clamp(a / 1.2)), { seed: 70 + k, dry: .5 + a * .3, alpha: 1 - clamp(a / 1.4) }); } });
}, { cam: [{ t: 0, pos: [.7, 1.4, 4], at: [0, 1.2, -4] , fov: 46}, { t: 1.1, pos: [1.1, 1.5, -6.4], at: [0, 1.3, -12], fov: 46 }, { t: 1.55, pos: [.9, 1.55, -12.4], at: [0, 1.5, -10.4], fov: 40 }, { t: 2, pos: [.4, 1.62, -16.6], at: [0, 1.55, -13.9], fov: 34 }], mb: .8, name: 'run · turn' });

// ===================================================================== 8 · first omen: two cuts cross, a tiny moon (9.0)
const H8 = fighter(HERO, [K(0, 'ready', { x: 0, z: 0, yaw: Math.PI, hp: -.35 }), K(.18, 'wind', { yaw: Math.PI, hp: -.3, gy: 1.3 }), K(.32, 'sweep', { yaw: Math.PI, gy: 1.17, bp: .5, e: 'whip', hp: -.3 }), K(.48, 'wind', { yaw: Math.PI, gy: 1.3, bp: .4, hp: -.3 }), K(.62, 'sweep', { yaw: Math.PI, gy: 1.17, bp: .55, e: 'whip', hp: -.3 }), K(1.45, 'sweep', { yaw: Math.PI, gy: 1.17, bp: .55, hp: -.35 }), K(1.6, 'skid', { yaw: .1, e: 'out' }), K(2, 'thrust', { x: 0, z: 5, yaw: 0, e: 'in' })]);
F.shot(2, (w, t) => {
  w.fighter(H8);
  w.screen((ctx, v) => {
    const W = v.W, Hh = v.H, cx = W * .42, cy = Hh * .3;
    const cut = (t0, ang, seed) => { const k = ease.out(clamp((t - t0) / .12)); if (k <= 0) return; const L = W * .55, a = [cx - Math.cos(ang) * L / 2, cy - Math.sin(ang) * L / 2], b = [cx + Math.cos(ang) * L / 2, cy + Math.sin(ang) * L / 2]; const pts = Array.from({ length: 20 }, (_, i) => [lerp(a[0], b[0], i / 19), lerp(a[1], b[1], i / 19) + Math.sin(i / 19 * Math.PI) * 6]); brush(ctx, pts, pts.map((_, i) => 15 * Math.sin(Math.PI * i / 19) ** .4), { seed, head: k, dry: .5, splatter: .6, fade: clamp((t - 1.5) / .5) }); };
    cut(.26, -.5, 81); cut(.56, .55, 82);
    // the red point, a tiny moon that waxes full for 0.3 s, closes into a spark
    if (t > .68 && t < 1.4) {
      const k = t - .68, R = 58;
      ctx.save(); ctx.shadowColor = RED; ctx.shadowBlur = 16; ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(cx, cy, Math.max(1.5, 4 * (1 - clamp(k / .2))), 0, TAU); ctx.fill(); ctx.restore();
      const op = clamp((k - .1) / .22), cl = clamp((k - .42) / .1);
      if (op > 0 && cl < 1) { ctx.save(); ctx.translate(cx, cy); ctx.scale(R * (1 - cl * .9), R * (1 - cl)); D.draw(ctx, { open: op, accent: RED, seed: 3, detail: true, look: [.6, .6] }); ctx.restore(); }
      if (cl >= 1) { const s = clamp((k - .52) / .3); ctx.save(); ctx.fillStyle = RED; ctx.shadowColor = RED; ctx.shadowBlur = 12; ctx.globalAlpha = 1 - s; ctx.beginPath(); ctx.arc(cx, cy + s * 30, 3, 0, TAU); ctx.fill(); ctx.restore(); }
    }
    // the first faint cracks in sky and ground
    if (t > 1.1) for (let i = 0; i < 3; i++) spaceCrack(ctx, W * (.15 + i * .3), Hh * (.12 + hash(i, 2) * .2), 120, hash(i, 4) * TAU, { seed: 90 + i, grow: clamp((t - 1.1 - i * .1) / .4), w: 1.4, branch: .2, alpha: .7 });
  });
}, { cam: [{ t: 0, pos: [-.75, 1.05, 2.0], at: [.9, 4.2, -6], fov: 56 }, { t: .7, pos: [-.72, 1.03, 1.9], at: [.9, 4.25, -6] }, { t: 1.4, pos: [-.7, 1.02, 1.85], at: [.9, 4.25, -6] }, { t: 2, pos: [-.4, 1.1, 2.6], at: [.6, 3.4, -6] }], hits: [{ t: .32, a: 6 }, { t: .62, a: 8 }], holds: [[.82, .06]], mb: .6, name: 'first omen' });

// ===================================================================== 9 · skid, three arc blinks (11.0)
const B = [[-2.4, 1.2, .9], [1.6, -1.8, -1.4], [3.0, 1.6, 2.4]];      // blink stops [x, z, yaw]
const H9 = fighter(HERO, [
