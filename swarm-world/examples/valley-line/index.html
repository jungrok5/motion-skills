  const pz = 30, px0 = coastX(pz) - 3;
  W.add('pier', { x: px0, y: 0.35, z: pz, ry: Math.PI / 2, lead: 44 });
  for (let k = 0; k < 7; k++) { const z2 = rr(-6, 62); W.add('boat', { x: coastX(z2) + rr(10, 34), y: 0, z: z2, ry: rr(0, 6.28), lead: 48, seed: rnd() * 10, color: pick(['#ffffff', '#fff2d6', '#ffd9c9']) }); }
  W.add('lighthouse', { x: ISLE[0], y: land(ISLE[0], ISLE[1], W.nearest(ISLE[0], ISLE[1])) - 0.3, z: ISLE[1], lead: 62 });
  for (let s = 150; s < 234; s += 9) { const [x2, z2] = W.beside(s, 1, 3.6); W.add('lamp', { x: x2, z: z2, s, b: W.buildAt(s, 22) + 0.006 }); }
}
{
  let tries = 0, n = 0;
  while (n < 150 && tries++ < 5000) {
    const s = rr(0, 238), a = W.at(s), side = rnd() < 0.5 ? -1 : 1, off = rr(5, 60);
    const x = a.p[0] + a.r[0] * side * off + rr(-3, 3), z = a.p[2] + a.r[2] * side * off + rr(-3, 3), nr = W.nearest(x, z), y = height(x, z, nr);
    if (nr.d < 4.5 || y < 1.0 || inField(x, z) || !W.free(x, z, 1.4) || coastX(z) - x < 5) continue;
    W.add('tree', { x, y: y - 0.1, z, ry: rr(0, 6.28), sx: rr(0.8, 1.3), b: W.buildAt(nr.s + Math.max(0, nr.d - 10) * 0.3, 36) });
    W.claim(x, z, 1.4); n++;
  }
}
{
  let tries = 0, n = 0;
  while (n < 400 && tries++ < 14000) {
    const s = rr(230, LEN), a = W.at(s), side = rnd() < 0.5 ? -1 : 1, off = rr(4, 70);
    const x = a.p[0] + a.r[0] * side * off + rr(-4, 4), z = a.p[2] + a.r[2] * side * off + rr(-4, 4), nr = W.nearest(x, z);
    if (nr.d < 5.5 || fbm(x * 0.05, z * 0.05) < 0.4) continue;
    const y = height(x, z, nr), e = 1.2, slope = Math.abs(height(x + e, z) - height(x - e, z)) + Math.abs(height(x, z + e) - height(x, z - e));
    if (y < 2 || y > 58 || slope > 3.6 || !W.free(x, z, 0.9)) continue;
    W.add(y > 44 ? 'pineSnow' : 'pine', { x, y: y - 0.15, z, ry: rr(0, 6.28), sx: rr(0.75, 1.35), b: W.buildAt(nr.s + Math.max(0, nr.d - 10) * 0.25, 34) });
    W.claim(x, z, 0.9); n++;
  }
  tries = 0; n = 0;
  while (n < 80 && tries++ < 4000) {
    const s = rr(184, LEN), side = rnd() < 0.5 ? -1 : 1, [x, z] = W.beside(s, side, rr(4, 50)), nr = W.nearest(x, z);
    if (nr.d < 3.6 || !W.free(x, z, 1)) continue;
    W.add('rock', { x, y: height(x, z, nr) - 0.3, z, ry: rr(0, 6.28), sx: rr(0.6, 1.8), sy: rr(0.5, 1.2), sz: rr(0.6, 1.6), lead: 32 }); n++;
  }
  const a = W.at(LEN - 7), x = a.p[0] + a.r[0] * 3.3, z = a.p[2] + a.r[2] * 3.3;
  W.add('station', { x, y: a.p[1] - 0.3, z, ry: Math.atan2(a.t[0], a.t[2]), s: LEN - 7, b: W.buildAt(LEN - 7, 32) });
  for (const k of [-1, 1]) W.add('lamp', { x: x + a.t[0] * k * 4.6 + a.r[0] * 0.9, y: a.p[1] - 0.2, z: z + a.t[2] * k * 4.6 + a.r[2] * 0.9, s: LEN - 7, b: W.buildAt(LEN - 7, 32) + 0.01 });
}
const lastStop = W.at(LEN - 7).p;
for (let k = 0; k < 15; k++) {
  const s = LEN * (k + 0.4) / 15, a = W.at(s), side = k % 2 ? 1 : -1, off = rr(18, 60);
  const x = a.p[0] + a.r[0] * side * off, y = Math.max(48, a.p[1] + 34) + rr(-6, 10), z = a.p[2] + a.r[2] * side * off;
  if (Math.hypot(x - lastStop[0], z - lastStop[2]) < 60) continue;   // keep the summit view clear
  W.add('cloud', { x, y, z, ry: rr(0, 6.28), sx: rr(0.9, 1.6), s, b: W.buildAt(s, 70) });
}

// ── the crew's jobs: every job is one cursor building something; each thing is built when its cursor reaches it ──
const T = (k) => W.list(k);
const EVERYONE = ['gardener', 'planter', 'stonecutter', 'mason', 'carpenter', 'rigger', 'roofer', 'shipwright', 'painter', 'lamplighter', 'cloudsmith'];
for (const f of FIELDS) {
  const plants = T(f.crop === 'sun' ? 'sunflower' : 'lavender').filter((it) => it.field === f);
  if (f.crop === 'sun' || f.crop === 'lav') for (const half of [0, 1]) {
    const items = plants.filter((it) => { const u = (it.x - f.c[0]) * f.u[0] + (it.z - f.c[1]) * f.u[1]; return (u >= 0) === (half === 1); });
    W.sweep(items, f.crop === 'sun' ? ['painter', 'planter', 'gardener'] : ['planter', 'painter', 'gardener'], { field: f, lanes: 4, u0: half ? 0 : -f.len / 2, u1: half ? f.len / 2 : 0 });
  }
  W.hop(T('hay').filter((it) => it.field === f).sort((a, b) => a.s - b.s), ['carpenter', 'shipwright', 'rigger']);
}
for (const it of T('windmill')) W.raise(it, ['rigger', 'mason', 'carpenter']);
for (const k of ['barn', 'silo', 'station', 'pier']) for (const it of T(k)) W.raise(it, ['carpenter', 'mason', 'shipwright']);
for (const it of T('church')) W.raise(it, ['mason', 'roofer']);
for (const it of T('lighthouse')) W.raise(it, ['mason', 'lamplighter', 'renderer']);
for (const it of T('cloud')) W.raise(it, ['cloudsmith', 'renderer'], { across: true, glyph: 'pen' });
for (const side of [-1, 1]) for (const run of W.chunk(T('fence').filter((it) => W.side(it) === side).sort((a, b) => a.s - b.s), 9)) W.lay(run, ['carpenter', 'lamplighter', 'shipwright', 'roofer']);
const houses = T('house').map((h, i) => [h, T('roof')[i]]).filter(([h]) => h.d < 34).sort((a, b) => W.side(a[0]) - W.side(b[0]) || a[0].s - b[0].s);
for (const grp of W.chunk(houses, 3)) {   // one cursor pulls up three houses, then drops their roofs on
  W.hop([...grp.map(([h]) => h), ...grp.map(([, r]) => r)], EVERYONE, { doing: 'building houses {k}/{n}', did: 'built {n} houses {where}', then: { n: grp.length, label: 'Roof', doing: 'roofing {k}/{n}' } });
}
for (const grp of W.chunk(W.lined(T('boat')), 4)) W.hop(grp, ['shipwright', 'rigger']);
for (const grp of W.chunk(W.lined(T('lamp')), 4)) W.hop(grp, ['lamplighter', 'carpenter', 'shipwright']);
for (const grp of W.chunk(W.lined(T('tree').filter((it) => it.d < 32)), 4)) W.hop(grp, ['gardener', 'planter', 'painter', 'carpenter']);
for (const grp of W.chunk(W.lined([...T('pine'), ...T('pineSnow')].filter((it) => it.d < 30)), 5)) W.hop(grp, EVERYONE);
for (const grp of W.chunk(W.lined(T('rock').filter((it) => it.d < 30)), 4)) W.hop(grp, ['stonecutter', 'mason', 'rigger', 'gardener']);

// fronts: two cursors draw the ground far ahead, the renderer paints the sea while its front runs over open water
const groundDoing = ({ p }) => { const y = W.groundAt(W.frontS(p, 84), 0)[1]; return y > 16 ? 'raising the peaks' : y > 5 ? 'shaping the hills' : y < 1 ? 'shaping the shore' : 'grading the valley'; };
W.terrainFront({ by: 'terraformer', phase: 0, doing: groundDoing });
W.terrainFront({ by: 'surveyor', phase: 0.5, doing: groundDoing });
{
  const seaFront = (p) => { const L = 34 + 9 * Math.sin(Math.PI * 2 * p * 5); return W.groundAt(W.frontS(p, 84) - Math.max(0, L - 20) * 0.3, L); };
  let a = -1, best = [0, 0];
  for (let p = 0.006; p < 0.95; p += 0.002) {
    const q = seaFront(p), wet = coastX(q[2]) - q[0] < -3;
    if (wet && a < 0) a = p;
    if ((!wet || p >= 0.948) && a >= 0) { if (p - a > best[1] - best[0]) best = [a, p]; a = -1; }
  }
  if (best[1] - best[0] > 0.05) W.front({ by: 'renderer', label: 'Sea', count: 'sea', p0: best[0], p1: best[1], at: (p) => { const q = seaFront(p); return [q[0], 0.35, q[2]]; }, doing: 'painting the sea', did: 'painted the sea' });
}

// ── the train: a red engine and two coaches, put on the line first by the conductor ──
const wheels = (z0, n, r, col) => [-0.82, 0.82].flatMap((x) => Array.from({ length: n }, (_, k) => [Cyl(r, r, 0.16, 12), col, { x, y: r, z: z0 + k * r * 2.3, rz: Math.PI / 2 }]));
const loco = [
  [Box(1.6, 0.4, 5.4), '#2a2a2f', { y: 0.32, z: 0.2 }], ...wheels(-1.4, 3, 0.46, '#c4382a'),
  [Cyl(0.78, 0.78, 3.3, 16), '#d23f2c', { rx: Math.PI / 2, y: 1.42, z: -0.7 }], ...[0.0, 1.0, 2.0].map((z) => [Cyl(0.81, 0.81, 0.12, 16), '#e2b04a', { rx: Math.PI / 2, y: 1.42, z: z + 0.1 }]),
  [Cyl(0.8, 0.8, 0.5, 16), '#26262b', { rx: Math.PI / 2, y: 1.42, z: 2.62 }], [Cyl(0.3, 0.22, 1.0, 10), '#26262b', { y: 2.0, z: 2.25 }], [Cyl(0.33, 0.33, 0.14, 10), '#e2b04a', { y: 2.95, z: 2.25 }],
  [Dome(0.36, 12, 6), '#e2b04a', { y: 2.15, z: 0.9 }],
  [Box(1.75, 1.8, 1.6), '#c63a29', { y: 0.55, z: -1.45 }], [Box(1.95, 0.16, 1.9), '#26262b', { y: 2.35, z: -1.45 }], [Box(1.78, 0.5, 0.6), '#2f3f50', { y: 1.65, z: -1.45 }],
  [Box(1.5, 0.34, 0.5), '#e2b04a', { y: 0.1, z: 2.95 }], [Cyl(0.16, 0.16, 0.25, 10), '#fff2b8', { rx: Math.PI / 2, y: 1.42, z: 2.95 }],
];
const coach = (body) => [
  [Box(1.6, 0.36, 4.6), '#2a2a2f', { y: 0.3 }], ...wheels(-1.6, 2, 0.32, '#3a3a40'), ...wheels(0.9, 2, 0.32, '#3a3a40'),
  [Box(1.8, 1.5, 4.4), body, { y: 0.66 }], [Box(1.83, 0.42, 3.8), '#33475a', { y: 1.38 }], [Box(1.86, 0.08, 4.42), '#e2b04a', { y: 1.15 }],
  [Box(1.95, 0.22, 4.6), '#f3ead8', { y: 2.16 }], [Box(1.5, 0.12, 4.3), '#e6dbc6', { y: 2.36 }],
];
W.vehicle([loco, coach('#2f9c95'), coach('#e2a53b')], { by: 'conductor', offsets: [0, -5.5, -10.6] });

// things that move: windmill blades turn, boats bob, clouds drift
W.animate('blades', (it, i, t) => ({ rz: t * 1.3 + i }));
W.animate('boat', (it, i, t) => ({ y: Math.sin(t * 1.4 + it.seed) * 0.14 - 0.05, rx: Math.sin(t * 1.1 + it.seed) * 0.05, rz: Math.cos(t * 0.9 + it.seed) * 0.06 }));
W.animate('cloud', (it, i, t) => ({ x: it.x + Math.sin(t * 0.03 + i) * 4, z: it.z + Math.sin(t * 0.02 + i * 2) * 8 }));
W.glow([...T('lamp').map((it) => [it.x, it.y + 2.48, it.z]), [ISLE[0], T('lighthouse')[0].y + 10.8, ISLE[1]]]);

// where the log says the work was done
for (const [k, words] of [['windmill', ['by the windmill', 'under the windmill']], ['barn', ['by the barn', 'at the farm']], ['church', ['in town', 'by the church', 'on the square']],
  ['lighthouse', ['out on the point', 'by the lighthouse']], ['pier', ['down by the harbour', 'on the quay', 'along the harbour road']], ['station', ['up at the station', 'by the station']]]) for (const it of T(k)) W.landmark(it.x, it.z, words);
W.places((x, y) => (y > 12 ? ['up on the ridge', 'below the summit'] : y > 5 ? ['in the hills', 'on the slope'] : y < 1.6 ? ['along the shore'] : ['beside the line', 'along the track']));

// the camera rides behind the train (zones by path length), then rises behind the station and looks back over the valley
const end = W.at(LEN - 7);
W.camera({
  zones: [[0, { h: 6.2, back: 13, side: -1.6, look: 0.4 }], [128, { h: 6.2, back: 13, side: -1.6, look: 0.4 }], [162, { h: 7.2, back: 14, side: -3.6, look: 4.5 }],
    [222, { h: 7.2, back: 14, side: -3.6, look: 4.5 }], [256, { h: 8.6, back: 15, side: 2.6, look: -1.5 }]],
  reveal: { pos: [end.p[0] - 4, end.p[1] + 36, end.p[2] - 44], tgt: [10, 6, 6], turn: 1 },
});
W.check('the train stays on screen', (t, p, w) => { const q = w.project([...w.at(w.travS(p)).p]); return p < 0.02 || w.rv > 0.02 || (q && q.a > 0.9); });
await W.start();
</script>
