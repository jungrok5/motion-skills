<script type="module" id="scene-code">
// This skeleton shows the contract, not the look: replace everything with what BRIEF.md designs.
import * as THREE from 'three';
const { scene, ease, lerp, Body } = TSS;
const W = 1080, H = 1920;
let renderer, world, cam3, crowd = [], mesh;

scene({
  title: '__TITLE__', W, H, duration: 10, fps: 30, renderer: 'three',
  setup({ canvas, scale }) {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1); renderer.setSize(W * scale, H * scale, false);
    world = new THREE.Scene(); world.background = new THREE.Color('#141a2a');
    cam3 = new THREE.PerspectiveCamera(40, W / H, .1, 400);
    world.add(new THREE.HemisphereLight('#8aa0ff', '#20140c', .8));
    const sun = new THREE.DirectionalLight('#ffd9a0', 1.6); sun.position.set(-4, 8, 6); world.add(sun);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: '#34303a' })); floor.rotation.x = -Math.PI / 2; world.add(floor);
    // one instanced capsule per body part; joints come from Body.pose (the same rig the Canvas scenes draw)
    for (let i = 0; i < 40; i++) crowd.push(Body.make({ id: 'p' + i, seed: i + 1, height: 1.55 + (i % 7) * .05 }));
    mesh = new THREE.InstancedMesh(new THREE.CapsuleGeometry(1, 1, 3, 8), new THREE.MeshStandardMaterial({ color: '#c9b9a8' }), crowd.length * 12);
    world.add(mesh);
  },
  frame(t) {
    const k = ease.inOut(t / 10, 1.5);
    cam3.position.set(lerp(-2, 2, k), 6, 14); cam3.lookAt(0, 1, 0);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0); let n = 0;
    crowd.forEach((s, i) => {
      const { J } = Body.pose(s, { x: (i % 8 - 3.5) * 1.6, z: Math.floor(i / 8) * -1.6, yaw: 0, breath: .5 + .5 * Math.sin(t * 1.7 + i) });
      for (const [a, b, r] of [['hipL', 'kneeL', .07], ['kneeL', 'ankleL', .05], ['hipR', 'kneeR', .07], ['kneeR', 'ankleR', .05], ['shL', 'elL', .05], ['elL', 'wrL', .04], ['shR', 'elR', .05], ['elR', 'wrR', .04], ['pelvis', 'chest', .15], ['neck', 'head', .1]]) {
        const A = new THREE.Vector3(...J[a]), B = new THREE.Vector3(...J[b]), d = B.clone().sub(A), L = d.length();
        q.setFromUnitVectors(up, d.normalize()); m.compose(A.clone().add(B).multiplyScalar(.5), q, new THREE.Vector3(r, Math.max(.01, L / 2 - r) / 1, r));
        mesh.setMatrixAt(n++, m);
      }
    });
    mesh.count = n; mesh.instanceMatrix.needsUpdate = true;
    renderer.render(world, cam3);
  },
  info() { return { figures: crowd.length }; },
  cast() { return crowd.slice(0, 3); },
});
</script></body></html>
