<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Daily Loaf · one recipe through five centuries</title>
<!--
  time-machine-page — worked example (BRIEF.md next to this file). Topic: "a bread recipe card, through time".
  One live recipe — an editable title, a loaves field that rescales the ingredients, a notes log — in four eras:
    1450 WOODCUT    rag paper, a cut-wood picture in parallel hatching, type gouged and blotchy, under candle light
    1962 DITTO      a school handout from a spirit duplicator: violet, fuzzy, fading across the sheet (a pass added here)
    1996 WEB PAGE   grey background, Times, blue links, 216 web colours dithered, on a beige CRT
    2040 HOLOGRAM   a kitchen assistant projected in light over an emitter ring
-->
<style>
  #page, #page * { box-sizing: border-box; }
  #page { position: relative; overflow: hidden; margin: 0; cursor: default; }
  #page h1, #page h2, #page p, #page ul, #page ol, #page figure { margin: 0; padding: 0; font: inherit; }
  #page ul, #page ol { list-style: none; }
  #page .headline { outline: none; cursor: text; white-space: pre-wrap; overflow-wrap: anywhere; }
  #page input, #page button { font: inherit; color: inherit; margin: 0; border-radius: 0; appearance: none; background: none; border: 0; outline: none; }
  #page input { cursor: text; min-width: 0; } #page button { cursor: pointer; }
  #page input[type=number] { -moz-appearance: textfield; } #page input::-webkit-inner-spin-button { -webkit-appearance: none; }
  #page .art { display: block; width: 100%; height: 100%; }
  #page .notes li { display: flex; gap: .5em; } #page .notes time { flex: none; }
  #page .notes span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #page .log-form, #page .scale { display: flex; align-items: center; }
  #page .ing li { display: flex; gap: .5em; } #page .ing b { flex: none; font-weight: inherit; }
  #page .method { counter-reset: st; } #page .method li { counter-increment: st; }
  /* the picture: roles coloured per era */
  #page .art .bg { fill: var(--bg); } #page .art .oven { fill: var(--oven); } #page .art .mouth { fill: var(--mouth); }
  #page .art .fire { fill: var(--fire); } #page .art .board { fill: var(--board); } #page .art .crust { fill: var(--crust); }
  #page .art .score { fill: none; stroke: var(--score); stroke-width: 3; stroke-linecap: round; }
  #page .art .wheat { fill: var(--wheat); } #page .art .stalk { fill: none; stroke: var(--wheat); stroke-width: 2; }
  #page .art .ink { fill: var(--line); }

  /* ================================================================ 1450 WOODCUT: a printed broadside of receipts.
     The picture is drawn in warm browns (the woodcut pass cuts warm pixels into hatching); type is neutral; rubrics red. */
  #page[data-era=woodcut] {
    --bg: #f6ead2; --oven: #b39066; --mouth: #3a2410; --fire: #e4c08c; --board: #8a6236; --crust: #a8743c; --score: #f0d9b0; --wheat: #c49a5a; --line: #3a2410;
    background: #fff; color: #000; font: 400 16px/21px Georgia, "Times New Roman", serif; padding: 16px 22px;
    display: grid; grid-template-columns: 330px 1fr; column-gap: 22px; grid-template-rows: auto auto auto 1fr auto;
    grid-template-areas: "top top" "head head" "pic ing" "pic method" "aside log"; border: 6px double #000; caret-color: #000;
  }
  #page[data-era=woodcut] .top { grid-area: top; text-align: center; border-bottom: 2px solid #000; padding-bottom: 6px; }
  #page[data-era=woodcut] .kicker { font-size: 13px; letter-spacing: .3em; text-transform: uppercase; }
  #page[data-era=woodcut] .headline { grid-area: head; text-align: center; border-bottom: 1px solid #000; padding: 4px 0 6px; font: 700 34px/40px Georgia, serif; font-variant: small-caps; letter-spacing: .02em; }
  #page[data-era=woodcut] .headline::first-letter { color: #b0201a; font-size: 44px; }
  #page[data-era=woodcut] .headline:focus { outline: 1px dashed #000; outline-offset: 2px; }
  #page[data-era=woodcut] .where { font-style: italic; font-size: 13px; }
  #page[data-era=woodcut] .pic { grid-area: pic; margin-top: 12px; align-self: start; border: 3px solid #000; outline: 1px solid #000; outline-offset: 3px; height: 330px; overflow: hidden; }
  #page[data-era=woodcut] .ingredients { grid-area: ing; margin-top: 10px; }
  #page[data-era=woodcut] .ingredients h2 { font: 700 20px/1 Georgia, serif; font-style: italic; color: #b0201a; display: inline; }
  #page[data-era=woodcut] .scale { float: right; gap: 6px; font-style: italic; font-size: 14px; }
  #page[data-era=woodcut] .scale input { width: 40px; text-align: center; border-bottom: 1px solid #000; font-size: 16px; }
  #page[data-era=woodcut] .ing { margin-top: 6px; columns: 2; column-gap: 18px; font-size: 16px; line-height: 23px; }
  #page[data-era=woodcut] .ing li::before { content: "¶"; color: #b0201a; }
  #page[data-era=woodcut] .method { grid-area: method; margin-top: 8px; text-align: justify; font-size: 18px; line-height: 26px; }
  #page[data-era=woodcut] .method li { margin-top: 8px; }
  #page[data-era=woodcut] .method li { margin-top: 4px; }
  #page[data-era=woodcut] .method li::before { content: counter(st, upper-roman) ". "; color: #b0201a; font-weight: 700; }
  #page[data-era=woodcut] .aside { grid-area: aside; align-self: end; text-align: center; font-style: italic; font-size: 14px; padding-top: 8px; }
  #page[data-era=woodcut] .log { grid-area: log; margin-top: 10px; border-top: 1px solid #000; padding-top: 4px; }
  #page[data-era=woodcut] .log h2 { font-size: 12px; letter-spacing: .25em; text-transform: uppercase; color: #b0201a; }
  #page[data-era=woodcut] .notes { height: 21px; overflow: hidden; font-size: 14px; font-style: italic; }
  #page[data-era=woodcut] .log-form { gap: 10px; margin-top: 2px; }
  #page[data-era=woodcut] .log-form input { flex: 1; border-bottom: 1px solid #000; font-style: italic; font-size: 14px; }
  #page[data-era=woodcut] .log-form input::placeholder { color: #000; opacity: .6; }
  #page[data-era=woodcut] .log-form button { border: 1px solid #000; padding: 1px 12px; font-variant: small-caps; letter-spacing: .1em; }

  /* ================================================================ 1962 DITTO: a typed, hand-ruled class handout.
     Everything is black on white; the ditto pass turns it violet, fuzzy and faded. */
  #page[data-era=ditto] {
    --bg: #fff; --oven: #fff; --mouth: #fff; --fire: #fff; --board: #fff; --crust: #fff; --score: #000; --wheat: #000; --line: #000;
    background: #fff; color: #000; font: 400 17px/24px "Courier New", "Liberation Mono", monospace; padding: 22px 34px;
    display: grid; grid-template-columns: 1fr 290px; column-gap: 26px; grid-template-rows: auto auto auto 1fr auto;
    grid-template-areas: "top top" "head pic" "ing pic" "method method" "log aside"; caret-color: #000;
  }
  #page[data-era=ditto] .top { grid-area: top; display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 4px; font-size: 14px; }
  #page[data-era=ditto] .headline { grid-area: head; margin-top: 14px; font: 700 27px/32px "Courier New", monospace; text-decoration: underline; text-underline-offset: 5px; }
  #page[data-era=ditto] .headline:focus { background: #eee; }
  #page[data-era=ditto] .pic { grid-area: pic; margin-top: 14px; height: 190px; border: 2px solid #000; border-radius: 4px; overflow: hidden; }
  #page[data-era=ditto] .art * { stroke: #000; stroke-width: 2; }
  #page[data-era=ditto] .art .bg { stroke: none; }
  #page[data-era=ditto] .ingredients { grid-area: ing; margin-top: 10px; }
  #page[data-era=ditto] .ingredients h2 { display: inline; font-weight: 700; text-transform: uppercase; }
  #page[data-era=ditto] .scale { float: right; gap: 8px; }
  #page[data-era=ditto] .scale input { width: 44px; border: 2px solid #000; text-align: center; font-weight: 700; }
  #page[data-era=ditto] .ing { margin-top: 4px; }
  #page[data-era=ditto] .ing li::before { content: "[ ]"; flex: none; }
  #page[data-era=ditto] .method { grid-area: method; margin-top: 12px; border-top: 2px dashed #000; padding-top: 8px; }
  #page[data-era=ditto] .method li::before { content: counter(st) ". "; font-weight: 700; }
  #page[data-era=ditto] .aside { grid-area: aside; align-self: end; border: 2px solid #000; padding: 6px 10px; transform: rotate(-2deg); font-weight: 700; font-size: 15px; line-height: 20px; }
  #page[data-era=ditto] .log { grid-area: log; align-self: end; }
  #page[data-era=ditto] .log h2 { font-weight: 700; text-transform: uppercase; font-size: 14px; }
  #page[data-era=ditto] .notes { height: 22px; overflow: hidden; font-size: 14px; }
  #page[data-era=ditto] .log-form { gap: 10px; }
  #page[data-era=ditto] .log-form input { flex: 1; border-bottom: 2px solid #000; }
  #page[data-era=ditto] .log-form input::placeholder { color: #777; }
  #page[data-era=ditto] .log-form button { border: 2px solid #000; padding: 0 10px; font-weight: 700; text-transform: uppercase; }

  /* ================================================================ 1996 WEB PAGE: a personal home page, 640×480 */
  #page[data-era=web] {
    --bg: #ffffcc; --oven: #996633; --mouth: #330000; --fire: #ff9900; --board: #cc9966; --crust: #cc6600; --score: #ffcc66; --wheat: #ffcc00; --line: #330000;
    background: #c0c0c0; color: #000; font: 400 15px/18px "Times New Roman", "Liberation Serif", Times, serif; padding: 8px 12px;
    display: grid; grid-template-columns: 1fr 200px; column-gap: 12px; grid-template-rows: auto auto auto 1fr auto auto;
    grid-template-areas: "top top" "head head" "ing pic" "method pic" "aside aside" "log log"; caret-color: #000; -webkit-font-smoothing: none;
  }
  #page[data-era=web] .top { grid-area: top; text-align: center; }
  #page[data-era=web] .kicker { font: 700 22px/26px "Comic Sans MS", "Comic Neue", "Times New Roman", serif; color: #800080; }
  #page[data-era=web] .where { font-size: 12px; color: #333; }
  #page[data-era=web] .headline { grid-area: head; margin: 4px 0 6px; font: 700 21px/24px "Times New Roman", serif; color: #0000ee; text-decoration: underline; text-align: center; border-top: 3px groove #fff; border-bottom: 3px groove #fff; padding: 4px 0; }
  #page[data-era=web] .headline:focus { background: #ffffff; }
  #page[data-era=web] .pic { grid-area: pic; height: 150px; border: 3px ridge #fff; }
  #page[data-era=web] .ingredients h2 { font-weight: 700; display: inline; }
  #page[data-era=web] .ingredients { grid-area: ing; }
  #page[data-era=web] .scale { float: right; gap: 4px; font-size: 13px; }
  #page[data-era=web] .scale input { width: 36px; background: #fff; border: 2px inset #fff; padding: 0 2px; }
  #page[data-era=web] .ing { margin-top: 3px; border: 2px outset #fff; background: #fff; padding: 2px 6px; font-size: 14px; }
  #page[data-era=web] .ing li::before { content: "\2022"; color: #c00; }
  #page[data-era=web] .method { grid-area: method; margin-top: 6px; font-size: 15px; line-height: 20px; }
  #page[data-era=web] .method::after { content: "Cool bread links: The Yeast Ring \00b7 Crumb Shots \00b7 Rye Lovers Unite"; display: block; margin-top: 10px; color: #0000ee; text-decoration: underline; font-size: 13px; }
  #page[data-era=web] .method li::before { content: counter(st) ". "; font-weight: 700; color: #800080; }
  #page[data-era=web] .aside { grid-area: aside; text-align: center; margin-top: 4px; font-size: 13px; color: #800000; background: repeating-linear-gradient(-45deg, #ffff00 0 8px, #000 8px 16px) top/100% 6px no-repeat; padding-top: 9px; }
  #page[data-era=web] .log { grid-area: log; margin-top: 4px; display: flex; gap: 8px; align-items: center; border-top: 3px groove #fff; padding-top: 4px; }
  #page[data-era=web] .log h2 { font-weight: 700; flex: none; color: #0000ee; text-decoration: underline; }
  #page[data-era=web] .notes { flex: 1; min-width: 0; height: 18px; overflow: hidden; font-size: 13px; }
  #page[data-era=web] .log-form { gap: 4px; flex: none; }
  #page[data-era=web] .log-form input { width: 170px; background: #fff; border: 2px inset #fff; padding: 0 3px; font-size: 13px; }
  #page[data-era=web] .log-form button { background: #c0c0c0; border: 2px outset #fff; padding: 0 8px; font: 13px/18px Arial, sans-serif; }
  #page[data-era=web] .log-form button:active { border-style: inset; }

  /* ================================================================ 2040 HOLOGRAM: light on black; the pass makes it cyan */
  #page[data-era=holo] {
    --bg: #000; --oven: #000; --mouth: #000; --fire: #000; --board: #000; --crust: #000; --score: #fff; --wheat: #000; --line: #fff;
    background: #000; color: #e8e8e8; font: 300 16px/1.4 Inter, ui-sans-serif, system-ui, sans-serif; padding: 20px 26px;
    display: grid; grid-template-columns: 260px 1fr; column-gap: 26px; grid-template-rows: auto auto 1fr auto;
    grid-template-areas: "top top" "pic head" "pic method" "ing log"; caret-color: #fff;
  }
  #page[data-era=holo] .top { grid-area: top; display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: #bdbdbd; border-bottom: 1px solid #555; padding-bottom: 8px; }
  #page[data-era=holo] .headline { grid-area: head; margin-top: 12px; font: 200 40px/1.05 Inter, system-ui, sans-serif; letter-spacing: -.01em; color: #fff; }
  #page[data-era=holo] .headline:focus { box-shadow: 0 2px 0 #fff; }
  #page[data-era=holo] .pic { grid-area: pic; margin-top: 14px; height: 230px; border-radius: 50%; border: 1px solid #888; overflow: hidden; }
  #page[data-era=holo] .art * { fill: none !important; stroke: #f0f0f0; stroke-width: 1.4; }
  #page[data-era=holo] .art .bg { stroke: none; }
  #page[data-era=holo] .ingredients { grid-area: ing; margin-top: 12px; font-size: 13px; }
  #page[data-era=holo] .ingredients h2 { font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: #aaa; display: inline; }
  #page[data-era=holo] .scale { float: right; gap: 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #aaa; }
  #page[data-era=holo] .scale input { width: 34px; border: 1px solid #fff; border-radius: 12px; text-align: center; color: #fff; font-size: 13px; }
  #page[data-era=holo] .ing { margin-top: 6px; }
  #page[data-era=holo] .ing li { border-bottom: 1px solid #333; padding: 2px 0; }
  #page[data-era=holo] .ing b { width: 64px; color: #fff; font-weight: 500; }
  #page[data-era=holo] .method { grid-area: method; margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 14px; line-height: 1.3; }
  #page[data-era=holo] .method li { border: 1px solid #666; border-radius: 10px; padding: 8px 10px; }
  #page[data-era=holo] .method li::before { content: "0" counter(st); display: block; font-size: 10px; letter-spacing: .2em; color: #aaa; }
  #page[data-era=holo] .aside { display: none; }
  #page[data-era=holo] .log { grid-area: log; margin-top: 12px; border: 1px solid #666; border-radius: 12px; padding: 8px 12px; align-self: end; }
  #page[data-era=holo] .log h2 { font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: #aaa; }
  #page[data-era=holo] .notes { height: 40px; overflow: hidden; font-size: 13px; }
  #page[data-era=holo] .notes time { color: #fff; font-weight: 500; }
  #page[data-era=holo] .log-form { gap: 8px; margin-top: 6px; }
  #page[data-era=holo] .log-form input { flex: 1; border: 1px solid #888; border-radius: 16px; padding: 4px 12px; font-size: 13px; }
  #page[data-era=holo] .log-form input::placeholder { color: #888; }
  #page[data-era=holo] .log-form button { border-radius: 16px; background: #fff; color: #000; padding: 4px 16px; font-size: 13px; font-weight: 500; }

  @media (max-width: 520px) {
    #page[data-era] { grid-template-columns: minmax(0, 1fr); padding: 12px 14px; }
    #page[data-era=woodcut] { grid-template-rows: auto auto 200px auto 1fr auto auto; grid-template-areas: "top" "head" "pic" "ing" "method" "log" "aside"; font-size: 14px; }
    #page[data-era=woodcut] .ing { columns: 1; } #page[data-era=woodcut] .method { font-size: 15.5px; line-height: 22px; }
    #page[data-era=woodcut] .headline { font-size: 24px; line-height: 28px; } #page[data-era=woodcut] .pic { height: 190px; }
    #page[data-era=ditto] { grid-template-rows: auto auto 170px auto 1fr auto auto; grid-template-areas: "top" "head" "pic" "ing" "method" "log" "aside"; font-size: 14px; line-height: 19px; }
    #page[data-era=ditto] .headline { font-size: 21px; line-height: 25px; } #page[data-era=ditto] .pic { height: 160px; } #page[data-era=ditto] .top { flex-direction: column; }
    #page[data-era=web] { grid-template-rows: auto auto 130px auto 1fr auto auto; grid-template-areas: "top" "head" "pic" "ing" "method" "aside" "log"; }
    #page[data-era=web] .log { flex-wrap: wrap; } #page[data-era=web] .notes { flex-basis: 100%; }
    #page[data-era=holo] { grid-template-rows: auto auto 170px auto 1fr auto; grid-template-areas: "top" "head" "pic" "ing" "method" "log"; }
    #page[data-era=holo] .headline { font-size: 30px; } #page[data-era=holo] .pic { height: 160px; border-radius: 16px; }
    #page[data-era=holo] .method { grid-template-columns: 1fr; font-size: 13px; } #page[data-era=holo] .top { flex-direction: column; gap: 4px; }
  }
</style>
</head>
<body>
<canvas id="stage" layoutsubtree content="drawable" aria-label="A bread recipe, drawn as it looked in the year on the dial">
  <main id="page" drawable data-era="woodcut">
    <header class="top"><p class="kicker" data-slot="kicker"></p><p class="where" data-slot="where"></p></header>
    <h1 class="headline" data-slot="title" contenteditable="plaintext-only" spellcheck="false" data-hic-edit></h1>
    <figure class="pic">
      <svg class="art" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect class="bg" width="300" height="300"/>
        <path class="oven" d="M40 190 L40 120 Q40 44 150 40 Q260 44 260 120 L260 190Z"/>
        <path class="mouth" d="M96 190 L96 140 Q96 96 150 94 Q204 96 204 140 L204 190Z"/>
        <path class="fire" d="M112 190 Q118 160 132 172 Q138 146 152 164 Q164 140 172 168 Q182 156 190 190Z"/>
        <g class="ink"><rect x="58" y="74" width="16" height="7" rx="2"/><rect x="226" y="74" width="16" height="7" rx="2"/><rect x="52" y="104" width="14" height="7" rx="2"/><rect x="234" y="104" width="14" height="7" rx="2"/></g>
        <rect class="board" x="20" y="232" width="260" height="20" rx="8"/>
        <rect class="board" x="252" y="236" width="40" height="10" rx="5"/>
        <path class="crust" d="M62 236 Q60 186 150 180 Q240 186 238 236Z"/>
        <path class="score" d="M96 214 Q112 196 128 200 M132 206 Q150 188 168 194 M172 204 Q190 190 206 198"/>
        <g class="stalk"><path d="M30 230 Q34 160 52 108"/><path d="M38 230 Q48 170 74 124"/><path d="M24 230 Q20 170 26 118"/></g>
        <g class="wheat"><ellipse cx="52" cy="104" rx="5" ry="12" transform="rotate(20 52 104)"/><ellipse cx="76" cy="120" rx="5" ry="12" transform="rotate(34 76 120)"/>
          <ellipse cx="26" cy="112" rx="5" ry="12" transform="rotate(4 26 112)"/><ellipse cx="45" cy="128" rx="4" ry="9" transform="rotate(-30 45 128)"/><ellipse cx="62" cy="140" rx="4" ry="9" transform="rotate(40 62 140)"/></g>
      </svg>
    </figure>
    <section class="ingredients">
      <h2 data-slot="ingTitle"></h2>
      <label class="scale"><span data-slot="loavesLabel"></span><input id="loaves" type="number" min="1" max="12" value="2" inputmode="numeric" aria-label="Loaves"></label>
      <ul class="ing" data-ingredients></ul>
    </section>
    <ol class="method" data-slot="method"></ol>
    <p class="aside" data-slot="aside"></p>
    <section class="log" aria-label="Notes">
      <h2 data-slot="logTitle"></h2>
      <ul class="notes" data-log-list></ul>
      <form class="log-form" autocomplete="off">
        <input type="text" data-log-input data-slot-placeholder="logHint" maxlength="60" spellcheck="false" aria-label="Your note">
        <button type="button" data-log-add data-hic-click data-slot="logButton"></button>
      </form>
    </section>
  </main>
</canvas>
<div id="dial"></div>
<script src="../../lib/hic.js"></script>
<script src="../../lib/passes.js"></script>
<script src="../../lib/time-machine.js"></script>
<script>
// A pass added for this topic: the spirit duplicator ("ditto") of school handouts. Every mark prints in aniline violet;
// the copy is soft, fades across the sheet as the drum runs dry, and carries a faint second image of the master.
TimeMachine.pass('ditto', {
  stage: 'page', params: { ink: '#5a2b93', fuzz: 0.55, fade: 0.42, ghost: 0.3 },
  glsl: [
    'vec3 pass_ditto(vec3 c, Ctx x) {',
    '  vec3 soft = pageLod(x.uv, 1.3);',
    '  float ink = 1.0 - luma(mix(c, soft, $fuzz));',
    '  float ghost = (1.0 - luma(page(x.uv + vec2(2.2, 1.4) / uPageCss))) * $ghost;',
    '  float fade = mix(1.0, $fade, smoothstep(0.0, 1.0, x.uv.x * 0.75 + x.uv.y * 0.25)) * (0.82 + 0.36 * vnoise(x.px * vec2(0.004, 0.06)));',
    '  float k = clamp(ink * fade * 1.3 + ghost * 0.35, 0.0, 1.0);',
    '  k = clamp(k * (1.0 + smoothstep(2.0, 8.0, x.u) * (vnoise(x.px * 2.4) - 0.5) * 0.5), 0.0, 1.0);',
    '  return mix(vec3(1.0), $ink, k);',
    '}'].join('\n')
});

var tm = TimeMachine.start({
  start: 'woodcut',
  notes: [{ year: 1450, text: 'The miller sent the good flour this week.' }],
  hints: ['Turn the dial', 'Change the loaves, type a note', 'Scroll to magnify'],

// The loaves field rescales the ingredients in every era, in that era's way of writing numbers.
(function () {
  var loaves = document.getElementById('loaves'), list = document.querySelector('[data-ingredients]');
  var FR = { 0.25: '¼', 0.5: '½', 0.75: '¾' };
  function fmt(n, style) {
    if (style === 'fraction') { var w = Math.floor(n), f = Math.round((n - w) * 4) / 4; if (f === 1) { w++; f = 0; } return (w ? w : '') + (FR[f] || '') || '0'; }
    return n >= 20 ? String(Math.round(n)) : String(Math.round(n * 100) / 100);
  }
  function render() {
    var e = tm.era, k = Math.max(1, Math.min(12, Math.round(+loaves.value) || 1));
    list.textContent = '';
    e.data.ingredients.forEach(function (it) {
      var li = document.createElement('li'), b = document.createElement('b'), s = document.createElement('span');
      b.textContent = fmt(it[0] * k, e.data.format) + ' ' + it[1]; s.textContent = it[2];
      li.appendChild(b); li.appendChild(s); list.appendChild(li);
    });
  }
  tm.on('era', render);
  loaves.addEventListener('input', render);
  render();
})();
