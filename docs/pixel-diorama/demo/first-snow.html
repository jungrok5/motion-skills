<!doctype html>
<!-- pixel-diorama example · "First Snow": the same kit as halloween-rain, turned to winter — an island cabin in falling snow
     under an aurora, a fire pit by the snowman, pines, a lamp. Cold field: navy sky, green aurora, blue snow; warm pockets:
     windows, door, fire, lamp. 480×270 × 4 = 1920×1080, 40 s loop at 30 fps. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>First Snow · pixel-diorama</title>
<style>html,body{margin:0;height:100%;background:#04070f;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script src="lib/pixel.js"></script>
<script src="lib/kit.js"></script>
<script>
const D = PD.create({ W: 480, H: 270, loop: 40, fps: 30, seed: 3, bg: '#04070f', vignette: 0.4 });
const P = K.PAL, GROUND = 176;

K.sky(D, { cols: ['#03060f', '#060b1a', '#0a1224', '#0f1a30', '#15233c', '#1d2e48', '#283a55'] });
K.stars(D, { n: 110, seed: 5, area: [0, 0, 480, 160] });
K.aurora(D, { y: 22, h: 54, x0: 30, x1: 430, seed: 4 });
K.moon(D, { x: 92, y: 44, r: 9, glowR: 5, glow: 0.6, glowColor: '#8fb4ff' });
K.clouds(D, { n: 4, seed: 15, y: [70, 120], w: [70, 140], sway: 10, cols: ['#0b1424', '#111c30', '#18263c', '#22324a', '#2c3e58'] });
K.hills(D, { y: 220, amp: 26, seed: 7, cols: ['#121c30', '#3a4a6a'], freq: 0.014 });
K.mist(D, { y: 206, h: 30, alpha: 0.28, color: '#2a3b5c', seed: 8 });
K.hills(D, { y: 242, amp: 12, seed: 9, cols: ['#0b1222', '#2a3856'], freq: 0.022 });

const isl = K.island(D, { x0: 116, x1: 366, y: GROUND, depth: 74, tip: 0.46, seed: 21, grass: P.snow, stones: 26 });
K.crystal(D, { x: 236, y: 220, h: 7, seed: 3, cols: ['#123a5c', '#2b6fae', '#5aa8f0', '#a6d4ff', '#e6f4ff'] });
K.roots(D, isl, { n: 12, seed: 22, glow: 0 });

K.pine(D, { x: 132, y: GROUND, h: 40, seed: 1 });
K.pine(D, { x: 146, y: GROUND, h: 30, seed: 2 });
K.pine(D, { x: 350, y: GROUND, h: 44, seed: 3 });
K.pine(D, { x: 336, y: GROUND, h: 28, seed: 4 });
const house = K.house(D, { x: 196, y: GROUND, w: 64, h1: 20, h2: 18, roofH: 22, seed: 11, snow: true });
K.smoke(D, { x: house.chimney.x, y: house.chimney.y, wind: 2.2, rise: 6, cols: ['#2c3850', '#3e4c68', '#56658a'] });
K.lampPost(D, { x: 176, y: GROUND, h: 30 });
K.campfire(D, { x: 292, y: GROUND, seed: 4, sparks: 18, wind: 1.5 });
K.snowman(D, { x: 312, y: GROUND, size: 1.1 });

K.snow(D, { n: 160, seed: 31, speed: [10, 18], sway: 2, cols: P.snow.slice(1, 3), name: 'snow-far' });
K.snow(D, { n: 55, seed: 32, speed: [20, 30], sway: 4, cols: P.snow.slice(3), big: true });

D.start();
</script>
</body>
</html>
