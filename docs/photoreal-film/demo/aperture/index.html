<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APERTURE</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#d8d2c6;font:13px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:grid;place-items:center}
  canvas{max-width:100%;max-height:100%;width:100%;height:auto;aspect-ratio:var(--ar);display:block;background:#000}
  #ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:10px 12px;
      background:linear-gradient(transparent,rgba(0,0,0,.72));transition:opacity .3s}
  body.idle #ui{opacity:0}
  button{all:unset;cursor:pointer;min-width:30px;height:30px;display:grid;place-items:center;border-radius:6px;color:#e9c98f;font-size:15px}
  button:hover,button:focus-visible{background:rgba(233,201,143,.16)}
  button:focus-visible{outline:2px solid #e9c98f}
  #bar{position:relative;flex:1;height:22px;cursor:pointer;touch-action:none}
  #bar::before{content:"";position:absolute;left:0;right:0;top:10px;height:2px;background:rgba(255,255,255,.22)}
  #fill{position:absolute;left:0;top:10px;height:2px;background:#e9c98f;pointer-events:none}
  #bar i{position:absolute;top:6px;width:1px;height:10px;background:rgba(255,255,255,.45);pointer-events:none}
  #lab{white-space:nowrap;font-variant-numeric:tabular-nums;min-width:11ch;text-align:right;color:#bdb6a8}
  #load{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#8d8779;letter-spacing:.2em;font-size:11px}
  @media (max-width:520px){#lab{display:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="APERTURE — frame sequence"></canvas></div>
<div id="load">LOADING</div>
<div id="ui">
  <button id="play" aria-label="Play or pause">❚❚</button>
  <div id="bar" role="slider" aria-label="Position" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div>
  <span id="lab"></span>
  <button id="snd" aria-label="Sound on or off" aria-pressed="false" hidden>♪</button>
</div>
<script>
(async () => {
  const film = await (await fetch('film.json')).json();
  const c = document.getElementById('c'), g = c.getContext('2d');
  c.width = film.w; c.height = film.h; c.style.setProperty('--ar', film.w + '/' + film.h);
  const $ = (id) => document.getElementById(id);
  const bar = $('bar'), fill = $('fill'), lab = $('lab'), playB = $('play'), sndB = $('snd'), load = $('load');
  const N = film.count, fps = film.fps, imgs = new Array(N);
  let loaded = 0, frame = 0, playing = true, t0 = performance.now(), audio = null, soundOn = false;
  for (const s of film.shots) if (s.start) { const i = document.createElement('i'); i.style.left = (s.start / N * 100) + '%'; bar.appendChild(i); }

  const q = new URLSearchParams(location.search);
  const seekTo = () => {
    const h = location.hash.slice(1);
    const s = film.shots.find((x) => x.id === h || x.id.split('_')[0] === h);
    if (s) { frame = Math.min(N - 1, s.start + Math.floor(s.n / 2)); playing = false; }
    else if (q.has('t')) { frame = Math.max(0, Math.min(N - 1, Math.round(parseFloat(q.get('t')) * fps))); playing = false; }
  };
  seekTo();
  addEventListener('hashchange', () => { seekTo(); sync(); draw(); });

  function draw() {
    const im = imgs[frame];
    if (im && im.complete && im.naturalWidth) g.drawImage(im, 0, 0, c.width, c.height);
    fill.style.width = (frame / (N - 1) * 100) + '%';
    const s = film.shots.filter((x) => x.start <= frame).pop();
    lab.textContent = (frame / fps).toFixed(1) + 's · ' + (s ? s.id.replace(/^s\d+_/, '') : '');
    bar.setAttribute('aria-valuenow', Math.round(frame / (N - 1) * 100));
    playB.textContent = playing ? '❚❚' : '▶';
  }
  function sync() {
    t0 = performance.now() - frame / fps * 1000;
    if (audio) { audio.currentTime = frame / fps; (playing && soundOn) ? audio.play().catch(() => {}) : audio.pause(); }
  }
  function tick(now) {
    if (playing && loaded >= Math.min(N, fps)) {
      let f = Math.floor((now - t0) / 1000 * fps);
      if (f >= N) { f = 0; frame = 0; sync(); }
      if (f !== frame && imgs[f] && imgs[f].complete) { frame = f; draw(); }
      else if (!(imgs[f] && imgs[f].complete)) t0 += 16;             // wait for the frame instead of skipping it
    }
    requestAnimationFrame(tick);
  }
  for (let i = 0; i < N; i++) {
    const im = new Image();
    im.onload = () => { loaded++; if (i === frame) draw(); if (loaded === Math.min(N, fps)) { load.remove(); sync(); } };
    im.src = 'frames/' + String(i + 1).padStart(4, '0') + '.' + film.ext;
    imgs[i] = im;
  }
  if (film.audio) {
    audio = new Audio(film.audio); audio.preload = 'auto'; sndB.hidden = false;
    sndB.onclick = () => { soundOn = !soundOn; sndB.setAttribute('aria-pressed', soundOn); sndB.style.opacity = soundOn ? 1 : .5; sync(); };
    sndB.style.opacity = .5;
  }
  playB.onclick = () => { playing = !playing; sync(); draw(); };
  const scrub = (e) => { const r = bar.getBoundingClientRect(); frame = Math.round(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (N - 1)); sync(); draw(); };
  bar.addEventListener('pointerdown', (e) => { bar.setPointerCapture(e.pointerId); scrub(e); bar.onpointermove = scrub; });
  bar.addEventListener('pointerup', () => { bar.onpointermove = null; });
  addEventListener('keydown', (e) => {
    if (e.key === ' ') { e.preventDefault(); playB.click(); }
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { playing = false; frame = Math.max(0, Math.min(N - 1, frame + (e.key === 'ArrowRight' ? 1 : -1))); sync(); draw(); }
  });
  let idle; const wake = () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => playing && document.body.classList.add('idle'), 2200); };
  ['pointermove', 'pointerdown', 'keydown'].forEach((ev) => addEventListener(ev, wake)); wake();
  draw(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
