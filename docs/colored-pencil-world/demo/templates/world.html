<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunflower Track — colored-pencil-world template</title>
<!-- A 12 s starter: a farm track at noon between a sunflower field and wheat, up to a red barn and a farmhouse, a girl in a
     straw hat walking it with a basket. It is an example of the style, not a menu: write BRIEF.md for your topic, then
     replace everything marked ①–⑧. -->
<script type="importmap">{ "imports": { "three": "../lib/three.module.min.js", "cpw/": "../lib/" } }</script>
<script type="module">
import { World, noise, fbm, sm, tone } from 'cpw/world.js';
import * as kit from 'cpw/kit.js';
import { Figure } from 'cpw/figure.js';

// ① the light and the pencils: where the sun is (az: the bearing it shines from, 0 = -z; el: its height), the sky's
//    light in the shade, the sunlight pencil (warm) and the shadow pencil, and the caption written on the page
const W = new World({
  name: 'Sunflower Track', seed: 4, extent: 70,
  sun: { az: 220, el: 52, strength: 1.3 }, skyStrength: 0.3,
  pencil: { px: 4.6, warm: '#fff0a0', shadow: '#4436a8' },
  caption: 'the long field, noon', wind: { az: 70, strength: 0.8 },
});

// ② the way: where the walker goes, [x, z] metres
W.way([[-4, 30], [-3, 18], [-1, 8], [0, -2], [1, -12], [3, -20]]);

// ③ the land: its height (gentle here; a hill rising behind the farm)
W.land({ height: (x, z) => 1.2 * fbm(x / 40, z / 40, 3, 2) + 6 * sm(-30, -60, z) * (0.6 + 0.4 * noise(x / 25, 3)) });

// ④ what the world is made of — every colour a pencil: clear, fairly light, never grey or black
const track = (x, z) => W.wayDist(x, z) < 1.3;
W.add(kit.sky(W, { horizon: '#a8d3f2', zenith: '#6aa2ea', cloud: 0.35, warm: '#fff0b8' }));
W.add(kit.ranges(W, { rows: [
  { dist: 520, height: 70, colour: '#9fb4dc', haze: 0.35, from: 120, to: 420, seed: 3, jag: 0.4 },
  { dist: 260, height: 26, colour: '#8cc063', haze: 0.15, from: 140, to: 400, seed: 9, trees: '#4f8f44' },
] }));
W.add(kit.ground(W, { colour: (x, z) => {
  if (track(x, z)) return '#e3c993';                                                  // the dry track
  if (W.wayDist(x, z) < 2.0) return '#9cc85a';                                          // its grassy edge
  if (x < -2 && z > -24) return Math.floor((x + 100) / 0.9) % 2 ? '#7db04b' : '#6aa343'; // under the sunflowers, in rows
  if (x > 2 && z > -24) return noise(x / 6, z / 6) > 0.5 ? '#f0d36a' : '#e8c55a';        // wheat
  return '#8cc063';
} }));
// the sunflowers: a crop of your own made with kit.make (stems in rows, heads turned to the sun)
W.add(kit.make(W, 'sunflowers', ({ line, shapes: { ball, roll }, hue, V, rng }) => {
  const r = rng(12);
  for (let x = -3.4; x > -22; x -= 0.9) for (let z = 26; z > -22; z -= 0.8) {
    if (r() < 0.12 || W.wayDist(x, z) < 2.4) continue;
    const jx = x + (r() - 0.5) * 0.3, jz = z + (r() - 0.5) * 0.3, y = W.groundAt(jx, jz), h = 1.3 + r() * 0.5;
    line.add(roll([V(jx, y, jz), V(jx + 0.05, y + h * 0.5, jz), V(jx, y + h, jz + 0.05)], 0.025, { around: 4, every: 0.5 }), '#5f9a3e', [0, 1, 0]);
    // the head faces the sun: petals in front, a brown middle, green behind
    line.add(hue(ball(0.17, 1).scale(1, 1, 0.35), (px, py, pz) => (pz > 0.01 ? '#f2c12b' : '#6aa343')).rotateY(-0.7).translate(jx, y + h + 0.05, jz), null, [1, 0.2, 0.3], [0.2, 1, 0.3]);
    line.add(ball(0.085, 1).scale(1, 1, 0.45).translate(0, 0, 0.05).rotateY(-0.7).translate(jx, y + h + 0.05, jz), '#8a5a34');
    for (const s of [-1, 1]) if (r() < 0.7) line.add(ball(0.1, 1).scale(1.6, 0.18, 0.7).translate(0.15, 0, 0).rotateZ(-0.35).rotateY(s > 0 ? r() : Math.PI + r()).translate(jx, y + h * (0.45 + 0.15 * s), jz), '#6aa343', [1, 0, 0.3], [0.3, 0, 1]);
  }
}));
const farm = W.add(kit.house(W, { at: [6, -30], turn: 200, w: 7, d: 6, storeys: 2, wall: '#f3e9d6', roof: { kind: 'eaves', colours: ['#c9663f', '#b5533c', '#d67a4a'], smoke: true }, windows: { cols: 3, shutters: '#4f7fb0', boxes: 0.6 }, door: { colour: '#4f7fb0' }, pots: 2, vine: { flowers: ['#f08ab0'] } }));
W.add(kit.house(W, { at: [-7, -27], turn: 160, w: 6.5, d: 8, storeys: 2, storey: 3.2, wall: '#d9533f', trim: '#f8f4ea', roof: { kind: 'gable', pitch: 0.95, colours: ['#8a8fa0', '#7b8194', '#989cab'], chimney: false }, windows: { cols: 1, shutters: null }, door: { colour: '#f8f4ea', arched: true }, name: 'barn' }));
W.add(kit.trees(W, { list: [
  ...[-14, -10, -6].map((x, i) => ({ at: [x - 5, -34 - i], kind: 'poplar', h: 11 + i })),
  { at: [12, -24], kind: 'round', h: 6.5 }, { at: [14, -34], kind: 'fruit', h: 5 }, { at: [3, -36], kind: 'cypress', h: 9 },
  { at: [-1.8, 4], kind: 'bush', h: 1.6 }, { at: [2.6, 12], kind: 'bush', h: 1.4 },
] }));
W.add(kit.props(W, [{ kind: 'hay', at: [7, 6], turn: 30 }, { kind: 'hay', at: [9, 3], turn: 70 }, { kind: 'cart', at: [2.8, -21], turn: 100, fill: ['#e2c56a'] }, { kind: 'sign', at: [1.8, 20], turn: 30 }, { kind: 'well', at: [-2.2, -19.5] }]));
W.add(kit.fence(W, { kind: 'rail', points: [[1.6, 28], [1.9, 14], [2.0, 2], [2.4, -10]] }));
W.add(kit.birds(W, { n: 5, centre: [0, 18, -10], radius: 14, colour: '#4a4458', size: 0.35, flap: 3 }));

// ⑤ the walker: what they wear and carry (colours by part)
W.figure(new Figure({
  height: 1.62, hair: 'long', sleeves: 'short', legs: 'skirt',
  hat: { kind: 'straw', band: '#e8554e' }, carry: { kind: 'basket', side: 'right', fill: ['#e8554e', '#f2c12b', '#8cc063'] },
  colours: { skin: '#f3c7a2', hair: '#6a3f22', top: '#f8f4ea', legs: '#4f9bd8', shoes: '#8a5a34', hat: '#ecd38a', prop: '#c9a060' },
}));

// ⑥ the shots: where they walk (metres along the way) and where the eye is
W.shots([
  { name: 'down the track', dur: 4.5, walk: [2, 8.5], cam: { from: { back: 4.6, up: 1.8, side: 0.8, yaw: 8, look: [0, 1.3, 4] }, to: { back: 4.2, up: 1.7, side: 0.4, yaw: -6, look: [0, 1.3, 4] } } },
  { name: 'past the sunflowers', dur: 4, walk: [8.5, 14.5], cam: { from: { way: [16.5, 2.3, 1.2], look: [0, 1.1, 0], fov: 44 }, to: { way: [16.5, 2.3, 1.25], look: [0, 1.15, 0], fov: 44 } } },
  { name: 'to the farm', dur: 3.5, walk: [14.5, 19.5], cam: { from: { back: 5, up: 1.3, yaw: 160, look: [0, 1.4, 0], fov: 48 }, to: { back: 6.2, up: 1.2, yaw: 172, look: [0, 1.7, 0], fov: 48 } } },
]);

// ⑦ rules of your own (optional): a sentence when one is broken
W.check('the farm stands', () => !farm.group.children.length && 'the farmhouse drew nothing');

// ⑧ go
W.start();
</script>
</html>
