<style>

<body>
<canvas id="c"></canvas>
<div id="hud">click to play with sound · space pause · arrows step</div>
<script>
// cinecode QUICK MODE starter. One file holds the whole film: timeline, scenes, on-screen text and the sound.
//
// Contract used by tools/capture.mjs:
//   window.READY            Promise<{frames, fps, width, height, renderer, title, bounds, vo}>, resolves after fonts are
//                           loaded (bounds = scene starts + the end, for tools/make.py and the per-scene checks)
//   window.renderFrame(i)   draws frame i; a pure function of (i / FPS, SEED); nothing carried between frames
//   window.captureFrame(i)  renderFrame(i) + returns a PNG/JPEG data URL of the canvas
//   window.renderAudio()    Promise<AudioBuffer>: the whole soundtrack, rendered OFFLINE (OfflineAudioContext)
// URL params: w, h (default 1080x1920 = 9:16), seed, capture=1 (set by capture.mjs: no preview loop),
//             shutter=<samples> (0 = motion blur off, for drafts), weave=<px>, tone=0 (finishing overrides)
//
// Renders: python3 tools/make.py stills | draft | final (KIT/references/quick-mode.md §3-4). It captures, lays the
// narration on the score (audio/mix.json), masters to -14 LUFS and runs the checks; never chain capture.mjs,
// master_audio.py and qc.py by hand.
//
// Edit only the FILM section below: TITLE, PURPOSE, FINISH, DURATION, PALETTE, TYPE (roles, check), CUES, VO, SCENES, SFX, ROOM,
// ARRANGEMENT, the scene functions and score(). Helpers stay as they are: EASE, MOTION (at, back, anticipate, spring, stagger, arc), CAM (pan, tilt, dolly, zoom, truck, crane, orbit, dollyZoom,
// pushTo, fpv, handheld, matchFrom, rackFocus), retime() (speed ramp, slow motion, time-lapse, freeze), plane(),
// TRANSITION (dissolve, wipe, whip, iris), lazy() (seeded data built once), label() (on-screen names), and the sound voices.
// Seeded data (star fields, layouts) is built with lazy() and first used inside a draw call: SEED is set further down
// the file, so a top-level rng() call here would run before it.

// ============================== FILM ==============================
const TITLE = 'First Sprout';
// Purpose (SKILL.md "First questions"): 'cinematic' or 'ad'.
const PURPOSE = 'cinematic';
// Look: one of the eight families (KIT/references/looks.md §1), applied to the whole frame by the look pass: grade (a
// CSS filter), bloom (highlight glow), texture ('paper' fibre, 'scanlines', 'halftone' dots), vignette, grain (and
// grainHold: frames per grain pattern; Infinity = static paper fibre), hold (drawings per second: 12 = on twos; sound,
// captions and the camera keep 24). Draw functions read line (outline width, share of the short side; 0 = none) and
// steps (toon light bands for shade(); 0 = smooth). palette is the family's starting PALETTE. A recipe from the style
// library (KIT/styles/<id>.md) starts from its base family here and adds its own grammar in the draw functions.
// ?look=<id> in the URL swaps the family for a preview (the director card's look line, quick-mode.md §2).
const LOOKS = {
  'cinematic-realistic': { grade: 'contrast(1.06) saturate(0.92)', bloom: 0.18, texture: null, vignette: 0.35, grain: 0.05, grainHold: 1, hold: 24, line: 0, steps: 0,
    palette: { bg: '#0d0f13', ink: '#efe8dc', accent: '#e0a85a', dim: '#2c3340' } },
  'anime-cel': { grade: 'saturate(1.18) contrast(1.05)', bloom: 0.1, texture: null, vignette: 0, grain: 0, grainHold: 1, hold: 24, line: 0.004, steps: 3,
    palette: { bg: '#7ec3ef', ink: '#1b1f2e', accent: '#ff5a5f', dim: '#3d5a80' } },
  'pastel-storybook': { grade: 'saturate(0.85) contrast(0.9) brightness(1.04)', bloom: 0.08, texture: 'paper', vignette: 0.15, grain: 0.025, grainHold: 1, hold: 24, line: 0.002, steps: 4,
    palette: { bg: '#f6e7d8', ink: '#4a3f55', accent: '#f2a7a0', dim: '#b8c4d6' } },
  'claymation': { grade: 'saturate(1.05) contrast(1.02)', bloom: 0, texture: null, vignette: 0.3, grain: 0.03, grainHold: 2, hold: 12, line: 0, steps: 0,
    palette: { bg: '#e9d9c4', ink: '#3b2f2a', accent: '#d9643a', dim: '#8a9a7b' } },
  'papercut-collage': { grade: 'contrast(1.04)', bloom: 0, texture: 'paper', vignette: 0.1, grain: 0.04, grainHold: Infinity, hold: 12, line: 0.0015, steps: 2,
    palette: { bg: '#efe6d6', ink: '#1f1d1a', accent: '#d6402f', dim: '#7d8b8f' } },
  'retro-synthwave-vhs': { grade: 'saturate(1.25) contrast(1.1)', bloom: 0.45, texture: 'scanlines', vignette: 0.4, grain: 0.06, grainHold: 1, hold: 24, line: 0, steps: 0,
    palette: { bg: '#0c0620', ink: '#f5e9ff', accent: '#ff2e88', dim: '#2de2e6' } },
  'glossy-commercial': { grade: 'contrast(1.04) saturate(1.04)', bloom: 0.12, texture: null, vignette: 0, grain: 0, grainHold: 1, hold: 24, line: 0, steps: 0,
    palette: { bg: '#f4f5f7', ink: '#111318', accent: '#2f6bff', dim: '#c9ced8' } },
  'handmade-ink': { grade: 'grayscale(0.6) sepia(0.15) contrast(1.1)', bloom: 0, texture: 'halftone', vignette: 0.2, grain: 0.04, grainHold: Infinity, hold: 12, line: 0.003, steps: 2,
    palette: { bg: '#efe7d6', ink: '#16130f', accent: '#b3322a', dim: '#8c8475' } },
};
const LOOK_ID = new URLSearchParams(location.search).get('look') || 'papercut-collage';
const LOOK = LOOKS[LOOK_ID] ?? LOOKS['cinematic-realistic'];
// Finishing: all off unless the user turned it on (the director card, quick-mode.md §2). Each one on its own:
// shutter: 180° motion blur for scenes marked blur: true, { deg: 180, samples: 8 } (6 for ads); each sample is one
// more draw, so render time × samples in those scenes; test one scene first. weave: gate weave in px at 1080 (0.6).
// tone: the kit's print curve, { lift: 0.035, knee: 0.72, contrast: 0.12, split: 0.02 } (lifted blacks, soft highlight
// roll-off, a light warm/cool split). KIT/references/purpose-cinematic.md §2.
const FINISH = { shutter: null, weave: 0, tone: null };
const FPS = 24;
const DURATION = 12;                        // seconds; the picture and the sound both follow this
const BPM = 80;                             // music grid; cue times sit on beats and bars: beat(n), bar(n)
const BEAT0 = 0;                            // film time of beat 0 (a bar line); 0 when the music clip starts on a downbeat
const beat = (n) => BEAT0 + n * 60 / BPM, bar = (n) => beat(4 * n);
// Own music (the user's song or track) instead of score(): null, or { file: 'audio/music.wav', gain: 0.8 }. Cut the
// clip on a bar line and take BPM from tools/beat_grid.py (KIT/references/music-video.md); the file goes through the
// same bus as everything else, so it ducks under the narration and plays in the browser preview.
const OWN_MUSIC = null;
// Recorded instruments for score() (CC0, `python3 tools/samples.py list`; `get cellos-pizz darbuka` copies them into
// audio/samples/): name them in INSTRUMENTS, then sample(ctx, out, 'cellos-pizz', bar(2), { note: 'E3', vel: 0.7 }) in score().
const INSTRUMENTS = [];
// Characters, only when the film has them (KIT/references/characters.md): one design per actor, drawn by character().
// { <name>: { skin: '#e2a57c', hair: '#2a1d16', hairStyle: 'bob', top: '#c8402f', bottom: '#2c3340', shoes: '#1c1c1c' } }
// hairStyle: short | bob | long | bun | curly | cap | bald · build: 0.8 slim .. 1.3 broad · check: film.html?modelsheet=<name>
const CAST = {};
// Math typeset as TeX, only when the film shows formulas: { pyth: 'a^2 + b^2 = c^2' }; drawn with formula(). MathJax
// (Apache-2.0, pinned) loads before READY only when this has entries; add its LICENSES.csv row when it does.
const FORMULAS = {};
const PALETTE = { bg: '#2c374b', ink: '#efe6c8', accent: '#93bb47', dim: '#3b2a20' };   // predawn wall · sprout · leaf green · soil          // the family's palette; replace with the film's own (measured from the board)
// The film's type, by role (display: titles and big words · text: subtitles, labels, lower thirds, legal · mono: data,
// code, timestamps). Chosen in the TYPE DIRECTION step (KIT/references/typography.md §10) from the dealt pairings in
// KIT/references/type-library.json: copy the role objects deal.py printed. Fontsource fonts are pinned on jsDelivr
// (latin + latin-ext, so Turkish renders the same everywhere; one LICENSES.csv row per family). A brand or Fontshare
// font stays local: { family: 'Brand Sans', files: { 600: 'fonts/BrandSans-SemiBold.woff2' } } (fonts/ is gitignored,
// never shared). A role that fails to load, or lacks a glyph of a checked string, stops the render.
// null roles = the system sans (drafts only). check: strings that must render, sizes (share of the short side) that
// must pass the phone minimum, maxChars per line. stops: faces for non-weight axes (the weight axis is continuous).
const TYPE = {
  lang: 'en',                                 // casing locale for up()/low(): 'tr' turns i into İ and I into ı
  roles: { display: null, text: null, mono: null },
  // e.g. display: { family: 'Fraunces', pkg: 'fraunces', version: '5.3.0', variable: 'full',
  //        axes: { wght: [100, 900], opsz: [9, 144], SOFT: [0, 100], WONK: [0, 1] }, stops: [{ SOFT: 0 }, { SOFT: 100 }] },
  //      text: { family: 'Instrument Sans', pkg: 'instrument-sans', version: '5.3.0', weights: [400, 600] },
  //      mono: { family: 'IBM Plex Mono', pkg: 'ibm-plex-mono', version: '5.3.0', weights: [400], features: '"tnum"' },
  check: { strings: {}, sizes: {} },   // a wordless film: no on-screen type
};

// Cues sit on the music grid (80 BPM: a beat is 0.75 s, a bar 3 s), so every hit lands on a beat.
const CUES = { fall: 0, land: beat(1), soak: bar(1), crack: beat(5), rise: bar(2), crust: beat(11), open: bar(3), shed: beat(13), dew: beat(15), end: DURATION };

// Narration: none. A wordless film; the picture and the sound carry it.
const VO = [];
const CAPTIONS = null;
const CAPTION_STYLE = { role: 'display', accentRole: 'display', size: 0.062, caps: false, ink: PALETTE.ink, hi: PALETTE.ink, accent: PALETTE.accent, punch: 0.07 };

// Four beats, one action each. S1 above the soil, S2 and S3 in the soil (a cut-paper cross-section), S4 above it again.
const SCENES = [
  { chapter: 'C1', from: CUES.fall, to: CUES.soak, draw: dropLands, action: 'a drop of water falls and soaks into the soil', amb: { kind: 'room', gain: 0.05 } },
  { chapter: 'C1', from: CUES.soak, to: CUES.rise, draw: rootDives, action: 'the bean swells, splits and its root dives down', in: { type: 'match' }, amb: { kind: 'room', gain: 0.03 } },
  { chapter: 'C1', from: CUES.rise, to: CUES.open, draw: stemShoulders, action: 'the hooked stem shoulders up and breaks the crust', in: { type: 'cut' }, amb: { kind: 'room', gain: 0.035 } },
  { chapter: 'C1', from: CUES.open, to: CUES.end, draw: leavesOpen, action: 'the stem straightens, sheds its coat and opens two leaves to the light', in: { type: 'dissolve', dur: 0.5 }, amb: { kind: 'air', gain: 0.05 } },
];

// Sounds of contact only, on the cues: the drop, the coat cracking, the crust giving, one swell into the morning, the dew.
const SFX = [
  { at: CUES.land, voice: 'foley', kind: 'tap', gain: 0.55, wet: 0.4 },
  { at: CUES.crack, voice: 'foley', kind: 'tap', gain: 0.32, wet: 0.25 },
  { at: CUES.crust, voice: 'foley', kind: 'step', gain: 0.5, wet: 0.3 },
  { at: CUES.crust + 0.05, voice: 'foley', kind: 'cloth', gain: 0.22, wet: 0.3 },
  { at: CUES.open - 0.35, voice: 'whoosh', dur: 0.7, gain: 0.2, wet: 0.3 },
  { at: CUES.dew, voice: 'tick', gain: 0.16, wet: 0.5 },
];

// A small room: a pot on a windowsill, not a hall.
const ROOM = { secs: 1.6, decay: 3.0, tone: 4200 };

const ARRANGEMENT = [
  { section: 'drop', from: 0, to: CUES.soak, parts: ['bell'] },
  { section: 'under', from: CUES.soak, to: CUES.open, parts: ['bell', 'pad', 'pulse'] },
  { section: 'morning', from: CUES.open, to: CUES.end, parts: ['bell', 'pad', 'lead'] },
];

// ---- Cut paper: every surface is a torn or cut sheet lying on the one below it, with a short shadow under its edge.
const SOIL = ['#3b2a20', '#46321f', '#33241a', '#4f3826', '#2f2118'];
const SHADOW = 'rgba(18, 9, 4, 0.42)';
const mixHex = (a, b, k) => {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(k))).toString(16).padStart(2, '0')).join('');
};
// a torn edge from x0 to x1 around y, seeded, so the tear is the same sheet in every frame
function tear(salt, x0, x1, y, amp = 0.012, n = 48) {
  const r = rng(salt), pts = [];
  for (let i = 0; i <= n; i++) pts.push([lerp(x0, x1, i / n), y + (r() - 0.5) * 2 * amp + Math.sin(i * 0.9 + salt) * amp * 0.5]);
  return pts;
}
// a sheet from a torn top edge down to `bottom`
const sheet = (salt, x0, x1, y, bottom, amp) => tear(salt, x0, x1, y, amp).concat([[x1, bottom], [x0, bottom]]);
function oval(cx, cy, rx, ry, rot = 0, n = 40, salt = 0, rough = 0) {
  const r = rng(salt + 1), c = Math.cos(rot), s = Math.sin(rot), pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU, j = 1 + (r() - 0.5) * rough;
    const x = Math.cos(a) * rx * j, y = Math.sin(a) * ry * j;
    pts.push([cx + x * c - y * s, cy + x * s + y * c]);
  }
  return pts;
}
// one paper layer: its shadow first (the sheet is lifted off the one below), then the sheet
function paper(g, pts, color, o = {}) {
  const d = o.shadow ?? 0.007;
  if (d) fillShape(g, pts.map(([x, y]) => [x + d * 0.35, y + d]), o.shadowColor ?? SHADOW, o.shadowAlpha ?? 1);
  fillShape(g, pts, color, o.alpha ?? 1);
}
// a tapered ribbon along a centre line (a root, a stem): width w0 at the start, w1 at the end
function ribbon(line, w0, w1) {
  const L = [], R = [];
  line.forEach(([x, y], i) => {
    const [ax, ay] = line[Math.max(0, i - 1)], [bx, by] = line[Math.min(line.length - 1, i + 1)];
    const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1, w = lerp(w0, w1, i / (line.length - 1)) / 2;
    L.push([x - (dy / len) * w, y + (dx / len) * w]); R.push([x + (dy / len) * w, y - (dx / len) * w]);
  });
  return L.concat(R.reverse());
}
// the soil in cross-section: strata of torn sheets, pebbles lying in them
const strata = lazy(() => Array.from({ length: 16 }, (_, i) => ({ y: -1.6 + i * 0.24, salt: 30 + i, color: SOIL[i % SOIL.length] })));
const pebbles = lazy(() => {
  const r = rng(77);
  return Array.from({ length: 40 }, () => ({ x: (r() - 0.5) * 1.6, y: -1.6 + r() * 3.4, rx: 0.012 + r() * 0.03, rot: r() * 3,
    color: ['#6b5a4a', '#57483b', '#7a6450', '#4a3e34'][Math.floor(r() * 4)] }));
});
const crumbs = lazy(() => {
  const r = rng(91);
  return Array.from({ length: 14 }, () => ({ x: (r() - 0.5) * 1.4, y: -1.2 + r() * 2.8, rx: 0.03 + r() * 0.05, rot: r() * 3 }));
});
function soilSection(g, salt0 = 0) {
  for (const s of strata()) paper(g, sheet(s.salt + salt0, -1.4, 1.4, s.y, s.y + 0.6, 0.02), s.color, { shadow: 0.012 });
  for (const p of pebbles()) paper(g, oval(p.x, p.y, p.rx, p.rx * 0.7, p.rot, 18, p.x * 100, 0.25), p.color, { shadow: 0.006 });
}
// the bean: a green coat with its pale scar, swelling with water; split = how far the coat has cracked open
function bean(g, x, y, sw, rot, split, alpha = 1) {
  const rx = 0.075 * sw, ry = 0.05 * sw;
  paper(g, oval(x, y, rx, ry, rot, 44, 5, 0.06), '#4c7a3c', { shadow: 0.008, alpha });
  fillShape(g, oval(x - rx * 0.25, y - ry * 0.35, rx * 0.45, ry * 0.25, rot, 24, 6, 0.1), '#6d9a52', 0.8 * alpha);
  fillShape(g, oval(x, y + ry * 0.45, rx * 0.35, ry * 0.12, rot, 18, 7), '#e9e2c6', 0.9 * alpha);
  if (split > 0) {                                   // the crack: a pale seam that opens along the bean's belly
    const c = Math.cos(rot), s = Math.sin(rot), seam = [];
    for (let i = 0; i <= 10; i++) {
      const u = i / 10, px = lerp(-rx * 0.8, rx * 0.8, u), py = ry * (0.55 - 0.35 * Math.sin(Math.PI * u));
      seam.push([x + px * c - py * s, y + px * s + py * c]);
    }
    g.globalAlpha = alpha; g.strokeStyle = '#efe6c8'; g.lineWidth = 0.002 + 0.007 * split; g.lineCap = g.lineJoin = 'round';
    g.beginPath(); seam.forEach(([a, b], i) => (i ? g.lineTo(a, b) : g.moveTo(a, b))); g.stroke(); g.globalAlpha = 1;
  }
}
// the root: from (x, y) down, `len` long, a wandering line that thins to its tip, root hairs behind the tip
function root(g, x, y, len, t) {
  if (len <= 0) return;
  const n = Math.max(2, Math.round(len * 60)), line = [];
  for (let i = 0; i <= n; i++) {
    const d = (i / n) * len;
    line.push([x + 0.03 * (noise1(d * 3 + 4) - noise1(4)) + 0.02 * Math.sin(d * 5), y + d]);
  }
  g.strokeStyle = '#e8dfc2'; g.lineWidth = 0.0018; g.globalAlpha = 0.75;
  for (let i = 4; i < line.length - 6; i += 2) {      // fine hairs, older ones longer
    const [px, py] = line[i], side = i % 4 ? 1 : -1, h = 0.012 + 0.018 * (1 - i / line.length);
    g.beginPath(); g.moveTo(px, py); g.lineTo(px + side * h, py + h * 0.6); g.stroke();
  }
  g.globalAlpha = 1;
  paper(g, ribbon(line, 0.022, 0.004), '#efe6c8', { shadow: 0.006 });
}
// the stem: up from its base, then a hook of radius rh that sweeps `bend` radians over to the right; returns the tip
// and its heading, where the leaves (still in the coat) hang
function stemLine(bx, by, rise, bend, rh = 0.038) {
  const line = [], step = 0.008;
  let x = bx, y = by, a = -Math.PI / 2;
  for (let d = 0; d < rise; d += step) { line.push([x, y]); x += Math.cos(a) * step; y += Math.sin(a) * step; }
  const arc = Math.abs(bend) * rh, sgn = Math.sign(bend) || 1;
  for (let d = 0; d <= arc; d += step) { line.push([x, y]); a += sgn * step / rh; x += Math.cos(a) * step; y += Math.sin(a) * step; }
  line.push([x, y]);
  return { line, tip: [x, y], heading: a };
}
function stem(g, s, color = '#efe6c8') { paper(g, ribbon(s.line, 0.024, 0.02), color, { shadow: 0.007 }); }
// the two seed leaves at the tip: closed (inside the coat) at open 0, spread at 1; green comes in with the light
function seedLeaves(g, tip, heading, open, green, scale = 1) {
  const col = mixHex('#d6d27a', '#93bb47', green), [x, y] = tip;
  for (const side of [-1, 1]) {
    const ang = heading + side * (0.12 + open * 1.25);
    const cx = x + Math.cos(ang) * 0.05 * scale, cy = y + Math.sin(ang) * 0.05 * scale;
    paper(g, oval(cx, cy, 0.056 * scale, 0.03 * scale, ang, 36, side + 3, 0.05), col, { shadow: 0.007 });
    fillShape(g, oval(cx - 0.008, cy - 0.006, 0.03 * scale, 0.01 * scale, ang, 20, side + 9), mixHex('#ece59a', '#b9d66a', green), 0.7);
  }
}

// S1 · above the soil, before dawn. A drop is already falling on frame 0; it lands on beat 1 and the wet spreads down.
function dropLands(g, k, t, S) {
  // tilt down, 3 s, ease-in-out, from the falling drop to the wet soil, with a slow dolly in
  const cam = CAM.base(); CAM.tilt(cam, EASE.inOut(k), 0.14, -0.2); CAM.dolly(cam, EASE.out(k), 1.05, 0.9);
  plane(g, S, cam, 0.7, (g) => {                       // the wall behind: predawn blue, a paler sheet where the window is
    fillShape(g, [[-2, -2], [2, -2], [2, 2], [-2, 2]], '#2c374b');
    paper(g, [[-0.9, -1.5], [-0.15, -1.5], [-0.2, -0.25], [-0.95, -0.2]], '#36445c', { shadow: 0.01 });
  });
  const land = CUES.land, wet = MOTION.at(t, land, 2.2);
  plane(g, S, cam, 0, (g) => {
    paper(g, sheet(12, -1.3, 1.3, 0.22, 1.6, 0.01), SOIL[0], { shadow: 0.012 });
    for (const c of crumbs()) if (c.y > -0.2 && c.y < 0.2)  // crumbs lying on the surface
      paper(g, oval(c.x, 0.215 + c.y * 0.02, c.rx * 0.5, 0.008, c.rot * 0.1, 14, c.x * 50, 0.3), SOIL[3], { shadow: 0.004 });
    if (t >= land) {                                     // the wet: a dark spot that spreads, then seeps down
      const spread = EASE.out(wet);
      paper(g, oval(0.02, 0.228, 0.03 + 0.15 * spread, 0.012 + 0.012 * spread, 0, 40, 3, 0.15), '#22160e', { shadow: 0 });
      const depth = 0.4 * EASE.inOut(MOTION.at(t, land + 0.3, 1.95)), w = 0.1 + 0.2 * spread;
      if (depth > 0.01) {                                // a blot that soaks down, rounded, its lower edge fingering into the soil
        const blot = tear(21, -w, w, 0.235, 0.004);
        for (let i = 0; i <= 40; i++) {
          const x = lerp(w, -w, i / 40), env = Math.sqrt(Math.max(0, 1 - (x / w) ** 2));
          blot.push([x + 0.02, 0.235 + depth * env * (0.75 + 0.35 * noise1(i * 0.16 + 9))]);
        }
        paper(g, blot, '#24170f', { shadow: 0, alpha: 0.6 });
      }
    }
    // the drop: already falling on frame 0, stretched by its speed; on the land cue it bursts into paper droplets
    if (t < land) {
      const u = t / land, y = lerp(-0.6, 0.2, u * u), stretch = 1 + 0.9 * u;
      g.save(); g.translate(0.02, y); g.scale(2.2, 2.2 * stretch);
      paper(g, [[0, -0.034], [0.014, -0.006], [0.016, 0.006], [0.008, 0.016], [-0.008, 0.016], [-0.016, 0.006], [-0.014, -0.006]], '#bfe0ec', { shadow: 0.005 });
      dot(g, S, -0.005, 0.002, 0.0035, '#f4fbff', 0.9);
      g.restore();
      g.strokeStyle = '#bfe0ec'; g.globalAlpha = 0.25 * u; g.lineWidth = 0.003;
      g.beginPath(); g.moveTo(0.02, y - 0.08 * stretch); g.lineTo(0.02, y - 0.08 * stretch - 0.14 * u); g.stroke(); g.globalAlpha = 1;
    } else {
      const tau = t - land, r = rng(41);
      for (let i = 0; i < 9; i++) {
        const vx = (r() - 0.5) * 0.5, vy = -0.35 - r() * 0.35, x = 0.02 + vx * tau, y = 0.21 + vy * tau + 2.2 * tau * tau;
        const size = 0.012 * (1 - clamp(tau / 0.6)) + 0.003;
        if (y < 0.225) paper(g, oval(x, y, size, size, 0, 12), '#bfe0ec', { shadow: 0.003 });
      }
    }
  });
  plane(g, S, cam, -0.3, (g) => {                      // the pot's rim in front, terracotta paper
    paper(g, sheet(15, -1.3, 1.3, 0.47, 1.6, 0.006), '#a85b37', { shadow: 0.014 });
    paper(g, sheet(16, -1.3, 1.3, 0.47, 0.5, 0.004), '#c4744a', { shadow: 0 });
  });
}

// S2 · in the soil. The wet front comes down where S1 left it, the bean swells, cracks on beat 5 and the root dives.
function rootDives(g, k, t, S) {
  // crane down, 3 s, ease-in-out, after the root tip
  const cam = CAM.base(); CAM.crane(cam, EASE.inOut(k), 0.12, -0.32); CAM.dolly(cam, EASE.inOut(k), 0.6, 0.78); CAM.matchFrom(cam, EASE.out(Math.min(1, k * 3)), 0, -0.04);
  const front = lerp(-0.5, 1.1, EASE.out(k));
  const bx = 0, by = -0.2, sw = 1.05 + 0.18 * EASE.out(MOTION.at(t, CUES.soak + 0.2, 0.8));
  const split = MOTION.back(MOTION.at(t, CUES.crack, 0.35), 1.2), len = 0.74 * EASE.out(MOTION.at(t, CUES.crack + 0.12, CUES.rise - CUES.crack - 0.12));
  plane(g, S, cam, 0.35, (g) => {
    soilSection(g);
    fillShape(g, tear(23, -1.4, 1.4, front, 0.03).concat([[1.4, -2], [-1.4, -2]]), '#140b06', 0.35);   // soil darkened by the water
  });
  plane(g, S, cam, 0, (g) => {
    root(g, bx + 0.01, by + 0.045 * sw, len, t);
    bean(g, bx, by, sw, -0.25, clamp(split, 0, 1.2));
  });
  plane(g, S, cam, -0.28, (g) => {                     // crumbs close to the lens slide past faster
    for (const c of crumbs()) paper(g, oval(c.x * 1.4, c.y, c.rx * 0.7, c.rx * 0.45, c.rot, 16, c.x * 70, 0.35), '#5a4131', { shadow: 0.01, alpha: 0.95 });
  });
}

// S3 · still in the soil, wider. The stem rises as a hook, pulling the leaves up in their coat; on beat 11 it breaks
// the crust.
function stemShoulders(g, k, t, S) {
  // crane up and dolly out, 3 s, ease-in-out, from the root to the surface
  const cam = CAM.base(); CAM.crane(cam, EASE.inOut(k), -0.12, 0.1); CAM.dolly(cam, EASE.inOut(k), 0.82, 1.02);
  const surface = -0.34, crust = CUES.crust, rise = lerp(0.04, 0.56, EASE.inOut(MOTION.at(t, CUES.rise, crust - CUES.rise + 0.2)));
  const s = stemLine(0, 0.22, rise, Math.PI * 0.95);
  const broke = MOTION.at(t, crust, 0.7);
  plane(g, S, cam, 0, (g) => {
    soilSection(g, 3);
    paper(g, tear(19, 3, -3, surface, 0.008).concat([[-3, -3], [3, -3]]), '#2c374b', { shadow: 0 });   // the air above, still dark
    root(g, 0, 0.22, 0.9, t);
    stem(g, s);
    bean(g, s.tip[0] + 0.03, s.tip[1] + 0.035, 1.15, s.heading - Math.PI / 2 - 0.4, 1);
    // the crust over the stem: whole until the cue, then its pieces lift and tip back
    const r = rng(55), top = Math.min(...s.line.map((p) => p[1])), bulge = 0.03 * clamp(1 - (top - surface) / 0.14);
    for (let i = 0; i < 6; i++) {
      const near = 1 - Math.abs(i - 2.5) / 3.5, lift = bulge * near + (broke > 0 ? 0.05 * EASE.out(broke) * near : 0), x0 = -0.12 + i * 0.045;
      const tilt = broke > 0 ? (i < 3 ? -1 : 1) * 0.5 * EASE.out(broke) * (0.5 + r()) : 0;
      g.save(); g.translate(x0 + 0.022, surface + 0.01 - lift); g.rotate(tilt);
      paper(g, [[-0.024, -0.012], [0.022, -0.016], [0.026, 0.014], [-0.02, 0.016]], SOIL[0], { shadow: 0.006 });
      fillShape(g, [[-0.024, -0.012], [0.022, -0.016], [0.023, -0.009], [-0.023, -0.006]], SOIL[3], 1);
      g.restore();
    }
  });
}

// S4 · above the soil at first light. The hook springs straight, the coat drops on beat 13, the leaves open, and the
// drop comes back as dew on a leaf that catches the light on beat 15.
function leavesOpen(g, k, t, S) {
  // push in, 3 s, ease-in-out, onto the opening leaves
  const cam = CAM.base(); CAM.pushTo(cam, EASE.inOut(k), 0.02, -0.1, 0.92, 0.64);
  const warm = EASE.inOut(MOTION.at(t, CUES.open, 2.6)), base = 0.3;
  const u = MOTION.back(MOTION.at(t, CUES.open + 0.1, 1.2), 1.4);          // the hook straightens with a small overshoot
  const s = stemLine(0, base, 0.36 + 0.05 * k, Math.PI * 0.95 * (1 - u));
  const open = MOTION.back(MOTION.at(t, CUES.shed + 0.25, 1.0), 1.6);
  plane(g, S, cam, 0.8, (g) => {                       // the wall warms; a window's light slides in from the left
    fillShape(g, [[-3, -3], [3, -3], [3, 3], [-3, 3]], mixHex('#4a5068', '#d9c39d', warm));
    const sx = lerp(-1.4, -0.35, EASE.out(warm));
    paper(g, [[sx - 0.6, -1.6], [sx + 0.35, -1.6], [sx + 0.7, 0.9], [sx - 0.25, 0.9]], '#f3d38e', { shadow: 0, alpha: 0.55 * warm });
  });
  plane(g, S, cam, 0, (g) => {
    paper(g, sheet(12, -1.4, 1.4, base, 1.8, 0.01), SOIL[0], { shadow: 0.012 });
    [[-0.09, -0.6], [-0.045, -0.3], [0.05, 0.35], [0.1, 0.65]].forEach(([x, r], i) =>   // the broken crust, tipped back
      paper(g, oval(x, base - 0.008, 0.024, 0.011, r, 14, i + 60, 0.2), SOIL[3], { shadow: 0.006 }));
    stem(g, s, mixHex('#e6dcb8', '#d7e3a4', warm));
    seedLeaves(g, s.tip, s.heading, clamp(open, 0, 1.15), warm);
    // true leaves peeking between the seed leaves
    const tl = EASE.out(MOTION.at(t, CUES.shed + 0.9, 1.0));
    if (tl > 0) for (const side of [-1, 1]) {
      const a = s.heading + side * 0.35;
      paper(g, oval(s.tip[0] + Math.cos(a) * 0.022 * tl, s.tip[1] + Math.sin(a) * 0.022 * tl, 0.02 * tl, 0.009 * tl, a, 20, side + 70), '#5e8f33', { shadow: 0.004 });
    }
    // the coat: two green halves that slip off on the cue and fall to the soil
    const fall = t - CUES.shed;
    for (const side of [-1, 1]) {
      let [x, y] = s.tip, rot = s.heading + side * 0.3;
      if (fall > 0) {
        const drop = Math.min(fall, 0.55);
        x += side * 0.06 * drop; y = Math.min(base - 0.012, y + 0.04 * drop + 1.6 * drop * drop); rot += side * 2.6 * drop;
      }
      const cx = x + Math.cos(rot) * 0.03, cy = y + Math.sin(rot) * 0.03;
      paper(g, oval(cx, cy, 0.042, 0.018, rot, 28, side + 80, 0.08), '#38572c', { shadow: 0.006 });
      fillShape(g, oval(cx - 0.006, cy - 0.005, 0.022, 0.006, rot, 20, side + 84), '#5b7d45', 0.9);
    }
    // the dew: forms on the right leaf's tip, catches the light on the cue
    const dew = EASE.out(MOTION.at(t, CUES.shed + 1.1, 0.4));
    if (dew > 0) {
      const a = s.heading + 0.12 + clamp(open, 0, 1.15) * 1.25, dx = s.tip[0] + Math.cos(a) * 0.1, dy = s.tip[1] + Math.sin(a) * 0.1 + 0.004;
      paper(g, oval(dx, dy, 0.012 * dew, 0.011 * dew, 0, 16), '#cfe9f2', { shadow: 0.003 });
      dot(g, S, dx - 0.004, dy - 0.004, 0.003 * dew, '#ffffff', 0.9);
      const glint = Math.max(0, 1 - Math.abs(t - CUES.dew) / 0.35) * warm;
      if (glint > 0) {
        g.globalAlpha = glint; g.fillStyle = '#fffbe8';
        for (const [ax, ay] of [[1, 0], [0, 1]]) {
          g.beginPath(); g.moveTo(dx - 0.004 - ax * 0.03, dy - 0.003 - ay * 0.03); g.lineTo(dx - 0.003 + ay * 0.003, dy - 0.003 + ax * 0.003);
          g.lineTo(dx - 0.004 + ax * 0.03, dy - 0.003 + ay * 0.03); g.lineTo(dx - 0.005 - ay * 0.003, dy - 0.003 - ax * 0.003); g.closePath(); g.fill();
        }
        g.globalAlpha = 1;
      }
    }
  });
  plane(g, S, cam, -0.25, (g) => {
    paper(g, sheet(15, -1.4, 1.4, 0.55, 1.8, 0.006), mixHex('#8e4c2f', '#b8653d', warm), { shadow: 0.014 });
    paper(g, sheet(16, -1.4, 1.4, 0.55, 0.58, 0.004), mixHex('#a65c38', '#d4834f', warm), { shadow: 0 });
  });
}

// Music: written in code (the brief asked for it). D major pentatonic at 80 BPM: a lone bell note for the drop, a slow
// heartbeat and a low pad while the bean works in the dark, and in the morning the pad opens and a soft lead climbs.
function score(ctx, out) {
  const B = 60 / BPM;
  pluck(ctx, out, CUES.land, hz('A5'), 0.22);                                  // the drop's note
  pluck(ctx, out, CUES.land + 2 * B, hz('F#5'), 0.12);
  const under = spans('pad').find(([a]) => Math.abs(a - CUES.soak) < 1e-6);
  if (under) {
    pad(ctx, out, CUES.soak, CUES.rise - CUES.soak, chord('Dadd9', 3), 0.1);
    pad(ctx, out, CUES.rise, CUES.open - CUES.rise, chord('Bm7', 3), 0.1);
  }
  for (const b of beats('pulse', 2 * B)) kick(ctx, out, b, 0.2);              // the seed's slow heartbeat, two a bar
  const bells = ['D5', 'A4', 'E5', 'F#5', 'D5', 'B4', 'E5', 'A5'];
  beats('bell', 2 * B).filter((b) => b >= CUES.soak && b < CUES.open).forEach((b, i) => pluck(ctx, out, b + B, hz(bells[i % bells.length]), 0.09));
  pad(ctx, out, CUES.open, 1.5, chord('Gmaj7', 3), 0.11);                      // the morning: the pad opens
  pad(ctx, out, CUES.open + 1.5, CUES.end - CUES.open - 1.5, chord('D', 3, { open: true }), 0.12);
  [['F#5', 0], ['A5', 1], ['B5', 2], ['D6', 3]].forEach(([n, i]) => lead(ctx, out, CUES.open + i * B, hz(n), i === 3 ? CUES.end - CUES.dew - 0.05 : B * 0.9, 0.07));
}

// ============================== HELPERS (picture) ==============================
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1080, H = +q.get('h') || 1920, SEED = +q.get('seed') || 7;
const FRAMES = Math.round(FPS * DURATION), TAU = Math.PI * 2, SR = 48000;
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const g = canvas.getContext('2d', { alpha: false });
const S = { W, H, u: Math.min(W, H) };       // u = the short side; sizes below are fractions of it

function rng(salt) {                         // seeded PRNG (mulberry32); call rng(salt) inside draw for a fresh, fixed stream
  let a = (SEED * 2654435761 + salt * 974711) >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function hash1(n) { const s = Math.sin(n * 127.1 + SEED * 311.7) * 43758.5453; return s - Math.floor(s); }
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return hash1(i) * (1 - u) + hash1(i + 1) * u; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
// Easing names used in camera lines: linear, ease-in, ease-out, ease-in-out, inertia (keeps speed at both ends).
const EASE = {
  linear: (k) => k, in: (k) => k * k * k, out: (k) => 1 - (1 - k) ** 3,
  inOut: (k) => k < 0.5 ? 4 * k ** 3 : 1 - (-2 * k + 2) ** 3 / 2,
  inertia: (k) => 0.35 * k + 0.65 * k * k * (3 - 2 * k),
};
// Motion for things in the frame (KIT/references/motion.md): entrances ease out, exits ease in, nothing living moves linearly.
const MOTION = {
  at: (t, start, dur) => clamp((t - start) / dur),                       // 0..1 progress; a follower uses at(t - lag, ...)
  back: (k, s = 1.7) => 1 + (s + 1) * (k - 1) ** 3 + s * (k - 1) ** 2,    // ease-out with overshoot: s 1 ≈ 4%, 1.7 ≈ 10%, 2.2 ≈ 15%
  anticipate: (k, amount = 0.15, share = 0.25) => k < share             // wind back by `amount`, then release
    ? -amount * (1 - Math.cos(Math.PI * k / share)) / 2
    : -amount + (1 + amount) * (1 - (1 - (k - share) / (1 - share)) ** 3),
  spring: (tau, zeta = 0.7, f = 2) => {                                  // damped spring tau s after release; zeta 1 firm, 0.7 ≈ 5%, 0.5 ≈ 16%, 0.4 ≈ 25%
    if (tau <= 0) return 0;
    const w = 2 * Math.PI * f;
    if (zeta >= 1) return 1 - Math.exp(-w * tau) * (1 + w * tau);
    const wd = w * Math.sqrt(1 - zeta * zeta);
    return 1 - Math.exp(-zeta * w * tau) * (Math.cos(wd * tau) + zeta * w / wd * Math.sin(wd * tau));
  },
  stagger: (i, n, spread, order = 'seq') => {                            // start delay of item i of n: seq, reverse, center, random (seeded)
    if (n < 2) return 0;
    const u = i / (n - 1);
    const p = order === 'reverse' ? 1 - u : order === 'center' ? Math.abs(2 * u - 1) : order === 'random' ? hash1(i + 0.5) : u;
    return p * spread;
  },
  arc: (k, ax, ay, bx, by, bend = 0.15) => {                             // point on a bowed path from a to b (living things move on arcs)
    const dx = bx - ax, dy = by - ay, o = bend * Math.sin(Math.PI * k);
    return [ax + dx * k - dy * o, ay + dy * k + dx * o];
  },
};

// ---- Camera (2.5D). Coordinates: (0,0) is the centre, 1 = the short side; y grows downward.
// The world is a stack of flat planes; z = depth behind the subject plane (z = 0), negative = in front of it.
// The camera sits `dist` in front of plane 0; a plane's scale is focal / (dist + z), so moving the camera gives
// real parallax and changing `focal` does not (a zoom). Every move takes an eased value e in 0..1.
const CAM = {
  base: () => ({ x: 0, y: 0, dist: 1, focal: 1, pan: 0, tilt: 0, roll: 0, focusZ: 0, aperture: 0 }),
  pan: (c, e, a, b) => { c.pan += lerp(a, b, e); },           // turn: screen shift, no parallax (+ = right)
  tilt: (c, e, a, b) => { c.tilt += lerp(a, b, e); },         // + = up
  dolly: (c, e, a, b) => { c.dist = lerp(a, b, e); },         // dolly in: b < a
  zoom: (c, e, a, b) => { c.focal = lerp(a, b, e); },         // zoom in: b > a (no parallax)
  truck: (c, e, a, b) => { c.x = lerp(a, b, e); },            // tracking / truck: camera moves sideways (+ = right)
  crane: (c, e, a, b) => { c.y = -lerp(a, b, e); },           // crane / pedestal: + = up
  orbit: (c, e, a, b, targetZ = 0) => {                       // arc around a target plane, degrees
    const ang = lerp(a, b, e) * Math.PI / 180, R = c.dist + targetZ;
    c.x = Math.sin(ang) * R; c.pan -= c.x * c.focal / R;      // turn back toward the target: near and far planes slide
  },
  dollyZoom: (c, e, a, b, subjectZ = 0) => {                  // vertigo: dist changes, focal compensates
    const f0 = c.focal; c.dist = lerp(a, b, e); c.focal = f0 * (c.dist + subjectZ) / (a + subjectZ);
  },
  pushTo: (c, e, x, y, a, b) => { c.dist = lerp(a, b, e); c.x = x * e; c.y = y * e; },   // push-in on a detail at (x, y)
  fpv: (c, e, a, b, bank = 0.15) => { c.dist = lerp(a, b, e); c.roll += bank * Math.sin(Math.PI * e); },   // fly through planes
  handheld: (c, t, amount = 1, salt = 3) => {                 // seeded, low-passed (0.3-1.1 Hz); never per-frame jitter
    const n = (f, o) => 2 * noise1(t * f + salt + o) - 1;
    c.pan += amount * (0.004 * n(1.1, 0) + 0.003 * n(0.3, 40));
    c.tilt += amount * (0.004 * n(1.0, 20) + 0.003 * n(0.27, 60));
    c.roll += amount * 0.003 * n(0.8, 80);
  },
  matchFrom: (c, e, dx, dy) => { c.x += dx * (1 - e); c.y += dy * (1 - e); },   // match cut: start where A's shape was, settle
  rackFocus: (c, e, a, b, aperture = 1) => { c.focusZ = lerp(a, b, e); c.aperture = aperture; },
  // One continuous shot: a fresh camera on the path through `keys` ([{ t, x, y, dist, focal, pan, tilt, roll }], a
  // missing value keeps the previous key's) at time t. Hermite curves with tangents from the neighbours, so the camera
  // flows through every key and never stops on one; it eases only out of the first key and into the last.
  path: (keys, t) => {
    const K = [];
    let prev = CAM.base();
    for (const k of keys) { prev = { ...prev, ...k }; K.push(prev); }
    const F = Object.keys(K[K.length - 1]).filter((f) => f !== 't' && typeof K[K.length - 1][f] === 'number');
    const c = CAM.base(), n = K.length;
    const at = (k) => { for (const f of F) c[f] = k[f]; return c; };
    if (n === 1 || t <= K[0].t) return at(K[0]);
    if (t >= K[n - 1].t) return at(K[n - 1]);
    let i = 0;
    while (t > K[i + 1].t) i++;
    const dt = K[i + 1].t - K[i].t, u = (t - K[i].t) / dt, u2 = u * u, u3 = u2 * u;
    const m = (j, f) => (j <= 0 || j >= n - 1) ? 0 : (K[j + 1][f] - K[j - 1][f]) / (K[j + 1].t - K[j - 1].t);
    for (const f of F) {
      c[f] = (2 * u3 - 3 * u2 + 1) * K[i][f] + (u3 - 2 * u2 + u) * dt * m(i, f)
        + (-2 * u3 + 3 * u2) * K[i + 1][f] + (u3 - u2) * dt * m(i + 1, f);
    }
    return c;
  },
  // An operator following a moving subject: the camera's x and y trail the subject's position lag seconds behind
  // (pos(t) returns [x, y] in world units), so it reads as a camera chasing, not a lock. k blends it into the path.
  follow: (c, pos, t, lag = 0.35, k = 1, offset = [0, 0]) => {
    const [x, y] = pos(t - lag);
    c.x = lerp(c.x, x + offset[0], k); c.y = lerp(c.y, y + offset[1], k);
  },
};

// Perspective: a camera standing in a 3D world (y up) at (x, y, z), looking at (tx, ty, tz), with a vertical field of
// view in degrees. For anything seen along or around: a road or track receding, a vehicle at three quarters, an orbit
// around a product, a flight through a place. Hand-drawn things stay hand-drawn: view.sprite() places a 2D drawing at a
// 3D point at its true size and depth, view.poly() and view.line() draw ground shapes and objects in perspective, and
// view.haze() fades what is far into the air (aerial perspective: the far is paler and softer, the near darkest).
// Keys for a moving view go through CAM.path like any camera: { t, x, y, z, tx, ty, tz, fov }.
const VIEW = {
  of(c, S) {
    const e = [c.x, c.y, c.z ?? 0], f0 = [(c.tx ?? 0) - e[0], (c.ty ?? 0) - e[1], (c.tz ?? 0) - e[2]];
    const n = (v) => { const l = Math.hypot(...v) || 1; return v.map((x) => x / l); };
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const f = n(f0); let r = n(cross(f, [0, 1, 0])), u = cross(r, f);
    if (c.roll) { const cs = Math.cos(c.roll), sn = Math.sin(c.roll); [r, u] = [r.map((x, i) => x * cs + u[i] * sn), u.map((x, i) => x * cs - r[i] * sn)]; }
    const k = (S.H / 2) / Math.tan((c.fov ?? 50) * Math.PI / 360), dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    return {
      // [screen x, screen y, scale (px per world unit at that depth), depth], or null behind the camera
      p(x, y, z) {
        const d = [x - e[0], y - e[1], z - e[2]], zc = dot(d, f);
        return zc > 0.05 ? [S.W / 2 + dot(d, r) * k / zc, S.H / 2 - dot(d, u) * k / zc, k / zc, zc] : null;
      },
      // a 2D drawing (fn draws in its own units, 1 = size world units) standing at (x, y, z)
      sprite(g, x, y, z, size, fn) {

  if (o.note != null && pitched.length) {
    const want = midiOf(o.note);
    take = pitched.reduce((a, b) => (Math.abs(b.midi - want) < Math.abs(a.midi - want) ? b : a));
    if (Math.abs(want - take.midi) > 4 && !o.stretch) {
      const lo = Math.min(...pitched.map((k) => k.midi)), hi = Math.max(...pitched.map((k) => k.midi));
      throw new Error(`sample: ${name} ${o.note} is ${Math.abs(want - take.midi)} semitones from its nearest take (it plays `
        + `${noteName(lo)}–${noteName(hi)}): an octave ${want > hi ? 'lower' : 'higher'}, another player, or { stretch: true } for an effect`);
    }
    rate = Math.pow(2, (want - take.midi) / 12);
  }
  const src = ctx.createBufferSource(), g = ctx.createGain();
  src.buffer = take.buf; src.playbackRate.value = rate;
  g.gain.value = (o.gain ?? 0.8) * take.norm * (o.note != null ? 0.4 + 0.6 * vel : 1);
  let node = src.connect(g);
  if (o.pan) { const p = ctx.createStereoPanner(); p.pan.value = o.pan; node = node.connect(p); }
  node.connect(out); src.start(Math.max(0, t));
  return src;
}

function loadAudio(ctx, url) {              // a local WAV next to film.html (XHR works on file:// in the capture)
  return new Promise((ok, fail) => {
    const x = new XMLHttpRequest(); x.open('GET', url.replace(/#/g, '%23')); x.responseType = 'arraybuffer';
    x.onload = () => (x.status === 0 || x.status === 200) ? ctx.decodeAudioData(x.response).then(ok, fail)
      : fail(new Error(`own music: ${url} (${x.status})`));
    x.onerror = () => fail(new Error(`own music: could not load ${url}`)); x.send();
  });
}
window.renderAudio = async () => {
  const ctx = new OfflineAudioContext(2, Math.round(DURATION * SR), SR);
  const bus = ctx.createGain(); duck(bus.gain, 0.8, VO);
  const lim = ctx.createDynamicsCompressor();  // safety only; loudness is set afterwards by master_audio.py
  lim.threshold.value = -6; lim.knee.value = 6; lim.ratio.value = 8; lim.attack.value = 0.003; lim.release.value = 0.15;
  bus.connect(lim).connect(ctx.destination);
  ROOM_IN = makeRoom(ctx, bus);
  await loadSamples(ctx);
  SCENES.forEach((s, i) => { if (s.amb) ambience(ctx, wet(ctx, bus, 0.15), s.from, s.to, s.amb.kind, s.amb.gain, 300 + i); });
  for (const e of SFX) sfx(ctx, bus, e);
  if (OWN_MUSIC) {
    const src = ctx.createBufferSource(), gain = ctx.createGain();
    src.buffer = await loadAudio(ctx, OWN_MUSIC.file); gain.gain.value = OWN_MUSIC.gain ?? 0.8;
    src.connect(gain).connect(bus); src.start(0);
  } else score(ctx, bus);
  return ctx.startRendering();
};

window.READY = loadType(TYPE).then(loadFormulas).then(() => document.fonts.ready).then(() => {
  const qc = typeCheck(g, TYPE, W, H, PALETTE);  // missing glyphs or unreadable contrast stop here; warnings go to the log
  if (qc.errors.length) throw new Error('type check: ' + qc.errors.join(' · '));
  if (!OWN_MUSIC) checkArrangement();          // the user's own song brings its own arrangement
  return { frames: FRAMES, fps: FPS, width: W, height: H, renderer: 'canvas2d', qc: qc.warnings,
           title: TITLE, bounds: SCENES.map((s) => s.from).concat(DURATION), vo: VO.length,
           sfx: SFX.map((e) => [Math.round(e.at * 100) / 100, e.voice, e.dur ?? null]),
           palette: PALETTE, lookPalette: LOOK.palette, families: Object.values(TYPE.roles || {}).filter(Boolean).map((r) => r.family) };
});

// Text check (make.py runs it on drafts and finals, ?textcheck=1 only; renders never take this path). Every fillText and
// strokeText on a full-frame canvas is watched: its ink is the pixels it changed. Ink of two lines stacked over each
// other on the same pixels is an overlap; a piece of type whose face is within 2:1 of what is around half or more of
// its letters is low contrast. window.textCheck(frame) draws one frame and returns what it found there.
if (q.get('textcheck')) {
  const P = CanvasRenderingContext2D.prototype, owners = new WeakMap(), calls = [];
  let frameStart = 0, found = [];
  const lin = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
  const lum = (r, gg, b) => 0.2126 * lin(r) + 0.7152 * lin(gg) + 0.0722 * lin(b);
  const rgbOf = (s) => {
    if (typeof s !== 'string') return null;
    if (s[0] === '#' && s.length === 7) return [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16));
    const m = s.match(/rgba?\(([^)]+)\)/);
    return m ? m[1].split(',').slice(0, 3).map(Number) : null;
  };
  const watch = (orig, stroke) => function (str, x, y, ...rest) {
    const cv = this.canvas, s = String(str);
    if (cv.width !== W || cv.height !== H || !s.trim() || this.globalAlpha < 0.6) return orig.call(this, str, x, y, ...rest);
    const m = this.measureText(s), T = this.getTransform();
    const pts = [[x - m.actualBoundingBoxLeft, y - m.actualBoundingBoxAscent], [x + m.actualBoundingBoxRight, y - m.actualBoundingBoxAscent],
      [x - m.actualBoundingBoxLeft, y + m.actualBoundingBoxDescent], [x + m.actualBoundingBoxRight, y + m.actualBoundingBoxDescent]]
      .map(([px, py]) => [T.a * px + T.c * py + T.e, T.b * px + T.d * py + T.f]);
    const pad = 3 + (this.shadowBlur || 0) + Math.abs(this.shadowOffsetX || 0) + Math.abs(this.shadowOffsetY || 0);
    const x0 = Math.max(0, Math.floor(Math.min(...pts.map((p) => p[0])) - pad)), x1 = Math.min(W, Math.ceil(Math.max(...pts.map((p) => p[0])) + pad));
    const y0 = Math.max(0, Math.floor(Math.min(...pts.map((p) => p[1])) - pad)), y1 = Math.min(H, Math.ceil(Math.max(...pts.map((p) => p[1])) + pad));
    if (x1 - x0 < 2 || y1 - y0 < 2) return orig.call(this, str, x, y, ...rest);
    const before = this.getImageData(x0, y0, x1 - x0, y1 - y0).data;
    const result = orig.call(this, str, x, y, ...rest);
    const after = this.getImageData(x0, y0, x1 - x0, y1 - y0).data;
    const cap = Math.abs(T.d) * m.actualBoundingBoxAscent, base = T.b * x + T.d * y + T.f;
    const left = Math.min(...pts.map((p) => p[0])), right = Math.max(...pts.map((p) => p[0]));
    const last = calls.length > frameStart ? calls[calls.length - 1] : null, same = last && last.cv === cv;
    // the same string again at about the same place is a layer of one piece of type (extrusion, shadow, outline + fill)
    const layer = same && last.s === s && Math.abs(last.base - base) < 0.3 * cap && Math.abs(last.left - left) < 0.3 * cap;
    // apart: how far a baseline lies outside a piece of type's baselines (all its layers, an extrusion runs deep)
    const apart = (st, b) => Math.max(0, st.lo - b, b - st.hi);
    let run = same && apart(last.stack, base) <= 0.6 * Math.min(last.cap, cap) ? last.run : null;   // bouncing letters stay one line
    if (run && !layer) { run.label += (left - run.right > 0.25 * cap ? ' ' : '') + s; run.right = Math.max(run.right, right); }
    else if (!run) run = { label: s, right };
    let stack = layer ? last.stack : null;
    if (!stack) { if (last) settle(last.stack); stack = { run, ink: null, alpha: 0, cap: 0, overlapped: false, lo: base, hi: base }; }
    if (!stroke) { stack.ink = rgbOf(this.fillStyle); stack.alpha = this.globalAlpha; }   // a gradient face: colour unknown, not judged
    Object.assign(stack, { after, bw: x1 - x0, bh: y1 - y0, cap: Math.max(stack.cap, cap), lo: Math.min(stack.lo, base), hi: Math.max(stack.hi, base) });
    const id = calls.push({ s, base, cap, cv, run, left, right, stack }) - 1;
    let own = owners.get(cv);
    if (!own) { own = new Int32Array(W * H).fill(-1); owners.set(cv, own); }
    const hits = new Map(), bw = x1 - x0;
    for (let i = 0, n = before.length / 4; i < n; i++) {
      const k = i * 4;
      if (Math.abs(after[k] - before[k]) + Math.abs(after[k + 1] - before[k + 1]) + Math.abs(after[k + 2] - before[k + 2]) <= 30) continue;
      const idx = (y0 + Math.floor(i / bw)) * W + x0 + (i % bw), prev = own[idx];
      if (prev >= frameStart && calls[prev].run !== run && calls[prev].s !== s) hits.set(prev, (hits.get(prev) || 0) + 1);
      own[idx] = id;
    }
    for (const [prev, px] of hits) {          // only lines stacked over each other: letters side by side may touch by design
      const o = calls[prev], wide = Math.min(o.right - o.left, right - left);
      const gap = Math.max(0, o.stack.lo - stack.hi, stack.lo - o.stack.hi);
      const stacked = gap > 0.6 * Math.min(o.cap, cap) && Math.min(o.right, right) - Math.max(o.left, left) > 0.3 * wide;
      if (stacked && px >= 6) { found.push({ kind: 'overlap', a: o.run, b: run, px }); stack.overlapped = true; }
    }
    return result;
  };
  // The finished piece of type: its face (the last fill colour) against what is right around each letter after every
  // layer is drawn, so an outline or a shadow that separates the letters counts. A face that fills its whole box has
  // nothing around it: the type is lost in a ground of its own colour.
  function settle(st) {
    if (!st || st.done) return;
    st.done = true;
    if (!st.ink || st.overlapped || st.alpha < 0.85 || st.cap < 6) return;
    const [ir, ig, ib] = st.ink, li = lum(ir, ig, ib), { after, bw, bh } = st, R = Math.max(3, Math.round(st.cap * 0.12));
    const face = (xx, yy) => { const k = (yy * bw + xx) * 4; return Math.abs(after[k] - ir) + Math.abs(after[k + 1] - ig) + Math.abs(after[k + 2] - ib) < 48; };
    let faces = 0, low = 0, all = 0;
    for (let yy = 0; yy < bh; yy++) for (let xx = 0; xx < bw; xx++) {
      if (!face(xx, yy)) continue;
      faces++;
      if ((xx + yy) % 2) continue;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        let best = 0, edge = false;
        for (let d = 1; d <= R; d++) {
          const nx = xx + dx * d, ny = yy + dy * d;
          if (nx < 0 || ny < 0 || nx >= bw || ny >= bh) break;
          if (!edge && face(nx, ny)) continue;
          edge = true;
          const k = (ny * bw + nx) * 4, lb = lum(after[k], after[k + 1], after[k + 2]);
          best = Math.max(best, (Math.max(li, lb) + 0.05) / (Math.min(li, lb) + 0.05));
        }
        if (edge) { all++; if (best < 2) low++; }
      }
    }
    const share = faces > 0.7 * bw * bh ? 100 : all >= 20 ? Math.round((100 * low) / all) : 0;
    if (share >= 50) found.push({ kind: 'contrast', run: st.run, share });
  }
  P.fillText = watch(P.fillText, false);
  P.strokeText = watch(P.strokeText, true);
  window.textCheck = (frame) => {
    frameStart = calls.length; found = []; window.renderFrame(frame);
    if (calls.length > frameStart) settle(calls[calls.length - 1].stack);
    const out = new Map();                       // one finding per line pair (overlap) or line (contrast), the worst kept
    for (const f of found) {
      const r = f.kind === 'overlap' ? { kind: 'overlap', a: f.a.label, b: f.b.label, px: f.px } : { kind: 'contrast', s: f.run.label, share: f.share };
      if (r.kind === 'overlap' && r.a === r.b) continue;
      const key = r.kind === 'overlap' ? [r.a, r.b].sort().join('\u0000') : 'c\u0000' + r.s, old = out.get(key);
      if (!old || (r.px ?? r.share) > (old.px ?? old.share)) out.set(key, r);
    }
    return [...out.values()];
  };
}

// Preview in a normal browser: click renders the soundtrack offline and plays picture and sound together.
// The audio clock picks the frame; nothing is fed back into the render.
if (!q.get('capture')) {
  let frame = 0, playing = false, audio = null, src = null, t0 = 0, offset = 0;
  const hud = document.getElementById('hud');
  const stop = () => { if (src) { src.stop(); src = null; } playing = false; };
  const play = async () => {
    audio ??= new AudioContext();
    const buf = await window.renderAudio();
    src = audio.createBufferSource(); src.buffer = buf; src.connect(audio.destination);
    offset = frame / FPS; t0 = audio.currentTime; src.start(0, offset); playing = true;
    src.onended = () => { if (playing) { playing = false; frame = 0; } };
  };
  addEventListener('click', () => (playing ? stop() : play()));
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') playing ? stop() : play();
    if (e.code === 'ArrowRight') { stop(); frame = Math.min(FRAMES - 1, frame + 1); }
    if (e.code === 'ArrowLeft') { stop(); frame = Math.max(0, frame - 1); }
  });
  const loop = () => {
    if (playing) frame = Math.min(FRAMES - 1, Math.floor((audio.currentTime - t0 + offset) * FPS));
    window.renderFrame(frame);
    hud.textContent = `${TITLE} · frame ${frame}/${FRAMES - 1} · t=${(frame / FPS).toFixed(2)}s · ${playing ? 'playing' : 'click to play with sound'}`;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
