<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>하이파이브 · motion-webtoon starter</title>
<link rel="stylesheet" href="fonts.css">
</head>
<body>
<script src="lib.js"></script>
<script>(function (run) { Pilot.run = c => { let go = false; const d = c.draw, q = new URLSearchParams(location.search), P = q.has("t") ? +q.get("t") : 1.5; c = Object.assign({}, c, { draw: (x, t) => { if (t > 0) go = true; d(x, go ? t : Math.min(P, c.dur - .01)); } }); if (!c.audio) c.audio = "highfive.m4a"; return run(c); }; })(Pilot.run);</script>
<script src="script-highfive.js"></script>
<script src="webtoon.js"></script>
<script src="manga.js"></script>
<script src="cast-rig.js"></script>
<script src="starter-cast.js"></script>
<script>
/* motion-webtoon starter 「하이파이브」 (10 s, portrait 1080×1920): one gag in three panels on one vertical strip the camera reads
   downward — set-up → fake-epic slow motion (register switch) → payoff (SD, deadpan, sweat). The cast is starter-cast.js (two people as
   data on lib/cast-rig.js), words and beats are script-highfive.js. Finish: the mono manga print (Manga.grade) with ONE accent colour.
   ?grade=0 shows the raw frame before the print pass · ?look=riso draws the same people in flat riso colour (no grade) · ?bones=1
   overlays the solved joints. A new film starts from a copy of this folder: python3 <skill>/scripts/new-film.py my-film. */
const WT = Webtoon, C = Cast, MG = Manga, S = window.SCRIPT, B = S.beat, Ln = S.lines, { clamp, lerp, ss, eo, eio } = Pilot, TAU = Math.PI * 2;
const Q = new URLSearchParams(location.search), RISO = Q.get('look') === 'riso', GRADE = !RISO && Q.get('grade') !== '0';
if (RISO) C.style = 'riso';
const INK = MG.C.ink, PAPER = MG.C.paper, PAPERL = MG.C.paperL, BW = 9;
const tone = (c, cov, x, y, w, h) => { c.fillStyle = MG.tone(c, cov); c.fillRect(x, y, w, h); };
const balloon = (c, t, [at, out, text], kind, x, y, o = {}) => WT.balloon(c, t, Object.assign({ kind, text, x, y, at, out }, o));
const tag = (c, t, text, at, x, y, size = 44) => { if (t >= at) MG.tag(c, text, x, y, { size, at, t }); };

// ================================================================ 1 · set-up: 준호 is done, 민지 offers a high five
function pMeet(c, t, P) {
  // flat paper, solid ink, deliberate tone only — the grade turns soft washes into busy dots
  c.fillStyle = PAPER; c.fillRect(0, 0, P.w, P.h); tone(c, .12, 0, 700, P.w, 230);
  c.fillStyle = PAPERL; c.fillRect(0, 930, P.w, P.h - 930); tone(c, .2, 0, 980, P.w, P.h - 980); c.fillStyle = INK; c.fillRect(0, 926, P.w, 6);
  MG.boil(t); const old = MG.figure(4);
  MG.ink(c, [[70, 130], [520, 130], [520, 420], [70, 420]], { fill: PAPERL, smooth: false, lw: 1.2 });            // whiteboard: the chart went up
  for (const [i, h] of [[0, 60], [1, 95], [2, 150], [3, 215]])   // the last bar is the ONE accent colour: the thing this gag is about
    MG.ink(c, [[120 + i * 95, 390 - h], [175 + i * 95, 390 - h], [175 + i * 95, 390], [120 + i * 95, 390]], i === 3 ? { fill: MG.C.accent, smooth: false, lw: .8 } : { fill: PAPER, tone: .34, smooth: false, lw: .8 });
  MG.taper(c, [[110, 330], [230, 290], [330, 230], [470, 160]], 2.2, 1.6);
  MG.ink(c, [[640, 120], [1010, 120], [1010, 470], [640, 470]], { fill: PAPER, tone: .3, smooth: false, lw: 1.2 });   // window
  c.fillStyle = INK; c.fillRect(820, 120, 8, 350); c.fillRect(640, 290, 370, 8);
  MG.figure(old);
  const up = eo(clamp((t - B.cheer) / .3)), offer = eo(clamp((t - B.offer) / .35));
  const talking = t > Ln.done[0] && t < Ln.done[1] - .4;
  const J = { x: 300, y: 1000, s: .95, turn: .45, expr: 'happy', mouth: talking ? 'talk' : 'grin',
    arms: { R: { to: [lerp(385, 405, up), lerp(760, 470, up)], hand: up > .5 ? 'fist' : 'open', ang: lerp(1.5, -1.3, up) } } };
  const M = { x: 770, y: 1000, s: .9, turn: -.45, expr: 'smile', mouth: t > B.offer && t < Ln.offer[1] - .3 ? 'talk' : 'smile', hairEv: [B.offer + .1],
    arms: { L: { to: [lerp(705, 690, offer), lerp(760, 420, offer)], hand: offer > .4 ? 'paper' : 'open', ang: lerp(1.6, -1.5, offer) } } };
  c.fillStyle = MG.tone(c, .45); for (const p of [J, M]) { c.beginPath(); c.ellipse(p.x, p.y + 4, 120 * p.s, 14, 0, 0, TAU); c.fill(); }
  P.J = C.draw(c, t, 'junho', J); P.M = C.draw(c, t, 'minji', M);
}
function oMeet(c, t, P) {
  if (P.J) balloon(c, t, Ln.done, 'talk', 290, 250, { tail: P.J.mouth, maxW: 380 });
  if (P.M) balloon(c, t, Ln.offer, 'shout', 790, 250, { tail: P.M.mouth, size: 58 });
}
// ================================================================ 2 · the fake-epic approach: black panel, white focus wedges, two big hands
function pEpic(c, t, P) {
  c.fillStyle = INK; c.fillRect(0, 0, P.w, P.h);
  MG.focus(c, t, { x: 0, y: 0, w: P.w, h: P.h, cx: 540, cy: 430, rx: 330, ry: 230, n: 90, wMax: 28, col: PAPERL, seed: 7, inner: .6 });
  const k = eio(clamp((t - B.approach[0]) / (B.approach[1] - B.approach[0])));
  // big arms ENTER FROM THE FRAME EDGE: each shoulder sits off the panel (bottom corners) and the arm is solved on the 3D IK with fixed
  // bones (Cast.reachArm) — the wrist targets stay inside l1 + l2 of the shoulder, so the elbows stay bent all the way in
  C.reachArm(c, t, 'junho', [-130, 900], [lerp(110, 330, k), lerp(650, 470, k)], { sz: 104, pose: 'paper', aim: -.8, flip: 1, pole: [0, 1, .4] });
  C.reachArm(c, t, 'minji', [1180, 870], [lerp(980, 735, k), lerp(640, 455, k)], { sz: 96, pose: 'paper', aim: -Math.PI + .8, flip: -1, pole: [0, 1, .4] });
}
function oEpic(c, t, P) { tag(c, t, S.tag.epic, B.epic + .15, 54, 60, 46); }
const epicCam = (t, P) => WT.mixCam(WT.punch(t, B.epic, { z0: 1.18, A: 10 }), WT.kenBurns(t, B.epic + .2, B.approach[1], 1.08, 540, 440));
// ================================================================ 3 · the payoff: they swing right past each other (SD), deadpan, sweat
function pMiss(c, t, P) {
  c.fillStyle = PAPERL; c.fillRect(0, 0, P.w, P.h); tone(c, .14, 0, 820, P.w, P.h - 820); c.fillStyle = INK; c.fillRect(0, 816, P.w, 6);
  const u = eo(clamp((t - B.swish) / .32)), frozen = t > B.swish + .5;
  if (t > B.swish - .05 && t < B.swish + .7) MG.speed(c, t, { x: 0, y: 140, w: P.w, h: 560, ang: 0, n: 18, wMax: 9, seed: 4, v: 2200, gap: { cx: 540, cy: 520, rx: 260, ry: 200 } });
  const jx = lerp(470, 780, u), mx = lerp(610, 300, u), ex = frozen ? 'blank' : 'happy';
  const J = { x: jx, y: 800, s: 1.9, turn: .55, pose: 'stand', expr: ex, sway: frozen ? false : 1 };
  const M = { x: mx, y: 800, s: 1.8, turn: -.55, pose: 'stand', expr: ex, sway: frozen ? false : 1 };
  // the high-five hand is still out, now on the far side. Targets come from the solved shoulder and stay inside the SD arm's reach
  // (~64 rig units × s): a target out of reach gives a straight stick of an arm.
  const out = (who, o, k, side) => { const sh = C.sdGeom(t, who, o).shoulders[k]; return { to: [sh[0] + side * 95, sh[1] - 55], hand: 'mitt' }; };
  J.arms = { R: out('junho', J, 'R', 1) }; M.arms = { L: out('minji', M, 'L', -1) };
  P.J = C.sd(c, t, 'junho', J); P.M = C.sd(c, t, 'minji', M);
  for (const G of [P.J, P.M]) WT.emote(c, t, 'sweat', G.head, { at: B.sweat });
}
function oMiss(c, t, P) {
  if (t >= B.swish && t < B.swish + 1.1) MG.sfx(c, t, { text: S.sfx.swish, x: 540, y: 190, size: 170, at: B.swish, rot: -.08, seed: 3 });
  balloon(c, t, Ln.dots, 'talk', 540, 150, { size: 52 });
  tag(c, t, S.tag.miss, B.tag, 640, 880, 44);
}

// ================================================================ the strip (gutters = time) and the camera reading it downward
const STRIP = WT.strip({
  top: 300, side: 48, bottom: 800,
  panels: [
    { id: 'meet', h: 1110, lw: BW, draw: pMeet, over: oMeet, overCam: false, cam: (t, P) => WT.kenBurns(t, 0, 3.2, 1.04, 540, 600) },
    { id: 'epic', gap: 'action', h: 880, border: 'bleed', bg: INK, cut: [0, 40, 0, -40], draw: pEpic, over: oEpic, overCam: false, cam: epicCam },
    { id: 'miss', gap: 'action', h: 1000, lw: BW, draw: pMiss, over: oMiss, overCam: false },
  ],
});
let prev = 0;
const CAM = WT.camera(STRIP, S.stops.map(([panel, a, l], i) => { const st = { panel, hold: l - a }; if (i) st.glide = a - prev; prev = l; return st; }));

function draw(ctx, t) {
  WT.begin(ctx, INK);
  WT.drawStrip(ctx, t, STRIP, CAM.y(t), { shake: WT.shake(t, B.epic, 10) });
  if (GRADE) MG.grade(ctx);          // the mono manga print; the accent colour survives it
  WT.fade(ctx, t, S.DUR, .4, .4);
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: WT.FONTS, draw });
</script>
</body>
</html>
