:root{color-scheme:light;--paper:oklch(94.9% .007 275);--ink:oklch(51.5% .238 269);--muted:oklch(43% .085 273);--rule:oklch(66% .17 269 / .45);--wash:oklch(90% .04 269);--grid:48px;--grid-major:240px;--grid-line:oklch(64% .17 269 / .14);--grid-bold:oklch(59% .20 269 / .19)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background-color:var(--paper);background-image:linear-gradient(var(--grid-bold) 1px,transparent 1px),linear-gradient(90deg,var(--grid-bold) 1px,transparent 1px),linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:var(--grid-major) var(--grid-major),var(--grid-major) var(--grid-major),var(--grid) var(--grid),var(--grid) var(--grid);color:var(--ink);font-family:"Bahnschrift","DIN Alternate","Helvetica Neue",sans-serif;-webkit-tap-highlight-color:transparent}
main{position:absolute;inset:0 0 158px;touch-action:manipulation}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#model{outline:none;touch-action:none;cursor:grab}#model:focus-visible{outline:1px dashed var(--muted);outline-offset:-20px}#model[data-hit="true"]{cursor:pointer}#model[data-dragging="true"]{cursor:grabbing}
.corner{position:absolute;width:18px;height:18px;pointer-events:none;opacity:.6}.tl{top:36px;left:36px;border-left:1px solid var(--ink);border-top:1px solid var(--ink)}.tr{top:36px;right:36px;border-right:1px solid var(--ink);border-top:1px solid var(--ink)}
footer{position:absolute;bottom:max(34px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 48px))}.controls{display:flex;align-items:center;justify-content:space-between;gap:24px;border-top:1px solid var(--ink);padding-top:23px}h1{font-size:16px;line-height:1.5;font-weight:600;letter-spacing:.09em;margin:0;padding:11px 17px;white-space:nowrap;background:var(--ink);color:white}h1 span{color:inherit;opacity:.8}
button{font:inherit;font-size:12px;font-weight:600;letter-spacing:.13em;min-height:48px;min-width:150px;padding:0 22px;border:1px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:20px;cursor:pointer;touch-action:manipulation;transition:background .2s,color .2s}button:hover{background:var(--ink);color:white}button:focus-visible{outline:2px solid var(--ink);outline-offset:5px}button[aria-disabled="true"]{cursor:wait;background:var(--wash);color:var(--ink);border-color:var(--ink)}button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.4;transition:transform .5s}button[aria-expanded="true"] svg{transform:rotate(180deg)}.hint{margin:22px 0 0;text-align:center;font-family:"Consolas","Courier New",monospace;font-size:10px;letter-spacing:.12em;line-height:1.5;color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}#unavailable{position:absolute;inset:40%;width:80%;left:10%;text-align:center;font-size:14px;line-height:1.7}#unavailable[hidden]{display:none}

canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&![0,1,2].includes(e.button))return;const mode=e.shiftKey||e.button===1||e.button===2?'pan':viewMode;if(!pointers.size)gestureUsed=false;pointers.set(e.pointerId,localPointer(e));canvas.setPointerCapture(e.pointerId);if(pointers.size>1)gestureUsed=true;beginGesture(mode);});
canvas.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 pointers.set(e.pointerId,localPointer(e));const current=gestureMetrics(),delta=current.center.map((v,i)=>v-gesture.center[i]);
 if(pointers.size>1&&gesture.distance>0){gestureUsed=true;const scale=Math.max(.55,Math.min(3.2,gesture.scale*current.distance/gesture.distance)),ratio=scale/gesture.scale;setView(scale,current.center.map((v,i)=>v-(gesture.center[i]-gesture.origin[i])*ratio));}
 else if(gestureUsed||Math.hypot(...delta)>4){gestureUsed=true;if(gesture.mode==='rotate'){const speed=PI/Math.max(280,Math.min(width,height));setOrbit(gesture.yaw-delta[0]*speed,gesture.pitch+delta[1]*speed);}else setView(gesture.scale,gesture.origin.map((v,i)=>v+delta[i]));}
 canvas.dataset.dragging=String(gestureUsed);
});
function endGesture(e){if(!pointers.has(e.pointerId))return;const continuingPinch=pointers.size>1;pointers.delete(e.pointerId);if(gestureUsed||e.type==='pointercancel')suppressClickUntil=performance.now()+400;beginGesture(continuingPinch?'pan':gesture?.mode);if(!pointers.size)canvas.dataset.dragging='false';}
canvas.addEventListener('pointerup',endGesture);canvas.addEventListener('pointercancel',endGesture);canvas.addEventListener('lostpointercapture',endGesture);
canvas.addEventListener('wheel',e=>{e.preventDefault();const unit=e.deltaMode===1?16:e.deltaMode===2?height:1;zoomAt(Math.exp(-e.deltaY*unit*.0015),localPointer(e));},{passive:false});
canvas.addEventListener('pointerleave',()=>{canvas.dataset.hit='false';});
canvas.addEventListener('click',e=>{if(performance.now()<suppressClickUntil)return;if(!busy&&hit(...localPointer(e)))toggle();});
document.addEventListener('keydown',e=>{if(e.target===resetViewButton||e.target===rotateButton||e.target===panButton)return;if((e.code==='Space'||e.code==='Enter')&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();if(!e.repeat)toggle();}});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();cancelAnimationFrame(raf);busy=false;button.disabled=true;document.getElementById('unavailable').hidden=false;});
canvas.addEventListener('webglcontextrestored',()=>location.reload());
window.addEventListener('resize',resize);new ResizeObserver(resize).observe(stage);resize();
})();
