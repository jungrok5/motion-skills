<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanok Alley</title>
<!-- parallax-facade worked example: "Hanok Alley" (ink finish, 8 s loop). Brief: BRIEF.md.
     Flat: a row of tiled hanok houses, a wooden gate in the gap, a broadcast tower on a hill just over the roofline —
     one painted strip. Reveal: the gate is 26 m up a narrow alley of persimmon trees and wires, the tower is on a hill
     150 m away, and a whole tiled neighbourhood fills the space between. -->
<script type="importmap">{ "imports": { "three": "../lib/three.module.min.js", "facade/": "../lib/" } }</script>
<body>
<script type="module">
import { Film } from "facade/facade.js";
import * as K from "facade/kit.js";

const F = new Film({
  facade: { x: 0, y: 4.4, h: 9.5 },
  focus: { x: 1.5, y: 3.6 },
  eye: 5.2,                                    // mid-roof of the front hanok: everything behind hides under it
  finish: "ink",
  look: { sky: "#2a44c8", shade: "#b6b4d8", ink: { color: "#1d1c2c", px: 2.2 } },
  sun: { az: -35, el: 38 },
  audio: "audio/loop.mp3",
  sound: { mood: "lofi", key: "D", chords: ["Dmaj7", "Bm7", "Gmaj7", "A7"], ambience: ["birds", "wind", "bell"], whoosh: "air" },
});
K.ground(F, { color: "#d8d6e0" });

// palette (BRIEF.md): plaster, stone, wood, charcoal tile, paper windows; persimmon orange is the one warm accent
const P = { wall: "#f3efe6", stone: "#b3afb8", wood: "#7a4b2e", tile: "#626780", paper: "#efe2c4", cafe: "#e9ecf5" };
const hanok = (r, o = {}) => ({
  h: o.h ?? 3.4 + r() * 0.5, d: o.d ?? 7, wall: P.wall, trim: P.wood,
  base: { h: 0.9, color: P.stone },
  roof: { kind: "hip", color: P.tile, h: 1.9 + r() * 0.4, over: 0.9, curl: 1, under: P.wood },
  win: o.win === false ? null : { rows: 1, cols: o.cols ?? 2, y0: 1.3, w: 1.1, h: 1.0, color: P.paper, frame: P.wood, mullion: true, faces: o.faces ?? ["front"] },
  door: o.door ? { w: 1.2, h: 2.2, color: P.wood, x: o.door } : null,
});

// 1 · the front row: hanok with one modern cafe, a gap at the alley mouth
F.part((B) => {
  K.road(B, { z0: 1.0, z1: 36, walk: { z0: 0, z1: 1.0, color: "#cfccd9" }, color: "#a6a7bb" });
  K.row(B, {
    x0: -60, x1: 60, z: 0, seed: 12, gaps: [[-0.6, 3.6]],
    width: (r) => 5.2 + r() * 1.6,
    make: (r, i, x) => Math.abs(x - 8) < 3
      ? { h: 6.0, d: 8, wall: P.cafe, trim: "#ffffff", win: { rows: 1, cols: 2, y0: 3.5, color: "#4f6ad0", frame: "#ffffff" }, shop: { h: 2.6, w: 4.4, glass: "#4f6ad0", frame: "#ffffff" }, awning: { color: "#4f6ad0", y: 2.9, w: 4.6 }, roof: { kind: "flat", color: "#d9dcea" } }
      : hanok(r, { door: r() < 0.5 ? 1.6 : -1.6, faces: ["front", "left", "right"] }),
  });
  K.tree(B, 4.6, 0.6, { kind: "round", h: 5.6, r: 1.9, color: "#5a9e4b", dark: "#43803b", seed: 3 });
  for (let i = 0; i < 9; i++) B.ball(4.6 + Math.cos(i * 2.4) * 1.5, 4.5 + Math.sin(i * 1.7) * 0.9, 0.6 + Math.sin(i) * 1.3, 0.18, "#f08a2a", { ink: false });
  const a = K.pole(B, -1.6, 0.4, { h: 7.2 }), b = K.pole(B, 15.5, 0.4, { h: 7.2 }), c = K.pole(B, -18, 0.4, { h: 7.2 });
  K.wire(B, c, a, { sag: 0.5 }); K.wire(B, a, b, { sag: 0.6 });
  K.wire(B, [a[0], a[1] - 0.3, a[2]], [b[0], b[1] - 0.3, b[2]], { sag: 0.8 });
  K.bush(B, -6, 0.5, { w: 1.8, planter: { h: 0.45, color: P.stone }, color: "#5a9e4b" });
}, { name: "front" });

// 2 · the alley behind the gap: stone paving, houses facing it, persimmon trees, poles and lantern wires
F.part((B) => {
  B.box(1.5, -0.03, -14, 4.0, 0.05, 28, "#c9c6d2", { ink: false });
  for (let z = -3; z > -26; z -= 2.2) B.box(1.5, 0.0, z, 3.8, 0.04, 0.08, "#b6b2c2", { ink: false });
  // B.at(x, z, 90) turns local +x toward world −z: the left row runs x 0 → 24 back up the alley, facing +x
  K.row(B.at(-0.8, -2, 90), { x0: 0, x1: 24, z: 0, seed: 31, width: () => 7, make: (r) => hanok(r, { d: 6, cols: 2, door: -1.5 }) });
  K.row(B.at(3.8, -2, -90), { x0: -24, x1: 0, z: 0, seed: 32, width: () => 7, make: (r) => hanok(r, { d: 6, cols: 2, door: 1.5 }) });
  for (const z of [-7, -15, -22]) {
    K.tree(B, 0.2, z, { h: 4.8, r: 1.5, color: "#5a9e4b", dark: "#43803b", seed: z });
    for (let i = 0; i < 6; i++) B.ball(0.2 + Math.cos(i * 2.1) * 1.1, 3.9 + Math.sin(i * 1.3) * 0.7, z + Math.sin(i * 0.7) * 1.1, 0.16, "#f08a2a", { ink: false });
  }
  const poles = [-4, -12, -20].map((z) => K.pole(B, 3.3, z, { h: 6.4, cross: 1.0 }));
  for (let i = 0; i < poles.length - 1; i++) K.wire(B, poles[i], poles[i + 1], { sag: 0.4 });
  K.wire(B, [-0.6, 5.2, -9], [3.3, 5.6, -12], { sag: 0.35, n: 8, lanterns: { every: 2, color: "#e8432f", size: 0.4 } });
  K.wire(B, [-0.6, 5.2, -17], [3.3, 5.6, -20], { sag: 0.35, n: 8, lanterns: { every: 2, color: "#e8432f", size: 0.4 } });
}, { name: "alley" });

// 3 · the plug: a wooden gate at the top of the alley fills the gap from the street up to the roofline
F.part((B) => {
  const G = B.at(1.5, -26);
  G.box(0, 0, -1, 8, 4.2, 2, P.wall); G.box(0, 0, -1, 8.1, 0.9, 2.1, P.stone);
  G.box(0, 0, 0.02, 2.8, 3.3, 0.16, P.wood); G.box(0, 0, 0.12, 0.08, 3.3, 0.06, "#4a2e1c");
  for (const s of [-1.6, 1.6]) G.box(s, 0, 0.05, 0.35, 3.6, 0.35, P.wood);
  K.tower(G.at(0, -1), { tiers: [{ shape: "hip", w: 9.4, d: 3.6, h: 2.2, color: P.tile, curl: 1.2, over: 0.6 }], y: 4.2 });
}, { name: "gate" });

// 4 · the landmark: a broadcast tower on a wooded hill, 150 m back, sized to clear the roofline only just
F.part((B) => {
  const T = B.at(1.0, -150);
  T.ball(0, -20, 0, 32, "#4f8a52", { s: [1.6, 0.78, 0.9] });
  for (let i = 0; i < 16; i++) { const a = i * 0.83, r = 10 + (i % 4) * 8; K.tree(T, Math.cos(a) * r, Math.sin(a) * r * 0.45 - 6, { kind: "cone", h: 3.2, color: "#3d7442", dark: "#33643a", seed: i }); }
}, { name: "hill" });
const tower = F.part((B) => {
  K.tower(B.at(1.0, -150, 0, 4.6), {
    tiers: [
      { shape: "cyl", w: 1.3, top: 0.9, h: 5.6, color: "#efeef4", seg: 12, band: { color: "#d8d6e2", h: 0.3 } },
      { shape: "cyl", w: 2.8, top: 2.8, h: 1.1, color: "#e2e0ec", seg: 16, win: { rows: 1, cols: 3, color: "#5b6ed6" } },
      { shape: "cyl", w: 2.0, top: 1.4, h: 0.7, color: "#efeef4", seg: 16 },
    ],
    spire: { h: 3.0, r: 0.2, color: "#e8483a" },
  });
}, { name: "tower" });
F.landmark(tower, "broadcast tower");

// 5 · the neighbourhood between: tiled roofs to the hill, every one under the flat roofline (F.hide)
F.part((B) => {
  K.field(B, {
    x0: -90, x1: 90, z0: -140, z1: -9, cell: [7.5, 8], street: 2.0, seed: 41,
    avoid: [[-1.2, 4.2, -30, 0], [-6, 9, -32, -24]],
    make: (r, c) => {
      const roofH = 1.9, h = Math.max(2.8, Math.min(3.4 + r() * 0.8, F.hide(c.z - 1, 5.2) - roofH - 0.4));
      return { ...hanok(r, { h, d: c.d, faces: ["front", "left", "right"], cols: 2 }), roof: { kind: "hip", color: P.tile, h: roofH, over: 0.8, curl: c.depth < 0.4 ? 1 : 0, under: P.wood } };
    },
  });
  for (const [x, y, z, w] of [[-26, 15, -240, 20], [30, 18, -250, 24], [-60, 13, -230, 16]]) K.cloud(B, x, y, z, { w, color: "#f4f3fb" });
}, { name: "town" });

// 6 · moving things
K.traffic(F, { lanes: [{ z: 2.4, dir: 1, n: 4 }, { z: 4.4, dir: -1, n: 4 }], x0: -36, x1: 36, colors: ["#f2f0f6", "#626780", "#e8505b", "#8fa6d9", "#f2c94c"], size: 0.55 });
K.birds(F, { n: 6, y: 15, dy: 5, z: -90, x0: -50, x1: 50, color: "#22243a", size: 1.0 });

// 7 · beats: the second flat comes after the bird's-eye, so the loop shows the trick twice from two sides
// a low town: the side views stand further back and lower than the defaults, so they see facades, not roof tops
const side = { zoom: 1.3, pitch: 18 };
F.beats(["flat", "deep", "high", "rise", "flat", { view: "right", ...side }, "deep", { view: "left", ...side }, "flat"], { beat: 1.0, move: 0.42 });
F.start();
</script>
