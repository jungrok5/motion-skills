/* ten-second-scene · brush.js — one painted stroke for Canvas 2D, built the way the source describes them:
   every stroke has its own size and colour, a rounded head, a tail that thins out, a few bristle streaks, and a lit

    // key: headlights from up the road as the bus nears (cool), the ad panel behind (warm rim), ambient blue
    const light = v3.norm([1, .35 + .2 * (1 - busNear), .25]);
    const pc = P(J.chest), ad = P([3.6, KERB + 1.4, -2.4]), dx = ad.x - pc.x, dy = ad.y - pc.y, dl = Math.hypot(dx, dy) || 1;
    const nearDoor = a.spec.id === 'student' ? op * clamp(1 - Math.hypot(J.pelvis[0] - (BUS.xs + .95), J.pelvis[2] + .3) / 2.5) : 0;
    const rimCol = nearDoor > .2 ? css(C.door, .8) : css(C.ad, .7), rimS = nearDoor > .2 ? [1, .1] : [dx / dl, dy / dl];
    Body.draw2d(ctx, p, cam, { light, lightColor: busNear > .3 ? mix('#ffd9b0', C.head, busNear) : '#ffc895', ambient: .42 + .2 * busNear + .3 * nearDoor, shadow: .32, rim: rimCol, rimScreen: rimS, rimSide: dx > 0 ? 1 : -1, fog: ['#1d2340', .1] });
    // breath: a vapour puff on each out-breath, from the mouth, drifting and fading
    const s = a.spec, ph = ((t / s.breathP + s.phase) % 1 + 1) % 1;
    if (ph > .55) {
      const k = (ph - .55) / .45, hf = J.headFrame, m = v3.add(J.head, v3.add(v3.mul(hf.F, .07 + k * .28), [k * .1, -.03 + k * .06, 0]));
      const q = P(m); const r = (.05 + k * .16) * q.s; const gr = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, r);
      gr.addColorStop(0, css('#c8d2f0', .32 * (1 - k))); gr.addColorStop(1, css('#c8d2f0', 0)); ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, PI * 2); ctx.fill();
    }
    if (s.id === 'phone') { const g = phoneGlow(t); if (g > .01) { const h = v3.lerp(J.handL, J.handR, .5), q = P(h); ctx.fillStyle = css('#d9ecff', .9 * g); ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(-.3); ctx.fillRect(-.035 * q.s, -.06 * q.s, .07 * q.s, .12 * q.s); ctx.restore(); ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(v3.lerp(h, J.head, .55), .35, '#9cc4ff', .35 * g); ctx.restore(); } }
  }
  return order;
}

scene({
  title: '첫차', W, H, duration: D, fps: 30, card: { title: 'THE FIRST BUS', sub: 'five past five, the first snow', credit: 'drawn in code · ten seconds · one html file' }, renderer: 'canvas2d',
  setup() { buildWorld(); simPitch(); buildCast(); },
  frame(t, api) {
    ctx = api.ctx; cam = camAt(t);
    ctx.fillStyle = '#0d1226'; ctx.fillRect(0, 0, W, H);
    drawSky(t); drawCity(t);
    for (const s of slabs) drawSlab(s, t);
    for (const sh of shops) drawShop(sh, t);
    for (const tr of trees) if (tr.z > 0) drawTree(tr, t);
    drawGround(t);
    const lightList = lamps.map(L => ({ p: L.arm, c: L.c, a: .8 * L.k, w: .5 }));
    const bx = busX(t);
    if (bx < 120) lightList.push(...[[BUS.z0 + .35], [BUS.z1 - .35]].map(([z]) => ({ p: [bx - .03, .82, z], c: C.head, a: 1.2, w: .7, len: 1.4 })));
    drawReflections(t, lightList);
    for (const L of lamps.filter(L => L.p[2] > 0)) drawLampPost(L, t);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; for (const L of lamps) pool([L.arm[0], L.arm[2] < 0 ? KERB : 0, L.arm[2] < 0 ? -1.2 : L.arm[2]], 6.5, 4.6, L.c, .15 * L.k, .3); ctx.restore();
    const bus = drawBus(t);
    for (const tr of trees) if (tr.z < 0) drawTree(tr, t);
    for (const L of lamps.filter(L => L.p[2] < 0)) drawLampPost(L, t);
    drawShelter(t);
    // the ad panel lights the pavement and the people's backs
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; pool([2.9, KERB, -2.4], 2.4, 1.7, C.ad, .18); const st = shops.find(s => s.lit); pool([(st.x0 + st.x1) / 2, KERB, st.z + 2.5], 4, 3.2, '#ffd9a2', .16); ctx.restore();
    drawPeople(t, bus);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; for (const L of lamps) drawLampGlow(L, t); ctx.restore();
    drawBusLight(t, bus);
    drawSnow(t, bus);
    // vignette + grain
    const vg = ctx.createRadialGradient(W / 2, H * .5, H * .3, W / 2, H * .5, H * .78); vg.addColorStop(0, 'rgba(5,6,15,0)'); vg.addColorStop(1, 'rgba(5,6,15,.55)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    grain(ctx, W, H, t, .07);
  },
  probe(t) { const c = camAt(t); return { figures: actors.map(a => a.probe(t, c)) }; },
  info() { return { figures: actors.length, flakes: flakes.length, windows: slabs.reduce((a, s) => a + s.win.length, 0), branches: trees.reduce((a, t) => a + t.segs.length, 0) }; },
  cast() { return cast; },
});
