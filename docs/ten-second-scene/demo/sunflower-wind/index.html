/* ten-second-scene · strokes-gl.js — tens of thousands of painted strokes in WebGL2, one instanced draw.

layout(location=2) in vec4 a_shape;       // width (px), bend (-1..1), taper, seed
layout(location=3) in vec4 a_col;         // rgb, alpha

  for (let i = 0; i < 60; i++) add({ x: hx + r.range(-14, 14), y: hy + r.range(-1, 8), angle: r.normal(0, .1), len: r.range(5, 8), width: r.range(3, 4), color: mix('#efe2c8', '#c8b9a6', r() * .4 + (r() < .3 ? .5 : 0)), anim: [0, 0, 0, 0] });
  for (let i = 0; i < 70; i++) { const u = r(); add({ x: hx - 16 + u * 32, y: hy - 3 - (1 - Math.abs(u - .5) * 2) * 7 + r.range(-1, 1), angle: (u < .5 ? -.42 : .42) + r.normal(0, .08), len: r.range(5, 8), width: r.range(2.5, 3.5), color: mix(C.roof, '#e07a4f', r() * .5), anim: [0, 0, 0, 0] }); }
  // 6. the far field: rows converging, olive with dots of yellow heads, denser yellow nearer
  for (let i = 0; i < 16000; i++) {
    const y = YH + 4 + Math.pow(r(), 1.7) * 240, d = depthAt(y), x = r.range(-20, W + 20), X = (x - W / 2) * d / FOC;
    const rowPhase = Math.sin(X / .75 * PI * 2) * .5 + .5, s = clamp(FOC * .14 / d, 1.6, 9);
    const yellow = r() < (.25 + .35 * rowPhase) * smooth(15, 40, d) + .1;
    const c = yellow ? mix(C.petal, C.petalLit, r() * .6 + (x < 450 ? .3 : 0)) : mix(mix(C.leafShade, C.leafLit, r() * .7 + rowPhase * .2), '#8f9cbd', clamp((d - 60) / 260) * .5);
    const ang = Math.atan2(y - YH + 40, x - W / 2) * .2 + r.normal(0, .3);
    add({ x, y, angle: yellow ? r() * PI : ang, len: s * (yellow ? 1.2 : r.range(1.8, 3)), width: s * (yellow ? 1 : .8), color: tweak(c, r.normal(0, .03)), alpha: .95, anim: [2, r(), .04, yellow ? 0 : 1] });
  }
  // 7. the path: a worn track curving into the field (world → screen), ruts and grass between
  const pathX = d => 1.3 - .1 * d + .0006 * d * d;
  for (let i = 0; i < 3800; i++) {
    const d = 3.4 + Math.pow(r(), 2.4) * 160, off = r.range(-.48, .48), X = pathX(d) + off, [x, y] = scr(d, X);
    if (y > H + 30) continue;
    const s = clamp(FOC * .07 / d, 1.5, 16), rut = Math.abs(Math.abs(off) - .26) < .07;
    const [xa, ya] = scr(d + 1, pathX(d + 1) + off), ang = Math.atan2(ya - y, xa - x);
    const c = rut ? mix('#9c7650', '#7e5d40', r()) : mix(C.path, '#e3c49a', r() * .6 + (X < pathX(d) ? .15 : 0));
    add({ x, y, angle: ang + r.normal(0, .15), len: s * r.range(1.8, 3.4), width: s * .7, color: tweak(mix(c, '#b9a3a8', clamp(d / 160) * .35), r.normal(0, .03)), alpha: .95, anim: [0, 0, 0, 0] });
  }
  // 9. near foliage floor around the bottom: big leaves without heads (the field's mass between near plants)
  for (let i = 0; i < 2600; i++) {
    const y = r.range(1500, H + 40), d = depthAt(y), x = r.range(-30, W + 30), X = (x - W / 2) * d / FOC;
    if (Math.abs(X - pathX(d)) < .5) continue;
    const s = r.range(14, 36), lit = clamp(.42 - (x - 300) / 1300 + r.normal(0, .2)), yy = y - r.range(0, 60), ang = r.normal(-PI / 2, .9), ph = r();
    const base = tweak(mix('#1d3a24', C.leafLit, lit * .6), r.normal(0, .04), 1, r.normal(0, .05));
    add({ x, y: yy, angle: ang, len: s * r.range(1.4, 2.2), width: s, bend: r.range(-.8, .8), taper: .55, color: base, alpha: .95, anim: [2, ph, .05, 0] });
    if (s > 20) add({ x, y: yy, angle: ang, len: s * 1.5, width: Math.max(1.5, s * .08), taper: .8, color: mix(base, '#d8e09a', .4), alpha: .7, anim: [2, ph, .05, 0] });
  }
  // soil between the rows: dark furrows along the rows, lighter clods on top
  for (let i = 0; i < 6500; i++) {
    const d = 3 + Math.pow(r(), 1.6) * 37, X = r.range(-d * .36 - .6, d * .36 + .6), [x, y] = scr(d, X);
    if (y > H + 20) continue;
    const rowU = ((X - .2 - d * .015) / .75 % 1 + 1) % 1, furrow = Math.abs(rowU - .5) < .18;
    const s = clamp(FOC * .05 / d, 1.2, 14), [xa, ya] = scr(d + 1, X);
    const c = furrow ? mix('#3b2a1a', '#4d3621', r()) : mix('#7a5a3a', '#a07d55', r() * .8);
    add({ x, y, angle: Math.atan2(ya - y, xa - x) + r.normal(0, .3), len: s * r.range(1.5, 3), width: s * .8, color: tweak(mix(c, '#8b8a9c', clamp(d / 60) * .3), r.normal(0, .03)), alpha: .95, anim: [0, 0, 0, 0] });
  }
  // 8. sunflowers in rows (near → many strokes; far → a few) — collected first, painted far → near
  const R2 = rng(77);
  for (let row = -40; row <= 40; row++) for (let d = 2.3; d < 42; d += .42 + R2() * .12) {
    const X = row * .75 + .2 + R2.normal(0, .07) + d * .015, half = d * .33 + .6;

    if (R2() < .06) continue;
    const hh = R2.range(1.35, 1.95), rad = R2.range(.11, .17) * (hh / 1.7);
    flowers.push({ d, X, hh, rad, seed: R2() * 1000, yaw: -.5 + R2.normal(0, .32), pitch: R2.range(.15, .75), tilt: R2.normal(0, .18), id: 0 });
  }
  flowers.sort((a, b) => b.d - a.d); flowers.forEach((f, i) => f.id = i); NF = flowers.length;
  for (const f of flowers) paintFlower(f, rng(Math.floor(f.seed * 997) + 3));
  // 10. loose petals that lift when the gust reaches them (left side first)
  for (let i = 0; i < 34; i++) { const f = flowers[Math.floor(r() * NF)]; if (f.d > 12) { i--; continue; } const [x, y] = scr(f.d, f.X, f.hh); const lift = GUST.t0 + (f.X - GUST.x0) / GUST.v - .15 + r.range(0, .4); add({ x: x + r.range(-10, 10), y: y + r.range(-10, 10), angle: r() * PI, len: FOC * .06 / f.d, width: FOC * .02 / f.d, color: mix(C.petal, C.petalLit, r()), anim: [4, lift, r() * 10, 0] }); }
}
function paintFlower(f, r) {
  const { d, X, hh, rad } = f, [cx, cy] = scr(d, X, hh), [bx, by] = scr(d, X, 0), px = FOC / d, R = rad * px;
  f.c = [cx, cy];
  const far = R < 7, mid = R < 22;
  const lit = clamp(.6 - (cx - SUN[0]) / 1500);                // nearer the sun side → more backlight
  // stem (bends with the head) and leaves
  const segs = far ? 2 : mid ? 4 : 7;
  for (let k = 0; k < segs; k++) {
    const u0 = k / segs, u1 = (k + 1) / segs, y0 = lerp(by, cy, u0), y1 = lerp(by, cy, u1);
    if (y0 < 0 && y1 < 0) continue;
    if (Math.min(y0, y1) > H + 40) continue;
    const w = Math.max(1.2, .028 * px);
    add({ x: cx + (bx - cx) * (1 - (u0 + u1) / 2) * 0, y: (y0 + y1) / 2, angle: -PI / 2 + r.normal(0, .04), len: Math.abs(y1 - y0) * 1.15, width: w, taper: .1, color: mix('#3f6b2c', '#86a24a', lit * .6 + r() * .2), anim: [5, f.id, (u0 + u1) / 2, 0] });
    if (!far && k > 0 && r() < .75) for (const side of [-1, 1]) { if (r() < .3) continue; const L = (mid ? .22 : .26) * px * r.range(.8, 1.2), yy = (y0 + y1) / 2; const ang = (side > 0 ? 0 : PI) + side * r.range(.25, .6); for (let j = 0; j < (mid ? 1 : 3); j++) add({ x: cx + Math.cos(ang) * L * .45 + r.normal(0, L * .05), y: yy + Math.sin(ang) * L * .3 + r.normal(0, L * .05), angle: ang + r.normal(0, .15), len: L * r.range(.85, 1.05), width: L * r.range(.5, .62), bend: side * r.range(.2, .6), taper: .7, color: tweak(mix('#24482a', mix(C.leafLit, '#b9c75a', side < 0 ? lit * .6 : 0), clamp(lit * .95 + (side < 0 ? .3 : -.25) + r.normal(0, .12))), r.normal(0, .03)), anim: [5, f.id, (u0 + u1) / 2, 1] }); }
  }
  // the head: a drooping disc in 3/4 view — green back on the far side, two rings of petals, a seeded disc
  const ex = R * Math.cos(f.yaw) * .95, ey = R * Math.cos(f.pitch);
  if (far) { for (let j = 0; j < 4; j++) add({ x: cx + r.normal(0, R * .4), y: cy + r.normal(0, R * .3), angle: r() * PI, len: R * 1.6, width: R * 1.1, color: mix(C.petal, C.petalLit, lit * .6 + r() * .3), anim: [3, f.id, 0, 0] }); add({ x: cx + R * .1, y: cy, angle: 0, len: R * .9, width: R * .8, color: mix(C.disc, '#7a4a22', r() * .4), anim: [3, f.id, 0, 0] }); return; }
  // sepals / back of head peeking on the side away from us
  for (let j = 0; j < (mid ? 4 : 10); j++) { const a = r.range(-.6, .6), x = cx + R * .85 * Math.cos(a), y = cy + R * .7 * Math.sin(a); add({ x, y, angle: a, len: R * .6, width: R * .26, color: mix('#3c5f2a', '#6f8c3c', r()), anim: [3, f.id, 0, 0] }); }
  const NP = mid ? 18 : 34;
  for (const ring of [0, 1]) for (let j = 0; j < NP; j++) {
    const a = (j + ring * .5 + r.normal(0, .12)) / NP * PI * 2, ca = Math.cos(a), sa = Math.sin(a);
    const L = R * r.range(.55, .8) * (ring ? .9 : 1), bx0 = cx + ca * ex * .68, by0 = cy + sa * ey * .68;
    const dirx = ca * ex, diry = sa * ey, dl = Math.hypot(dirx, diry) || 1, back = clamp(-(ca * .8 - .2));      // left side faces the sun
    const sunSide = clamp(back * .9 + lit * .5 - .2);
    let c = mix(mix('#c98a1c', C.petal, clamp(.4 + lit * .6)), mix(C.petalLit, '#fff3b8', .5), sunSide);
    if (ring === 0) c = tweak(c, -.06, 1.05);
    add({ x: bx0 + dirx / dl * L * .5, y: by0 + diry / dl * L * .5, angle: Math.atan2(diry, dirx) + r.normal(0, .1), len: L, width: R * r.range(.2, .28) * (.6 + .4 * Math.abs(sa) + .4 * Math.abs(ca) * Math.cos(f.yaw)), bend: r.range(-.5, .5), taper: .5, color: tweak(c, r.normal(0, .025)), anim: [3, f.id, 0, 0] });
  }
  // disc: dark, seeded in a sunflower spiral, a warm rim where the light grazes it
  for (let j = 0; j < (mid ? 9 : 22); j++) { const a = (j / (mid ? 9 : 22)) * PI * 2 + r() * .4, rr = j < 4 ? .08 : .3 + r() * .14; add({ x: cx + Math.cos(a) * ex * rr, y: cy + Math.sin(a) * ey * rr, angle: a + PI / 2, len: ex * (j < 4 ? .55 : .42), width: ey * (j < 4 ? .5 : .3), taper: .2, color: j < 4 ? mix(C.disc, '#24140a', .35) : mix('#5a3416', '#8a5524', clamp(.3 + (-Math.cos(a) * .4) + r() * .3)), anim: [3, f.id, 0, 0] }); }
  const NS = mid ? 26 : 90;
  for (let j = 0; j < NS; j++) { const rr = Math.sqrt(j / NS) * .5, a = j * 2.39996; const x = cx + Math.cos(a) * ex * rr, y = cy + Math.sin(a) * ey * rr; add({ x, y, angle: a, len: R * .12 + 1, width: R * .09 + .8, taper: .1, color: mix(mix('#3b2210', '#8a5a26', r() * .7), '#d39a3a', clamp((Math.cos(a) * -1) * .4 * rr * 2)), anim: [3, f.id, 0, 0] }); }
  for (let j = 0; j < (mid ? 4 : 10); j++) { const a = PI * .65 + r.range(0, .7) * PI; add({ x: cx + Math.cos(a) * ex * .48, y: cy + Math.sin(a) * ey * .48, angle: a + PI / 2, len: R * .25, width: R * .05 + .7, color: '#e0a23e', alpha: .8, anim: [3, f.id, 0, 0] }); }
}

// ---------- each head's swing: a damped spring driven by the gust at its place (heavier heads are slower) ----------
const TAB_HZ = 60;
function simulate() {
  simTab = new Float32Array(NF * (D * TAB_HZ + 2) * 3);
  const dt = 1 / 240, N = D * TAB_HZ + 2;
  flowers.forEach((f, i) => {
    const w = PI * 2 * .62 * Math.sqrt(.14 / f.rad), z = .3, G = .15;
    let th = 0, v = 0, k = 0;
    for (let s = 0; s < N * 4; s++) {
      const t = s * dt, F = pulse(f.X, t) + breeze(f.X, f.d, t);
      const a = w * w * (G * F - th) - 2 * z * w * v; v += a * dt; th += v * dt;
      if (s % 4 === 0) { const o = (i * N + k) * 3; simTab[o] = th; simTab[o + 1] = v; simTab[o + 2] = F; k++; }
    }

}
function headAt(i, t) { const N = D * TAB_HZ + 2, x = t * TAB_HZ, k = Math.min(N - 2, Math.floor(x)), u = x - k, o = (i * N + k) * 3; return [lerp(simTab[o], simTab[o + 3], u), lerp(simTab[o + 2], simTab[o + 5], u)]; }

scene({
  title: '바람의 들판', W, H, duration: D, fps: 30, card: { title: 'WIND OVER THE FIELD', sub: 'late August, one gust', credit: 'drawn in code · ten seconds · one html file', scrim: .55 }, renderer: 'webgl',
  setup({ gl }) {
    // the warm ground (imprimatura) that shows between strokes, cooler in the sky
    under = fullscreen(gl, `vec4 shade(vec2 px, vec2 res, float t){ float y = px.y / res.y; vec3 sky = mix(vec3(.36,.47,.62), vec3(.83,.74,.58), smoothstep(.1,.51,y)); vec3 fld = mix(vec3(.47,.36,.2), vec3(.36,.27,.15), smoothstep(.51,1.,y)); return vec4(mix(sky, fld, smoothstep(.505,.52,y)), 1.0); }`, W, H);
    // linen weave + a breath of vignette, multiplied over the paint
    // the low sun's warmth over the left of the field and around it; the lower right falls away cooler
    glowPass = fullscreen(gl, `vec4 shade(vec2 px, vec2 res, float t){ vec2 s = vec2(${SUN[0]}.0, ${SUN[1]}.0); float d = length((px - s) * vec2(1.0, 1.25)); float g = exp(-d / 520.0) * 0.32; float lowR = smoothstep(0.55, 1.0, px.y / res.y) * smoothstep(0.35, 1.0, px.x / res.x) * 0.22; vec3 c = vec3(1.0, 0.82, 0.5) * g; return vec4(c * (1.0 - lowR) + vec3(0.06, 0.08, 0.16) * lowR, g * 0.55 + lowR); }`, W, H);
    weave = fullscreen(gl, `vec4 shade(vec2 px, vec2 res, float t){ float w = 0.965 + 0.025 * sin(px.x * 1.7) * sin(px.y * 1.7) + 0.012 * sin(px.x * 0.37 + px.y * 0.11); vec2 q = px / res - 0.5; float v = 1.0 - 0.22 * dot(q * vec2(1.0, .8), q * vec2(1.0, .8)); return vec4(vec3(w * v), 1.0); }`, W, H);
    paint(); simulate();
    strokes = Strokes(gl, { W, H, motion: MOTION, segments: 8 });
    strokes.set(S.map((s, i) => Object.assign({ seed: (i * .6180339) % 1, bend: 0, taper: .7, alpha: 1 }, s, { color: col(s.color) })));
    flTex = dataTexture(gl, NF, 2);
    const st = new Float32Array(NF * 4); flowers.forEach((f, i) => { st[i * 4] = f.c[0]; st[i * 4 + 1] = f.c[1]; });
    flTex.update(st, 1, 1);
    info = { strokes: S.length, flowers: NF };
  },
  frame(t, { gl }) {
    gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
    const dyn = new Float32Array(NF * 4);
    flowers.forEach((f, i) => { const [th, F] = headAt(i, t), px = FOC / f.d; dyn[i * 4] = th * px; dyn[i * 4 + 1] = th * th * 3.2 * px + Math.abs(th) * .25 * px; dyn[i * 4 + 2] = th * 2.3; dyn[i * 4 + 3] = clamp(F); });
    flTex.update(dyn, 0, 1);
    under({ time: t });
    const k = ease.inOut(t / D, 1.6), view = [W * .5, H * .62, 1 + .03 * k];

  },

});
