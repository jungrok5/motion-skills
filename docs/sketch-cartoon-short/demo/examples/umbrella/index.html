<!doctype html>
<html lang="en">

<meta charset="utf-8">

<title>The Runaway Umbrella · sketch-cartoon-short</title>
<!-- 「The Runaway Umbrella」 — the worked example of sketch-cartoon-short (BRIEF.md has the topic written out first).
     A boy, his dog and a red umbrella on a rainy day: the page draws them, the wind steals the umbrella, they chase it over
     the town and the rooftops, a scribble storm cloud swallows it, the boy leaps from the bridge and catches it, the cloud
     bursts into loose sheets, he floats down — back onto the blank page. 8 shots, 35.5 s, 24 fps, 1920×1080. -->
<script type="importmap">{ "imports": { "scs/": "../../lib/" } }</script>
</head>
<body>
<script type="module">
import * as S from 'scs/sketch.js';
import * as R from 'scs/rig.js';
import * as K from 'scs/kit.js';
import { Film } from 'scs/film.js';
import { umbrella } from './umbrella.js';
import { SCORE } from './score.js';

const { span, ease, lerp, clamp } = S;
// ── palette: sage paper, dusty teal air, olive and khaki walls, one warm accent (the umbrella and the awnings) ──
const PAPER = '#b7b996', WALLS = ['#c9c8a9', '#bfc4a6', '#cdc6ad', '#c2c0a2'], TEAL = '#86a09a', DEEP = '#6e8a84', UMB = '#c48a7c', AWN = '#c39385';
const F = new Film({ seed: 11, paper: PAPER, score: SCORE, title: 'The Runaway Umbrella' });

// ── the cast, designed for this topic (cast.js; cast.html draws the sheet) ──
import { JUNO, BISCUIT } from './cast.js';

const HOLD = { arm: { near: [1.0, 1.9] }, grip: { near: 'fist' } };   // the umbrella hold: hand at shoulder height, shaft up past the head
const last = { boy: null, ground: null, cam: null, offOK: false };   // read by the checks below
const toScreen = (p, cam, z = 1) => { const sc = Math.pow(cam.zoom, z); return [(p.x - cam.x * z - 960) * sc + 960, (p.y - cam.y * z - 540) * sc + 540]; };
const rainOn = (g, a, o = {}) => { if (a > 0) g.screen(c => { c.globalAlpha = a; K.rain(c, 1920, 1080, g.t, { slant: -.18, ...o }); }); };

// ── plates (painted once; 2 boil variants so even the backgrounds breathe) ──
const corner = F.plate(1920, 1080, c => {
  K.facade(c, -90, 1010, 560, 860, { seed: 3, wall: WALLS[0], awning: AWN, roof: 'cornice', wash: .7, shade: .22, base: PAPER });
  K.facade(c, 1460, 1010, 560, 760, { seed: 5, wall: WALLS[2], roof: 'cornice', wash: .55 });
  K.lamp(c, 1290, 1012, 520, { face: -1 });
  K.ground(c, 0, 1920, 1012, { seed: 4 });
}, { boil: 2 });
const sky1 = F.plate(3400, 1080, c => K.skyline(c, 0, 3400, 760, { seed: 21, col: TEAL, hmin: 160, hmax: 430, a: .85 }), { boil: 2 });
const town = F.plate(4700, 1080, c => {
  K.street(c, -60, 4760, 1000, { seed: 8, pal: WALLS, awnings: [AWN], hmin: 380, hmax: 700, wash: .7, base: PAPER });
  K.ground(c, 0, 4700, 1002, { seed: 9 });
}, { boil: 2 });
const rooftops = F.plate(3600, 1300, c => {
  // the far street down in the gap: faint, unfinished tops of facades
  c.save(); c.globalAlpha = .55; K.street(c, 760, 1500, 1300, { seed: 31, pal: WALLS, hmin: 360, hmax: 420, wash: .3, awningP: 0, base: PAPER }); c.restore();
  // roof A (flat, with a parapet and a chimney), roof B (flat then pitched)
  S.shape(c, S.rect(-300, 820, 1200, 600), { fill: WALLS[1], tex: .5, sharp: true });
  S.shape(c, S.rect(-310, 806, 1220, 22), { fill: S.tone(WALLS[1], .2), sharp: true, w: 2 });
  S.shape(c, S.rect(330, 650, 70, 160), { fill: S.tone(WALLS[1], -.2), sharp: true }); S.shape(c, S.rect(318, 640, 94, 20), { fill: S.tone(WALLS[1], -.1), sharp: true });
  S.strokes(c, [[[-200, 900], [860, 905]], [[-200, 1010], [860, 1005]]], { w: 1.3, a: .4 });
  S.shape(c, S.rect(1260, 860, 2400, 600), { fill: WALLS[3], tex: .5, sharp: true });
  S.shape(c, S.rect(1250, 846, 1000, 22), { fill: S.tone(WALLS[3], .2), sharp: true, w: 2 });
  K.roofs(c, 2280, 3600, 870, { seed: 4, pal: WALLS, roof: '#7b8c80' });
  S.hatch(c, S.rect(830, 830, 70, 470), { sharp: true, angle: -1.2, gap: 8, a: .3 });
  S.hatch(c, S.rect(1260, 870, 60, 430), { sharp: true, angle: -1.2, gap: 8, a: .3 });
}, { boil: 2 });
const sky2 = F.plate(2800, 1080, c => K.skyline(c, 0, 2800, 900, { seed: 41, col: TEAL, hmin: 200, hmax: 560, spires: .25 }), { boil: 2 });
const sky4 = F.plate(3000, 1080, c => K.skyline(c, 0, 3000, 1000, { seed: 43, col: '#9fb2aa', hmin: 140, hmax: 420, spires: .25, a: .7 }), { boil: 2 });
const bridgeP = F.plate(2400, 1500, c => { K.bridge(c, -200, 2300, 900, 1500, { n: 3, rise: 18, col: DEEP }); }, { boil: 2 });
const city = F.plate(2400, 1200, c => {
  K.skyline(c, -40, 2440, 1150, { seed: 51, col: '#8ea7a0', hmin: 260, hmax: 640, spires: .3 });
  K.roofs(c, -120, 2500, 1010, { seed: 13, pal: WALLS, roof: '#7b8c80' });
}, { boil: 2 });

// ── shot 1 · drawn: the blank page draws a boy, his dog, his umbrella; then it starts to rain ──
const S1 = { x: 860, y: 950 };
F.shot(4, g => {
  g.paper();
  const k = span(g.lt, .2, 3.0, ease.lin), blink = g.lt > 3.35 && g.lt < 3.47 ? 1 : 0;
  const pose = { x: S1.x, y: S1.y, s: .95, face: 1, turn: .45, ...R.pose(R.stand(g.lt), HOLD), expr: 'smile', blink, flow: g.twos(), look: g.lt > 3.4 ? [.6, -.8] : [0, 0] };
  g.at(1, c => g.drawOn(k, () => {
    K.shadow(c, 880, 952, 150); K.shadow(c, 1250, 952, 95);
    R.critter(c, BISCUIT, { x: 1250, y: 952, face: -1, gait: 'sit', expr: 'calm', flow: g.twos() });
    const G = R.person(c, JUNO, pose);
    umbrella(c, G.hands.near.x, G.hands.near.y, { ang: -.08, open: 1, col: UMB, s: .95, flutter: g.twos() });
    K.ground(c, 360, 1600, 954, { seed: 2 });
    last.boy = G;
  }));
  // the pencil doing the drawing: it travels over the figure as k grows, scribbling on twos, then leaves
  const path = [[900, 955], [1240, 850], [900, 900], [880, 640], [860, 470], [980, 260], [1500, -200]];
  const pk = k * (path.length - 2) + span(g.lt, 3.0, 3.6) * 1, i = Math.min(path.length - 2, Math.floor(pk)), u = pk - i, j = g.twos();
  const px = lerp(path[i][0], path[i + 1][0], u) + Math.sin(j * 37) * 18, py = lerp(path[i][1], path[i + 1][1], u) + Math.cos(j * 29) * 14;
  g.at(1, c => K.pencil(c, px, py, -2.3, 230));
  rainOn(g, span(g.lt, 3.2, 3.9) * .55, { n: 90 });
  last.ground = 950; last.cam = g.cam; last.offOK = false;
}, { name: 'drawn', cam: [{ t: 0, zoom: 1 }, { t: 4, zoom: 1.05, y: -8 }] });

// ── shot 2 · gust: the wind turns the umbrella inside out and tears it away ──
const YANK = 1.25;
const s2pose = lt => {
  if (lt < YANK) return { x: 760, y: 1010, s: 1.25, face: 1, turn: .5, ...R.pose(R.stand(lt), { arm: { near: R.blend([1.0, 1.9], [2.6, .25], span(lt, .55, YANK)), far: [.9 * span(lt, .7, YANK), 1.2] }, grip: { near: 'fist' } }), lean: -.07 * span(lt, .5, YANK), expr: lt > .9 ? 'scared' : 'smile' };
  const c = span(lt, 3.2, 4.0);
  return { x: 760, y: 1010, s: 1.25, face: 1, turn: .5, ...R.blend(R.pose(R.stand(lt), { arm: { near: [2.95, .05], far: [.4, .9] }, grip: { near: 'open' } }), R.pose(R.crouch(.45), { arm: { near: [-.6, 1.2], far: [.6, 1.3] }, grip: { near: 'fist', far: 'fist' } }), c), lean: .06 * span(lt, YANK, YANK + .4) - .02, expr: lt < 2.6 ? 'shock' : 'determined', head: lt < 2.6 ? -.25 : -.05, look: lt < 2.6 ? [.8, -1] : [1, 0] };
};
const s2hand = R.where(JUNO, s2pose(YANK - .001)).hands.near;
F.shot(4, g => {
  const lt = g.lt, tw = g.twos();
  g.paper(); g.put(corner, 0, 0, 1);
  g.at(1, c => {
    K.gust(c, 120, 430, 460, span(lt, .25, 1.4, ease.lin), { dir: 1 }); K.gust(c, -60, 700, 380, span(lt, .55, 1.6, ease.lin), { dir: 1, n: 2 });
    K.shadow(c, 790, 1012, 170); K.shadow(c, 1190, 1012, 100);
    const dogPose = lt < YANK + .1 ? { gait: 'sit', expr: 'calm' } : lt < 2.2 ? { gait: 'sit', expr: 'alarm', ears: 0 } : { gait: 'stand', expr: 'alarm', ears: .1 };
    R.critter(c, BISCUIT, { x: 1190, y: 1012, s: 1.15, face: lt < 2.2 ? -1 : 1, look: lt > YANK ? [.5, -1] : [0, 0], flow: tw, ...dogPose });
    const P = s2pose(tw); P.wind = [lt < YANK ? 40 + 120 * span(lt, .3, 1) : 90, -10]; P.flow = tw;
    const G = R.person(c, JUNO, P); last.boy = G;
    if (lt < YANK) umbrella(c, G.hands.near.x, G.hands.near.y, { ang: -.08 + span(lt, .4, YANK) * .6, open: 1, inv: span(lt, .85, 1.15, ease.out), col: UMB, s: 1.1, flutter: tw * 3 });
    else { const u = tw - YANK; umbrella(c, s2hand.x + 560 * u + 220 * u * u, s2hand.y - 360 * u - 90 * u * u, { ang: .65 + u * 3.6, open: 1, inv: 1 - span(u, .3, 1.2), col: UMB, s: 1 - u * .15, flutter: tw * 3 }); }
  });
  rainOn(g, .6, { slant: -.45, n: 150 });
  last.ground = 1010; last.cam = g.cam; last.offOK = false;
}, { name: 'gust', cam: [{ t: 0, zoom: 1.02 }, { t: 4, zoom: 1.0, x: 20 }], shake: lt => lt > YANK && lt < YANK + .45 ? 9 * (1 - (lt - YANK) / .45) : 0 });

// ── shot 3 · chase: along the street, the umbrella tumbling ahead ──
F.shot(5, g => {
  const lt = g.lt, tw = g.twos(), cx = g.cam.x;
  g.paper(); g.put(sky1, -200, 0, .35); g.put(town, -100, 0, 1);
  g.at(1, c => {
    const bx = 560 + cx, dx = bx - 330;
    K.speed(c, bx - 160, 760, { dir: 0, len: 280, spread: 330, seed: Math.floor(tw * 6), a: .45 });
    const ph = tw * 1.45, fr = (ph * 2) % 1;
    K.puff(c, bx + 30 - fr * 120, 1000, fr / .5, { r: 26, col: '#cfd3c0', seed: Math.floor(ph * 2) });
    K.shadow(c, dx + 20, 1002, 90); K.shadow(c, bx + 20, 1002, 120);
    R.critter(c, BISCUIT, { x: dx, y: 1000, s: .95, face: 1, gait: 'run', ph: tw * 2.3, flow: tw, ears: 1 });
    const G = R.person(c, JUNO, { x: bx, y: 1000, s: .95, face: 1, turn: .85, ...R.run(ph), expr: 'determined', wind: [-110, 0], flow: tw });
    last.boy = G;
    umbrella(c, bx + 640 + 120 * Math.sin(tw * 1.3), 420 + 70 * Math.sin(tw * 2.1), { ang: tw * 3.1, open: 1, inv: .35 + .3 * Math.sin(tw * 4), col: UMB, s: .72, flutter: tw * 3 });
  });
  rainOn(g, .5, { slant: -.1 });
  last.ground = 1000; last.cam = g.cam; last.offOK = false;
}, { name: 'chase', cam: [{ t: 0, x: 0, e: 'lin' }, { t: 5, x: 2400, e: 'io' }] });

// ── shot 4 · leap: across the gap between two roofs, the dog right behind ──
const roofY = x => x < 905 ? 820 : 860;
const boyX4 = lt => lt < 1.0 ? lerp(160, 870, lt / 1.0) : lt < 2.5 ? lerp(870, 1440, clamp((lt - 1.0 - .55) / .95)) : lt < 3.1 ? 1440 + (lt - 2.5) * 120 : 1512 + (lt - 3.1) * 520;
F.shot(5, g => {
  const lt = g.lt, tw = g.twos();
  g.paper(); g.put(sky4, -120, 0, .3);
  g.at(.5, c => K.mass(c, 2200 + lt * 30, 150, 150 * span(lt, 2.0, 5), 90 * span(lt, 2.0, 5), { col: '#3a3d39', core: '#4a4d48', n: 40 }));
  g.put(rooftops, -200, 0, 1);
  g.at(1, c => {
    // the umbrella, high and away
    umbrella(c, 1500 + lt * 320, 260 - span(lt, 2, 4.4) * 520 + 30 * Math.sin(tw * 3), { ang: 2.4 + tw * 2.2, open: 1, inv: .4, col: UMB, s: .55, flutter: tw * 3 });
    // the dog: the same path .55 s later, a smaller leap
    const dl = lt - .5, dk = span(dl, 1.15, 2.4, ease.lin), dxp = dl < 1.15 ? lerp(-40, 860, clamp(dl / 1.15)) : dl < 2.4 ? lerp(860, 1330, dk) : 1330 + (dl - 2.4) * 560;
    const dyp = dl < 1.15 ? 820 : dl < 2.4 ? lerp(820, 860, dk) - Math.sin(Math.PI * dk) * 230 : 860;
    if (!(dl > 1.15 && dl < 2.4)) K.shadow(c, dxp + 20, roofY(dxp) + 2, 80);
    R.critter(c, BISCUIT, { x: dxp, y: dyp, s: .82, face: 1, gait: dl > 1.15 && dl < 2.4 ? 'leap' : 'run', k: dk, ph: tw * 2.3, flow: tw, ears: 1, plant: !(dl > 1.15 && dl < 2.4) });
    // the boy
    const kL = span(lt, 1.0, 2.5, ease.lin);
    let P, ground = null;
    if (lt < 1.0) { P = { ...R.run(tw * 1.5), y: 820 }; ground = 820; }
    else if (lt < 2.5) {
      const a = clamp((kL - .42) / .58), y = kL < .42 ? 820 : lerp(820, 860, a) - Math.sin(Math.PI * a) * 330;
      P = { ...R.leap(kL), y }; if (kL < .42) ground = 820;
      K.speed(c, boyX4(lt) - 100, y - 300, { dir: -.3 + a * .6, len: 200, spread: 260, seed: Math.floor(tw * 6), a: .4 * (kL > .42 ? 1 : 0) });
    } else if (lt < 3.1) { const u = span(lt, 2.5, 3.1); P = { ...R.blend(R.crouch(1), R.run(0), u), y: 860, squash: lerp(.88, 1, u) }; ground = 860; K.puff(c, boyX4(lt), 860, span(lt, 2.5, 3.0, ease.lin), { r: 40, n: 6, col: '#d3d4c2' }); }
    else { P = { ...R.run((lt - 3.1) * 1.5), y: 860 }; ground = 860; }
    const bx = boyX4(lt);
    if (ground != null) K.shadow(c, bx + 20, ground + 2, 120);
    last.boy = R.person(c, JUNO, { x: bx, s: .9, face: 1, turn: .85, ...P, expr: lt > 1.0 && lt < 2.5 ? 'yell' : 'determined', wind: [-100, 0], flow: tw });
    last.ground = ground;
  });
  rainOn(g, .45, { slant: -.1, n: 110 });
  last.cam = g.cam; last.offOK = lt > 4.2;
}, { name: 'leap', cam: [{ t: 0, x: 0, y: 0 }, { t: 1.0, x: 280, e: 'in' }, { t: 2.5, x: 720, y: -40, e: 'lin' }, { t: 5, x: 1250, y: 0, e: 'out' }] });

// ── shot 5 · cloud: on the bridge; a scribble storm cloud swallows the umbrella; thunder ──
const THUNDER = 1.75;
F.shot(4, g => {
  const lt = g.lt, tw = g.twos(), k = span(lt, 0, 1.6, ease.out);
  g.paper(); g.put(sky2, -300, 40, .4);
  g.at(1, c => {
    // the umbrella flies in from the right and into the cloud (drawn first: the cloud covers it)
    const u = span(lt, 0, 1.35, ease.in);
    if (u < 1) umbrella(c, lerp(1980, 1420, u), lerp(520, 260, u), { ang: 2 + tw * 3, open: 1, inv: .5, col: UMB, s: lerp(.6, .3, u), flutter: tw * 3 });
    K.mass(c, 1420, 220, 380 * k, 190 * k, { col: '#2b2d2a', core: '#464943', n: 110, stray: .7 });
    if (lt > THUNDER && lt < THUNDER + .25) S.line(c, [[1330, 380], [1270, 510], [1320, 520], [1240, 700]], { w: 7, col: '#efe6c2', over: 0, smooth: false });
  });
  g.put(bridgeP, -260, -10, 1);
  g.at(1, c => {
    K.shadow(c, 520, 892, 90); K.shadow(c, 760, 892, 120);
    R.critter(c, BISCUIT, { x: 500, y: 890, s: .85, face: 1, gait: lt < THUNDER ? 'stand' : 'crouch', expr: 'alarm', look: [.6, -1], flow: tw, ears: lt > THUNDER ? .8 : .1 });
    const P = R.blend(R.stand(lt), R.crouch(.4), span(lt, 3.1, 4));
    last.boy = R.person(c, JUNO, { x: 760, y: 890, s: .85, face: 1, turn: .65, ...P, head: lt < 2.6 ? -.35 : -.15, look: [.7, -1], expr: lt < THUNDER ? 'awe' : lt < 2.5 ? 'shock' : 'determined', wind: [70, -10], flow: tw });
  });
  rainOn(g, .7, { slant: -.3, n: 230 });
  if (lt > THUNDER && lt < THUNDER + .3) g.screen(c => { c.fillStyle = S.rgba('#f4efdd', .5 * (1 - (lt - THUNDER) / .3)); c.fillRect(0, 0, 1920, 1080); });
  last.ground = 890; last.cam = g.cam; last.offOK = false;
}, { name: 'cloud', cam: [{ t: 0, zoom: 1 }, { t: 4, zoom: 1.07, y: -20 }], shake: lt => lt > THUNDER && lt < THUNDER + .5 ? 10 * (1 - (lt - THUNDER) / .5) : 0 });

// ── shot 6 · catch: up off the parapet; the cloud spits the umbrella out; he catches it; it opens; the cloud bursts into sheets ──
const CATCH = 2.0, CL = { x: 1440, y: 170 };
const s6pose = lt => {
  if (lt < .7) return { x: lerp(380, 760, lt / .7), y: 905, ...R.run(lt * 1.6) };
  if (lt < .95) return { x: 760, y: 905, ...R.crouch(span(lt, .7, .95, ease.out)) };
  if (lt < CATCH) { const u = span(lt, .95, CATCH, ease.out); return { x: lerp(760, 930, u), y: lerp(905, 640, u), ...R.pose(R.leap(lerp(.3, .75, u)), { arm: { near: [3.05, .05] }, grip: { near: 'open' } }) }; }
  return null;
};
const s6catch = R.where(JUNO, { s: .85, face: 1, turn: .6, ...s6pose(CATCH - .001) }).hands.near;
const hangOff = (() => { const P = { x: 0, y: 0, s: .85, face: 1, turn: .45, ...R.fall(0) }; const H = R.where(JUNO, P).hands.near; return [H.x, H.y]; })();
const grip6 = lt => ({ x: s6catch.x + (lt - CATCH) * 70, y: s6catch.y - 30 * span(lt, CATCH, CATCH + .7, ease.out) + 12 * Math.sin((lt - CATCH) * 2.4) });
F.shot(5, g => {
  const lt = g.lt, tw = g.twos(), burst = span(lt, 2.2, 2.9, ease.in);
  g.paper(); g.put(sky2, -300, 40, .4);
  g.at(1, c => {
    // the umbrella before the catch: spat out at .5, folded, tumbling down to where the hand will be at CATCH
    if (lt > .45 && lt < CATCH) { const u = span(lt, .45, CATCH, ease.sine); umbrella(c, lerp(CL.x - 80, s6catch.x, u), lerp(CL.y + 160, s6catch.y, u), { ang: lerp(2.6, 0, u) + Math.sin(tw * 5) * .2 * (1 - u), open: .15, col: UMB, s: .7, flutter: tw * 3 }); }
    if (burst < 1) K.mass(c, CL.x, CL.y, 380 * (1 - burst * .7), 200 * (1 - burst * .7), { col: '#2b2d2a', core: '#464943', n: Math.round(90 * (1 - burst)) + 8, stray: .6 + burst });
    // the burst: loose sheets fly out of where the cloud was
    if (lt > 2.2) for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2 + .3, u = (tw - 2.2) * (.7 + (i % 3) * .2), d = 120 + u * 620; K.sheet(c, CL.x + Math.cos(a) * d, CL.y + Math.sin(a) * d * .7 + u * u * 160, 70 + (i % 4) * 14, a + u * 3, { flap: Math.sin(u * 9 + i), seed: i }); }
  });
  g.put(bridgeP, -260, -10, 1);
  g.at(1, c => {
    K.shadow(c, 560, 907, 90);
    R.critter(c, BISCUIT, { x: 560, y: 905, s: .85, face: 1, gait: lt < 3 ? 'stand' : 'sit', expr: lt < 2.4 ? 'alarm' : 'happy', look: [.5, -1], flow: tw, ears: .2 });
    let P = s6pose(tw);
    if (P) { if (lt < .95) K.shadow(c, P.x + 20, 907, 110); last.boy = R.person(c, JUNO, { s: .85, face: 1, turn: .6, ...P, expr: 'yell', wind: [-30, 40], flow: tw }); last.ground = lt < .95 ? 905 : null; }
    else {
      const gp = grip6(tw), FP = { s: .85, face: 1, turn: .45, ...R.fall(tw), x: gp.x - hangOff[0], y: gp.y - hangOff[1], expr: lt < 2.5 ? 'shock' : 'joy', wind: [0, 30], flow: tw };
      last.boy = R.person(c, JUNO, FP); last.ground = null;
      const U = umbrella(c, gp.x, gp.y, { ang: -.05 + Math.sin(tw * 2) * .05, open: span(lt, CATCH + .05, CATCH + .3, ease.back) * .85 + .15, col: UMB, s: .7, flutter: tw * 3 });
      K.ring(c, U.cx, U.cy, 150 + 40 * span(lt, CATCH + .1, 3.2), 1 - span(lt, 2.4, 3.4), { squash: .45 });
    }
  });
  rainOn(g, .7 * (1 - span(lt, 2.2, 3.0)), { slant: -.3, n: 230 });
  if (lt > CATCH + .1) g.screen(c => { const k = span(lt, CATCH + .1, 3.6) * .3, gr = c.createRadialGradient(1300, 250, 50, 1300, 250, 1400); gr.addColorStop(0, S.rgba('#f5e9c4', k)); gr.addColorStop(1, S.rgba('#f5e9c4', 0)); c.globalCompositeOperation = 'screen'; c.fillStyle = gr; c.fillRect(0, 0, 1920, 1080); });
  last.cam = g.cam; last.offOK = false;
}, { name: 'catch', cam: [{ t: 0, y: 0, zoom: 1 }, { t: 1, y: -80 }, { t: 2.2, y: -260, zoom: .98 }, { t: 5, y: -330, zoom: 1.0, x: 80 }] });

// ── shot 7 · float: down over the town under the open umbrella, the sheets drifting with him ──
const hang7 = (() => { const P = { x: 0, y: 0, s: .55, face: 1, turn: .45, ...R.fall(0) }; const H = R.where(JUNO, P).hands.near; return [H.x, H.y]; })();
F.shot(4.5, g => {
  const lt = g.lt, tw = g.twos();
  g.paper(); g.put(city, -240, -60, .6);
  g.at(1, c => {
    for (let i = 0; i < 11; i++) { const u = (tw * .35 + i * .093) % 1; K.sheet(c, lerp(-120, 2100, (u + i * .17) % 1), 120 + (i * 97) % 640 + Math.sin(tw * 1.3 + i) * 40 + u * 120, 46 + (i % 4) * 10, tw * (1 + i % 3) + i, { flap: Math.sin(tw * 4 + i), seed: i + 3 }); }
    const gx = lerp(420, 1160, ease.sine(lt / 4.5)), gy = lerp(260, 470, ease.sine(lt / 4.5)) + Math.sin(tw * 2.2) * 18;
    last.boy = R.person(c, JUNO, { s: .55, face: 1, turn: .45, ...R.fall(tw * .6), x: gx - hang7[0], y: gy - hang7[1], expr: 'joy', wind: [0, 25], flow: tw });
    umbrella(c, gx, gy, { ang: -.08 + Math.sin(tw * 1.6) * .06, open: 1, col: UMB, s: .42, flutter: tw * 2 });
  });
  g.screen(c => { const gr = c.createRadialGradient(400, 120, 50, 400, 120, 1500); gr.addColorStop(0, S.rgba('#f6ecca', .3)); gr.addColorStop(1, S.rgba('#f6ecca', 0)); c.globalCompositeOperation = 'screen'; c.fillStyle = gr; c.fillRect(0, 0, 1920, 1080); });
  last.ground = null; last.cam = g.cam; last.offOK = false;
}, { name: 'float', tr: { type: 'dissolve', d: 1.0 }, cam: [{ t: 0, x: 0, zoom: 1 }, { t: 4.5, x: 120, zoom: 1.04 }] });

// ── shot 8 · page: back on the blank sheet; he lands, the dog runs in; one last drop; the pencil draws the ground ──
const LAND = .9, BX = 820;
const hang8 = (() => { const P = { x: 0, y: 0, s: 1, face: 1, turn: .45, ...R.fall(0), plant: false }; const H = R.where(JUNO, P).hands.near; return [H.x, H.y]; })();
F.shot(4, g => {
  const lt = g.lt, tw = g.twos();
  g.paper();
  g.at(1, c => {
    const dk = span(lt, .5, 1.8, ease.out), dxp = lerp(-220, 1210, dk);
    if (lt > .5) { K.shadow(c, dxp + 20, 932, 95); R.critter(c, BISCUIT, { x: dxp, y: 930, s: 1, face: lt < 1.9 ? 1 : -1, gait: lt < 1.8 ? 'run' : 'sit', ph: tw * 2.3, expr: lt < 1.8 ? 'calm' : 'happy', flow: tw }); }
    let G;
    if (lt < LAND) {
      const u = span(lt, 0, LAND, ease.out), gx = BX + 40, gy = lerp(-120, 930 - 640 * .0, 0) ;
      const P = { s: 1, face: 1, turn: .45, ...R.fall(tw), plant: false, expr: 'joy', wind: [0, 30], flow: tw };
      const hy = lerp(-160, 930 + hang8[1] - 6, u);      // the grip comes down until the feet touch the ground line
      G = R.person(c, JUNO, { ...P, x: gx - hang8[0], y: hy - hang8[1] }); last.ground = null;
      umbrella(c, G.hands.near.x, G.hands.near.y, { ang: -.05, open: 1, col: UMB, s: .95, flutter: tw * 2 });
    } else {
      const u = span(lt, LAND, LAND + .5);
      const P = { x: BX, y: 930, s: 1, face: 1, turn: lt > 3.0 ? .3 : .45, ...R.pose(R.blend(R.crouch(.35), R.stand(lt), u), { arm: { near: R.blend([2.7, .2], [1.0, 1.9], span(lt, LAND, LAND + .8)) }, grip: { near: 'fist' } }), squash: lerp(.9, 1, ease.out(u)), expr: lt < 2.4 ? 'joy' : lt < 3.0 ? 'awe' : 'wink', look: lt > 2.3 && lt < 3.0 ? [.3, -1] : [0, 0], head: lt > 2.3 && lt < 3.0 ? -.2 : 0, flow: tw };
      K.shadow(c, BX + 20, 932, 150);
      G = R.person(c, JUNO, P); last.ground = 930;
      const U = umbrella(c, G.hands.near.x, G.hands.near.y, { ang: -.08, open: 1, col: UMB, s: .95, flutter: tw });
      // one last drop falls onto the canopy
      const d = span(lt, 2.3, 2.75, ease.in); if (d > 0 && d < 1) S.line(c, [[U.cx - 60, lerp(-40, U.cy - 70, d)], [U.cx - 64, lerp(-40, U.cy - 70, d) + 36]], { w: 2.4, over: 0 });
      if (lt > 2.75 && lt < 3.2) K.puff(c, U.cx - 62, U.cy - 70, span(lt, 2.75, 3.2, ease.lin), { r: 14, n: 4, col: '#d9dccb', up: true });
    }
    last.boy = G;
    // the pencil draws a ground line under them
    const tk = span(lt, 3.0, 3.75, ease.lin), line = [[480, 936], [900, 940], [1400, 934]];
    K.trail(c, line, tk, { w: 2.6 });
    if (lt > 2.9) { const p = S.sub(S.curve(line, 8), 0, Math.max(.002, tk)).at(-1); K.pencil(c, p[0] + (lt > 3.75 ? (lt - 3.75) * 900 : 0), p[1] - (lt > 3.75 ? (lt - 3.75) * 700 : 0), -2.3, 230); }
  });
  last.cam = g.cam; last.offOK = false;
}, { name: 'page', tr: { type: 'paper', d: 1.0 }, cam: [{ t: 0, zoom: 1.02 }, { t: 4, zoom: 1 }] });

// ── checks: rules that must hold at every sampled moment ──
F.check('feet on the ground when standing or running', () => last.ground == null || Math.abs(last.boy.ground - last.ground) < 3);
F.check('the hero stays in frame', () => { if (last.offOK || !last.boy || !last.cam) return true; const [x, y] = toScreen(last.boy.head, last.cam); return x > -60 && x < 1980 && y > -60 && y < 1100; });
F.start();
</script>
