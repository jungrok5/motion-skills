<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>map-dive · template</title>
<link rel="stylesheet" href="fonts/fonts.css">
<script type="importmap">{ "imports": { "three": "../lib/three.module.min.js", "dive/": "../lib/" } }</script>
</head>
<body>
<script type="module">
// map-dive template — a 14 s, two-stage film: a made-up region as a floating toy map → a dive into one valley with a
// waterfall → back up. It is an example of the style, not a form to fill: replace the region, the places, the landmark
// and the close-up with what your BRIEF.md says. Units are world units; for a real place use projector() (see the Jeju
// example) so lon/lat go straight in.
import { Film, smoothLoop, hex, mixc, fbm, smooth, clamp, distToLine, inside } from 'dive/dive.js';
import * as L from 'dive/land.js';
import * as K from 'dive/kit.js';

const F = await Film.create({ duration: 14 });

// ---------------------------------------------------------------- stage 1: the region as a floating toy map
// 1. the outline: a handful of points, smoothed (a real region: smoothLoop(coast.map(p => geo(p))))
const region = smoothLoop([[-6, -1.5], [-3.5, -3.2], [0, -3], [3.2, -3.6], [5.8, -2], [6.2, .8], [4, 2.8], [.5, 2.4], [-2.5, 3.2], [-5.6, 1.6]], 360);
const PL = { lake: [1.6, -.6], falls: [-3.2, -.4], hills: [3.8, -1.6], town: [-.6, 1.3], port: [4.6, 1.9], farm: [-4.6, 1.1] };
const I = F.stage('region');                                      // day sky, sun from the upper left, haze that scales with the camera
L.island(I, {
  land: [region],
  // 2. the ground colour: a gradient across the map + noise patches (dry north, green south, darker woods)
  base: (x, z) => {
    const n = fbm(x * .5, z * .5, 4);
    let c = mixc(hex('#e2cf84'), hex('#9fcb62'), smooth(-3, 1.5, z + (n - .5) * 2));
    return mixc(c, hex('#5e9e48'), smooth(.58, .7, fbm(x * .9 + 5, z * .9, 3)) * .8);
  },
  // 3. vector work on top: rivers, roads, a lake, names lying on the map
  paint: P => {
    const river = smoothLoop([PL.falls, [-1.2, .2], PL.lake, [3.4, .8], [5.9, 1.2]], 60, false);
    P.river(river, .07);
    P.fill(smoothLoop([[1, -1], [2.2, -1.1], [2.4, -.2], [1.2, -.1]], 40), '#4a9be0', { stroke: '#d7eef7', strokeWidth: .05 });
    P.road(smoothLoop([PL.farm, PL.town, [2.5, 1.4], PL.port], 60, false), .05, { glow: .5 });
    P.text('Lake Ula', [PL.lake[0], PL.lake[1] + .55], { size: .22, color: '#2c5f86' });
    P.text('Marrow', [PL.town[0], PL.town[1] + .45], { size: .3, weight: 800 });
    P.text('Port Ness', [PL.port[0] - .2, PL.port[1] + .4], { size: .24 });
    P.text('High Falls', [PL.falls[0], PL.falls[1] + .62], { size: .22 });
    P.light(PL.town, .6); P.light(PL.port, .4);
  },
});
// 4. landmarks as oversized toys, then life
K.waterfall(I, { at: PL.falls, s: .7 });
K.mountain(I, { at: PL.hills, s: .9, peaks: 3 });
K.houses(I, { at: PL.town, n: 10, spread: .4, size: .12 });
K.houses(I, { at: PL.port, n: 5, spread: .25, size: .1, seed: 7 });
K.lighthouse(I, { at: [5.7, 1.5], s: .45 });
K.trees(I, { at: [-1.5, -1.8], n: 9, spread: .6, kind: 'pine', size: .2 });
K.trees(I, { at: [2.6, .2], n: 6, spread: .4, size: .18 });
K.animals(I, { at: PL.farm, n: 4, spread: .3, size: .1 });
K.plane(I, { path: t => [Math.cos(t * .25) * 5, 1.6, Math.sin(t * .25) * 3], s: .35 });
[[-7, -3, 2.6], [6.5, -4, 2.2], [-4, 4, 2], [7.5, 3, 2.4]].forEach(([x, z, y], i) => K.cloud(I, { at: [x, z], y, s: .9, seed: i }));
I.check('the falls stand on the land', () => inside(PL.falls, region));

// ---------------------------------------------------------------- stage 2: the close-up (1 unit ≈ 25 m here)
const C = F.stage('falls');
const FALLS = [0, -2], riverC = [[2, -60], [-3, -24], [0, -4.5], [0, -2], [1.5, 8], [-3, 22], [2, 60]];
const height = (x, z) => {
  const r = Math.hypot(x - FALLS[0], z - FALLS[1]);
  const plateau = 3.2 * smooth(-.5, -2.6, z) * smooth(2.7, 3.6, r);  // high land to the north, a round notch for the plunge pool
  return plateau + .3 * fbm(x * .1, z * .1, 3) - .45 * (1 - smooth(1.2, 3, distToLine([x, z], riverC)));
};
L.terrain(C, {
  size: 80, height,
  base: (x, z) => mixc(hex('#9fcb62'), hex('#5e9e48'), smooth(.5, .7, fbm(x * .06, z * .06, 4))),
  paint: P => { P.river(riverC, 2, { color: '#4a9be0', bank: '#cfe9f2' }); P.fields([[8, 8], [38, 8], [38, 38], [8, 38]], { cell: 4, angle: 10 }); },
  trees: { where: (x, z) => distToLine([x, z], riverC) > 3.5 && Math.hypot(x - FALLS[0], z - FALLS[1]) > 4.5 ? (z < 0 ? .55 : .12) : 0, n: 1800, size: [.6, 1.1] },
  apron: { size: 700, base: (x, z) => mixc(hex('#9fcb62'), hex('#6aa64c'), fbm(x * .02, z * .02, 3)) },
});
K.waterfall(C, { at: FALLS, y: -.1, s: 6, h: .58 });
C.label('High Falls', [0, 3.9, -4.5], { from: 6.6, to: 10.6 });
C.check('the falls drop from the plateau', () => height(-6, -8) > 2.6 && height(0, 2) < 1);

// ---------------------------------------------------------------- 5. the camera: shots with keys; overlapping shots crossfade (a dive)
F.shot('region', { from: 0, to: 5.6, keys: [
  { t: 0, at: [0, 0, .2], dist: 15, yaw: -8, elev: 40 },
  { t: 4.2, at: [-.4, 0, 0], dist: 13.5, yaw: 4, elev: 38 },
  { t: 5.6, at: [PL.falls[0], .1, PL.falls[1]], dist: .9, yaw: 10, elev: 58 }] });
F.shot('falls', { from: 5, to: 11, keys: [
  { t: 5, at: [0, 1, 0], dist: 170, yaw: 10, elev: 58 },
  { t: 6.8, at: [0, 1.4, 0], dist: 34, yaw: 18, elev: 34 },
  { t: 10.4, at: [0, 1.4, 0], dist: 30, yaw: 42, elev: 30 },
  { t: 11, at: [0, 1, 0], dist: 170, yaw: 46, elev: 58 }] });
F.shot('region', { from: 10.4, to: 14, keys: [
  { t: 10.4, at: [PL.falls[0], .1, PL.falls[1]], dist: .9, yaw: 46, elev: 58 },
  { t: 14, at: [0, 0, .2], dist: 14.5, yaw: 0, elev: 38 }] });
F.title('The Ula Basin', { from: .3, to: 4.4, sub: 'a made-up region · 1 unit = 6 km' });
F.start();
</script>
</body>
</html>
