<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plant Cell Zoom</title>
<style>
:root{--bg:#f2f5f2;--fg:#17201a;--mut:#5b6a60;--line:#cdd6cf;--acc:#3c8a14}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#030805;--fg:#dbe7de;--mut:#8a9a8f;--line:#1f2b23;--acc:#a6ff4a}}
:root[data-theme="dark"]{--bg:#030805;--fg:#dbe7de;--mut:#8a9a8f;--line:#1f2b23;--acc:#a6ff4a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px 16px}
.stage,.bar{width:min(100%,calc((100vh - 84px) * var(--ar,.5625)))}
.stage{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#000;cursor:pointer}
canvas{width:100%;height:100%;display:block}
.bar{display:flex;align-items:center;gap:12px;font-size:15px}
.bar button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;width:40px;height:34px;font-size:15px;cursor:pointer;flex:none}
.bar input{flex:1;min-width:0;accent-color:var(--acc)}
.bar span{color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#a6ff4a;font:600 15px/1.2 ui-monospace,monospace;letter-spacing:.06em;background:#020604;pointer-events:none;transition:opacity .4s}
html.render body{padding:0;display:block}
html.render .stage{width:1080px;border-radius:0}
html.render .bar,html.render #load{display:none}
</style>
</head>
<body>
<div class="stage" id="stage"><canvas id="c"></canvas><div id="load">building…</div></div>
<div class="bar"><button id="pp" aria-label="Play or pause">❚❚</button><input id="seek" type="range" min="0" max="28" step="0.01" value="0" aria-label="Seek"><span id="time">0:00 / 0:28</span></div>
<script src="../../kit/specimen-zoom.js"></script>
<script>
'use strict';
// ============================================================================================
//  Plant cell — a three-dimensional cutaway, 14 shots × 2 s, drawn entirely in Canvas 2D on the
//  specimen-zoom kit. This page holds only the topic: organelles, the cell, the plates, the shot
//  table and the HUD's words and numbers. ?ar=4:5 gives the feed cut; default is 9:16 (shorts).
// ============================================================================================
const { TAU, mk, TEX, rng, clamp, lerp, p, eo, eio, ss, wob, hx, mix, rgba, WHITE, BLACK, lit, drk,
  circleP, ellP, lineP, cr, smoothP, blobPts, insetPoly, reflect, noiseTex, texOver, devScale, innerShadow, blurLayer, layer, bloom,
  sphere, body, tube, fiberBand, network, dots, liquidBody, bubbles, fieldBase } = SZ;
// DURATION = 28 (14 shots × 2 s; scripts/render-chunked.sh reads this line)
const AR = new URLSearchParams(location.search).get('ar') === '4:5' ? '4:5' : '9:16', LY = SZ.LAYOUT[AR];
document.documentElement.style.setProperty('--ar', LY.W / LY.H);
const OS = 1.6, OX = -150, OY = -420, OWW = 1400, OWH = 2400;   // overview plate: world → plate px = (w - O) * OS
let PW, PH, PY0;                           // close-up plate frame, set from the film below

// ---------- organelles ----------
const COL = {
  wall: [74, 160, 34], cyto: [22, 52, 140], vac: [60, 200, 240], nuc: [140, 62, 215], nucl: [92, 40, 190], er: [52, 112, 230],
  mito: [238, 104, 32], golgi: [232, 186, 40], ribo: [214, 30, 72], mem: [214, 70, 170], chl: [72, 176, 40], tono: [70, 230, 220]
};
function chloroplast(g, x, y, rx, ry, rot, seed, o = {}) {
  const R = rng(seed); g.save(); g.translate(x, y); g.rotate(rot);
  const outer = ellP(0, 0, rx, ry);
  body(g, outer, [-rx, -ry, 2 * rx, 2 * ry], [78, 190, 40], { tex: TEX.fine, texA: .35, texS: Math.max(.15, rx / 260), hiK: .5 });
  const inner = ellP(0, 0, rx * .88, ry * .9);
  const ig = g.createRadialGradient(-rx * .2, -ry * .2, 0, 0, 0, Math.max(rx, ry)); ig.addColorStop(0, rgba([70, 150, 40])); ig.addColorStop(1, rgba([22, 72, 18]));
  g.fillStyle = ig; g.fill(inner); texOver(g, inner, TEX.fine, { alpha: .35, scale: Math.max(.12, rx / 300) });
  innerShadow(g, inner, 'rgba(4,22,4,.95)', Math.min(rx, ry) * .25, rx * .04, ry * .04);
  // grana: stacks of thylakoid discs on a jittered grid inside the stroma
  const s = Math.min(rx, ry) * (o.grid ?? .62), stacks = [];
  for (let gy = -ry; gy <= ry; gy += s) for (let gx = -rx; gx <= rx; gx += s) {
    const jx = gx + (R() - .5) * s * .35, jy = gy + (R() - .5) * s * .35;
    if ((jx / (rx * .72)) ** 2 + (jy / (ry * .74)) ** 2 < 1) stacks.push([jx, jy]);
  }
  const gr = s * .36;
  g.save(); g.strokeStyle = rgba([150, 230, 90], .55); g.lineWidth = Math.max(1, gr * .1);
  for (let i = 0; i < stacks.length; i++) for (let j = i + 1; j < stacks.length; j++) { const a = stacks[i], b = stacks[j]; if (Math.hypot(a[0] - b[0], a[1] - b[1]) < s * 1.25) { g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); } }
  g.restore();
  stacks.sort((a, b) => a[1] - b[1]);
  for (const [sx, sy] of stacks) { g.save(); g.translate(sx, sy); g.rotate(-rot); granum(g, 0, gr * .9, gr, 4 + (R() * 4 | 0)); g.restore(); }
  // outer rim light
  g.save(); g.clip(outer); g.strokeStyle = rgba([200, 255, 140], .45); g.lineWidth = Math.max(1.5, rx * .03); g.translate(-rx * .015, -ry * .02); g.stroke(ellP(0, 0, rx * .97, ry * .97)); g.restore();
  g.restore();
}
function granum(g, x, y, r, n) { // stack of discs, bottom at (x, y)
  const th = r * .3, ry = r * .42;
  for (let k = 0; k < n; k++) {
    const yy = y - k * th * 1.12;
    g.fillStyle = rgba([10, 50, 10], .9); g.beginPath(); g.ellipse(x, yy + th * .15, r * 1.02, ry, 0, 0, TAU); g.fill();
    const sg = g.createLinearGradient(x - r, 0, x + r, 0); sg.addColorStop(0, rgba([26, 90, 20])); sg.addColorStop(.35, rgba([120, 220, 60])); sg.addColorStop(1, rgba([20, 70, 16]));
    g.fillStyle = sg; g.beginPath(); g.ellipse(x, yy, r, ry, 0, 0, Math.PI); g.lineTo(x - r, yy - th); g.ellipse(x, yy - th, r, ry, 0, Math.PI, 0, true); g.closePath(); g.fill();
    const tg = g.createRadialGradient(x - r * .3, yy - th - ry * .3, 0, x, yy - th, r); tg.addColorStop(0, rgba([210, 255, 140])); tg.addColorStop(1, rgba([80, 180, 40]));
    g.fillStyle = tg; g.beginPath(); g.ellipse(x, yy - th, r, ry, 0, 0, TAU); g.fill();
  }
}
function mitochondrion(g, x, y, rx, ry, rot, seed) {
  const R = rng(seed); g.save(); g.translate(x, y); g.rotate(rot);
  const outer = ellP(0, 0, rx, ry);
  body(g, outer, [-rx, -ry, 2 * rx, 2 * ry], COL.mito, { tex: TEX.fine, texA: .45, texS: Math.max(.12, rx / 300), hiK: .5 });
  const inner = ellP(0, 0, rx * .86, ry * .78);
  g.fillStyle = rgba([92, 22, 8]); g.fill(inner); texOver(g, inner, TEX.fine, { alpha: .3, scale: Math.max(.1, rx / 400) });
  innerShadow(g, inner, 'rgba(30,4,0,.95)', ry * .3, rx * .02, ry * .05);
  // cristae: one serpentine fold of the inner membrane
  // cristae: folds of the inner membrane reaching in from both sides like fingers
  const folds = Math.max(5, Math.round(rx / ry * 4.2)), L = rx * .8, step = 2 * L / folds, cw = Math.max(2, step * .5), paths = [];
  paths.push(ellP(0, 0, rx * .84, ry * .76));
  for (let side of [-1, 1]) for (let i = 0; i < folds; i++) {
    const xx = -L + step * (i + (side > 0 ? .5 : .1)) + (R() - .5) * step * .2, e = Math.sqrt(Math.max(0, 1 - (xx / (rx * .84)) ** 2)); if (e < .3) continue;
    const edge = ry * .76 * e * side, depth = ry * .76 * e * (.95 + R() * .5), bend = (R() - .5) * step * .5;
    const q = new Path2D(); q.moveTo(xx, edge); q.quadraticCurveTo(xx + bend, edge - side * depth * .5, xx + bend * .4, edge - side * depth); paths.push(q);
  }
  g.save(); g.clip(inner);
  for (const q of paths) { g.save(); g.translate(cw * .18, cw * .3); g.strokeStyle = 'rgba(25,2,0,.7)'; g.lineWidth = cw * 1.25; g.lineCap = 'round'; g.stroke(q); g.restore(); }
  for (const q of paths) tube(g, q, cw, [232, 96, 30], { hl: .45 });
  g.restore();
  g.save(); g.clip(outer); g.strokeStyle = rgba([255, 200, 140], .5); g.lineWidth = Math.max(1, ry * .05); g.translate(-rx * .01, -ry * .03); g.stroke(ellP(0, 0, rx * .96, ry * .93)); g.restore();
  g.restore();
}
function golgi(g, x, y, w, seed, o = {}) {
  const R = rng(seed), n = o.n ?? 5, tw = w * .085, gap = tw * 1.25; g.save(); g.translate(x, y); g.rotate(o.rot || 0);
  const c = COL.golgi;
  for (let i = n - 1; i >= 0; i--) {
    const half = w * .5 * (1 - i * .07), yy = -n * gap / 2 + i * gap, cv = w * .14;
    const j = () => (R() - .5) * tw * .5, pts = [[-half, yy + cv + j()], [-half * .55, yy - cv * .35 + j()], [0, yy - cv * .6 + j()], [half * .55, yy - cv * .35 + j()], [half, yy + cv + j()]];
    const tw2 = tw * (.75 + R() * .45);
    tube(g, lineP(cr(pts, 10)), tw2, c, { hl: .7 });
    for (const sx of [-1, 1]) { const e = pts[sx < 0 ? 0 : 4]; sphere(g, e[0] + sx * tw2 * .2, e[1], tw2 * (.62 + R() * .25), c, { spec: .7 }); }
  }
  for (let i = 0; i < (o.ves ?? 14); i++) { const sx = R() < .5 ? -1 : 1, a = R(); sphere(g, sx * w * (.48 + R() * .22), -n * gap / 2 + (a - .15) * n * gap * 1.6, tw * (.25 + R() * .5), R() < .25 ? lit(c, .2) : c, { spec: .9 }); }
  g.restore();
}
function nucleus(g, x, y, r, seed, o = {}) {
  const R = rng(seed), c = COL.nuc, P = circleP(x, y, r);
  sphere(g, x, y, r, c, { tex: TEX.grain, texA: .7, texS: Math.max(.15, r / 220), spec: .5, rimA: .5, rimC: [220, 150, 255] });
  // nuclear pores
  for (let i = 0; i < (o.pores ?? 60); i++) {
    const a = R() * TAU, d = Math.sqrt(R()) * .93, px = x + Math.cos(a) * d * r, py = y + Math.sin(a) * d * r, f = Math.sqrt(1 - d * d), pr = r * .035;
    g.save(); g.translate(px, py); g.rotate(a); g.scale(Math.max(.25, f), 1);
    g.fillStyle = rgba([40, 10, 70], .85); g.beginPath(); g.arc(0, 0, pr, 0, TAU); g.fill();
    g.strokeStyle = rgba([220, 170, 255], .55); g.lineWidth = pr * .45; g.beginPath(); g.arc(0, 0, pr * 1.15, Math.PI * .9, Math.PI * 2.1); g.stroke(); g.restore();
  }
  // cut-away opening showing the inside
  const cx = x + r * (o.cx ?? .1), cy = y + r * (o.cy ?? .02), cr2 = r * (o.cut ?? .64);
  const hole = circleP(cx, cy, cr2);
  const hg = g.createRadialGradient(cx + cr2 * .35, cy + cr2 * .35, cr2 * .1, cx, cy, cr2); hg.addColorStop(0, rgba([120, 50, 200])); hg.addColorStop(.7, rgba([58, 16, 110])); hg.addColorStop(1, rgba([26, 6, 52]));
  g.fillStyle = hg; g.fill(hole); texOver(g, hole, TEX.grain, { alpha: .8, scale: Math.max(.12, r / 300) });
  innerShadow(g, hole, 'rgba(10,0,25,.95)', cr2 * .35, -cr2 * .1, -cr2 * .12);
  // chromatin specks
  g.save(); g.clip(hole); for (let i = 0; i < 80; i++) { const a = R() * TAU, d = Math.sqrt(R()) * cr2; g.fillStyle = rgba([200, 140, 255], .25 + R() * .35); g.beginPath(); g.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, cr2 * (.008 + R() * .02), 0, TAU); g.fill(); } g.restore();
  // rim of the cut (thickness of the double envelope)
  g.save(); g.lineWidth = r * .07; g.strokeStyle = rgba([175, 105, 245]); g.stroke(hole); g.lineWidth = r * .025; g.strokeStyle = rgba([235, 200, 255], .7); g.translate(-r * .012, -r * .015); g.stroke(hole); g.restore();
  // nucleolus
  sphere(g, cx + cr2 * .08, cy + cr2 * .12, cr2 * .42, COL.nucl, { tex: TEX.grain, texA: .8, texS: Math.max(.12, r / 400), spec: .9, rimC: [190, 130, 255] });
  return P;
}
function erSheet(g, pts, w, seed, o = {}) { // folded ER cisterna with ribosomes on the upper edge
  const R = rng(seed), d = cr(pts, 10);
  tube(g, lineP(d), w, o.c || COL.er);
  if (o.ribo !== false) for (let i = 0; i < d.length; i += o.every ?? 3) { const [x, y] = d[i]; sphere(g, x + (R() - .5) * w * .3, y - w * .42, w * (o.rr ?? .13), COL.ribo, { spec: .9, rimA: .2 }); }
}

// ---------- the cell: overview world (1080-wide frame, cell centred near (560, 610) at zoom 1) ----------
const HEX = [[300, 280], [700, 215], [872, 425], [848, 905], [520, 1002], [232, 842]];
const CC = HEX.reduce((a, q) => [a[0] + q[0] / 6, a[1] + q[1] / 6], [0, 0]);
const INNER = insetPoly(HEX, 22), MEMB = insetPoly(HEX, 25);
const VAC = [[380, 330], [520, 292], [640, 300], [662, 382], [604, 452], [578, 560], [522, 640], [440, 628], [396, 540], [372, 430]];
const NUC = [735, 520, 95];

function paintCell(g, xray) {
  const R = rng(7);
  // neighbours: reflect the cell across each wall; a second ring further out, blurred
  const ring1 = HEX.map((a, i) => HEX.map(q => reflect(q, a, HEX[(i + 1) % 6])));
  const ring2 = []; ring1.forEach((poly, j) => poly.forEach((a, i) => { const b = poly[(i + 1) % 6]; const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; if (Math.hypot(m[0] - CC[0], m[1] - CC[1]) > 330) ring2.push(poly.map(q => reflect(q, a, b))); }));
  const neighbour = (t, polys, dim, seed) => polys.forEach((poly, j) => {
    const c = poly.reduce((a, q) => [a[0] + q[0] / 6, a[1] + q[1] / 6], [0, 0]);
    const ig = t.createRadialGradient(c[0], c[1], 20, c[0], c[1], 380); ig.addColorStop(0, rgba([8, 34, 14])); ig.addColorStop(.75, rgba([3, 14, 6])); ig.addColorStop(1, rgba([16, 52, 14]));
    t.fillStyle = ig; t.fill(lineP(poly, true));
    poly.forEach((a, i) => fiberBand(t, a, poly[(i + 1) % 6], 40, seed + j * 13 + i, { mid: drk(COL.wall, dim), dark: [6, 26, 6], light: drk([170, 240, 100], dim), density: .035 }));
  });
  g.fillStyle = '#020905'; g.fillRect(OX, OY, OWW, OWH);
  blurLayer(g, 7, t => neighbour(t, ring2, .55, 500));
  blurLayer(g, 2.2, t => neighbour(t, ring1, .3, 300));
  // interior
  const inner = lineP(INNER, true);
  g.save(); g.clip(inner);
  fieldBase(g, 200, 200, 700, 820, 11, { n: 1100, step: 6, lw: .8, ts: .6 });
  dots(g, 230, 230, 640, 760, 120, 12, [70, 150, 255], 2, 6, { spec: .8 });
  // ER around the nucleus
  for (let k = 0; k < 6; k++) {
    const rr = NUC[2] + 26 + k * 17, pts = [];
    for (let a = .15; a <= 3.5; a += .22) pts.push([NUC[0] + Math.cos(a) * rr + Math.sin(a * 5 + k) * 6, NUC[1] + Math.sin(a) * rr * 1.05 + Math.cos(a * 4 + k) * 6]);
    erSheet(g, pts, 11, 40 + k, { every: 4, rr: .2 });
  }
  // vacuole
  const vac = smoothP(VAC); liquidBody(g, vac, [370, 290, 295, 352], { caus: .22, cs: .35 });
  bubbles(g, 380, 300, 280, 330, 26, 21, 2, 9, (x, y) => g.isPointInPath(vac, x * OS - OX * OS, y * OS - OY * OS));
  nucleus(g, NUC[0], NUC[1], NUC[2], 31, { pores: 70 });
  chloroplast(g, 362, 478, 52, 96, .1, 51);
  chloroplast(g, 358, 708, 56, 100, -.06, 52);
  chloroplast(g, 482, 722, 72, 42, -.22, 53, { grid: .72 });
  mitochondrion(g, 592, 782, 62, 28, -.15, 61);
  mitochondrion(g, 722, 742, 62, 28, -.1, 62);
  mitochondrion(g, 790, 640, 40, 20, 1.3, 63);
  golgi(g, 612, 892, 175, 71, { n: 5, ves: 16 });
  // polysome cluster + free ribosomes
  for (let i = 0; i < 9; i++) { const a = i * .75, r = 6 + i * 2.2; sphere(g, 455 + Math.cos(a) * r, 868 + Math.sin(a) * r, 5.5, COL.ribo, { spec: 1 }); }
  dots(g, 260, 260, 600, 720, 110, 13, COL.ribo, 2, 4.5);
  dots(g, 260, 600, 560, 380, 18, 14, [130, 60, 220], 4, 9);
  innerShadow(g, inner, 'rgba(0,10,0,.9)', 26, 4, 6);
  g.restore();
  // plasma membrane
  g.save(); g.strokeStyle = rgba(COL.mem, .9); g.lineWidth = 3; g.stroke(lineP(MEMB, true)); g.strokeStyle = rgba([255, 170, 230], .5); g.lineWidth = 1; g.stroke(lineP(insetPoly(HEX, 27), true)); g.restore();
  // the wall
  const band = new Path2D(); band.addPath(lineP(insetPoly(HEX, -22), true)); band.addPath(lineP(INNER, true));
  g.save(); g.clip(band, 'evenodd');
  HEX.forEach((a, i) => fiberBand(g, a, HEX[(i + 1) % 6], 46, 200 + i, { density: .07, sc: .8 }));
  g.restore();
  // plasmodesmata pits along the wall
  [[.3, 0], [.7, 1], [.45, 2], [.5, 3], [.35, 4], [.6, 5]].forEach(([f, i]) => { const a = HEX[i], b = HEX[(i + 1) % 6], x = lerp(a[0], b[0], f), y = lerp(a[1], b[1], f); g.fillStyle = 'rgba(8,30,6,.85)'; g.beginPath(); g.arc(x, y, 4, 0, TAU); g.fill(); g.strokeStyle = 'rgba(200,255,140,.5)'; g.lineWidth = 1; g.stroke(); });
}


// the closed cell as a rotating box (shot 1), then it opens into the cutaway
function drawPrism(g, cam, lt, alpha) {
  alpha *= 1 - ss(p(lt, 1.15, .4)); if (alpha <= 0) return;
  const u = clamp(lt / 1.5), yaw = lerp(-1.05, 0, eio(u)), pitch = lerp(.42, 0, eio(u));
  g.save(); g.globalAlpha = alpha;
  SZ.prism(g, HEX, CC, 430, yaw, pitch, q => [F.FX + (CC[0] + q[0] - cam.x) * cam.z, F.FY + (CC[1] + q[1] - cam.y) * cam.z], TEX.fiber, { edge: [96, 196, 44], edgeW: 22, scale: cam.z });
  g.restore();
}

// ---------- close-up plates: painted in a 1240-wide frame with the subject around (620, 735); PY0..PY0+PH is what the layout shows ----------
const PAINT = {
  wall(g) {
    g.fillStyle = '#020a05'; g.fillRect(0, PY0, PW, PH);
    const bgG = g.createRadialGradient(250, 700, 50, 250, 700, 900); bgG.addColorStop(0, '#0c2a10'); bgG.addColorStop(1, '#010402'); g.fillStyle = bgG; g.fillRect(0, PY0, PW, PH);
    // the neighbouring cell, out of focus on the left
    blurLayer(g, 16, t => { fieldBase(t, -100, PY0, 700, PH, 2, { n: 300, c0: [6, 30, 40], c1: [2, 12, 16], lw: 2 }); chloroplast(t, 180, 420, 150, 230, .4, 6); chloroplast(t, 120, 1250, 170, 240, -.3, 7); fiberBand(t, [-200, 300], [620, -420], 230, 3, { density: .02, sc: 2.2, mid: [40, 100, 24] }); });
    const A = [1014, -492], B = [226, 2063], T = 330, d = [B[0] - A[0], B[1] - A[1]], l = Math.hypot(...d), nx = d[1] / l, ny = -d[0] / l; // n → right side
    const strip = (o0, o1) => lineP([[A[0] + nx * o0 - d[0] * .2, A[1] + ny * o0 - d[1] * .2], [B[0] + nx * o0 + d[0] * .2, B[1] + ny * o0 + d[1] * .2], [B[0] + nx * o1 + d[0] * .2, B[1] + ny * o1 + d[1] * .2], [A[0] + nx * o1 - d[0] * .2, A[1] + ny * o1 - d[1] * .2]], true);
    // right of the wall: membrane, a sliver of cytoplasm, then the vacuole
    const vac = strip(250, 900); liquidBody(g, vac, [700, PY0, 700, PH], { caus: .25, cs: 1.1 });
    bubbles(g, 760, PY0, 500, PH, 40, 8, 4, 22, (x, y) => g.isPointInPath(vac, x, y));
    const cy = strip(178, 250); g.save(); g.clip(cy); fieldBase(g, 400, 0, 900, PH, 9, { n: 500, lw: 1.4, step: 10 }); dots(g, 400, 0, 900, PH, 60, 10, COL.ribo, 3, 8); g.restore();
