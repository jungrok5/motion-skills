<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I Quit · paper-desk</title>
<!--
  paper-desk worked example — topic: "a resignation letter you can write, fold for the envelope, crumple, spill your
  coffee on and set on fire". Made through the flow: BRIEF.md → this page → scripts/check.mjs → stills reviewed.
  Designed for the topic: an office memo on 80 g copy paper; a grey laminate desk under a cool office lamp; a mug of
  coffee, a pencil, a paper clip and a stapler (a prop made in this page); a Tone slider that rewrites the letter live;
  the acts fold (into thirds), crumple, burn and coffee stain; the dock's wording.
-->
<style>
  :root { --bg: #0b0c0d; --chip: #e9ecef; --chip-ink: #1d2328; --line: rgba(29, 35, 40, .2); --f-ui: "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
    --f-type: "Courier Prime", "Courier New", Courier, ui-monospace, monospace; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: #e9ecef; font-family: var(--f-ui); }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #desk { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------------- the letter: a typed office memo (white = the copy paper, ink = toner) ---------------- */
  #sheet { --ink: #16191d; position: absolute; left: 0; top: 0; width: 560px; height: 792px; box-sizing: border-box; overflow: hidden;
    padding: 46px 52px 34px; background: #fff; color: var(--ink); color-scheme: light; display: flex; flex-direction: column; gap: 12px;
    font: 15.5px/1.55 var(--f-type); -webkit-font-smoothing: antialiased; }
  #sheet * { box-sizing: border-box; }
  #sheet ::selection { background: rgba(255, 214, 0, .55); }
  #sheet .lh { display: flex; justify-content: space-between; align-items: baseline; font: 700 11px/1 var(--f-ui); letter-spacing: .22em; text-transform: uppercase; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
  #sheet .lh span:last-child { font-weight: 500; letter-spacing: .08em; }
  #sheet dl { display: grid; grid-template-columns: 70px 1fr; gap: 4px 10px; margin: 6px 0 0; font-size: 14px; }
  #sheet dt { font: 600 11px/2 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
  #sheet dd { margin: 0; }
  #sheet input[type=text], #sheet select { font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1px dotted currentColor; padding: 1px 2px; width: 100%; outline: none; }
  #sheet h1 { margin: 10px 0 2px; font: 700 44px/1.05 var(--f-ui); letter-spacing: -.02em; outline: none; }
  #sheet .body { outline: none; }
  #sheet .body p { margin: 0 0 10px; }
  #sheet .row { display: flex; align-items: center; gap: 10px; font: 12px/1.2 var(--f-ui); letter-spacing: .04em; }
  #sheet .row input[type=range] { flex: 1; accent-color: var(--ink); }
  #sheet .row b { font-weight: 600; min-width: 64px; }
  #sheet h2 { margin: 6px 0 4px; font: 700 10.5px/1 var(--f-ui); letter-spacing: .2em; text-transform: uppercase; }
  #sheet .todo { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; font-size: 14px; }
  #sheet .todo label { display: flex; align-items: center; gap: 7px; }
  #sheet .todo input:checked + span { text-decoration: line-through; opacity: .55; }
  #sheet input[type=checkbox] { accent-color: var(--ink); margin: 0; width: 15px; height: 15px; }
  #sheet .ps { font-style: italic; }
  #sheet .sign { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; border-top: 1px solid var(--ink); padding-top: 10px; font: 12px/1.4 var(--f-ui); }
  #sheet .sign .sig { font: 30px/1 "Segoe Script", "Brush Script MT", "Snell Roundhand", cursive; min-width: 170px; text-align: right; }
  #sheet button.psb { font: 600 11px var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); background: transparent; border: 1px solid var(--ink); border-radius: 2px; padding: 4px 8px; cursor: pointer; }
  #sheet .stamp { position: absolute; right: 44px; top: 96px; transform: rotate(-8deg); border: 2.5px solid #b3261e; color: #b3261e; border-radius: 4px; padding: 3px 9px; font: 800 14px/1.1 var(--f-ui); letter-spacing: .18em; opacity: .8; pointer-events: none; }
  #sheet :focus-visible { outline: 2px solid rgba(0, 90, 200, .5); outline-offset: 1px; }
  #sheet h1:focus-visible, #sheet .body:focus-visible { outline: none; }

  .ui { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 14px 16px; z-index: 2; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .title { font: 600 14px/1.3 var(--f-ui); letter-spacing: .04em; text-shadow: 0 1px 3px #000; }
  .title small { display: block; font-weight: 400; font-size: 11.5px; color: #9aa3ab; letter-spacing: 0; }
  .chip { pointer-events: auto; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--chip); color: var(--chip-ink); font: 500 13px var(--f-ui); cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
  .chip[aria-pressed=false] { opacity: .7; }
  .bottom { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .hint { font: 13.5px var(--f-ui); background: rgba(8, 9, 10, .62); padding: 4px 12px; border-radius: 12px; text-shadow: 0 1px 2px #000; text-align: center; }
  .dock { pointer-events: auto; display: flex; gap: 2px; padding: 4px; border-radius: 4px; background: var(--chip); border: 1px solid var(--line); box-shadow: 0 3px 12px rgba(0, 0, 0, .55); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .dock button { height: 38px; padding: 0 12px; border: 0; border-radius: 3px; background: transparent; color: var(--chip-ink); font: 500 14px var(--f-ui); cursor: pointer; white-space: nowrap; }
  .dock button:hover { background: rgba(29, 35, 40, .1); }
  .dock button[aria-pressed=true] { background: var(--chip-ink); color: var(--chip); }
  .dock .sep { width: 1px; margin: 7px 4px; background: var(--line); flex: none; }
  @media (max-width: 600px) { .dock button { padding: 0 8px; font-size: 12.5px; } .title small { display: none; } }
  .pd-fallback, .pd-fallback body { overflow: auto; height: auto; }
  .pd-fallback #stage { position: static; overflow: visible; }
  .pd-fallback .ui { position: static; }
  .pd-fallback .dock, .pd-fallback .hint { display: none; }
  .hic-fallback #sheet { position: relative; width: min(560px, 100%); height: auto; margin: 16px auto; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="desk" layoutsubtree content="drawable" aria-label="A resignation letter on an office desk">
    <article id="sheet" drawable>
      <div class="lh"><span>Internal memo</span><span id="today">Monday</span></div>
      <div class="stamp" id="stamp">FINAL</div>
      <dl>
        <dt>To</dt><dd><input type="text" id="to" value="R. Pruitt, Head of Operations" aria-label="To"></dd>
        <dt>From</dt><dd><input type="text" id="from" value="Sam Okafor, Desk 14" aria-label="From"></dd>
        <dt>Leaving</dt><dd><select id="when" aria-label="Last day"><option value="in two weeks">in two weeks</option><option value="at the end of the month">at the end of the month</option><option value="on Friday">on Friday</option><option value="today, at five">today, at five</option></select></dd>
      </dl>
      <h1 id="head" contenteditable="true" spellcheck="false" data-hic-edit data-pd-probe aria-label="Headline">I quit.</h1>
      <div class="row"><span>Tone</span><input type="range" id="tone" min="0" max="2" step="1" value="1" aria-label="Tone"><b id="toneName">Honest</b></div>
      <div class="body" id="body" contenteditable="true" spellcheck="false" aria-label="Letter">
        <p id="p1" data-pd-select></p>
        <p id="p2"></p>
      </div>
      <h2>Before I go</h2>
      <div class="todo">
        <label><input type="checkbox"> <span>Return the stapler</span></label>
        <label><input type="checkbox"> <span>Water the fern</span></label>
        <label><input type="checkbox"> <span>Hand over the keys</span></label>
        <label><input type="checkbox"> <span>Say goodbye to Dee</span></label>
      </div>
      <p class="ps" id="ps" hidden>P.S. The stapler was always mine.</p>
      <div class="sign">
        <span>Signed, with no hard feelings<br><button type="button" class="psb" id="psb" data-hic-click>Add a P.S.</button></span>
        <span class="sig" id="sig">Sam Okafor</span>
      </div>
    </article>
  </canvas>
  <div class="ui">
    <div class="top">
      <div class="title">I Quit<small>a resignation letter on a live page</small></div>
      <button class="chip" type="button" data-pd="sound">Sound</button>
    </div>
    <div class="bottom">
      <div class="hint" data-pd-hint>&nbsp;</div>
      <div class="dock" role="toolbar" aria-label="What to do with the letter">
        <button type="button" data-pd-tool="type" aria-pressed="true">Type</button>
        <button type="button" data-pd-tool="fold" aria-pressed="false">Fold</button>
        <button type="button" data-pd-tool="crumple" aria-pressed="false">Crumple</button>
        <button type="button" data-pd-tool="stain" aria-pressed="false">Spill coffee</button>
        <button type="button" data-pd-tool="burn" aria-pressed="false">Burn it</button>
        <span class="sep"></span>
        <button type="button" data-pd="flatten">Smooth out</button>
        <button type="button" data-pd="fresh">Start over</button>
      </div>
    </div>
  </div>
</div>
<script src="../../lib/hic.js"></script>
<script src="../../lib/paper-desk.js"></script>
<script>
(function () {
  'use strict';
  // a prop this topic needs and the kit lacks: a desk stapler, made from boxes in the page (no library edit)
  PaperDesk.PROPS.stapler = function (B, o) {
    var body = PaperDesk.color(o.color || '#2c2f33'), steel = PaperDesk.color('#a9adb3'), M = HIC.mat4;
    B.box(1.25, 0.34, 0.07, body, PaperDesk.MAT.satin);                                   // base
    B.push(M.translate(0.04, 0, 0.07)); B.box(1.1, 0.24, 0.05, steel, PaperDesk.MAT.metal); B.pop();   // anvil
    B.push(M.mul(M.translate(-0.55, 0, 0.12), M.rotY(-0.06))); B.push(M.translate(0.6, 0, 0)); B.box(1.2, 0.28, 0.16, body, PaperDesk.MAT.gloss); B.pop(); B.pop();  // arm
    B.push(M.translate(-0.48, 0, 0.07)); B.box(0.16, 0.3, 0.2, body, PaperDesk.MAT.satin); B.pop();   // hinge
  };
  var sheet = document.getElementById('sheet');
  var desk = PaperDesk.create({
    canvas: document.getElementById('desk'), sheet: sheet,
    stock: 'copy', desk: { kind: 'laminate', a: [0.075, 0.082, 0.09], b: [0.11, 0.118, 0.125], gloss: 0.5 },
    lamp: { pos: [-2.6, 2.9, 4.6], color: [0.92, 0.96, 1.0], power: 1.3, cone: 0.78 },
    room: { sky: [0.07, 0.085, 0.10], ground: [0.035, 0.035, 0.035], off: 0.2 },
    props: [
      { kind: 'mug', at: [1.42, 0.55], rot: 0.5, color: '#c8d3dc', fill: '#2a1306' },
      { kind: 'pencil', at: [1.3, -0.25], rot: 1.75, color: '#e0ad1a' },
      { kind: 'stapler', at: [-1.42, 0.52], rot: 1.45 },
      { kind: 'clip', at: [-1.3, -0.55], rot: 0.4 },
      { kind: 'clip', at: [-1.38, -0.68], rot: 1.1 }
    ],
    acts: { curl: true, fold: { max: 3 }, crumple: true, stain: { color: '#5a3416', size: 0.28 }, burn: { max: 6, size: 0.4, speed: 2.4 } },
    hints: {
      type: 'Click the letter and type. Drag a corner to lift it.',
      fold: 'Drag across the letter to fold it in thirds for the envelope.',
      crumple: 'Press and hold to crumple it. Let go to give it another chance.',
      stain: 'Click to knock the coffee over.',
      burn: 'Click to set it alight. You can keep typing while it burns.'
    }
  });
  desk.wire();

  // ---- the letter itself: ordinary DOM code
  var $ = function (id) { return document.getElementById(id); };
  var TONES = [
    ['Polite', 'Please accept this letter as formal notice of my resignation. It has been a privilege to work with the team, and I am grateful for every opportunity I have had here.'],
    ['Honest', 'This is my notice. I have learned a great deal here, mostly about the printer on the third floor and how long a meeting can run without an agenda.'],
    ['Blunt', 'I am leaving. The coffee is cold, the fern is dying and the printer has been jammed since March. I will miss exactly one person, and she already knows.']
  ];
  function write() {
    var t = TONES[+$('tone').value];
    $('toneName').textContent = t[0]; $('p1').textContent = t[1];
    $('p2').textContent = 'My last day will be ' + $('when').value + '. I will hand over my work in good order before then, and leave the desk cleaner than I found it.';
  }
  $('tone').addEventListener('input', write); $('when').addEventListener('change', write); write();
  $('from').addEventListener('input', function () { $('sig').textContent = $('from').value.split(',')[0] || ' '; });
  $('psb').addEventListener('click', function () { var ps = $('ps'); ps.hidden = !ps.hidden; $('psb').textContent = ps.hidden ? 'Add a P.S.' : 'Remove the P.S.'; });
  $('today').textContent = 'Room 4B · Monday';
})();
</script>
</body>
</html>
