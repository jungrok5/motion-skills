<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Island Loop · ride planner</title>
<!--
  exploded-view-map — the template: a ride planner for a small volcanic island, taken apart in 3D.
  This is an EXAMPLE of the style, not a form to fill in. For a new topic, write BRIEF.md first (references/BRIEF.md),
  then redesign: the height function (or a layer list), the levels, the palette variants, the cards' HTML and
  wording, the readouts, the slider's meaning, the pins, the route, the desk and the sound. Everything that is topic is
  marked "TOPIC". The engine (lib/exploded.js) stays as it is.
-->
<link rel="stylesheet" href="../lib/exploded.css">
<style>
  /* TOPIC: palette and type. System font stacks only (no network). */
  :root { --ink: #1f2a2e; --ink2: #586469; --ink3: #8b9599; --rule: #e3e1da; --card: #fffdf8; --paper: #f5f1e8; --accent: #d9542b; --soft: #eef0ec; }
  body { background: #d8d2c4; color: var(--ink); font: 14px/1.38 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  /* layout: the flat page. The map box ([data-ev-map]) and the base map ([data-ev-base]) share --mx --my --mw --mh. */
  #page { width: 1180px; height: 700px; --mx: 20px; --my: 20px; --mw: 660px; --mh: 660px; }
  [data-ev=sheet] { background: var(--paper); border-radius: 16px; }
  [data-ev-base], [data-ev-map] { left: var(--mx); top: var(--my); width: var(--mw); height: var(--mh); }
  [data-ev-base] { border-radius: 4px; }
  #side { position: absolute; left: 700px; top: 20px; width: 460px; height: 660px; display: flex; flex-direction: column; gap: 12px; }
  @media (max-width: 760px) {
    #page { width: 400px; height: 1030px; --mx: 10px; --my: 10px; --mw: 380px; --mh: 380px; }
    #side { left: 10px; top: 402px; width: 380px; height: 618px; }
  }
  .card { position: relative; background: var(--card); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--rule); padding: 15px 18px; }
  .eyebrow { font-size: 11px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--ink3); }
  .brand { display: flex; align-items: center; gap: 8px; margin: -2px 0 10px; color: var(--ink2); font-size: 13px; }
  .brand svg { width: 18px; height: 18px; }
  .brand b { color: var(--ink); font-weight: 650; }
  .brand .meta { margin-left: auto; font-size: 11px; color: var(--ink3); }
  #title { display: block; width: 100%; box-sizing: border-box; margin: 4px 0 4px -8px; padding: 2px 8px 3px; border: 0; border-radius: 8px; background: transparent;
    font: italic 400 32px/1.15 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; color: var(--ink); caret-color: var(--accent); }
  #title:hover, #title:focus { background: var(--soft); outline: none; }
  .card p { margin: 0; color: var(--ink2); }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); }
  .nums > div + div { border-left: 1px solid var(--rule); padding-left: 16px; }
  .nums output { display: block; font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .nums output span { font-size: 13px; font-weight: 500; color: var(--ink2); margin-left: 3px; }
  #profile { display: block; width: 100%; height: 78px; margin-top: 8px; overflow: visible; }
  #profile .area { fill: rgba(217, 84, 43, .11); } #profile .line { fill: none; stroke: var(--accent); stroke-width: 1.8; }
  #profile .dot { fill: var(--accent); } #profile .cur { fill: #fff; stroke: var(--accent); stroke-width: 2.5; }
  #profile text { font: 650 9.5px system-ui, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; }
  .row { display: flex; align-items: baseline; justify-content: space-between; }
  #clock { font-size: 13px; }
  #sun { appearance: none; -webkit-appearance: none; display: block; width: 100%; height: 24px; margin: 6px 0 2px; background: transparent; cursor: pointer; }
  #sun::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #f0a35e, #f8e2a0 22%, #fdf7e2 45%, #f8e2a0 68%, #ec7d4b 86%, #34406b 93%, #1b2240); }
  #sun::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px var(--ink), 0 2px 4px rgba(0,0,0,.25); }
  #sun:focus { outline: none; }
  .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink3); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 10px; padding: 3px; border-radius: 10px; background: var(--soft); }
  .seg label { position: relative; text-align: center; padding: 6px 0; border-radius: 7px; font-weight: 550; color: var(--ink2); cursor: pointer; }
  .seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .seg label:has(input:checked) { background: var(--ink); color: #fff; }
  #c-stops { flex: 1; min-height: 0; padding: 12px 10px 6px; }
  #c-stops .eyebrow { padding: 0 8px 6px; }
  #stops { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 6px; }
  .stop { appearance: none; display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 10px; width: 100%; border: 0; background: none; border-radius: 9px;
    padding: 7px 8px; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .stop b { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; }
  .stop em { display: block; font: italic 18px/1.05 "Iowan Old Style", Palatino, Georgia, serif; }
  .stop small { display: block; font-size: 12px; color: var(--ink3); }
  .stop:hover, .stop.hot, .stop:focus-visible { background: var(--soft); outline: none; }
  .ev-pin em { font-family: "Iowan Old Style", Palatino, Georgia, serif; }

  /* the bar outside the canvas */
  .ev-bar { position: fixed; left: 0; right: 0; bottom: 20px; z-index: 3; display: flex; justify-content: center; align-items: center; gap: 10px; pointer-events: none; }
  .ev-bar button { pointer-events: auto; appearance: none; border: 0; border-radius: 999px; padding: 11px 20px 12px; background: #1f2a2e; color: #fff; font: 600 14px/1 system-ui, sans-serif; cursor: pointer; box-shadow: 0 6px 18px -6px rgba(0,0,0,.5); }
  .ev-bar #toggle { min-width: 196px; }
  .ev-bar #snd { background: rgba(255,255,255,.85); color: #1f2a2e; }
  .ev-bar .hint { font-size: 13px; color: #4b5261; transition: color .4s; }
  html.ev-apart .ev-bar .hint { color: #e9e4da; }
  @media (max-width: 760px) { .ev-bar .hint { display: none; } }
</style>
</head>
<body>
<canvas id="stage" layoutsubtree content="drawable" aria-label="A ride planner, taken apart in layers">
  <div id="page">
    <div data-ev="sheet" drawable><div data-ev-base></div></div>
    <div data-ev-map></div>
    <aside id="side">
      <section class="card" data-ev="card" drawable>
        <div class="brand"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="5" cy="14" r="4" fill="none" stroke="#1f2a2e" stroke-width="1.6"/><circle cx="15" cy="14" r="4" fill="none" stroke="#1f2a2e" stroke-width="1.6"/><path d="M5 14l4-7h5l1 7M8 5h3" fill="none" stroke="#d9542b" stroke-width="1.6"/></svg><b>Ride planner</b><span class="meta mono">Contours every 50 m</span></div>
        <label class="eyebrow" for="title">Ride</label>
        <input id="title" data-hic-edit type="text" value="The Crater Loop" spellcheck="false" autocomplete="off" maxlength="48">
        <p>Clockwise from the harbour, up the old lava road to the rim.</p>
      </section>
      <section class="card" data-ev="card" drawable>
        <div class="nums">
          <div><span class="eyebrow">Distance</span><output id="s-km"></output></div>
          <div><span class="eyebrow">Climb</span><output id="s-up"></output></div>
          <div><span class="eyebrow">Time</span><output id="s-h"></output></div>
        </div>
        <svg id="profile" viewBox="0 0 424 78" preserveAspectRatio="none" role="img" aria-label="Height along the ride"></svg>
      </section>
      <section class="card" data-ev="card" drawable>
        <div class="row"><label class="eyebrow" for="sun">Sun</label><output id="clock" class="mono" for="sun"></output></div>
        <input id="sun" type="range" min="0" max="1000" value="380" step="1" aria-label="Time of day">
        <div class="ends"><span>Sunrise</span><span>Night</span></div>
        <div class="seg" role="radiogroup" aria-label="Season">
          <label><input type="radio" name="season" value="dry" checked>Dry season</label>
          <label><input type="radio" name="season" value="green">Green season</label>
        </div>
      </section>
      <section class="card" id="c-stops" data-ev="card" drawable>
        <div class="eyebrow">Stops</div>
        <div id="stops"></div>
      </section>
    </aside>
  </div>
</canvas>
<div class="ev-bar"><button id="toggle" type="button">Take it apart</button><span class="hint">Drag to turn · scroll to pull apart · click a layer to lift it</span><button id="snd" type="button" aria-pressed="false">Sound off</button></div>

<script src="../lib/hic.js"></script>
<script src="../lib/terrain.js"></script>
<script src="../lib/paper-sound.js"></script>
<script src="../lib/exploded.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); }, T = EVTerrain;

  // ---- TOPIC: the ground. One height function over the unit square, in metres. A volcano with three ridges, a crater,
  // a coastal shelf; the sea floor is the base sheet (everything under the first level).
  var cone = T.ridges([
    [[0.47, 0.49, 640], [0.58, 0.40, 470], [0.72, 0.36, 260], [0.88, 0.24, 40]],
    [[0.47, 0.49, 640], [0.38, 0.60, 450], [0.27, 0.74, 220], [0.16, 0.84, 30]],
    [[0.47, 0.49, 640], [0.44, 0.33, 380], [0.33, 0.20, 120]],
    [[0.58, 0.40, 470], [0.66, 0.58, 330], [0.74, 0.74, 90]]
  ], { fall: 1500, shoulder: 1100, base: 0, sharp: 0.02 });
  var shelf = T.bumps([{ at: [0.45, 0.55], r: 0.33, h: 260 }, { at: [0.28, 0.72], r: 0.16, h: 120 }, { at: [0.70, 0.40], r: 0.18, h: 110 }], -260);
  var crater = T.bumps([{ at: [0.47, 0.49], r: 0.032, h: -80 }]);
  var height = T.floor(T.rough(T.warp(function (u, v) { var a = cone(u, v), b = shelf(u, v); return Math.max(a, b) + 0.25 * Math.min(a, b) * 0 + crater(u, v); }, 0.06, 2.2, 11), 45, 7, 4,
    function (h) { return Math.max(0.3, Math.min(1, h / 300)); }), -110, 30);

  // TOPIC: the stops and the route through them (u, v on the map)
  var PINS = [
    { id: 'harbour', name: 'Porto Velho', note: 'harbour', at: [0.22, 0.86] },
    { id: 'cafe', name: 'Café Basalto', note: 'café', at: [0.33, 0.62] },
    { id: 'rim', name: 'Crater rim', note: '', at: [0.505, 0.47] },
    { id: 'beach', name: 'Praia Negra', note: 'beach', at: [0.70, 0.74] }
  ];
  var ROUTE = [[0.22, 0.86], [0.27, 0.76], [0.33, 0.62], [0.38, 0.56], [0.44, 0.535], [0.505, 0.47], [0.56, 0.52], [0.60, 0.60], [0.66, 0.69], [0.70, 0.74], [0.58, 0.82], [0.42, 0.86], [0.30, 0.88], [0.22, 0.86]];
  var KM_ACROSS = 11;                                   // TOPIC: how wide the map is

  var view = ExplodedView.create(document.getElementById('stage'), {
    terrain: { height: height, levels: { from: 0, step: 50, count: 14 }, grid: 160, minor: 3,
      labels: { from: [0.47, 0.49], to: [0.1, 0.3], text: function (l) { return String(l); } },
      tag: function (l) { return l + ' m and up'; }, aria: function (l) { return 'Land above ' + l + ' metres'; } },
    variants: {                                         // TOPIC: palettes, low → high, one per season
      dry: { ramp: ['#e9d9b4', '#e3cf9f', '#d9c08e', '#cdb284', '#c4a983', '#bfa88e', '#c9b9a6', '#dcd2c4', '#efe9e0'], base: '#9fc6cf', minor: 'rgba(70,55,30,.2)', label: 'rgba(70,55,30,.75)' },
      green: { ramp: ['#e6dcb8', '#b7cf95', '#9cc183', '#86b276', '#78a56d', '#7f9f72', '#9aa78a', '#c3c2b0', '#ebe8de'], base: '#8cc2d0', minor: 'rgba(30,60,30,.2)', label: 'rgba(30,60,30,.72)' }
    },
    variant: 'dry',
    material: { thickness: 7, gap: 19, core: '#efe4cf', weight: 1 },          // TOPIC: the card stock
    desk: { color: '#d8d2c4', lit: '#45566a', pattern: 'wood' },
    route: { points: ROUTE, color: '#d9542b' },
    pins: PINS, marker: true,
    camera: { yaw: 0.2, tilt: 0.98 },
    intro: { delay: 0.7, apart: 1 }
  });

  // ---- readouts (TOPIC: units and rules of thumb)
  var km = view.route.length * KM_ACROSS, up = Math.round(view.route.ascent / 10) * 10, hours = km / 15 + up / 550;
  $('#s-km').innerHTML = km.toFixed(1) + '<span>km</span>';
  $('#s-up').innerHTML = up + '<span>m</span>';
  $('#s-h').innerHTML = Math.floor(hours) + '<span>h</span> ' + String(Math.round(hours % 1 * 12) * 5).padStart(2, '0') + '<span>min</span>';
  // the height profile with the stops on it
  var prof = $('#profile'), P = view.route.profile, W = 424, H = 78, lo = Math.min.apply(null, P.map(function (p) { return p[1]; })), hi = Math.max.apply(null, P.map(function (p) { return p[1]; }));
  var X = function (d) { return 8 + d / P[P.length - 1][0] * (W - 16); }, Y = function (h) { return H - 4 - (h - lo) / (hi - lo || 1) * (H - 22); };
  var line = P.map(function (p, i) { return (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1); }).join('');
  prof.innerHTML = '<path class="area" d="' + line + 'L' + X(P[P.length - 1][0]) + ' ' + H + 'L8 ' + H + 'Z"/><path class="line" d="' + line + '"/>' +
    PINS.map(function (p, i) { var d = view.route.at[p.id] * P[P.length - 1][0], h = view.heightAt(p.at[0], p.at[1]); return '<circle class="dot" cx="' + X(d) + '" cy="' + Y(h) + '" r="7"/><text x="' + X(d) + '" y="' + Y(h) + '">' + 'ABCD'[i] + '</text>'; }).join('') +
    '<circle class="cur" r="4.5" cx="8" cy="' + Y(P[0][1]) + '"/>';
  var cur = prof.querySelector('.cur');

  // the stops list: rows share data-pin with the map's pins, so they light each other up (the engine wires that)
  $('#stops').innerHTML = PINS.map(function (p, i) {
    return '<button type="button" class="stop" data-pin="' + p.id + '"' + (i === 2 ? ' data-hic-click' : '') + '><b>' + 'ABCD'[i] + '</b><span><em></em><small></small></span></button>';
  }).join('');
  [].forEach.call(document.querySelectorAll('.stop'), function (b, i) { b.querySelector('em').textContent = PINS[i].name; b.querySelector('small').textContent = (PINS[i].note ? PINS[i].note + ' · ' : '') + Math.max(0, Math.round(view.heightAt(PINS[i].at[0], PINS[i].at[1]) / 5) * 5) + ' m'; });

  // ---- the sun (TOPIC: what the slider means). Here: the time of day; the rider is where the plan says at that hour.
  var sun = $('#sun'), season = 'dry';
  var SEASONS = { dry: { rise: 6 * 60 + 20, set: 18 * 60 + 30, maxEl: 1.2, az0: 80, az1: 280 }, green: { rise: 6 * 60 + 5, set: 18 * 60 + 50, maxEl: 1.35, az0: 70, az1: 290 } };
  var START = 7 * 60 + 30;
  function onSun() {
    var f = sun.value / 1000, L = ExplodedView.daylight(f, SEASONS[season]);
    $('#clock').textContent = ExplodedView.clock(L.minutes);
    view.setLight(L);
    var g = Math.max(0, Math.min(1, (L.minutes - START) / (hours * 60)));                   // where the ride is at this hour
    view.setMarker(g);
    var d = g * P[P.length - 1][0]; cur.setAttribute('cx', X(d)); cur.setAttribute('cy', Y(P[Math.min(P.length - 1, Math.round(g * (P.length - 1)))][1]));
  }
  sun.addEventListener('input', onSun);
  var hs = parseFloat(ExplodedView && HIC.param('sun')); if (isFinite(hs)) sun.value = Math.round(hs * 1000);
  [].forEach.call(document.querySelectorAll('input[name=season]'), function (r) {
    if (HIC.param('variant') === r.value) { r.checked = true; season = r.value; }
    r.addEventListener('change', function () { season = r.value; view.setVariant(season); onSun(); });
  });
  onSun();
  // a stop pressed (on the map or in the list): wind the clock to the hour the ride gets there
  view.on('pin', function (p) {
    var at = START + view.route.at[p.id] * hours * 60, s = SEASONS[season];
    view.animateInput(sun, Math.round(Math.max(0, Math.min(0.9, (at - s.rise) / (s.set - s.rise) * 0.9)) * 1000), 500);
    if (view.state && view.state.eT < 0.4) view.apart(0.45);
  });

  // ---- the bar
  var toggle = $('#toggle'), snd = $('#snd');
  var label = function (v) { toggle.textContent = v > 0.2 ? 'Put it back together' : 'Take it apart'; };
  view.on('apart', label);
  toggle.addEventListener('click', function () { if (view.state.eT > 0.2) view.together(); else view.apart(1); });
  snd.addEventListener('click', function () {
    var on = !PaperSound.on; if (on) PaperSound.enable(); else PaperSound.disable();
    snd.textContent = on ? 'Sound on' : 'Sound off'; snd.setAttribute('aria-pressed', String(on));
  });
  PaperSound.voice({ desk: 96, paper: 0.55 });                                          // TOPIC: the desk and the paper
})();
</script>
</body>
</html>
