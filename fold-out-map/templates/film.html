<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saltmere · fold-out-map template</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html, body { margin: 0; background: #120d0a; }</style>
<script type="importmap">{ "imports": { "three": "../lib/three.module.min.js", "fold/": "../lib/" } }</script>
</head>
<body>
<script type="module">
// TEMPLATE — a made-up harbour town, "Saltmere", 24 s, three stops. It shows every part once; it is an example of the
// style, not a form to fill: for your place, write BRIEF.md first and design its map, its stops and their pop-ups anew.
// Map units: the open sheet is cols × panel[0] wide and 2 × panel[1] tall, centred on 0,0; x east, z south.
import { Film, spline } from 'fold/foldmap.js';
import { paint, paintBack, maskOf, INK } from 'fold/mapart.js';
import { card } from 'fold/cardart.js';

const F = await Film.create({ duration: 24, W: 1080, H: 1920, seed: 7 });
// 1. the sheet: 4 accordion panels × 2 rows. (A real place: const P = projector({ center: [lon, lat], km: 6 }) and P(lon, lat).)
const S = F.sheet({ cols: 4, panel: [.85, 2], color: '#f1e9d6' });

// 2. geography in map units (traced by eye for a made-up town)
const coast = [[-1.8, .9], [-1.2, .75], [-.7, .95], [-.2, .8], [.2, .55], [.55, .6], [.75, .3], [.9, -.2], [1.2, -.5], [1.4, -1.1], [1.8, -1.4]];
const sea = [...coast, [1.8, 2.1], [-1.8, 2.1]];
const land = [[[-1.8, -2.1], [1.8, -2.1], [1.8, -1.4], ...[...coast].reverse()]];
const river = [[-.9, -2.1], [-.75, -1.2], [-.45, -.4], [-.3, .3], [-.2, .8]];
const peaks = [[-1.2, -1.3, 1, .45], [.6, -1.4, .8, .35], [-1.35, .1, .5, .25]];

// 3. the pop-up art — one card per place, drawn in code (cardart.js). Light from the upper left; lights lit at night.
const clock = card({ aspect: .72, seed: 2, draw: p => {
  const H = p.H;
  p.ground(0, 100, H - 4, { color: '#9bb37a', bump: 2 });
  p.block(12, H - 6, 22, 30, { wall: '#e3c9a3', roof: 'gable', roofColor: '#a4523e', windows: { rows: 2, cols: 2, lit: .7 } });
  p.block(66, H - 6, 22, 26, { wall: '#d9bf9b', roof: 'gable', roofColor: '#8f4636', windows: { rows: 2, cols: 2, lit: .6, seed: 2 } });
  p.block(38, H - 6, 24, 86, { wall: '#efe3cc', side: 3, roof: 'gable', roofColor: '#6f7b80', windows: { rows: 5, cols: 2, lit: .5, seed: 3 } });
  p.circle(50, H - 80, 7, '#fbf7ee'); p.line([[50, H - 80], [50, H - 85]], '#2a2a2a', .9); p.line([[50, H - 80], [54, H - 79]], '#2a2a2a', .9);
  p.tree(6, H - 5, 14, 'round'); p.tree(94, H - 5, 13, 'round', { seed: 4 });
}});
const pier = card({ aspect: 1.9, seed: 4, draw: p => {
  const H = p.H;
  p.waves(0, H - 16, 100, 16);
  p.rect(8, H - 20, 84, 3, '#a7896a'); for (let x = 10; x < 92; x += 8) p.rect(x, H - 17, 1.2, 12, '#7d6650');
  p.block(14, H - 20, 24, 16, { wall: '#c8574a', roof: 'gable', roofColor: '#4f5a60', windows: { rows: 1, cols: 3, lit: .8 } });
  p.block(56, H - 20, 20, 13, { wall: '#5f8fa8', roof: 'gable', roofColor: '#4f5a60', windows: { rows: 1, cols: 2, lit: .8, seed: 5 } });
  p.lanterns(8, H - 34, 92, H - 32, { n: 12 });
  p.people(40, 54, H - 20, { n: 3 });
}});
const mill = card({ aspect: .9, seed: 6, draw: p => {
  const H = p.H;
  p.ground(0, 100, H - 10, { color: '#8fae6a', bump: 10 });
  p.block(40, H - 16, 18, 42, { wall: '#f1ebdf', side: 3, roof: 'gable', roofColor: '#7b5a44', windows: { rows: 3, cols: 1, lit: .9 } });
  for (const a of [0, 1, 2, 3]) { const t = a * Math.PI / 2 + .4; p.poly([[49, H - 62], [49 + Math.cos(t) * 30 - Math.sin(t) * 3, H - 62 + Math.sin(t) * 30 + Math.cos(t) * 3], [49 + Math.cos(t) * 30 + Math.sin(t) * 3, H - 62 + Math.sin(t) * 30 - Math.cos(t) * 3]], '#d9cdb5', '#7b5a44'); }
  p.tree(14, H - 12, 15, 'cone'); p.tree(84, H - 12, 13, 'cone');
}});

// 4. the stops in route order: name, latin, note (the label card), where, the art, and its camera (yaw = which side it is seen from)
const STOPS = [
  { name: 'Clock Square', latin: 'Old town', note: 'market bells on the hour', at: [-.95, -.55], art: clock, w: .36, yaw: 10 },
  { name: 'Herring Pier', latin: 'The harbour', note: 'lanterns over the water at dusk', at: [.15, .38], art: pier, w: .5, yaw: -12 },
  { name: 'Windmill Hill', latin: 'Above the bay', note: 'the last light on the sails', at: [1.05, -.85], art: mill, w: .4, yaw: 30 },
];

// 5. the printed map (front), then the back panels (cover = c 0, top row; the guide = the last column)
S.front(paint(m => {
  m.paper();
  m.sea(sea, { coast });
  m.hills(peaks, { clip: land[0] });
  m.river(river, { w0: .008, w1: .03 });
  m.streets({ mask: maskOf({ land, not: [(x, z) => Math.hypot(x + 1.2, z + 1.3) < .3] }), districts: [{ at: [-.6, -.4], r: 1, angle: 12 }, { at: [.5, -.7], r: .7, angle: -20 }] });
  m.road([[-1.8, -.4], [-.6, -.45], [.4, -.2], [1.3, -1]]);
  m.text('SALTMERE', -1.62, -1.68, { size: .18, align: 'left', color: '#23463c', spacing: .06 });
  m.text('a made-up harbour town · TEMPLATE', -1.6, -1.5, { size: .032, align: 'left', color: INK.soft, spacing: .1 });
  m.text('Grey Bay', .3, 1.3, { size: .04, italic: true, color: '#4f8a84', halo: null });
  m.border(.06); m.compass(1.35, 1.6, .08);
}));
S.backs(paintBack((m, { cover, guide, r, pw }) => {
  m.paper({ color: '#ece4cf' });
  if (cover) {
    m.border(.05, { color: '#23463c' }); m.text('SALTMERE', pw / 2, .45, { size: .1, color: '#23463c', halo: null });
    m.dot(pw / 2, .95, .17, '#c0412f'); m.text('TRAVEL MAP', pw / 2, 1.5, { size: .045, color: '#23463c', spacing: .2, halo: null });
  } else if (guide && r === 1) {
    m.text('THREE STOPS', .1, .25, { size: .04, align: 'left', halo: null });
    STOPS.forEach((s, i) => m.text(`${i + 1}  ${s.name}`, .1, .5 + i * .2, { size: .03, align: 'left', halo: null }));
  }
}));
F.desk({ props: [{ kind: 'cup', at: [2.5, -1.4] }, { kind: 'pencil', at: [-2.3, 1.3], rot: 70 }] });

// 6. time: unfold, the trip (route, pop-ups, labels, touring camera), the light, your own opening / closing camera keys
F.unfold({ at: 1.2 });
const T = F.trip({ stops: STOPS, route: [STOPS[0].at, [-.4, -.2], STOPS[1].at, [.7, -.3], STOPS[2].at], start: 7.4, hold: 2.4, travel: 2 });
F.light([[0, 'day'], [12, 'day'], [15, 'golden'], [17.5, 'night']]);
F.track([
  { t: 0, at: [-1.27, 0, 1], dist: 3.1, yaw: 4, elev: 66 },
  { t: 2.8, at: [-1.2, .1, .1], dist: 5.4, yaw: 2, elev: 64 },
  { t: 5.2, at: [0, 0, .05], dist: 10.2, yaw: 0, elev: 68 },
  { t: T.end + 1.6, at: [.1, 0, -.2], dist: 5, yaw: 8, elev: 48 },
  { t: 24, at: [0, 0, 0], dist: 9.4, yaw: 0, elev: 70 },
]);
F.title('Saltmere', { from: 20.5, to: 24, sub: 'fold-out-map · template' });
F.start();
</script>
</body>
</html>
