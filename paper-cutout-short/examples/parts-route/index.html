<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parts route · paper-cutout-short</title>
<script type="importmap">{ "imports": { "pcs/": "../../lib/" } }</script>
</head>
<body>
<script type="module">
// The image route, end to end: parts cut from a sheet (sheet.png → cut-parts.mjs → parts/ember/parts.js) are pinned into the
// standard biped with Pup.bipedParts, turned both ways on a cast sheet, then walked across a small paper set.
// sheet.png here is a stand-in made by make-sheet.html so this runs offline; a generated sheet goes through exactly the same steps.
import * as P from 'pcs/paper.js';
import * as Pup from 'pcs/puppet.js';
import * as K from 'pcs/kit.js';
import { Stage } from 'pcs/stage.js';
import MAN from './parts/ember/parts.js';
const F = new Stage({ seed: 5, fadeIn: .3, fadeOut: .4 });
await F.ready();
// pins in sheet px, read off parts/ember/preview.jpg (the neck under the head, the hip at the coat's waist, the ankle, the tail root);
// 'top' = the limb's upper end. The sheet was drawn 1.6× the puppet's size, so px = 1 / 1.6.
const IMG = await P.parts(MAN, { px: 1 / 1.6, pivots: { head: [77, 248], torso: [84, 196], tail: [185, 33], footN: [28, 18], armN: 'top', foreN: 'top', thighN: 'top', shinN: 'top' } });
const EMBER = Pup.bipedParts(IMG, { name: 'Ember (cut parts)', neck: [0, -110], shoulder: [2, 14], hipW: 14, joints: { armN: [0, 50], thighN: [0, 56], shinN: [0, 54] },
  z: { thighN: -6, shinN: -5, footN: -4 }, extraParts: [{ id: 'tail', parent: 'hip', at: [-30, 12], z: -40, img: IMG.tail, lim: [-35, 35] }] });
const sky = F.layer([0, 0, 2400, 1080], c => K.backdrop(c, 2400, 1080, { stops: ['#f2b07a', '#e48a86', '#9a72a8'] }), { shadow: 0 });
const hill = F.layer([0, 0, 2400, 1080], c => { K.hills(c, -40, 2440, 760, { col: '#7a9a6a', amp: 50 }); c.save(); c.translate(500, 760); K.tree(c, { h: 220, r: 80 }); c.restore(); });
const road = F.layer([0, 0, 2400, 300], c => K.cobbles(c, -20, 2420, 0, 120));
const label = F.prop([-10, -20, 360, 130], c => K.label(c, 'Parts route', 'cut from a sheet · 12 fps', { w: 340, h: 110, size: 40 }));
const SPC = Pup.walkSpeed(EMBER);
// shot 1: the cast sheet (facing right / left) — shot 2: a walk on the cut parts
F.shot(2, g => {
  g.put(sky, 0, 0, 0, { jit: 0 });
  g.at(0, c => Pup.sheet(c, EMBER, [['stand', Pup.stand()], ['walk .25', Pup.walk(.25)], ['walk .75', Pup.walk(.75)], ['reach', { ...Pup.stand(), armN: -72, foreN: -24 }]], { cw: 240, x0: 0, gy: 700, cols: 8, pins: true }));
}, { name: 'cast sheet' });
F.shot(4, (g, lt) => {
  g.put(sky, -100, 0, .1); g.put(hill, -100, 0, .5, { lift: 10 }); g.put(road, -100, 900, 1, { lift: 6 });
  g.puppet(EMBER, { x: 300 + lt * SPC * 1.1, ground: 960, angles: { ...Pup.walk(lt * 1.1), tail: Math.sin(lt * 3) * 14 } }, 1);
  g.put(label, 70, 60, 0, { lift: 14, rot: -.02 });
}, { name: 'walk', tr: { type: 'card', d: .6 }, cam: [{ t: 0, x: 0 }, { t: 4, x: 300 }] });
F.check('both feet planted on the road while walking', t => t < 2 || Math.abs(Math.max(...Pup.soles(EMBER, { x: 0, ground: 960, angles: Pup.walk((t - 2) * 1.1) }).map(p => p[1])) - 960) < 1);
F.start();
</script>
</body>
</html>
