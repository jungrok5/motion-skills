<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machine player</title>
<style>
  html, body { margin: 0; height: 100%; background: #8d8e91; overflow: hidden; font: 500 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; left: 16px; top: 12px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); pointer-events: none; letter-spacing: .02em; }
  .hud b { font-weight: 650; font-size: 15px; display: block; margin-bottom: 2px; letter-spacing: .12em; }
  .hud small { opacity: .85; }
  .bar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 20px); }
  .bar button { font: inherit; color: #fff; background: rgba(22,24,30,.55); border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
  .bar button.on { background: rgba(255,255,255,.92); color: #1d1f25; }
  .bar input { width: min(180px, 30vw); accent-color: #fff; }
  body.capture .bar { display: none; }
  #err { position: fixed; inset: auto 16px 60px 16px; color: #fff; background: rgba(120,20,20,.7); padding: 8px 10px; border-radius: 6px; display: none; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="stage"></div>
<div class="hud"><b id="title">MACHINE</b><span id="act">–</span><br><small id="facts">–</small></div>
<div class="bar" id="bar"><button id="play" class="on" aria-label="play / pause">❚❚</button><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="time"><button id="orbit" class="on">orbit</button></div>
<div id="err"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/jsm/loaders/GLTFLoader.js';

// The machine from its .glb (rigid parts on bones, one animation per action, walk in place), in the reel's grey
// studio with the 1.75 m figure. Buttons: every action + "assembly" (parts arrive by build stage, lights last).
// Blender is Z-up, +X forward; glTF / three.js is Y-up: (x, y, z)_blender -> (x, z, -y).
const q = new URLSearchParams(location.search);
const base = q.get('src') || '.';
const fail = (m) => { const e = document.getElementById('err'); e.textContent = m; e.style.display = 'block'; };
let meta;
try { meta = await (await fetch(`${base}/meta.json`)).json(); } catch (e) { fail(`no ${base}/meta.json`); throw e; }
const B = (v) => new THREE.Vector3(v[0], v[2], -v[1]);
const H = meta.height;
document.getElementById('title').textContent = meta.title;
document.getElementById('facts').textContent = `${meta.parts} parts · ${meta.bones} bones · ${meta.actuators} hydraulic actuators · ${H.toFixed(1)} m`;
if (q.has('capture')) document.body.classList.add('capture');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('stage').appendChild(renderer.domElement);

const BG = 0x8d8e91;
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, H * 3.2, H * 9);
const cam = new THREE.PerspectiveCamera(32, 16 / 9, 0.1, H * 40);

// studio floor with a faint grid that scrolls under the in-place walk
const step = Math.max(1, Math.round(H / 8));
const floorG = new THREE.Group();
const floor = new THREE.Mesh(new THREE.PlaneGeometry(H * 30, H * 30), new THREE.MeshStandardMaterial({ color: 0x9a9b9e, roughness: .85 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
const grid = new THREE.GridHelper(H * 30, Math.round(H * 30 / step), 0x86878a, 0x86878a);
grid.position.y = 0.005; grid.material.transparent = true; grid.material.opacity = .45;
floorG.add(floor, grid);
scene.add(floorG);

scene.add(new THREE.HemisphereLight(0xe8eaf0, 0x55565a, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.4);
sun.position.copy(B([-0.45 * H, -0.6 * H, 1.2 * H]));
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -H, right: H, top: H, bottom: -H, near: 1, far: H * 4 });
sun.shadow.bias = -0.0004; sun.shadow.radius = 4;
scene.add(sun, sun.target);
const rim = new THREE.DirectionalLight(0xffffff, 0.8);
rim.position.copy(B([0.8 * H, 0.9 * H, 0.7 * H]));
scene.add(rim);

// the 1.75 m figure (orange, faceless)
function figure(h) {
  const g = new THREE.Group();
  const m = new THREE.MeshStandardMaterial({ color: 0xd8662c, roughness: .55 });
  const cap = (r, len, x, y, z) => { const o = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 4, 10), m); o.position.set(x, y, z); o.castShadow = true; g.add(o); };
  cap(0.075, 0.72, 0, 0.44, 0.1); cap(0.075, 0.72, 0, 0.44, -0.1);
  cap(0.16, 0.42, 0, 1.12, 0); cap(0.05, 0.56, 0, 1.12, 0.235); cap(0.05, 0.56, 0, 1.12, -0.235);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 12), m); head.position.y = 1.64; head.castShadow = true; g.add(head);
  g.scale.setScalar(h / 1.75);
  return g;
}
const fig = figure(meta.figure || 1.75);
fig.position.copy(B(meta.figure_at || [0, 0, 0]));
scene.add(fig);

let gltf;
try { gltf = await new GLTFLoader().loadAsync(`${base}/machine.glb`); } catch (e) { fail(`no ${base}/machine.glb`); throw e; }
const mach = gltf.scene;
const emissive = [];
const parts = [];
mach.traverse((o) => {
  if (o.isMesh) {
    o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) if (m.emissiveIntensity > 0 && m.emissive && m.emissive.getHex() !== 0 && !emissive.includes(m)) { m.userData.e0 = m.emissiveIntensity; emissive.push(m); }
  }
  if (meta.stages && meta.stages[o.name] !== undefined) parts.push({ o, stage: meta.stages[o.name], p0: o.position.clone() });
});
scene.add(mach);
const mixer = new THREE.AnimationMixer(mach);
const anims = Object.fromEntries(gltf.animations.map((a) => [a.name.replace(/^A_/, ''), a]));
const names = Object.keys(meta.actions);
const ACT = [...names, 'assembly'];
const stages = [...new Set(parts.map((p) => p.stage))].sort((a, b) => a - b);
const ASM = 9.0;

let cur = q.get('action') && ACT.includes(q.get('action')) ? q.get('action') : (names.includes('walk') ? 'walk' : names[0]);
let action = null;
function pick(n) {
  cur = n;
  if (action) action.stop();
  const a = anims[n === 'assembly' ? 'idle' : n];
  action = a ? mixer.clipAction(a) : null;
  if (action) action.play();
  T = 0;
  for (const b of document.querySelectorAll('.bar .actb')) b.classList.toggle('on', b.dataset.n === n);
  window.DURATION = dur();
}
const dur = () => cur === 'assembly' ? ASM : meta.actions[cur].dur;

function size() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  cam.aspect = w / h;
  cam.fov = cam.aspect >= 1.2 ? 32 : 2 * Math.atan(Math.tan(16 * Math.PI / 180) * 1.2 / cam.aspect) * 180 / Math.PI;
  cam.updateProjectionMatrix();
}
addEventListener('resize', size);
size();

const tgt = B([0, 0, 0.5 * H]);
function placeCam(yawDeg, el = 4) {
  const a = yawDeg * Math.PI / 180, e = el * Math.PI / 180;
  const d = (H * 1.4) / 2 / Math.tan(cam.fov * Math.PI / 360);
  const p = [Math.cos(e) * Math.cos(a) * d, Math.cos(e) * Math.sin(a) * d, 0.5 * H + Math.sin(e) * d];
  cam.position.copy(B(p));
  cam.lookAt(tgt);
}

const ease = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const backOut = (x) => { x = Math.min(1, Math.max(0, x)) - 1; return x * x * (2.6 * x + 1.6) + 1; };
const m3 = new THREE.Matrix3(), inv = new THREE.Matrix4(), off = new THREE.Vector3();
function lightAt(t) {
  if (cur === 'assembly') return ease((t / ASM - 0.9) / 0.08);
  const L = meta.actions[cur].light;
  return L ? L[Math.min(L.length - 1, Math.floor(t * (meta.fps || 24)))] : 1;
}
let T = 0, playing = !q.has('capture'), auto = true, yaw = -55, last = performance.now();
function draw() {
  const D = dur();
  const loop = cur === 'assembly' ? false : meta.actions[cur].loop;
  const t = loop ? T % D : Math.min(T, D);
  if (action) mixer.setTime(cur === 'assembly' ? 0 : Math.min(t, D - 1e-4));
  mach.updateMatrixWorld(true);
  for (const p of parts) {
    p.o.position.copy(p.p0); p.o.visible = true;
    if (cur !== 'assembly') continue;
    const i = stages.indexOf(p.stage);
    const a0 = 0.04 + 0.78 * i / stages.length, s = (t / D - a0) / 0.14;
    if (s <= 0) { p.o.visible = false; continue; }
    if (s >= 1) continue;
    off.set(0, 0.55 * H * (1 - backOut(s)), 0);
    inv.copy(p.o.parent.matrixWorld).invert();
    off.applyMatrix3(m3.setFromMatrix4(inv));
    p.o.position.add(off);
  }
  const lv = lightAt(t);
  for (const m of emissive) m.emissiveIntensity = m.userData.e0 * lv;
  const sp = cur === 'walk' ? meta.speed : 0;
  floorG.position.x = -((sp * T) % step);
  if (auto) yaw = -55 + 40 * Math.sin(T * 0.12);
  placeCam(yaw);
  renderer.render(scene, cam);
  document.getElementById('act').textContent = `${cur}${loop ? ' [loop]' : ''}  ${t.toFixed(2)} s`;
  document.getElementById('scrub').value = Math.round(t / D * 1000);
}
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (playing) { T += dt; const loop = cur !== 'assembly' && meta.actions[cur].loop; if (!loop && T > dur() + 1.2) T = 0; }
  draw();
  requestAnimationFrame(tick);
}
const playB = document.getElementById('play');
const setPlay = (p) => { playing = p; playB.textContent = p ? '❚❚' : '▶'; playB.classList.toggle('on', p); };
playB.onclick = () => setPlay(!playing);
document.getElementById('scrub').oninput = (e) => { T = e.target.value / 1000 * dur(); setPlay(false); };
const orbitB = document.getElementById('orbit');
orbitB.onclick = () => { auto = !auto; orbitB.classList.toggle('on', auto); };
for (const n of ACT) {
  const b = document.createElement('button');
  b.textContent = n; b.className = 'actb'; b.dataset.n = n;
  b.onclick = () => pick(n);
  document.getElementById('bar').insertBefore(b, playB);
}
let drag = null;
const st = document.getElementById('stage');
st.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, yaw }; auto = false; orbitB.classList.remove('on'); st.setPointerCapture(e.pointerId); });
st.addEventListener('pointermove', (e) => { if (drag) yaw = drag.yaw - (e.clientX - drag.x) * 0.35; });
st.addEventListener('pointerup', () => { drag = null; });
pick(cur);

// contract: action(name) switches; seek(t) renders that instant (seconds); DURATION; __ready
window.action = (n) => { if (ACT.includes(n)) pick(n); };
window.seek = (s) => { T = Math.max(0, s); draw(); };
window.__ready = true;
requestAnimationFrame(tick);
</script>
</body>
</html>
